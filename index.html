    <style>
      :root {
        --coyote: #c19a6b;
      }
      body {
        font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        background-color: #0a0a0a;
        color: #e5e5e5;
        margin: 0;
        overflow-x: hidden;
      }
      .main-wrapper {
        min-height: 100vh;
        min-height: 100dvh;
        width: 100%;
        background-color: #0a0a0a;
        background-image:
          var(--strzelca-bg-vignette),
          linear-gradient(
            rgba(10, 10, 10, 0.1) 0%,
            rgba(10, 10, 10, 0.4) 50%,
            #0a0a0a 100%
          ),
          url("./tlo.png");
        background-size: cover, cover, cover;
        background-position: center center, top center, top center;
        background-repeat: no-repeat;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
      }
      .hub-button {
        background: rgba(20, 20, 20, 0.8);
        border: 1px solid #333;
        transition: 0.3s;
        cursor: pointer;
      }
      .hub-button:hover:not(.disabled) {
        border-color: var(--coyote);
        transform: translateY(-5px);
        background: rgba(30, 30, 30, 0.9);
      }
      .hub-button.disabled {
        opacity: 0.25;
        cursor: not-allowed;
        filter: grayscale(1);
      }
      .coyote-text {
        color: var(--coyote);
        font-family: "Orbitron", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      }
      .bg-coyote {
        background-color: var(--coyote);
      }
      .text-coyote {
        color: var(--coyote);
      }
      #login-button a:hover {
        color: white !important;
      }
      .custom-render b {
        font-weight: bold;
        color: var(--coyote);
      }
      input,
      select,
      textarea,
      .editor-content {
        background: #000 !important;
        border: 1px solid #333 !important;
        color: white !important;
        padding: 14px 20px !important;
        border-radius: 10px;
        width: 100%;
        outline: none;
      }
      .editor-content {
        min-height: 250px;
        overflow-y: auto;
        text-align: left;
      }
      .toolbar {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin-bottom: 8px;
        background: #1a1a1a;
        padding: 10px;
        border-radius: 10px;
        border: 1px solid #333;
      }
      .toolbar button {
        background: #222;
        color: #fff;
        width: 38px;
        height: 38px;
        border-radius: 6px;
        border: 1px solid #444;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .btn-admin {
        background: var(--coyote);
        color: #000;
        font-weight: 900;
        text-transform: uppercase;
        padding: 16px;
        border-radius: 8px;
        cursor: pointer;
      }

      .top-search-row {
        position: fixed;
        top: 16px;
        left: 0;
        right: 0;
        z-index: 55;
        display: flex;
        justify-content: center;
        pointer-events: none;
        display: none !important;
      }
      .top-search-row-inner {
        width: min(680px, 50vw);
        pointer-events: auto;
      }
      .spotlight-shell {
        position: relative;
        background: linear-gradient(120deg, rgba(22, 22, 22, 0.78), rgba(10, 10, 10, 0.62));
        border: 1px solid rgba(193, 154, 107, 0.35);
        border-radius: 16px;
        backdrop-filter: blur(14px);
        -webkit-backdrop-filter: blur(14px);
        box-shadow: 0 18px 45px rgba(0, 0, 0, 0.42);
        overflow: visible;
      }
      .spotlight-input-row {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 9px 11px;
      }
      .spotlight-input {
        background: transparent !important;
        border: none !important;
        color: #f5f5f5 !important;
        padding: 4px 0 !important;
        width: 100%;
        font-size: 0.95rem;
      }
      .spotlight-input::placeholder {
        color: rgba(229, 229, 229, 0.48);
      }
      .spotlight-input:focus {
        box-shadow: none;
      }
      .spotlight-icon-btn {
        width: 40px;
        height: 40px;
        border-radius: 11px;
        border: none;
        background: transparent;
        color: rgba(245, 245, 245, 0.68);
        display: inline-flex;
        align-items: center;
        justify-content: center;
        transition: 0.2s ease;
      }
      .spotlight-icon-btn:hover,
      .spotlight-icon-btn.is-active {
        color: rgba(255, 255, 255, 0.95);
      }
      .spotlight-filter-wrap {
        position: relative;
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.18s ease;
      }
      .spotlight-shell.is-engaged .spotlight-filter-wrap {
        opacity: 1;
        pointer-events: auto;
      }
      .spotlight-filter-toggle {
        color: rgba(161, 161, 170, 0.9);
      }
      .spotlight-submit-btn {
        color: rgba(193, 154, 107, 0.42);
      }
      .spotlight-shell.is-engaged .spotlight-submit-btn {
        color: rgba(193, 154, 107, 0.95);
      }
      .spotlight-filter-menu {
        position: absolute;
        top: calc(100% + 8px);
        left: 0;
        width: 220px;
        padding: 8px;
        border-radius: 12px;
        border: 1px solid rgba(193, 154, 107, 0.25);
        background: rgba(8, 8, 8, 0.92);
        box-shadow: 0 16px 32px rgba(0, 0, 0, 0.42);
        z-index: 70;
      }
      .spotlight-filter-item {
        width: 100%;
        text-align: left;
        border-radius: 8px;
        border: 1px solid transparent;
        background: transparent;
        color: rgba(236, 236, 236, 0.88);
        padding: 8px 10px;
        font-size: 0.82rem;
      }
      .spotlight-filter-item:hover,
      .spotlight-filter-item.is-active {
        background: rgba(193, 154, 107, 0.14);
        border-color: rgba(193, 154, 107, 0.3);
      }
      .spotlight-results {
        position: absolute;
        top: calc(100% + 8px);
        left: 0;
        right: 0;
        background: rgba(7, 7, 7, 0.78);
        border: 1px solid rgba(193, 154, 107, 0.22);
        border-radius: 14px;
        max-height: min(55vh, 520px);
        overflow-y: auto;
        padding: 10px 10px 12px;
        z-index: 68;
      }
      .spotlight-group {
        margin-bottom: 10px;
      }
      .spotlight-group-title {
        font-size: 0.72rem;
        text-transform: uppercase;
        letter-spacing: 0.18em;
        color: rgba(193, 154, 107, 0.9);
        margin: 0 0 6px;
      }
      .spotlight-item {
        width: 100%;
        text-align: left;
        border: 1px solid rgba(255, 255, 255, 0.05);
        border-radius: 10px;
        padding: 9px 11px;
        background: rgba(18, 18, 18, 0.62);
        color: #f2f2f2;
        cursor: pointer;
        margin-bottom: 7px;
      }
      .spotlight-item:hover,
      .spotlight-item.is-selected {
        border-color: rgba(193, 154, 107, 0.75);
        background: rgba(30, 30, 30, 0.86);
      }
      .spotlight-item-title {
        font-weight: 700;
        font-size: 0.92rem;
      }
      .spotlight-item-snippet {
        margin-top: 3px;
        font-size: 0.78rem;
        color: rgba(229, 229, 229, 0.68);
      }
      .spotlight-empty {
        padding: 16px 6px;
        text-align: center;
        font-size: 0.84rem;
        color: rgba(229, 229, 229, 0.66);
      }
      .global-modal-shell {
        background: rgba(8, 8, 8, 0.8);
        border: 1px solid rgba(193, 154, 107, 0.45);
        border-radius: 18px;
        box-shadow: 0 26px 56px rgba(0, 0, 0, 0.52);
        overflow: hidden;
      }
      .global-modal-frame {
        width: 100%;
        height: min(86vh, 920px);
        border: none;
        background: #090909;
      }
      @media (max-width: 900px) {
        .top-search-row {
          top: 72px;
          z-index: 45;
        }
        .top-search-row-inner {
          width: min(94vw, 680px);
        }
      }
      @media (max-width: 640px) {
        .main-wrapper > header {
          padding-top: 4.5rem;
        }
        .main-wrapper > main {
          padding-top: 0.75rem;
          padding-bottom: 0.75rem;
        }
        .main-wrapper > main .grid {
          gap: 0.5rem;
        }
        .hub-button {
          padding: 0.8rem !important;
          border-radius: 0.9rem;
        }
        .hub-button svg {
          width: 1.6rem;
          height: 1.6rem;
          margin-bottom: 0.35rem;
        }
        .hub-button span {
          font-size: 0.62rem;
          letter-spacing: 0.12em;
          line-height: 1.15;
        }
      }
      @media (max-width: 640px) and (max-height: 760px) {
        .main-wrapper > header {
          padding-top: 4rem;
        }
        .main-wrapper > header h1 {
          font-size: 1.9rem;
          line-height: 1.05;
        }
        .hub-button {
          padding: 0.68rem !important;
        }
        .hub-button svg {
          width: 1.45rem;
          height: 1.45rem;
          margin-bottom: 0.3rem;
        }
        .hub-button span {
          font-size: 0.58rem;
          letter-spacing: 0.1em;
        }
      }
    </style>

              <i class="fa-solid fa-user"></i>
            </div>

          <!-- Menu rozwijane -->
          <div
            id="user-menu"
            class="absolute top-14 right-0 bg-zinc-900/95 backdrop-blur-md border border-zinc-700 rounded-2xl p-4 shadow-2xl min-w-[200px] hidden"

            <div class="space-y-2">
              <div

              <a

              <button

                <i class="fa-solid fa-sign-out-alt mr-2"></i>Wyloguj się
              </button>
            </div>
          </div>
        </div>
      </div>

      <!-- Przycisk logowania dla niezalogowanych -->
      <div id="login-button" class="fixed top-4 right-4 z-50">
        <a

          class="text-coyote w-12 h-12 rounded-full flex items-center justify-center hover:text-white hover:bg-coyote/20 transition"

      <div class="top-search-row">
        <div class="top-search-row-inner">
          <section id="spotlight-search" class="spotlight-shell">
            <div class="spotlight-input-row">
              <div class="spotlight-filter-wrap">
                <button
                  id="spotlight-filter-toggle"
                  class="spotlight-icon-btn spotlight-filter-toggle"
                  type="button"
                  aria-label="Filtr kategorii"
                  title="Filtr kategorii"
                >
                  <i class="fa-solid fa-filter"></i>
                </button>
                <div id="spotlight-filter-menu" class="spotlight-filter-menu hidden">
                  <button type="button" class="spotlight-filter-item is-active" data-category="all">Wszystko</button>
                  <button type="button" class="spotlight-filter-item" data-category="user">Użytkownicy</button>
                  <button type="button" class="spotlight-filter-item" data-category="shop">Sklep</button>
                  <button type="button" class="spotlight-filter-item" data-category="event">Wydarzenia</button>
                  <button type="button" class="spotlight-filter-item" data-category="blog">Blog</button>
                  <button type="button" class="spotlight-filter-item" data-category="bazar">Bazar</button>
                </div>
              </div>
              <input
                id="spotlight-search-input"
                class="spotlight-input"
                type="search"
                autocomplete="off"
                spellcheck="false"
                placeholder="Szukaj: użytkownicy, sklep, wydarzenia, blog, bazar..."
                aria-label="Wyszukiwarka globalna"
              />
              <button id="spotlight-submit" class="spotlight-icon-btn spotlight-submit-btn" type="button" aria-label="Szukaj">
                <i class="fa-solid fa-paper-plane"></i>
              </button>
            </div>
            <div id="spotlight-results" class="spotlight-results hidden"></div>
          </section>
        </div>
      </div>

                d="M21.75 6.75v10.5a2.25 2.25 0 0 1-2.25 2.25h-15a2.25 2.25 0 0 1-2.25-2.25V6.75m19.5 0A2.25 2.25 0 0 0 19.5 4.5h-15a2.25 2.25 0 0 0-2.25 2.25m19.5 0v.243a2.25 2.25 0 0 1-1.07 1.916l-7.5 4.615a2.25 2.25 0 0 1-2.36 0L3.32 8.91a2.25 2.25 0 0 1-1.07-1.916V6.75"

    <div id="global-modal" class="fixed inset-0 z-[140] hidden items-center justify-center p-3 md:p-5 bg-black/90 backdrop-blur-md">
      <div class="global-modal-shell w-full max-w-6xl relative">
        <button
          id="global-modal-close"
          type="button"
          class="absolute top-3 right-3 z-10 w-10 h-10 rounded-full border border-zinc-600 text-zinc-300 hover:text-white hover:border-coyote transition"
          aria-label="Zamknij"
        >

        <iframe id="global-modal-frame" class="global-modal-frame" title="Podgląd wyniku wyszukiwania"></iframe>
      </div>
    </div>

    <script type="module">
      import {
        doc,
        setDoc,
        getDoc,
        getDocs,
        collection,
        deleteDoc,
        query,
        orderBy,
        where,
        limit,
        updateDoc,
      } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
      import {
        signInWithEmailAndPassword,
        onAuthStateChanged,
        signOut,
      } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
      import { initAuth } from "https://strzelca.pl/auth-init.mjs?v=2026-03-21-1";
      import {
        getHeaderProfileFromCache,
        setHeaderProfileCache,
      } from "https://strzelca.pl/header-profile-cache.mjs?v=2026-03-21-1";

      
      async function getFirebaseApiKey() {
        const urls = ["/api/firebase-config"];

        for (const url of urls) {
          try {
            const res = await fetch(url, { cache: "no-store" });
            if (!res.ok) continue;
            const data = await res.json().catch(() => null);
            if (data && typeof data.apiKey === "string" && data.apiKey.length > 10) {
              return data.apiKey;
            }
          } catch (_) {
            // ignore and try next url
          }
        }

        throw new Error("Nie udało się pobrać FIREBASE_WEB_API_KEY z /api/firebase-config");
      }
      // OPTYMALIZACJA: Użyj wspólnego modułu inicjalizacji
      const firebaseConfig = {
        apiKey: await getFirebaseApiKey(),
        authDomain: "strzelca-pl.firebaseapp.com",
        projectId: "strzelca-pl",
        storageBucket: "strzelca-pl.appspot.com",
        messagingSenderId: "511362047688",
        appId: "1:511362047688:web:9b82c0a4d19c1a3a878ffd",
        measurementId: "G-9EJ2R3JPVD",
      };

      const { auth, db } = await initAuth(firebaseConfig, {
        logAuthReady: true,
        logSSO: true,
      });

      void (async () => {
        try {
          const [{ initActivityTracker }, { initUserStatusMonitor }, { initVisitTracker }] =
            await Promise.all([
              import("https://strzelca.pl/activity-tracker.mjs?v=2026-03-23-1"),
              import("https://strzelca.pl/user-status-monitor.mjs?v=2026-02-06-1"),
              import("https://strzelca.pl/visit-tracker.mjs?v=2026-03-23-1"),
            ]);
          await Promise.all([
            initActivityTracker(auth, db),
            initUserStatusMonitor(auth, db),
            initVisitTracker(auth),
          ]);
        } catch (error) {
          console.warn("Could not initialize trackers:", error);
        }
      })();
      
      let productsList = [];
      let contactTopics = [];
      let currentMessageFilter = "all";
      let currentUser = null;
      let eventsList = [];
      let usersList = [];
      let conversationsList = [];
      let currentConversationId = null;

      const SEARCH_TYPE_ORDER = ["user", "shop", "event", "blog", "bazar"];
      const SEARCH_TYPE_LABEL = {
        user: "Użytkownicy",
        shop: "Sklep",
        event: "Wydarzenia",
        blog: "Blog",
        bazar: "Bazar",
      };
      const SEARCH_MIN_CHARS = 3;
      const SEARCH_LIMIT_ALL = 3;
      const SEARCH_LIMIT_SINGLE = 10;
      const SEARCH_FETCH_LIMIT_ALL = 30;
      const SEARCH_FETCH_LIMIT_SINGLE = 80;
      const SEARCH_STORAGE = {
        recentQueries: "strzelca_spotlight_recent_queries_v1",
        recentItems: "strzelca_spotlight_recent_items_v1",
        cacheItems: "strzelca_spotlight_cache_items_v1",
      };

      const spotlightState = {
        typingTimer: null,
        selectionIndex: -1,
        activeEntries: [],
        lastFullSignature: "",
        fullSearchCache: new Map(),
        selectedCategory: "all",
      };

      const spotlightEls = {
        shell: null,
        input: null,
        submit: null,
        filterToggle: null,
        filterMenu: null,
        results: null,
        modal: null,
        modalFrame: null,
        modalClose: null,
      };

      function loadJsonStorage(key, fallback) {
        try {
          const raw = localStorage.getItem(key);
          if (!raw) return fallback;
          const parsed = JSON.parse(raw);
          return parsed == null ? fallback : parsed;
        } catch {
          return fallback;
        }
      }

      function saveJsonStorage(key, value) {
        try {
          localStorage.setItem(key, JSON.stringify(value));
        } catch (_) {}
      }

      function normalizeSearchText(value) {
        if (value == null) return "";
        return String(value)
          .replace(/[Łł]/g, "l")
          .normalize("NFD")
          .replace(/[\u0300-\u036f]/g, "")
          .toLowerCase()
          .replace(/[^a-z0-9\s]/g, " ")
          .replace(/\s+/g, " ")
          .trim();
      }

      function stripHtmlText(value) {
        if (!value) return "";
        return String(value)
          .replace(/<style[\s\S]*?<\/style>/gi, " ")
          .replace(/<script[\s\S]*?<\/script>/gi, " ")
          .replace(/<[^>]+>/g, " ")
          .replace(/\s+/g, " ")
          .trim();
      }

      function tokenizeQuery(value) {
        const normalized = normalizeSearchText(value);
        if (!normalized) return [];
        return Array.from(new Set(normalized.split(" ").filter((part) => part.length >= 2)));
      }

      function userSearchVisible() {
        return !!currentUser;
      }

      function visibleSearchTypes() {
        return SEARCH_TYPE_ORDER.filter((type) => type !== "user" || userSearchVisible());
      }

      function activeSearchTypes() {
        const selected = spotlightState.selectedCategory || "all";
        if (selected === "all") return visibleSearchTypes();
        if (selected === "user" && !userSearchVisible()) return [];
        return visibleSearchTypes().includes(selected) ? [selected] : [];
      }

      function updateSearchCategoryOptions() {
        const menu = spotlightEls.filterMenu;
        if (!menu) return;
        const current = spotlightState.selectedCategory || "all";
        const userItem = menu.querySelector('[data-category="user"]');
        if (userItem) {
          userItem.classList.toggle("hidden", !userSearchVisible());
        }
        if (!userSearchVisible() && current === "user") {
          spotlightState.selectedCategory = "all";
          spotlightState.lastFullSignature = "";
        }
        refreshFilterMenuSelection();
      }

      function refreshFilterMenuSelection() {
        const menu = spotlightEls.filterMenu;
        if (!menu) return;
        const selected = spotlightState.selectedCategory || "all";
        menu.querySelectorAll(".spotlight-filter-item").forEach((item) => {
          const cat = item.getAttribute("data-category") || "all";
          item.classList.toggle("is-active", cat === selected);
        });
        if (spotlightEls.filterToggle) {
          const label = SEARCH_TYPE_LABEL[selected] || "Wszystko";
          spotlightEls.filterToggle.title = `Filtr: ${label}`;
        }
      }

      function closeFilterMenu() {
        spotlightEls.filterMenu?.classList.add("hidden");
        spotlightEls.filterToggle?.classList.remove("is-active");
      }

      function toggleFilterMenu() {
        if (!spotlightEls.filterMenu) return;
        const willOpen = spotlightEls.filterMenu.classList.contains("hidden");
        spotlightEls.filterMenu.classList.toggle("hidden", !willOpen);
        spotlightEls.filterToggle?.classList.toggle("is-active", willOpen);
      }

      function setSearchEngaged(active) {
        spotlightEls.shell?.classList.toggle("is-engaged", active === true);
      }

      function searchEntryKey(entry) {
        return `${entry.type}:${entry.sourceId || entry.slug || entry.title || ""}`;
      }

      function coerceArray(value) {
        return Array.isArray(value) ? value : [];
      }

      function toDisplaySnippet(raw) {
        const text = stripHtmlText(raw || "");
        if (!text) return "";
        if (text.length <= 140) return text;
        return `${text.slice(0, 139).trim()}…`;
      }

      function buildEntrySearchBlob(entry) {
        const parts = [
          entry.title || "",
          entry.snippet || "",
          entry.slug || "",
          entry.type || "",
          coerceArray(entry.tokens).join(" "),
          entry.meta?.category || "",
          entry.meta?.location || "",
          entry.meta?.wojewodztwo || "",
          entry.meta?.miejscowosc || "",
          entry.meta?.sellerName || "",
          entry.meta?.username || "",
        ];
        return normalizeSearchText(parts.join(" "));
      }

      function computeEntryScore(entry, normQuery, tokens) {
        const title = normalizeSearchText(entry.title || "");
        const blob = buildEntrySearchBlob(entry);
        let score = 0;
        if (title.startsWith(normQuery)) score += 180;
        if (title.includes(normQuery)) score += 110;
        if (blob.includes(normQuery)) score += 70;
        for (const tok of tokens) {
          if (title.includes(tok)) score += 22;
          if (blob.includes(tok)) score += 10;
        }
        const popularity = Number(entry.popularity || 0);
        if (Number.isFinite(popularity) && popularity > 0) {
          score += Math.min(90, popularity);
        }
        return score;
      }

      function mapSearchDocToEntry(docSnap) {
        const data = docSnap.data() || {};
        return {
          id: docSnap.id,
          type: String(data.type || "").toLowerCase(),
          sourceId: String(data.sourceId || ""),
          title: String(data.title || "").trim(),
          snippet: toDisplaySnippet(data.snippet || ""),
          url: typeof data.url === "string" ? data.url : "",
          slug: typeof data.slug === "string" ? data.slug : "",
          tokens: coerceArray(data.tokens).map((x) => String(x)),
          searchKeys: coerceArray(data.searchKeys).map((x) => String(x)),
          popularity: Number(data.popularity || 0),
          meta: data.meta && typeof data.meta === "object" ? data.meta : {},
          source: "remote",
        };
      }

      function getStoredRecentQueries() {
        return loadJsonStorage(SEARCH_STORAGE.recentQueries, []);
      }

      function pushRecentQuery(rawQuery) {
        const queryText = String(rawQuery || "").trim();
        if (!queryText) return;
        const list = getStoredRecentQueries();
        const next = [queryText, ...list.filter((x) => normalizeSearchText(x) !== normalizeSearchText(queryText))].slice(0, 10);
        saveJsonStorage(SEARCH_STORAGE.recentQueries, next);
      }

      function getStoredRecentItems() {
        return loadJsonStorage(SEARCH_STORAGE.recentItems, []);
      }

      function pushRecentItem(entry) {
        if (!entry) return;
        const key = searchEntryKey(entry);
        const list = getStoredRecentItems();
        const existing = list.find((x) => x.key === key);
        const clicks = Number(existing?.clicks || 0) + 1;
        const payload = {
          key,
          type: entry.type,
          sourceId: entry.sourceId,
          title: entry.title,
          snippet: entry.snippet,
          url: entry.url,
          slug: entry.slug || "",
          clicks,
          lastClickedAt: Date.now(),
        };
        const next = [payload, ...list.filter((x) => x.key !== key)].slice(0, 80);
        saveJsonStorage(SEARCH_STORAGE.recentItems, next);
      }

      function getStoredCacheItems() {
        return loadJsonStorage(SEARCH_STORAGE.cacheItems, []);
      }

      function mergeIntoCache(entries) {
        if (!Array.isArray(entries) || entries.length === 0) return;
        const current = getStoredCacheItems();
        const map = new Map(current.map((item) => [searchEntryKey(item), item]));
        for (const entry of entries) {
          map.set(searchEntryKey(entry), {
            type: entry.type,
            sourceId: entry.sourceId,
            title: entry.title,
            snippet: entry.snippet,
            url: entry.url,
            slug: entry.slug || "",
            tokens: coerceArray(entry.tokens),
            popularity: Number(entry.popularity || 0),
            meta: entry.meta || {},
            updatedAt: Date.now(),
          });
        }
        const next = Array.from(map.values())
          .sort((a, b) => Number(b.updatedAt || 0) - Number(a.updatedAt || 0))
          .slice(0, 450);
        saveJsonStorage(SEARCH_STORAGE.cacheItems, next);
      }

      function setSpotlightSelection(nextIndex) {
        spotlightState.selectionIndex = nextIndex;
        spotlightState.activeEntries.forEach((entry, index) => {
          entry.element.classList.toggle("is-selected", index === nextIndex);
        });
      }

      function flattenRenderedEntries(groups) {
        const out = [];
        for (const group of groups) {
          for (const item of group.items) {
            out.push(item);
          }
        }
        return out;
      }

      function renderSpotlightGroups(groups) {
        const resultsEl = spotlightEls.results;
        if (!resultsEl) return;
        resultsEl.innerHTML = "";
        spotlightState.activeEntries = [];
        spotlightState.selectionIndex = -1;

        if (!groups.length) {
          resultsEl.innerHTML = '<div class="spotlight-empty">Brak wyników.</div>';
          resultsEl.classList.remove("hidden");
          return;
        }

        for (const group of groups) {
          const section = document.createElement("section");
          section.className = "spotlight-group";
          const heading = document.createElement("h4");
          heading.className = "spotlight-group-title";
          heading.textContent = group.label;
          section.appendChild(heading);

          for (const item of group.items) {
            const btn = document.createElement("button");
            btn.type = "button";
            btn.className = "spotlight-item";
            const titleEl = document.createElement("div");
            titleEl.className = "spotlight-item-title";
            titleEl.textContent = String(item.title || "");
            btn.appendChild(titleEl);

            if (item.snippet) {
              const snippetEl = document.createElement("div");
              snippetEl.className = "spotlight-item-snippet";
              snippetEl.textContent = String(item.snippet || "");
              btn.appendChild(snippetEl);
            }
            btn.addEventListener("click", () => openSearchEntry(item));
            section.appendChild(btn);
            spotlightState.activeEntries.push({ item, element: btn });
          }

          resultsEl.appendChild(section);
        }

        resultsEl.classList.remove("hidden");
      }

      function spotlightSignature(normQuery, category) {
        return `${category}::${normQuery}`;
      }

      function tryReuseNearFullSearch(norm, selectedCategory, tokens) {
        for (const [signature, groups] of spotlightState.fullSearchCache.entries()) {
          const [cachedCategory = "", cachedNorm = ""] = String(signature).split("::");
          if (cachedCategory !== selectedCategory) continue;
          if (!cachedNorm || cachedNorm === norm) continue;
          const delta = Math.abs(cachedNorm.length - norm.length);
          if (delta > 1) continue;
          if (!(norm.startsWith(cachedNorm) || cachedNorm.startsWith(norm))) continue;

          const filtered = flattenRenderedEntries(groups).filter((entry) => {
            const blob = buildEntrySearchBlob(entry);
            return tokens.every((token) => blob.includes(token));
          });

          if (!filtered.length) continue;
          return groupAndLimitEntries(filtered, selectedCategory, norm, tokens);
        }
        return null;
      }

      async function runCategorySearch(type, primaryKey, tokens, perTypeQueryLimit = SEARCH_FETCH_LIMIT_SINGLE) {
        const ref = collection(db, "searchIndex");
        const qRef = query(
          ref,
          where("type", "==", type),
          where("searchKeys", "array-contains", primaryKey),
          limit(perTypeQueryLimit),
        );

        const snap = await getDocs(qRef);
        const mapped = snap.docs.map(mapSearchDocToEntry);
        const filtered = mapped.filter((entry) => {
          if (!entry.title) return false;
          const blob = buildEntrySearchBlob(entry);
          return tokens.every((token) => blob.includes(token));
        });
        return filtered;
      }

      function groupAndLimitEntries(entries, selectedCategory, normQuery, tokens) {
        const grouped = new Map();
        const order = activeSearchTypes();
        for (const type of order) grouped.set(type, []);

        for (const entry of entries) {
          if (!grouped.has(entry.type)) continue;
          grouped.get(entry.type).push(entry);
        }

        const out = [];
        for (const type of order) {
          const scored = grouped
            .get(type)
            .map((entry) => ({ ...entry, score: computeEntryScore(entry, normQuery, tokens) }))
            .sort((a, b) => b.score - a.score || Number(b.popularity || 0) - Number(a.popularity || 0));

          const limitPerCategory = selectedCategory === "all" ? SEARCH_LIMIT_ALL : SEARCH_LIMIT_SINGLE;
          const items = scored.slice(0, limitPerCategory);
          if (!items.length) continue;

          out.push({
            type,
            label: SEARCH_TYPE_LABEL[type],
            items,
          });
        }
        return out;
      }

      function renderLocalSuggestions(rawQuery) {
        const norm = normalizeSearchText(rawQuery);
        const types = activeSearchTypes();
        const cacheItems = getStoredCacheItems().filter((item) => types.includes(item.type));
        const recentItems = getStoredRecentItems().filter((item) => types.includes(item.type));

        const suggestionItems = [];
        if (norm.length < SEARCH_MIN_CHARS) {
          for (const item of recentItems
            .slice()
            .sort((a, b) => Number(b.clicks || 0) - Number(a.clicks || 0))
            .slice(0, 5)) {
            suggestionItems.push({
              ...item,
              popularity: Number(item.clicks || 0),
              source: "recent",
            });
          }

          const queries = getStoredRecentQueries().slice(0, 5);
          if (queries.length && suggestionItems.length < 5) {
            for (const qText of queries) {
              suggestionItems.push({
                type: "query",
                sourceId: "",
                title: qText,
                snippet: "Poprzednie zapytanie",
                url: "",
                slug: "",
                popularity: 0,
                source: "query",
              });
              if (suggestionItems.length >= 5) break;
            }
          }
        } else {
          const tokens = tokenizeQuery(norm);
          const fromCache = cacheItems
            .filter((item) => {
              const blob = normalizeSearchText(
                [item.title, item.snippet, coerceArray(item.tokens).join(" "), item.meta?.category || ""].join(" "),
              );
              return tokens.every((token) => blob.includes(token));
            })
            .map((item) => ({
              ...item,
              snippet: toDisplaySnippet(item.snippet),
              source: "cache",
              score: computeEntryScore(item, norm, tokens),
            }))
            .sort((a, b) => Number(b.score || 0) - Number(a.score || 0))
            .slice(0, 12);

          suggestionItems.push(...fromCache);
        }

        const deduped = [];
        const seen = new Set();
        for (const item of suggestionItems) {
          if (item.type === "query") {
            const k = `query:${normalizeSearchText(item.title)}`;
            if (seen.has(k)) continue;
            seen.add(k);
            deduped.push(item);
            continue;
          }
          const key = searchEntryKey(item);
          if (seen.has(key)) continue;
          seen.add(key);
          deduped.push(item);
        }

        const grouped = [];
        const entryItems = deduped.filter((x) => x.type !== "query");
        if (entryItems.length) {
          const normalizedEntries = entryItems.map((item) => ({
            ...item,
            type: item.type,
            sourceId: item.sourceId,
            title: item.title,
            snippet: item.snippet || "",
            url: item.url || "",
            slug: item.slug || "",
            meta: item.meta || {},
            tokens: coerceArray(item.tokens),
          }));
          grouped.push({ type: "suggestions", label: "Ostatnie", items: normalizedEntries.slice(0, 5) });
        }

        const queryItems = deduped.filter((x) => x.type === "query");
        if (queryItems.length && !grouped.length) {
          grouped.push({
            type: "queries",
            label: "Ostatnie zapytania",
            items: queryItems.slice(0, 5),
          });
        }

        if (!grouped.length) {
          spotlightEls.results.classList.add("hidden");
          spotlightState.activeEntries = [];
          spotlightState.selectionIndex = -1;
          return;
        }

        renderSpotlightGroups(grouped);
      }

      async function runFullSearch({ persistQuery = false } = {}) {
        const input = spotlightEls.input;
        if (!input) return;

        const raw = input.value || "";
        const norm = normalizeSearchText(raw);
        if (norm.length < SEARCH_MIN_CHARS) {
          renderLocalSuggestions(raw);
          return;
        }

        const selectedCategory = spotlightState.selectedCategory || "all";
        const signature = spotlightSignature(norm, selectedCategory);
        if (spotlightState.lastFullSignature === signature && spotlightState.fullSearchCache.has(signature)) {
          renderSpotlightGroups(spotlightState.fullSearchCache.get(signature));
          return;
        }

        const tokens = tokenizeQuery(norm);
        if (!tokens.length) {
          renderLocalSuggestions(raw);
          return;
        }
        const primaryToken = tokens.find((token) => token.length >= SEARCH_MIN_CHARS) || norm;
        const primaryKey = primaryToken.slice(0, 12);
        const types = activeSearchTypes();
        if (!types.length) {
          spotlightEls.results.innerHTML = '<div class="spotlight-empty">Brak dostępnych kategorii dla tego konta.</div>';
          spotlightEls.results.classList.remove("hidden");
          return;
        }

        const nearCachedGroups = tryReuseNearFullSearch(norm, selectedCategory, tokens);
        if (nearCachedGroups) {
          spotlightState.lastFullSignature = signature;
          spotlightState.fullSearchCache.set(signature, nearCachedGroups);
          if (persistQuery) pushRecentQuery(raw);
          renderSpotlightGroups(nearCachedGroups);
          return;
        }

        spotlightEls.results.innerHTML = '<div class="spotlight-empty">Wyszukiwanie…</div>';
        spotlightEls.results.classList.remove("hidden");

        const perTypeQueryLimit =
          selectedCategory === "all" ? SEARCH_FETCH_LIMIT_ALL : SEARCH_FETCH_LIMIT_SINGLE;
        const queryErrors = [];
        const resultsByType = await Promise.all(
          types.map(async (type) => {
            try {
              const rows = await runCategorySearch(type, primaryKey, tokens, perTypeQueryLimit);
              return rows;
            } catch (e) {
              queryErrors.push(e);
              console.warn("search query failed:", type, e?.message || e);
              return [];
            }
          }),
        );

        const flat = resultsByType.flat();
        if (!flat.length && queryErrors.length === types.length) {
          const missingIndex = queryErrors.some((err) => {
            const code = String(err?.code || "");
            const msg = String(err?.message || "").toLowerCase();
            return code.includes("failed-precondition") || msg.includes("index");
          });
          if (missingIndex) {
            spotlightEls.results.innerHTML =
              '<div class="spotlight-empty">Indeks wyszukiwania nie jest jeszcze gotowy. Dokończ budowę indeksów Firestore i uruchom reindex.</div>';
            spotlightEls.results.classList.remove("hidden");
            return;
          }
        }

        const grouped = groupAndLimitEntries(flat, selectedCategory, norm, tokens);
        spotlightState.lastFullSignature = signature;
        spotlightState.fullSearchCache.set(signature, grouped);
        if (spotlightState.fullSearchCache.size > 16) {
          const firstKey = spotlightState.fullSearchCache.keys().next().value;
          spotlightState.fullSearchCache.delete(firstKey);
        }

        mergeIntoCache(flat);
        if (persistQuery) pushRecentQuery(raw);
        renderSpotlightGroups(grouped);
      }

      function openGlobalModal(url) {
        if (!spotlightEls.modal || !spotlightEls.modalFrame) return;
        spotlightEls.modalFrame.src = url;
        spotlightEls.modal.classList.remove("hidden");
        spotlightEls.modal.classList.add("flex");
        document.body.style.overflow = "hidden";
      }

      function closeGlobalModal() {
        if (!spotlightEls.modal || !spotlightEls.modalFrame) return;
        spotlightEls.modal.classList.add("hidden");
        spotlightEls.modal.classList.remove("flex");
        spotlightEls.modalFrame.src = "about:blank";
        document.body.style.overflow = "";
      }

      function withEmbedQuery(urlValue, params = {}) {
        try {
          const url = new URL(urlValue);
          url.searchParams.set("embedModal", "1");
          for (const [key, value] of Object.entries(params)) {
            if (value == null || value === "") continue;
            url.searchParams.set(key, String(value));
          }
          return url.toString();
        } catch (_) {
          return urlValue;
        }
      }

      function openSearchEntry(entry) {
        if (!entry) return;

        spotlightEls.results?.classList.add("hidden");
        spotlightEls.shell?.classList.remove("is-active");

        if (entry.type === "query") {
          spotlightEls.input.value = entry.title || "";
          runFullSearch({ persistQuery: true });
          return;
        }

        pushRecentItem(entry);

        let targetUrl = entry.url || "";
        if (entry.type === "user") {
          const userId = entry.sourceId || entry.slug;
          targetUrl = withEmbedQuery(targetUrl || "https://konto.strzelca.pl/profil.html", {
            uid: userId || "",
          });
        } else if (entry.type === "shop") {
          targetUrl = withEmbedQuery(targetUrl || "https://sklep.strzelca.pl/", { open: entry.sourceId || entry.slug });
        } else if (entry.type === "event") {
          targetUrl = withEmbedQuery(targetUrl || "https://wydarzenia.strzelca.pl/", { open: entry.sourceId || entry.slug });
        } else if (entry.type === "blog") {
          targetUrl = withEmbedQuery(targetUrl || "https://blog.strzelca.pl/", { open: entry.sourceId || entry.slug });
        } else if (entry.type === "bazar") {
          targetUrl = withEmbedQuery(targetUrl || "https://bazar.strzelca.pl/", { offer: entry.sourceId || entry.slug });
        }

        if (!targetUrl) return;
        openGlobalModal(targetUrl);
      }

      function highlightSpotlightByOffset(offset) {
        const entries = spotlightState.activeEntries;
        if (!entries.length) return;
        const current = spotlightState.selectionIndex;
        let next = current + offset;
        if (next < 0) next = entries.length - 1;
        if (next >= entries.length) next = 0;
        setSpotlightSelection(next);
        entries[next].element.scrollIntoView({ block: "nearest" });
      }

      function scheduleSearch() {
        if (spotlightState.typingTimer) {
          clearTimeout(spotlightState.typingTimer);
        }
        spotlightState.typingTimer = setTimeout(async () => {
          const queryText = spotlightEls.input?.value || "";
          const norm = normalizeSearchText(queryText);
          if (norm.length < SEARCH_MIN_CHARS) {
            renderLocalSuggestions(queryText);
            return;
          }
          await runFullSearch({ persistQuery: false });
        }, 230);
      }

      function initSpotlightSearch() {
        spotlightEls.shell = document.getElementById("spotlight-search");
        spotlightEls.input = document.getElementById("spotlight-search-input");
        spotlightEls.submit = document.getElementById("spotlight-submit");
        spotlightEls.filterToggle = document.getElementById("spotlight-filter-toggle");
        spotlightEls.filterMenu = document.getElementById("spotlight-filter-menu");
        spotlightEls.results = document.getElementById("spotlight-results");
        spotlightEls.modal = document.getElementById("global-modal");
        spotlightEls.modalFrame = document.getElementById("global-modal-frame");
        spotlightEls.modalClose = document.getElementById("global-modal-close");

        if (!spotlightEls.shell || !spotlightEls.input || !spotlightEls.results) return;

        updateSearchCategoryOptions();
        refreshFilterMenuSelection();

        spotlightEls.input.addEventListener("focus", () => {
          setSearchEngaged(true);
          renderLocalSuggestions(spotlightEls.input.value || "");
        });

        spotlightEls.input.addEventListener("input", () => {
          scheduleSearch();
        });

        spotlightEls.input.addEventListener("keydown", async (event) => {
          if (event.key === "ArrowDown") {
            event.preventDefault();
            highlightSpotlightByOffset(1);
            return;
          }
          if (event.key === "ArrowUp") {
            event.preventDefault();
            highlightSpotlightByOffset(-1);
            return;
          }
          if (event.key === "Enter") {
            event.preventDefault();
            if (
              spotlightState.selectionIndex >= 0 &&
              spotlightState.selectionIndex < spotlightState.activeEntries.length
            ) {
              const chosen = spotlightState.activeEntries[spotlightState.selectionIndex]?.item;
              if (chosen) {
                openSearchEntry(chosen);
                return;
              }
            }
            await runFullSearch({ persistQuery: true });
            return;
          }
          if (event.key === "Escape") {
            spotlightEls.results.classList.add("hidden");
            closeFilterMenu();
            setSpotlightSelection(-1);
            return;
          }
        });

        spotlightEls.submit?.addEventListener("click", () => {
          setSearchEngaged(true);
          runFullSearch({ persistQuery: true });
        });

        spotlightEls.filterToggle?.addEventListener("click", (event) => {
          event.preventDefault();
          event.stopPropagation();
          setSearchEngaged(true);
          toggleFilterMenu();
        });

        spotlightEls.filterMenu?.addEventListener("click", (event) => {
          const button = event.target?.closest?.(".spotlight-filter-item");
          if (!button) return;
          const nextCategory = String(button.getAttribute("data-category") || "all");
          if (nextCategory === "user" && !userSearchVisible()) return;
          spotlightState.selectedCategory = nextCategory;
          spotlightState.lastFullSignature = "";
          closeFilterMenu();
          refreshFilterMenuSelection();
          const raw = spotlightEls.input.value || "";
          const norm = normalizeSearchText(raw);
          if (norm.length >= SEARCH_MIN_CHARS) {
            void runFullSearch({ persistQuery: false });
          } else {
            renderLocalSuggestions(raw);
          }
        });

        spotlightEls.modalClose?.addEventListener("click", closeGlobalModal);
        spotlightEls.modal?.addEventListener("click", (event) => {
          if (event.target === spotlightEls.modal) closeGlobalModal();
        });

        window.addEventListener("message", (event) => {
          if (event.data?.source === "strzelca-modal" && event.data?.action === "close") {
            closeGlobalModal();
          }
        });

        document.addEventListener("keydown", (event) => {
          if (event.key === "Escape" && !spotlightEls.modal?.classList.contains("hidden")) {
            closeGlobalModal();
          }
        });

        document.addEventListener("click", (event) => {
          if (!spotlightEls.shell.contains(event.target)) {
            spotlightEls.results.classList.add("hidden");
            closeFilterMenu();
            setSearchEngaged(false);
            setSpotlightSelection(-1);
          }
        });
      }

      initSpotlightSearch();

      // Dodaj globalną obsługę błędów CORS (ignoruj błędy Firebase internal)
      window.addEventListener('error', function(e) {
        // Ignoruj błędy CORS związane z Firebase/Firestore
        if (e.message && (
          e.message.includes('access control checks') ||
          e.message.includes('CORS') ||
          e.message.includes('firestore.googleapis.com')
        )) {
          console.warn('Ignored Firebase CORS error:', e.message);
          e.preventDefault();
          return false;
        }
      });

      // Dodaj obsługę błędów dla fetch API
      window.addEventListener('unhandledrejection', function(e) {
        if (e.reason && e.reason.message && (
          e.reason.message.includes('access control checks') ||
          e.reason.message.includes('CORS') ||
          e.reason.message.includes('firestore.googleapis.com')
        )) {
          console.warn('Ignored Firebase CORS promise rejection:', e.reason.message);
          e.preventDefault();
          return false;
        }
      });

      // --- MONITOROWANIE STANU ZALOGOWANIA ---
      // OPTYMALIZACJA: Inicjalizacja i SSO są już wykonane w initAuth()
      console.log("Firebase Auth initialized, checking current user...");

      // Sprawdź aktualnego użytkownika przed ustawieniem listenera
      const checkCurrentUserOnIndex = async () => {
        if (!auth) {
          console.warn("Auth nie jest jeszcze dostępne");
          return false;
        }
        const currentUser = auth.currentUser;
        if (currentUser) {
          try {
            await currentUser.reload();
            console.log("Sprawdzanie aktualnego użytkownika na stronie głównej");
          } catch (error) {
            console.warn("Błąd sprawdzania aktualnego użytkownika na stronie głównej:", error);
          }
        }
        return false;
      };

      // Sprawdź przed ustawieniem listenera
      const wasSignedOut = await checkCurrentUserOnIndex();
      const shouldSkipAuthListener = wasSignedOut === true;

      // Flaga zapobiegająca wielokrotnemu wylogowaniu
      let isSigningOut = false;
      let initialAuthCheck = true; // Flaga dla pierwszego wywołania

      if (!shouldSkipAuthListener && auth) {
        onAuthStateChanged(auth, async (user) => {
        // Ignoruj zmiany stanu podczas wylogowywania
        if (isSigningOut) {
          console.log("Ignoruję zmianę stanu podczas wylogowywania");
          return;
        }

        // Ignoruj pierwsze wywołanie z user = null TYLKO jeśli nie ma aktualnego użytkownika
        // i to jest rzeczywiście początkowe załadowanie strony (nie po przekierowaniu)
        if (initialAuthCheck && !user) {
          const currentUser = auth.currentUser;
          if (!currentUser) {
            console.log(
              "Początkowe wywołanie onAuthStateChanged z user = null - ignoruję (brak aktualnego użytkownika)"
            );
            initialAuthCheck = false;
            return;
          }
          // Jest aktualny użytkownik, więc kontynuujemy jako zalogowany
          initialAuthCheck = false;
          user = currentUser;
        }
        initialAuthCheck = false;

        console.log(
          "Auth state changed:",
          user ? "logged in" : "logged out",
          user?.email || ""
        );

        currentUser = user;
        updateUserInterface(user);
        updateSearchCategoryOptions();
        });
      }

      // Funkcja pomocnicza do generowania domyślnego awatara
      function getDefaultAvatar(gender) {
        return '<i class="fa-solid fa-user text-white"></i>';
      }

      // Funkcja aktualizacji interfejsu użytkownika
      async function updateUserInterface(user) {
        const loginBtn = document.getElementById("login-button");
        const userPanel = document.getElementById("user-panel");
        const userDisplayName = document.getElementById("user-display-name");
        const userAvatar = document.getElementById("user-avatar");

        if (user) {
          // Użytkownik zalogowany
          loginBtn.classList.add("hidden");
          userPanel.classList.remove("hidden");

          // Sprawdź czy użytkownik ma zweryfikowany email (tryb ograniczony, bez wylogowania)
          const profileLink = document.getElementById("profile-link");
          if (profileLink) {
            profileLink.href = "https://konto.strzelca.pl/profil.html";
          }

          // Pobierz awatar z profilu (cache localStorage → mniej odczytów Firestore)
          try {
            const cached = getHeaderProfileFromCache(user.uid);
            const fallbackName = user.displayName || user.email.split("@")[0];
            userDisplayName.textContent = cached
              ? cached.displayName || fallbackName
              : fallbackName;

            if (cached) {
              if (cached.avatar) {
                userAvatar.innerHTML = `<img src="${cached.avatar}" alt="Avatar" class="w-full h-full rounded-full object-cover">`;
              } else {
                userAvatar.innerHTML = getDefaultAvatar(cached.gender);
              }
            } else {
              userAvatar.innerHTML = getDefaultAvatar();

              const profileDoc = await getDoc(doc(db, "userProfiles", user.uid));
              if (profileDoc.exists()) {
                const userProfile = profileDoc.data();
                console.log("Profil użytkownika istnieje:", userProfile.displayName);
                setHeaderProfileCache(user.uid, {
                  displayName: userProfile.displayName || "",
                  avatar: userProfile.avatar || "",
                  gender: userProfile.gender ?? null,
                  role: userProfile.role || "user",
                  profileExists: true,
                });
                if (userProfile.avatar) {
                  userAvatar.innerHTML = `<img src="${userProfile.avatar}" alt="Avatar" class="w-full h-full rounded-full object-cover">`;
                } else {
                  userAvatar.innerHTML = getDefaultAvatar(userProfile.gender);
                }
              } else {
                console.warn("Profil użytkownika nie istnieje w Firestore, ale użytkownik jest zalogowany");
                setHeaderProfileCache(user.uid, {
                  displayName: fallbackName,
                  avatar: "",
                  gender: null,
                  role: "user",
                  profileExists: false,
                });
                userAvatar.innerHTML = getDefaultAvatar();
              }
            }
          } catch (error) {
            // Ignoruj błędy CORS i problemy z połączeniem do Firestore
            if (error.message && (
              error.message.includes('access control checks') ||
              error.message.includes('CORS') ||
              error.message.includes('firestore.googleapis.com') ||
              error.message.includes('network-request-failed')
            )) {
              console.warn("Ignored Firestore connection error in user interface update:", error.message);
            } else {
              console.error("Error loading user profile:", error);
            }
            userAvatar.innerHTML = getDefaultAvatar();
          }
        } else {
          // Użytkownik niezalogowany
          loginBtn.classList.remove("hidden");
          userPanel.classList.add("hidden");
        }
      }

      // Funkcja rozwijania/zwijania menu użytkownika
      window.toggleUserMenu = () => {
        const userMenu = document.getElementById("user-menu");
        if (userMenu) {
          userMenu.classList.toggle("hidden");
        }
      };

      // (usunięto) logikę weryfikacji emaila poza procesem logowania

      // Zamykanie menu po kliknięciu poza nim
      document.addEventListener("click", (event) => {
        const userPanel = document.getElementById("user-panel");
        const userMenu = document.getElementById("user-menu");
        const userAvatarButton = document.getElementById("user-avatar-button");
        
        if (
          userPanel &&
          userMenu &&
          !userPanel.contains(event.target) &&
          !userMenu.classList.contains("hidden")
        ) {
          userMenu.classList.add("hidden");
        }
      });

      // Funkcja wylogowania
      window.logout = async () => {
        try {
          // SSO: wyczyść cookie wspólnej sesji
          try {
            await fetch("https://strzelca.pl/api/sso-session-logout", {
              method: "POST",
              credentials: "include",
            });
          } catch (e) {
            console.warn("SSO logout failed (ignored):", e?.message || e);
          }
          
          // Wyczyść cache SSO (ważne dla synchronizacji między subdomenami)
          try {
            const { clearSSOCache } = await import("https://strzelca.pl/sso-client.mjs?v=2026-03-21-1");
            clearSSOCache();
          } catch (e) {
            console.warn("SSO cache clear failed (ignored):", e?.message || e);
          }
          
          await signOut(auth);
          // Zamknij menu po wylogowaniu
          const userMenu = document.getElementById("user-menu");
          if (userMenu) {
            userMenu.classList.add("hidden");
          }
        } catch (error) {
          console.error("Logout error:", error);
        }
      };
    </script>
    <script
      type="module"
      src="https://strzelca.pl/auth-widget.mjs?v=2026-03-25-1"
    ></script>
    <script
      type="module"
      src="https://strzelca.pl/messages-widget.mjs?v=2026-03-23-1"
    ></script>
    <script type="module" src="https://strzelca.pl/global-search-widget.mjs?v=2026-03-24-1"></script>
