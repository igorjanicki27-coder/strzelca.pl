    <script type="module">
        import { initializeApp, getApp, getApps } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, onAuthStateChanged, setPersistence, browserLocalPersistence } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { initializeFirestore, getFirestore, collection, getDocs, doc, getDoc, query, orderBy, updateDoc, setDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
        import { ensureFirebaseSSO } from "https://strzelca.pl/sso-client.mjs?v=2026-03-29-4";
        import {
          getHeaderProfileFromCache,
          setHeaderProfileCache,
        } from "https://strzelca.pl/header-profile-cache.mjs?v=2026-03-21-1";
        import { openOrderInquiryFlow } from "https://strzelca.pl/order-inquiry-form.mjs?v=2026-04-07-1";
        import { loadWithVersionCache, idbDeleteEntry } from "https://strzelca.pl/public-firestore-list-cache.mjs?v=2026-03-21-1";
        import { attachHorizontalCarouselSwipe } from "https://strzelca.pl/carousel-swipe.mjs?v=2026-03-27-1";
        import { syncCarouselDotsNav } from "https://strzelca.pl/carousel-dots.mjs?v=2026-03-24-1";
        import {
            initNewsletterOptInFromEmptyCarousels,
            buildEmptyCarouselArticleHtml,
        } from "https://strzelca.pl/empty-carousel-newsletter.mjs?v=2026-03-22-1";

        
      async function getFirebaseApiKey() {
        const cachedKey = localStorage.getItem("firebase_web_api_key");
        if (cachedKey) return cachedKey;

        // Używamy pełnego URL, bo sklep jest na subdomenie sklep.strzelca.pl
        const urls = [
          "https://strzelca.pl/api/firebase-config",
          "/api/firebase-config" // fallback dla lokalnego developmentu
        ];

        for (const url of urls) {
          try {
            const res = await fetch(url, { cache: "force-cache" });
            if (!res.ok) continue;
            const data = await res.json().catch(() => null);
            if (data && typeof data.apiKey === "string" && data.apiKey.length > 10) {
              localStorage.setItem("firebase_web_api_key", data.apiKey);
              return data.apiKey;
            }
          } catch (_) {
            // ignore and try next url
          }
        }

        throw new Error("Nie udało się pobrać FIREBASE_WEB_API_KEY z /api/firebase-config");
      }
        const baseFirebaseConfig = {
            authDomain: "strzelca-pl.firebaseapp.com",
            projectId: "strzelca-pl",
            storageBucket: "strzelca-pl.appspot.com",
            messagingSenderId: "511362047688",
            appId: "1:511362047688:web:9b82c0a4d19c1a3a878ffd"
        };

        let app;
        const existingApps = getApps();
        if (existingApps.length > 0) {
            app = getApp();
        } else {
            const apiKey = await getFirebaseApiKey();
            app = initializeApp({
                apiKey,
                ...baseFirebaseConfig
            });
        }

        let db;
        try {
            db = initializeFirestore(app, {
                experimentalAutoDetectLongPolling: true,
                useFetchStreams: true,
            });
        } catch (e) {
            if (e?.code === "failed-precondition" || String(e?.message || "").includes("already been called")) {
                db = getFirestore(app);
            } else {
                throw e;
            }
        }
        const auth = getAuth(app);

        // Obsługa błędów CORS z Firestore (często są to fałszywe alarmy)
        window.addEventListener('unhandledrejection', function(e) {
            if (e.reason && e.reason.message && (
                e.reason.message.includes('access control checks') ||
                e.reason.message.includes('CORS') ||
                e.reason.message.includes('firestore.googleapis.com')
            )) {
                console.warn('Ignored Firebase CORS promise rejection:', e.reason.message);
                e.preventDefault();
                return false;
            }
        });

        // Ustaw trwałość sesji na browserLocalPersistence dla wszystkich subdomen
        await setPersistence(auth, browserLocalPersistence);

        // SSO między subdomenami: jeśli tu nie ma usera, spróbuj zalogować z cookie (.strzelca.pl)
        try {
            await ensureFirebaseSSO(auth);
        } catch (e) {
            console.warn("SSO ensure failed (ignored):", e?.message || e);
        }

        initNewsletterOptInFromEmptyCarousels({
            auth,
            db,
            doc,
            getDoc,
            setDoc,
            updateDoc,
        });

        void (async () => {
            try {
                const [{ initActivityTracker }, { initUserStatusMonitor }, { initVisitTracker }] =
                    await Promise.all([
                        import("https://strzelca.pl/activity-tracker.mjs?v=2026-03-23-1"),
                        import("https://strzelca.pl/user-status-monitor.mjs?v=2026-02-06-1"),
                        import("https://strzelca.pl/visit-tracker.mjs?v=2026-03-23-1"),
                    ]);
                await Promise.all([
                    initActivityTracker(auth, db),
                    initUserStatusMonitor(auth, db),
                    initVisitTracker(auth),
                ]);
            } catch (error) {
                console.warn("Could not initialize trackers:", error);
            }
        })();

        let currentUser = null;
        const STRZELCA_ORDERS_API = "https://strzelca.pl/api/orders";

        // Funkcja pomocnicza do generowania domyślnego awatara
        function getDefaultAvatar(gender) {
            return '<i class="fa-solid fa-user text-white"></i>';
        }

        // Funkcja rozwijania/zwijania menu użytkownika
        window.toggleUserMenu = () => {
            const userMenu = document.getElementById("user-menu");
            if (userMenu) {
                userMenu.classList.toggle("hidden");
            }
        };

        // Zamykanie menu po kliknięciu poza nim
        document.addEventListener("click", (event) => {
            const userPanel = document.getElementById("user-panel");
            const userMenu = document.getElementById("user-menu");
            
            if (
                userPanel &&
                userMenu &&
                !userPanel.contains(event.target) &&
                !userMenu.classList.contains("hidden")
            ) {
                userMenu.classList.add("hidden");
            }
        });

        // Funkcja aktualizacji interfejsu użytkownika
        async function updateUserInterface(user) {
            const loginBtn = document.getElementById("login-button");
            const userPanel = document.getElementById("user-panel");
            const userDisplayName = document.getElementById("user-display-name");
            const userAvatar = document.getElementById("user-avatar");
            const profileLink = document.getElementById("profile-link");

            if (user) {
                // Użytkownik zalogowany
                loginBtn.classList.add("hidden");
                userPanel.classList.remove("hidden");

                // Wyświetl nazwę użytkownika
                const displayName = user.displayName || user.email.split("@")[0];
                if (userDisplayName) {
                    userDisplayName.textContent = displayName;
                }

                // Profil zawsze prowadzi do profilu (weryfikacja emaila jest sprawdzana wyłącznie przy logowaniu)
                if (profileLink) {
                    profileLink.href = "https://konto.strzelca.pl/profil.html";
                }

                // Pobierz awatar z profilu (cache localStorage → mniej odczytów Firestore)
                try {
                    const cached = getHeaderProfileFromCache(user.uid);
                    const fallbackName = user.displayName || user.email.split("@")[0];

                    if (cached) {
                        if (userDisplayName) {
                            userDisplayName.textContent = cached.displayName || fallbackName;
                        }
                        if (userAvatar) {
                            if (cached.avatar) {
                                userAvatar.innerHTML = `<img src="${cached.avatar}" alt="Avatar" class="w-full h-full rounded-full object-cover">`;
                            } else {
                                userAvatar.innerHTML = getDefaultAvatar(cached.gender);
                            }
                        }
                    } else {
                        if (userDisplayName) {
                            userDisplayName.textContent = fallbackName;
                        }
                        if (userAvatar) {
                            userAvatar.innerHTML = getDefaultAvatar();
                        }

                        const profileDoc = await getDoc(doc(db, "userProfiles", user.uid));
                        if (profileDoc.exists()) {
                            const userProfile = profileDoc.data();
                            setHeaderProfileCache(user.uid, {
                                displayName: userProfile.displayName || "",
                                avatar: userProfile.avatar || "",
                                gender: userProfile.gender ?? null,
                                role: userProfile.role || "user",
                                profileExists: true,
                            });
                            if (userProfile.displayName && userDisplayName) {
                                userDisplayName.textContent = userProfile.displayName;
                            }
                            if (userAvatar) {
                                if (userProfile.avatar) {
                                    userAvatar.innerHTML = `<img src="${userProfile.avatar}" alt="Avatar" class="w-full h-full rounded-full object-cover">`;
                                } else {
                                    userAvatar.innerHTML = getDefaultAvatar(userProfile.gender);
                                }
                            }
                        } else {
                            setHeaderProfileCache(user.uid, {
                                displayName: fallbackName,
                                avatar: "",
                                gender: null,
                                role: "user",
                                profileExists: false,
                            });
                            if (userAvatar) {
                                userAvatar.innerHTML = getDefaultAvatar();
                            }
                        }
                    }
                } catch (error) {
                    console.error("Error loading user profile:", error);
                    if (userAvatar) {
                        userAvatar.innerHTML = getDefaultAvatar();
                    }
                }
            } else {
                // Użytkownik niezalogowany
                loginBtn.classList.remove("hidden");
                userPanel.classList.add("hidden");
            }
        }

        // Funkcja wylogowania
        window.logout = async () => {
            try {
                // SSO: wyczyść cookie wspólnej sesji
                try {
                    await fetch("https://strzelca.pl/api/sso-session-logout", {
                        method: "POST",
                        credentials: "include",
                    });
                } catch (e) {
                    console.warn("SSO logout failed (ignored):", e?.message || e);
                }

                const { signOut } = await import("https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js");
                await signOut(auth);
                // Zamknij menu po wylogowaniu
                const userMenu = document.getElementById("user-menu");
                if (userMenu) {
                    userMenu.classList.add("hidden");
                }
            } catch (error) {
                console.error("Logout error:", error);
            }
        };

        // Monitorowanie stanu logowania
        onAuthStateChanged(auth, (user) => {
            currentUser = user;
            updateUserInterface(user);
            void refreshProductOrderStates();
        });

        window.handleOrder = async (
            productId,
            productName,
            productPrice = null,
            individualPricing = false,
        ) => {
            await openOrderInquiryFlow({
                auth,
                db,
                getDoc,
                doc,
                context: "shop",
                rawTitle: productName,
                price: productPrice || 0,
                itemId: productId || "",
                individualPricing: individualPricing === true,
            });
        };

        let productItems = [];
        let productCarouselLeftIndex = 0;
        let productLoopEnabled = false;
        let productCarouselAnimating = false;
        let productPendingMoves = 0;
        const PRODUCT_CAROUSEL_DURATION_MS = 180;

        function isOrderBlockingStatus(status) {
            return status !== 'zakonczone' && status !== 'anulowane';
        }

        async function fetchActiveOrderItemIdsByContext(context) {
            if (!currentUser) return new Set();
            try {
                const idToken = await currentUser.getIdToken();
                const response = await fetch(`${STRZELCA_ORDERS_API}?scope=mine`, {
                    method: "GET",
                    headers: {
                        Authorization: `Bearer ${idToken}`,
                    },
                    credentials: "include",
                });
                const data = await response.json().catch(() => ({}));
                if (!response.ok || !data?.success || !Array.isArray(data?.data)) {
                    return new Set();
                }
                const ids = new Set();
                data.data.forEach((order) => {
                    if (!order || order.orderContext !== context) return;
                    const orderItemId = String(order.orderItemId || "").trim();
                    const status = String(order.status || "").trim();
                    if (orderItemId && isOrderBlockingStatus(status)) {
                        ids.add(orderItemId);
                    }
                });
                return ids;
            } catch (error) {
                console.warn("Nie udało się pobrać statusów zamówień:", error);
                return new Set();
            }
        }

        async function refreshProductOrderStates() {
            const activeOrderIds = await fetchActiveOrderItemIdsByContext("shop");
            productItems = productItems.map((item) => ({
                ...item,
                hasActiveOrder: activeOrderIds.has(item.id),
            }));
            renderProductCarousel(false);
        }

        function syncProductCarouselDots() {
            const dots = document.getElementById('product-carousel-dots');
            const n = productItems.length;
            syncCarouselDotsNav(dots, n, productCarouselLeftIndex, (idx) => window.goToProductCarousel(idx), productLoopEnabled);
        }

        window.goToProductCarousel = (idx) => {
            if (!productLoopEnabled) return;
            const n = productItems.length;
            if (n <= 1 || idx < 0 || idx >= n || idx === productCarouselLeftIndex) return;
            const track = document.getElementById('product-track');
            const prevBtn = document.getElementById('carousel-prev');
            const nextBtn = document.getElementById('carousel-next');
            if (!track || !prevBtn || !nextBtn) return;
            productCarouselAnimating = false;
            productPendingMoves = 0;
            const ordered = [...productItems.slice(idx), ...productItems.slice(0, idx)];
            track.innerHTML = ordered.map((item) => buildProductCard(item)).join('');
            productCarouselLeftIndex = idx;
            track.classList.toggle('carousel-track--single', n === 1);
            const visibleCards = getVisibleCardsCount();
            productLoopEnabled = n > visibleCards;
            prevBtn.disabled = !productLoopEnabled;
            nextBtn.disabled = !productLoopEnabled;
            track.style.transition = 'none';
            track.style.transform = 'translateX(0)';
            window.requestAnimationFrame(() => {
                track.style.transition = `transform ${PRODUCT_CAROUSEL_DURATION_MS}ms cubic-bezier(0.22, 0.61, 0.36, 1)`;
            });
            syncProductCarouselDots();
        };

        function getVisibleCardsCount() {
            if (window.innerWidth <= 700) return 1;
            if (window.innerWidth <= 1024) return 2;
            return 3;
        }

        function getProductStepWidth() {
            const track = document.getElementById('product-track');
            if (!track) return 0;

            const cards = track.querySelectorAll('.product-card');
            if (cards.length >= 2) {
                return cards[1].offsetLeft - cards[0].offsetLeft;
            }
            return cards[0] ? cards[0].offsetWidth : 0;
        }

        function buildProductCard(item) {
            const encodedTitle = encodeURIComponent(item.title || '');
            const mainImage = item.mainImage || '';
            const imgStyleAttr = (() => {
                const styles = [];
                if (item.mainImageObjectPosition) {
                    styles.push(`object-position:${item.mainImageObjectPosition};`);
                }
                if (typeof item.mainImageObjectScale === 'number') {
                    const origin = item.mainImageObjectPosition || '50% 50%';
                    styles.push(`transform: scale(${item.mainImageObjectScale}); transform-origin:${origin};`);
                }
                return styles.length ? `style="${styles.join('')}"` : '';
            })();
            const priceLabel = item.individualPricing ? 'Wycena indywidualna' : `${item.price} PLN`;
            const priceAriaLabel = item.individualPricing ? 'Wycena indywidualna' : `Cena: ${item.price} złotych`;

            return `
                <article class="card-dark product-card flex flex-col h-full shadow-2xl transition hover:border-[#C19A6B]/50 cursor-pointer" role="button" tabindex="0" aria-label="Pokaż szczegóły produktu ${item.title}" onclick="window.showDetails('${item.id}')" onkeydown="if(event.key === 'Enter' || event.key === ' '){ event.preventDefault(); window.showDetails('${item.id}'); }">
                    <div class="product-img-container"><img src="${mainImage}" alt="${item.title}" loading="lazy" ${imgStyleAttr}></div>
                    <div class="p-4 md:p-6 flex flex-col flex-grow text-center">
                        <h3 class="text-xl md:text-2xl font-black uppercase mb-2 font-[Orbitron] text-white tracking-tight">${item.title}</h3>
                        ${item.oldPrice ? `<p class="text-zinc-500 line-through text-sm mb-1">${item.oldPrice} PLN</p>` : ''}
                        <p class="coyote-text font-bold text-lg md:text-xl mb-4 md:mb-5 min-w-0 w-full leading-tight whitespace-nowrap overflow-hidden text-ellipsis" aria-label="${priceAriaLabel}">${priceLabel}</p>
                        <div class="mt-auto flex flex-col gap-2 md:gap-3">
                            ${item.hasActiveOrder
                                ? `<button type="button" disabled aria-label="Produkt ${item.title} został już zamówiony" class="w-full py-3 md:py-4 bg-emerald-600 text-white text-[11px] md:text-xs uppercase font-black rounded tracking-[0.12em] flex items-center justify-center cursor-not-allowed opacity-95">Zamówiono</button>`
                                : `<button type="button" onclick="event.stopPropagation(); window.showDetails('${item.id}')" aria-label="Pokaż szczegóły produktu ${item.title}" class="w-full py-3 md:py-4 bg-[#C19A6B] text-black text-[11px] md:text-xs uppercase font-black rounded tracking-[0.12em] flex items-center justify-center hover:bg-[#b18a5f] transition">Złóż zamówienie</button>`
                            }
                        </div>
                    </div>
                </article>
            `;
        }

        function renderProductCarousel(preservePosition = true) {
            const track = document.getElementById('product-track');
            const prevBtn = document.getElementById('carousel-prev');
            const nextBtn = document.getElementById('carousel-next');
            if (!track || !prevBtn || !nextBtn) return;
            track.classList.remove('carousel-track--status-single');
            productCarouselAnimating = false;
            productPendingMoves = 0;

            if (productItems.length === 0) {
                track.classList.remove('carousel-track--single');
                track.innerHTML = buildEmptyCarouselArticleHtml(
                    'card-dark product-card carousel-status-message product-carousel-empty-wide',
                );
                productLoopEnabled = false;
                productCarouselLeftIndex = 0;
                prevBtn.disabled = true;
                nextBtn.disabled = true;
                track.style.transition = 'none';
                track.style.transform = 'translateX(0)';
                syncProductCarouselDots();
                return;
            }

            if (!preservePosition) {
                productCarouselLeftIndex = 0;
                track.innerHTML = productItems.map((item) => buildProductCard(item)).join('');
            }
            track.classList.toggle('carousel-track--single', productItems.length === 1);
            const visibleCards = getVisibleCardsCount();
            productLoopEnabled = productItems.length > visibleCards;
            prevBtn.disabled = !productLoopEnabled;
            nextBtn.disabled = !productLoopEnabled;
            track.style.transition = 'none';
            track.style.transform = 'translateX(0)';
            window.requestAnimationFrame(() => {
                track.style.transition = `transform ${PRODUCT_CAROUSEL_DURATION_MS}ms cubic-bezier(0.22, 0.61, 0.36, 1)`;
            });
            syncProductCarouselDots();
        }

        function consumeQueuedProductMove() {
            if (!productLoopEnabled || productPendingMoves === 0 || productCarouselAnimating) return;
            const nextDir = productPendingMoves > 0 ? 1 : -1;
            productPendingMoves -= nextDir;
            window.moveProductCarousel(nextDir);
        }

        window.moveProductCarousel = (direction) => {
            if (!productLoopEnabled) return;
            const moveDir = direction > 0 ? 1 : -1;

            if (productCarouselAnimating) {
                productPendingMoves += moveDir;
                productPendingMoves = Math.max(-8, Math.min(8, productPendingMoves));
                return;
            }

            const track = document.getElementById('product-track');
            if (!track) return;
            const stepWidth = getProductStepWidth();
            if (stepWidth <= 0) return;

            const n = productItems.length;

            productCarouselAnimating = true;
            let finished = false;
            let fallbackTimer = null;

            const finalizeMove = (afterFinalize) => {
                if (finished) return;
                finished = true;
                if (fallbackTimer) {
                    clearTimeout(fallbackTimer);
                }
                if (typeof afterFinalize === 'function') {
                    afterFinalize();
                }
                productCarouselAnimating = false;
                consumeQueuedProductMove();
            };

            if (moveDir > 0) {
                track.style.transition = `transform ${PRODUCT_CAROUSEL_DURATION_MS}ms cubic-bezier(0.22, 0.61, 0.36, 1)`;
                track.style.transform = `translateX(-${stepWidth}px)`;

                const onEnd = (event) => {
                    if (event.propertyName && event.propertyName !== 'transform') return;
                    track.style.transition = 'none';
                    const firstCard = track.firstElementChild;
                    if (firstCard) {
                        track.appendChild(firstCard);
                    }
                    track.style.transform = 'translateX(0)';
                    void track.offsetHeight;
                    track.style.transition = `transform ${PRODUCT_CAROUSEL_DURATION_MS}ms cubic-bezier(0.22, 0.61, 0.36, 1)`;
                    productCarouselLeftIndex = (productCarouselLeftIndex + 1) % n;
                    syncProductCarouselDots();
                    finalizeMove();
                };
                track.addEventListener('transitionend', onEnd, { once: true });
                fallbackTimer = setTimeout(() => {
                    finalizeMove(() => {
                        track.style.transition = 'none';
                        const firstCard = track.firstElementChild;
                        if (firstCard) {
                            track.appendChild(firstCard);
                        }
                        track.style.transform = 'translateX(0)';
                        void track.offsetHeight;
                        track.style.transition = `transform ${PRODUCT_CAROUSEL_DURATION_MS}ms cubic-bezier(0.22, 0.61, 0.36, 1)`;
                        productCarouselLeftIndex = (productCarouselLeftIndex + 1) % n;
                        syncProductCarouselDots();
                    });
                }, PRODUCT_CAROUSEL_DURATION_MS + 120);
            } else {
                track.style.transition = 'none';
                const lastCard = track.lastElementChild;
                if (lastCard) {
                    track.insertBefore(lastCard, track.firstElementChild);
                }
                productCarouselLeftIndex = (productCarouselLeftIndex - 1 + n) % n;
                syncProductCarouselDots();
                track.style.transform = `translateX(-${stepWidth}px)`;
                void track.offsetHeight;
                track.style.transition = `transform ${PRODUCT_CAROUSEL_DURATION_MS}ms cubic-bezier(0.22, 0.61, 0.36, 1)`;
                track.style.transform = 'translateX(0)';

                const onEnd = (event) => {
                    if (event.propertyName && event.propertyName !== 'transform') return;
                    finalizeMove();
                };
                track.addEventListener('transitionend', onEnd, { once: true });
                fallbackTimer = setTimeout(() => {
                    finalizeMove();
                }, PRODUCT_CAROUSEL_DURATION_MS + 120);
            }
        };

        window.addEventListener('resize', () => {
            if (productItems.length === 0) return;
            renderProductCarousel(false);
        });

        const _shopCarouselVp = document.querySelector('#arsenal .carousel-viewport');
        if (_shopCarouselVp) {
            attachHorizontalCarouselSwipe(_shopCarouselVp, {
                onPrev: () => window.moveProductCarousel(-1),
                onNext: () => window.moveProductCarousel(1),
            });
        }

        const shopUrlParams = new URLSearchParams(window.location.search || '');
        const shopAutoOpenId = (shopUrlParams.get('open') || shopUrlParams.get('product') || '').trim();
        const shopEmbedMode = shopUrlParams.get('embedModal') === '1';
        let shopAutoOpenDone = false;

        function notifyParentCloseInEmbed() {
            if (!shopEmbedMode) return;
            try {
                window.parent?.postMessage({ source: 'strzelca-modal', action: 'close' }, '*');
            } catch (_) {}
        }

        function applyShopEmbedMode() {
            if (!shopEmbedMode) return;
            document.getElementById('user-panel')?.classList.add('hidden');
            document.getElementById('login-button')?.classList.add('hidden');
            document.querySelector('nav')?.classList.add('hidden');
            document.getElementById('arsenal')?.classList.add('hidden');
            const footer = document.querySelector('footer');
            if (footer) footer.classList.add('hidden');
            document.body.style.background = '#000';
        }

        applyShopEmbedMode();

        const wait = (ms) => new Promise((resolve) => setTimeout(resolve, ms));

        const fetchAll = async () => {
            const track = document.getElementById('product-track');
            if (track) {
                track.classList.add('carousel-track--status-single');
                track.innerHTML = `
                    <article class="card-dark product-card carousel-status-message p-8 w-full">
                        <p class="text-zinc-400 uppercase tracking-[0.15em] text-xs w-full text-center">Ładowanie ...</p>
                    </article>
                `;
            }
            const maxAttempts = 3;

            for (let attempt = 1; attempt <= maxAttempts; attempt++) {
                try {
                    const { payload } = await loadWithVersionCache({
                        db,
                        getDoc,
                        doc,
                        idbKey: "list:products",
                        metaDocId: "products",
                        fetchFresh: async () => {
                            let snap;
                            try {
                                const q = query(collection(db, "products"), orderBy("order", "asc"));
                                snap = await getDocs(q);
                            } catch (orderError) {
                                console.warn("products orderBy failed, trying fallback:", orderError);
                                snap = await getDocs(collection(db, "products"));
                            }
                            const rows = [];
                            snap.forEach((d) => {
                                const p = d.data();
                                let mainImage = p.img || '';
                                let mainImagePosX = undefined;
                                let mainImagePosY = undefined;
                                let mainImageZoom = undefined;
                                if (p.images && Array.isArray(p.images) && p.images.length > 0) {
                                    const main = p.images[0];
                                    if (typeof main === 'string') {
                                        mainImage = main;
                                    } else if (main && typeof main === 'object') {
                                        mainImage = main.url || '';
                                        if (typeof main.posX === 'number') mainImagePosX = main.posX;
                                        if (typeof main.posY === 'number') mainImagePosY = main.posY;
                                        if (typeof main.zoom === 'number') mainImageZoom = main.zoom;
                                    }
                                }
                                rows.push({
                                    id: d.id,
                                    title: p.title || '',
                                    price: p.price || 0,
                                    individualPricing: p.individualPricing === true,
                                    mainImage,
                                    mainImageObjectPosition:
                                        typeof mainImagePosX === 'number' && typeof mainImagePosY === 'number'
                                            ? `${mainImagePosX}% ${mainImagePosY}%`
                                            : null,
                                    mainImageObjectScale: typeof mainImageZoom === 'number' ? mainImageZoom : null,
                                });
                            });
                            return rows;
                        },
                    });
                    const rows = Array.isArray(payload) ? payload : [];
                    const activeOrderIds = await fetchActiveOrderItemIdsByContext("shop");
                    productItems = rows.map((item) => ({
                        ...item,
                        hasActiveOrder: activeOrderIds.has(item.id),
                    }));
                    renderProductCarousel(false);
                    if (!shopAutoOpenDone && shopAutoOpenId) {
                        shopAutoOpenDone = true;
                        const opened = await window.showDetails(shopAutoOpenId);
                        if (!opened && shopEmbedMode) {
                            notifyParentCloseInEmbed();
                        }
                    }
                    return;
                } catch (error) {
                    console.warn(`Load products attempt ${attempt}/${maxAttempts} failed:`, error);
                    if (attempt < maxAttempts) {
                        await wait(450 * attempt);
                        continue;
                    }
                }
            }

            if (track) {
                track.classList.add('carousel-track--status-single');
                track.innerHTML = `
                    <article class="card-dark product-card carousel-status-message p-8 w-full">
                        <div class="flex flex-col items-center justify-center gap-3 w-full">
                            <p class="text-red-400 uppercase tracking-[0.15em] text-xs text-center">Nie udało się załadować produktów</p>
                            <button type="button" onclick="window.reloadProducts()" class="px-4 py-2 border border-zinc-700 rounded text-zinc-300 hover:border-[#C19A6B] hover:text-[#C19A6B] transition text-xs uppercase tracking-[0.12em]">Spróbuj ponownie</button>
                        </div>
                    </article>
                `;
            }
            productLoopEnabled = false;
            productCarouselAnimating = false;
            productPendingMoves = 0;
            const prevBtn = document.getElementById('carousel-prev');
            const nextBtn = document.getElementById('carousel-next');
            if (prevBtn) prevBtn.disabled = true;
            if (nextBtn) nextBtn.disabled = true;
        };

        window.reloadProducts = async () => {
            await idbDeleteEntry("list:products");
            fetchAll();
        };

        window.closeDetailsModal = () => {
            const modal = document.getElementById('details-modal');
            if (modal) modal.classList.add('hidden');
            if (shopEmbedMode) {
                notifyParentCloseInEmbed();
            }
        };

        window.showDetails = async (id) => {
            const d = await getDoc(doc(db, "products", id));
            if (!d.exists()) return false;
            const p = d.data();
            const productState = productItems.find((item) => item.id === id) || null;
            
            // Pobierz zdjęcia produktu
            let images = [];
            if (p.images && Array.isArray(p.images) && p.images.length > 0) {
                images = p.images
                    .map((img) => {
                        if (typeof img === 'string') return { url: img };
                        if (img && typeof img === 'object') {
                            return {
                                url: img.url || '',
                                posX: typeof img.posX === 'number' ? img.posX : undefined,
                                posY: typeof img.posY === 'number' ? img.posY : undefined,
                                zoom: typeof img.zoom === 'number' ? img.zoom : undefined,
                            };
                        }
                        return null;
                    })
                    .filter(Boolean);
            } else if (p.img) {
                // Fallback dla starych produktów
                images = [{ url: p.img }];
            }
            
            // Jeśli nie ma zdjęć w tablicy, spróbuj wyciągnąć z opisu
            if (images.length === 0 && p.description) {
                const tempDiv = document.createElement('div');
                tempDiv.innerHTML = p.description;
                const imgs = tempDiv.querySelectorAll('img');
                imgs.forEach(img => {
                    const url = img.src;
                    if (url && !images.some(i => i.url === url)) {
                        images.push({ url });
                    }
                });
            }

            const getObjectPositionStyleAttr = (meta) => {
                if (!meta) return '';
                const posOk = typeof meta.posX === 'number' && typeof meta.posY === 'number';
                const zoomOk = typeof meta.zoom === 'number';
                if (!posOk && !zoomOk) return '';
                const x = posOk ? meta.posX : 50;
                const y = posOk ? meta.posY : 50;
                const styles = [
                    posOk ? `object-position:${x}% ${y}%;` : '',
                    zoomOk ? `transform: scale(${meta.zoom}); transform-origin:${x}% ${y}%;` : '',
                ].filter(Boolean).join('');
                return `style="${styles}"`;
            };
            
            // Generuj HTML galerii
            let galleryHTML = '';
            if (images.length > 0) {
                galleryHTML = `
                    <div class="product-gallery" id="product-gallery">
                        <img id="gallery-main-img" src="${images[0].url}" alt="${p.title}" ${getObjectPositionStyleAttr(images[0])} />
                        ${images.length > 1 ? `
                            <button class="gallery-nav prev" onclick="changeGalleryImage(-1, ${images.length})" id="gallery-prev" style="opacity: 0.3; cursor: not-allowed;">
                                <i class="fa-solid fa-chevron-left"></i>
                            </button>
                            <button class="gallery-nav next" onclick="changeGalleryImage(1, ${images.length})" id="gallery-next">
                                <i class="fa-solid fa-chevron-right"></i>
                            </button>
                            <div class="gallery-counter">
                                <span id="gallery-current">1</span> / <span id="gallery-total">${images.length}</span>
                            </div>
                        ` : ''}
                    </div>
                `;
                
                // Zapisz zdjęcia w zmiennej globalnej dla funkcji nawigacji
                window.currentProductImages = images;
                window.currentGalleryIndex = 0;
                
                // Dodaj obsługę klawiatury dla nawigacji
                const handleKeyPress = (e) => {
                    if (e.key === 'ArrowLeft' && window.currentGalleryIndex > 0) {
                        changeGalleryImage(-1, images.length);
                    } else if (e.key === 'ArrowRight' && window.currentGalleryIndex < images.length - 1) {
                        changeGalleryImage(1, images.length);
                    }
                };
                
                // Usuń poprzedni listener jeśli istnieje
                if (window.galleryKeyHandler) {
                    document.removeEventListener('keydown', window.galleryKeyHandler);
                }
                
                window.galleryKeyHandler = handleKeyPress;
                document.addEventListener('keydown', handleKeyPress);
            }
            
            // Przygotuj opis - usuń zdjęcia, które są już w galerii
            let descriptionHTML = p.description || p.desc || '';
            if (descriptionHTML && images.length > 0) {
                const tempDiv = document.createElement('div');
                tempDiv.innerHTML = descriptionHTML;
                const imageUrls = images.map((i) => i.url).filter(Boolean);
                const imgs = tempDiv.querySelectorAll('img');
                imgs.forEach(img => {
                    if (imageUrls.includes(img.src)) {
                        img.remove();
                    }
                });
                descriptionHTML = tempDiv.innerHTML;
            }
            
            const orderButtonHtml = productState?.hasActiveOrder
                ? `<button type="button" disabled class="bg-emerald-600 text-white px-8 py-4 uppercase text-[10px] font-black rounded tracking-widest shadow-lg cursor-not-allowed opacity-95">Zamówiono</button>`
                : `<button onclick="window.handleOrder('${p.id}', decodeURIComponent('${encodeURIComponent(p.title || "")}'), ${p.price || 0}, ${p.individualPricing === true})" class="bg-[#C19A6B] text-black px-8 py-4 uppercase text-[10px] font-black rounded tracking-widest shadow-lg hover:bg-[#b18a5f] transition">Złóż zamówienie</button>`;

            document.getElementById('details-content').innerHTML = `
                <h2 class="text-3xl font-black uppercase mb-4 font-[Orbitron] text-white">${p.title}</h2>
                ${galleryHTML}
                <div class="text-zinc-400 text-sm mb-8 custom-render details-scroll-area leading-relaxed">
                    ${descriptionHTML}
                </div>
                <div class="flex justify-between items-center gap-3 border-t border-zinc-800 pt-6">
                    <p class="text-2xl font-bold coyote-text min-w-0 flex-1 truncate">${p.individualPricing ? 'Wycena indywidualna' : `${p.price} PLN`}</p>
                    ${orderButtonHtml}
                </div>`;
            document.getElementById('details-modal').classList.remove('hidden');
            return true;
        };

        window.addEventListener('strzelca-order-created', (event) => {
            const orderContext = event?.detail?.context;
            const orderItemId = String(event?.detail?.orderItemId || '').trim();
            if (orderContext !== 'shop') return;
            if (!orderItemId) return;
            productItems = productItems.map((item) =>
                item.id === orderItemId ? { ...item, hasActiveOrder: true } : item
            );
            renderProductCarousel(false);
            const detailsModal = document.getElementById('details-modal');
            if (detailsModal && !detailsModal.classList.contains('hidden')) {
                void window.showDetails(orderItemId);
            }
        });
        
        // Funkcja zmiany zdjęcia w galerii
        window.changeGalleryImage = (direction, total) => {
            if (!window.currentProductImages || window.currentProductImages.length === 0) return;
            
            const newIndex = window.currentGalleryIndex + direction;
            if (newIndex < 0 || newIndex >= total) return; // Nie pozwól wyjść poza zakres
            
            window.currentGalleryIndex = newIndex;
            const img = document.getElementById('gallery-main-img');
            const counter = document.getElementById('gallery-current');
            
            if (img) {
                const meta = window.currentProductImages[window.currentGalleryIndex];
                img.src = meta?.url || '';
                if (meta && typeof meta.posX === 'number' && typeof meta.posY === 'number') {
                    img.style.objectPosition = `${meta.posX}% ${meta.posY}%`;
                } else {
                    img.style.objectPosition = '';
                }
                if (meta && typeof meta.zoom === 'number') {
                    const x = typeof meta.posX === 'number' ? meta.posX : 50;
                    const y = typeof meta.posY === 'number' ? meta.posY : 50;
                    img.style.transform = `scale(${meta.zoom})`;
                    img.style.transformOrigin = `${x}% ${y}%`;
                } else {
                    img.style.transform = '';
                    img.style.transformOrigin = '';
                }
            }
            if (counter) {
                counter.textContent = window.currentGalleryIndex + 1;
            }
            
            // Aktualizuj stan przycisków (ukryj jeśli na początku/końcu)
            const prevBtn = document.getElementById('gallery-prev');
            const nextBtn = document.getElementById('gallery-next');
            if (prevBtn) {
                if (window.currentGalleryIndex === 0) {
                    prevBtn.style.opacity = '0.3';
                    prevBtn.style.cursor = 'not-allowed';
                } else {
                    prevBtn.style.opacity = '1';
                    prevBtn.style.cursor = 'pointer';
                }
            }
            if (nextBtn) {
                if (window.currentGalleryIndex === total - 1) {
                    nextBtn.style.opacity = '0.3';
                    nextBtn.style.cursor = 'not-allowed';
                } else {
                    nextBtn.style.opacity = '1';
                    nextBtn.style.cursor = 'pointer';
                }
            }
        };

        fetchAll();
    </script>

    ></script>

  </body>
