    <title>Sklep STRZELCA.PL</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Inter:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        :root { --coyote: #C19A6B; }
        html { height: 100%; }
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background-color: #0a0a0a;
            background-image:
                var(--strzelca-bg-vignette),
                linear-gradient(rgba(10,10,10,0.22) 0%, rgba(10,10,10,0.55) 55%, rgba(10,10,10,0.9) 100%),
                url('https://strzelca.pl/tlo.png');
            background-size: cover, cover, cover;
            background-position: center center, top center, top center;
            background-attachment: scroll;
            color: #e5e5e5;
            margin: 0;
            display: flex;
            flex-direction: column;
            min-height: 100%;
            min-height: 100dvh;
            overflow-x: hidden;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
        }
        
        .hero-bg {
            height: 65vh;
            background-color: #0a0a0a;
            background-image:
                var(--strzelca-bg-vignette),
                linear-gradient(rgba(10,10,10,0.1) 0%, rgba(10,10,10,0.4) 50%, #0a0a0a 100%),
                url('https://strzelca.pl/tlo.png');
            background-size: cover, cover, cover;
            background-position: center center, top center, top center;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .coyote-text { color: var(--coyote); font-family: 'Orbitron', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif; }
        .card-dark { background: #111; border: 1px solid #1f1f1f; border-radius: 12px; overflow: hidden; }
        
        .product-img-container img { width: 100%; height: 100%; object-fit: contain; background: #080808; }

        .product-gallery { position: relative; width: 100%; height: 400px; background: #080808; border-radius: 12px; overflow: hidden; margin-bottom: 20px; }
        .product-gallery img { width: 100%; height: 100%; object-fit: contain; }
        .gallery-nav { position: absolute; top: 50%; transform: translateY(-50%); background: rgba(0,0,0,0.7); color: white; border: none; padding: 12px 16px; cursor: pointer; font-size: 18px; z-index: 10; transition: background 0.3s; }
        .gallery-nav:hover { background: rgba(193, 154, 107, 0.9); }
        .gallery-nav.prev { left: 10px; }
        .gallery-nav.next { right: 10px; }
        .gallery-nav:disabled { opacity: 0.3; cursor: not-allowed; }
        .gallery-counter { position: absolute; bottom: 15px; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,0.8); color: white; padding: 8px 16px; border-radius: 20px; font-size: 14px; font-weight: bold; }

        .custom-render ul { list-style-type: disc !important; padding-left: 20px !important; margin: 10px 0 !important; }
        .custom-render li { margin-bottom: 5px !important; display: list-item !important; }
        .custom-render b, .custom-render strong { font-weight: bold !important; color: var(--coyote) !important; }
        .custom-render div[style*="text-align: center"] { text-align: center !important; }
        .custom-render div[style*="text-align: right"] { text-align: right !important; }

        .details-scroll-area { max-height: 55vh; overflow-y: auto; padding-right: 20px; scrollbar-gutter: stable; }
        .details-scroll-area::-webkit-scrollbar { width: 6px; }
        .details-scroll-area::-webkit-scrollbar-thumb { background: #333; border-radius: 10px; }
        .details-scroll-area::-webkit-scrollbar-thumb:hover { background: var(--coyote); }

        #arsenal {
            flex: 1;
            min-height: 0;
            display: flex;
            align-items: center;
            width: 100%;
        }
        .shop-carousel {
            width: 100%;
            max-width: 1600px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: auto 1fr auto;
            align-items: center;
            gap: 14px;
        }
        .carousel-viewport {
            overflow: hidden;
            width: 100%;
        }
        #product-track {
            display: flex;
            gap: 20px;
            transition: transform 0.18s cubic-bezier(0.22, 0.61, 0.36, 1);
            will-change: transform;
        }
        .product-card {
            flex: 0 0 calc((100% - 40px) / 3);
            min-width: 0;
        }
        .product-card.card-dark {
            background: rgba(17, 17, 17, 0.72);
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
        }
        .product-card .product-img-container img {
            background: rgba(8, 8, 8, 0.55);
        }
        .carousel-arrow {
            width: 44px;
            height: 44px;
            border: 1px solid #2b2b2b;
            border-radius: 999px;
            color: #f4f4f5;
            background: rgba(10, 10, 10, 0.9);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
        }
        .carousel-arrow:hover:not(:disabled) {
            background: rgba(193, 154, 107, 0.95);
            color: #050505;
            border-color: rgba(193, 154, 107, 0.95);
        }
        .carousel-arrow:disabled {
            opacity: 0.35;
            cursor: not-allowed;
        }
        .product-card .product-img-container {
            height: clamp(140px, 24vh, 220px);
        }

        @media (max-width: 1024px) {
            .product-card {
                flex-basis: calc((100% - 20px) / 2);
            }
        }

        @media (max-width: 700px) {
            .shop-carousel {
                gap: 8px;
            }
            #product-track {
                gap: 12px;
            }
            .product-card {
                flex-basis: 100%;
            }
            .carousel-arrow {
                width: 38px;
                height: 38px;
            }
        }
    </style>
    <!-- Wspólne poprawki responsywności -->
    <link rel="stylesheet" href="https://strzelca.pl/shared.css?v=2026-03-21-3" />
    <link rel="modulepreload" href="https://strzelca.pl/sso-client.mjs?v=2026-03-21-1" crossorigin />
    <link rel="modulepreload" href="https://strzelca.pl/header-profile-cache.mjs?v=2026-03-21-1" crossorigin />
    <link rel="modulepreload" href="https://strzelca.pl/order-inquiry-form.mjs?v=2026-03-22-6" crossorigin />
</head>
<body>
    <!-- Panel użytkownika -->
    <div id="user-panel" class="fixed top-4 right-4 z-50 hidden">
        <div class="relative">
            <!-- Avatar - widoczny zawsze -->
            <button
                id="user-avatar-button"
                class="w-12 h-12 rounded-full bg-coyote flex items-center justify-center text-white font-bold cursor-pointer hover:opacity-80 transition shadow-lg overflow-hidden"
                onclick="toggleUserMenu()"
            >
                <div id="user-avatar" class="w-full h-full flex items-center justify-center">
                    <i class="fa-solid fa-user"></i>
                </div>
            </button>
            
            <!-- Menu rozwijane -->
            <div
                id="user-menu"
                class="absolute top-14 right-0 bg-zinc-900/95 backdrop-blur-md border border-zinc-700 rounded-2xl p-4 shadow-2xl min-w-[200px] hidden"
            >
                <div class="space-y-2">
                    <div
                        id="user-display-name"
                        class="text-white font-semibold text-sm mb-3 pb-3 border-b border-zinc-700"
                    ></div>
                    <a
                        id="profile-link"
                        href="https://konto.strzelca.pl/profil.html"
                        class="block text-zinc-300 hover:text-coyote transition text-sm"
                    >
                        <i class="fa-solid fa-user mr-2"></i>Mój profil
                    </a>
                    <button onclick="logout()" class="block w-full text-left text-zinc-300 hover:text-red-400 transition text-sm">
                        <i class="fa-solid fa-sign-out-alt mr-2"></i>Wyloguj się
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Przycisk logowania dla niezalogowanych -->
    <div id="login-button" class="fixed top-4 right-4 z-50">
        <a href="https://konto.strzelca.pl/login.html" class="bg-coyote text-black w-10 h-10 rounded-full flex items-center justify-center hover:bg-white transition shadow-lg" title="Zaloguj się">
            <i class="fa-solid fa-sign-in-alt text-lg"></i>
        </a>
    </div>

    <nav class="h-[73px] border-b border-zinc-900 sticky top-0 bg-black/95 z-50 backdrop-blur-md flex items-center relative" role="navigation" aria-label="Nawigacja główna">
        <a href="https://strzelca.pl" aria-label="Powrót do centrum dowodzenia" class="absolute left-4 md:left-8 text-zinc-500 hover:text-white transition text-xl z-[60]">
            <i class="fa-solid fa-arrow-left" aria-hidden="true"></i>
        </a>
        <div class="container mx-auto px-6 flex justify-center items-center">
            <div class="uppercase font-bold text-[11px] tracking-[0.3em] font-[Orbitron] text-zinc-400">
                SKLEP.<span class="coyote-text">STRZELCA</span>.PL
            </div>
        </div>
    </nav>

    <section id="arsenal" class="px-4 md:px-8 py-6 md:py-10">
        <div class="shop-carousel">
            <button id="carousel-prev" class="carousel-arrow" type="button" aria-label="Poprzedni produkt" onclick="window.moveProductCarousel(-1)">
                <i class="fa-solid fa-chevron-left"></i>
            </button>
            <div class="carousel-viewport">
                <div id="product-track"></div>
            </div>
            <button id="carousel-next" class="carousel-arrow" type="button" aria-label="Następny produkt" onclick="window.moveProductCarousel(1)">
                <i class="fa-solid fa-chevron-right"></i>
            </button>
        </div>
    </section>

    <div id="details-modal" class="fixed inset-0 z-[100] hidden flex items-center justify-center p-4 md:p-6 bg-black/95 backdrop-blur-md" onclick="if(!event.target.closest('#details-modal-panel')) document.getElementById('details-modal').classList.add('hidden')">
        <div id="details-modal-panel" class="bg-zinc-900 p-4 md:p-8 rounded-2xl md:rounded-3xl max-w-2xl w-full border border-zinc-800 relative shadow-2xl max-h-[90vh] overflow-y-auto">
            <button onclick="document.getElementById('details-modal').classList.add('hidden')" class="absolute top-4 md:top-6 right-4 md:right-6 text-2xl md:text-3xl text-zinc-500 hover:text-white">&times;</button>
            <div id="details-content"></div>
        </div>
    </div>

    <footer class="w-full py-10 text-center text-zinc-700 text-[10px] uppercase font-bold tracking-[0.4em] bg-transparent" role="contentinfo">
        <a href="https://strzelca.pl" class="hover:text-zinc-500 transition">STRZELCA.PL</a> |
        <a href="?cookies=1" class="hover:text-zinc-500 transition ml-4">Ustawienia cookies</a>
    </footer>

    <script type="module">
        import { initializeApp, getApp, getApps } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, onAuthStateChanged, setPersistence, browserLocalPersistence } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { initializeFirestore, getFirestore, collection, getDocs, doc, getDoc, query, orderBy } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
        import { ensureFirebaseSSO } from "https://strzelca.pl/sso-client.mjs?v=2026-03-21-1";
        import {
          getHeaderProfileFromCache,
          setHeaderProfileCache,
        } from "https://strzelca.pl/header-profile-cache.mjs?v=2026-03-21-1";
        import { openOrderInquiryFlow } from "https://strzelca.pl/order-inquiry-form.mjs?v=2026-03-22-6";
        import { loadWithVersionCache, idbDeleteEntry } from "https://strzelca.pl/public-firestore-list-cache.mjs?v=2026-03-21-1";
        import { attachHorizontalCarouselSwipe } from "https://strzelca.pl/carousel-swipe.mjs?v=2026-03-21-1";

        
      async function getFirebaseApiKey() {
        const cachedKey = localStorage.getItem("firebase_web_api_key");
        if (cachedKey) return cachedKey;

        // Używamy pełnego URL, bo sklep jest na subdomenie sklep.strzelca.pl
        const urls = [
          "https://strzelca.pl/api/firebase-config",
          "/api/firebase-config" // fallback dla lokalnego developmentu
        ];

        for (const url of urls) {
          try {
            const res = await fetch(url, { cache: "force-cache" });
            if (!res.ok) continue;
            const data = await res.json().catch(() => null);
            if (data && typeof data.apiKey === "string" && data.apiKey.length > 10) {
              localStorage.setItem("firebase_web_api_key", data.apiKey);
              return data.apiKey;
            }
          } catch (_) {
            // ignore and try next url
          }
        }

        throw new Error("Nie udało się pobrać FIREBASE_WEB_API_KEY z /api/firebase-config");
      }
        const baseFirebaseConfig = {
            authDomain: "strzelca-pl.firebaseapp.com",
            projectId: "strzelca-pl",
            storageBucket: "strzelca-pl.appspot.com",
            messagingSenderId: "511362047688",
            appId: "1:511362047688:web:9b82c0a4d19c1a3a878ffd"
        };

        let app;
        const existingApps = getApps();
        if (existingApps.length > 0) {
            app = getApp();
        } else {
            const apiKey = await getFirebaseApiKey();
            app = initializeApp({
                apiKey,
                ...baseFirebaseConfig
            });
        }

        let db;
        try {
            db = initializeFirestore(app, {
                experimentalAutoDetectLongPolling: true,
                useFetchStreams: true,
            });
        } catch (_) {
            // Firestore mogło być już zainicjalizowane przez inny moduł.
            db = getFirestore(app);
        }
        const auth = getAuth(app);

        // Obsługa błędów CORS z Firestore (często są to fałszywe alarmy)
        window.addEventListener('unhandledrejection', function(e) {
            if (e.reason && e.reason.message && (
                e.reason.message.includes('access control checks') ||
                e.reason.message.includes('CORS') ||
                e.reason.message.includes('firestore.googleapis.com')
            )) {
                console.warn('Ignored Firebase CORS promise rejection:', e.reason.message);
                e.preventDefault();
                return false;
            }
        });

        // Ustaw trwałość sesji na browserLocalPersistence dla wszystkich subdomen
        await setPersistence(auth, browserLocalPersistence);

        // SSO między subdomenami: jeśli tu nie ma usera, spróbuj zalogować z cookie (.strzelca.pl)
        try {
            await ensureFirebaseSSO(auth);
        } catch (e) {
            console.warn("SSO ensure failed (ignored):", e?.message || e);
        }

        void (async () => {
            try {
                const [{ initActivityTracker }, { initUserStatusMonitor }, { initVisitTracker }] =
                    await Promise.all([
                        import("https://strzelca.pl/activity-tracker.mjs?v=2026-03-21-2"),
                        import("https://strzelca.pl/user-status-monitor.mjs?v=2026-02-06-1"),
                        import("https://strzelca.pl/visit-tracker.mjs?v=2026-03-21-2"),
                    ]);
                await Promise.all([
                    initActivityTracker(auth, db),
                    initUserStatusMonitor(auth, db),
                    initVisitTracker(auth),
                ]);
            } catch (error) {
                console.warn("Could not initialize trackers:", error);
            }
        })();

        let currentUser = null;

        // Funkcja pomocnicza do generowania domyślnego awatara
        function getDefaultAvatar(gender) {
            return '<i class="fa-solid fa-user text-white"></i>';
        }

        // Funkcja rozwijania/zwijania menu użytkownika
        window.toggleUserMenu = () => {
            const userMenu = document.getElementById("user-menu");
            if (userMenu) {
                userMenu.classList.toggle("hidden");
            }
        };

        // Zamykanie menu po kliknięciu poza nim
        document.addEventListener("click", (event) => {
            const userPanel = document.getElementById("user-panel");
            const userMenu = document.getElementById("user-menu");
            
            if (
                userPanel &&
                userMenu &&
                !userPanel.contains(event.target) &&
                !userMenu.classList.contains("hidden")
            ) {
                userMenu.classList.add("hidden");
            }
        });

        // Funkcja aktualizacji interfejsu użytkownika
        async function updateUserInterface(user) {
            const loginBtn = document.getElementById("login-button");
            const userPanel = document.getElementById("user-panel");
            const userDisplayName = document.getElementById("user-display-name");
            const userAvatar = document.getElementById("user-avatar");
            const profileLink = document.getElementById("profile-link");

            if (user) {
                // Użytkownik zalogowany
                loginBtn.classList.add("hidden");
                userPanel.classList.remove("hidden");

                // Wyświetl nazwę użytkownika
                const displayName = user.displayName || user.email.split("@")[0];
                if (userDisplayName) {
                    userDisplayName.textContent = displayName;
                }

                // Profil zawsze prowadzi do profilu (weryfikacja emaila jest sprawdzana wyłącznie przy logowaniu)
                if (profileLink) {
                    profileLink.href = "https://konto.strzelca.pl/profil.html";
                }

                // Pobierz awatar z profilu (cache localStorage → mniej odczytów Firestore)
                try {
                    const cached = getHeaderProfileFromCache(user.uid);
                    const fallbackName = user.displayName || user.email.split("@")[0];

                    if (cached) {
                        if (userDisplayName) {
                            userDisplayName.textContent = cached.displayName || fallbackName;
                        }
                        if (userAvatar) {
                            if (cached.avatar) {
                                userAvatar.innerHTML = `<img src="${cached.avatar}" alt="Avatar" class="w-full h-full rounded-full object-cover">`;
                            } else {
                                userAvatar.innerHTML = getDefaultAvatar(cached.gender);
                            }
                        }
                    } else {
                        if (userDisplayName) {
                            userDisplayName.textContent = fallbackName;
                        }
                        if (userAvatar) {
                            userAvatar.innerHTML = getDefaultAvatar();
                        }

                        const profileDoc = await getDoc(doc(db, "userProfiles", user.uid));
                        if (profileDoc.exists()) {
                            const userProfile = profileDoc.data();
                            setHeaderProfileCache(user.uid, {
                                displayName: userProfile.displayName || "",
                                avatar: userProfile.avatar || "",
                                gender: userProfile.gender ?? null,
                                role: userProfile.role || "user",
                                profileExists: true,
                            });
                            if (userProfile.displayName && userDisplayName) {
                                userDisplayName.textContent = userProfile.displayName;
                            }
                            if (userAvatar) {
                                if (userProfile.avatar) {
                                    userAvatar.innerHTML = `<img src="${userProfile.avatar}" alt="Avatar" class="w-full h-full rounded-full object-cover">`;
                                } else {
                                    userAvatar.innerHTML = getDefaultAvatar(userProfile.gender);
                                }
                            }
                        } else {
                            setHeaderProfileCache(user.uid, {
                                displayName: fallbackName,
                                avatar: "",
                                gender: null,
                                role: "user",
                                profileExists: false,
                            });
                            if (userAvatar) {
                                userAvatar.innerHTML = getDefaultAvatar();
                            }
                        }
                    }
                } catch (error) {
                    console.error("Error loading user profile:", error);
                    if (userAvatar) {
                        userAvatar.innerHTML = getDefaultAvatar();
                    }
                }
            } else {
                // Użytkownik niezalogowany
                loginBtn.classList.remove("hidden");
                userPanel.classList.add("hidden");
            }
        }

        // Funkcja wylogowania
        window.logout = async () => {
            try {
                // SSO: wyczyść cookie wspólnej sesji
                try {
                    await fetch("https://strzelca.pl/api/sso-session-logout", {
                        method: "POST",
                        credentials: "include",
                    });
                } catch (e) {
                    console.warn("SSO logout failed (ignored):", e?.message || e);
                }

                const { signOut } = await import("https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js");
                await signOut(auth);
                // Zamknij menu po wylogowaniu
                const userMenu = document.getElementById("user-menu");
                if (userMenu) {
                    userMenu.classList.add("hidden");
                }
            } catch (error) {
                console.error("Logout error:", error);
            }
        };

        // Monitorowanie stanu logowania
        onAuthStateChanged(auth, (user) => {
            currentUser = user;
            updateUserInterface(user);
        });

        window.handleOrder = async (productName, productPrice = null) => {
            await openOrderInquiryFlow({
                auth,
                db,
                getDoc,
                doc,
                context: "shop",
                rawTitle: productName,
                price: productPrice || 0,
            });
        };

        let productItems = [];
        let productLoopEnabled = false;
        let productCarouselAnimating = false;
        let productPendingMoves = 0;
        const PRODUCT_CAROUSEL_DURATION_MS = 180;

        function getVisibleCardsCount() {
            if (window.innerWidth <= 700) return 1;
            if (window.innerWidth <= 1024) return 2;
            return 3;
        }

        function getProductStepWidth() {
            const track = document.getElementById('product-track');
            if (!track) return 0;

            const cards = track.querySelectorAll('.product-card');
            if (cards.length >= 2) {
                return cards[1].offsetLeft - cards[0].offsetLeft;
            }
            return cards[0] ? cards[0].offsetWidth : 0;
        }

        function buildProductCard(item) {
            const encodedTitle = encodeURIComponent(item.title || '');
            const mainImage = item.mainImage || '';

            return `
                <article class="card-dark product-card flex flex-col h-full shadow-2xl transition hover:border-[#C19A6B]/50 cursor-pointer" role="button" tabindex="0" aria-label="Pokaż szczegóły produktu ${item.title}" onclick="window.showDetails('${item.id}')" onkeydown="if(event.key === 'Enter' || event.key === ' '){ event.preventDefault(); window.showDetails('${item.id}'); }">
                    <div class="product-img-container"><img src="${mainImage}" alt="${item.title}" loading="lazy"></div>
                    <div class="p-4 md:p-6 flex flex-col flex-grow text-center">
                        <h3 class="text-xl md:text-2xl font-black uppercase mb-2 font-[Orbitron] text-white tracking-tight">${item.title}</h3>
                        ${item.oldPrice ? `<p class="text-zinc-500 line-through text-sm mb-1">${item.oldPrice} PLN</p>` : ''}
                        <p class="coyote-text font-bold text-lg md:text-xl mb-4 md:mb-5" aria-label="Cena: ${item.price} złotych">${item.price} PLN</p>
                        <div class="mt-auto flex flex-col gap-2 md:gap-3">
                            <button type="button" onclick="event.stopPropagation(); window.handleOrder(decodeURIComponent('${encodedTitle}'), ${item.price || 0})" aria-label="Zamów produkt ${item.title}" class="w-full py-3 md:py-4 bg-[#C19A6B] text-black text-[9px] md:text-[10px] uppercase font-black rounded tracking-[0.2em] flex items-center justify-center hover:bg-[#b18a5f] transition">Zamów</button>
                        </div>
                    </div>
                </article>
            `;
        }

        function renderProductCarousel(preservePosition = true) {
            const track = document.getElementById('product-track');
            const prevBtn = document.getElementById('carousel-prev');
            const nextBtn = document.getElementById('carousel-next');
            if (!track || !prevBtn || !nextBtn) return;
            productCarouselAnimating = false;
            productPendingMoves = 0;

            if (productItems.length === 0) {
                track.innerHTML = `
                    <article class="card-dark product-card p-8 text-center w-full">
                        <p class="text-zinc-400 uppercase tracking-[0.15em] text-xs">Brak produktów wystawionych na sprzedaż</p>
                    </article>
                `;
                productLoopEnabled = false;
                prevBtn.disabled = true;
                nextBtn.disabled = true;
                track.style.transition = 'none';
                track.style.transform = 'translateX(0)';
                return;
            }

            if (!preservePosition) {
                track.innerHTML = productItems.map((item) => buildProductCard(item)).join('');
            }
            const visibleCards = getVisibleCardsCount();
            productLoopEnabled = productItems.length > visibleCards;
            prevBtn.disabled = !productLoopEnabled;
            nextBtn.disabled = !productLoopEnabled;
            track.style.transition = 'none';
            track.style.transform = 'translateX(0)';
            window.requestAnimationFrame(() => {
                track.style.transition = `transform ${PRODUCT_CAROUSEL_DURATION_MS}ms cubic-bezier(0.22, 0.61, 0.36, 1)`;
            });
        }

        function consumeQueuedProductMove() {
            if (!productLoopEnabled || productPendingMoves === 0 || productCarouselAnimating) return;
            const nextDir = productPendingMoves > 0 ? 1 : -1;
            productPendingMoves -= nextDir;
            window.moveProductCarousel(nextDir);
        }

        window.moveProductCarousel = (direction) => {
            if (!productLoopEnabled) return;
            const moveDir = direction > 0 ? 1 : -1;

            if (productCarouselAnimating) {
                productPendingMoves += moveDir;
                productPendingMoves = Math.max(-8, Math.min(8, productPendingMoves));
                return;
            }

            const track = document.getElementById('product-track');
            if (!track) return;
            const stepWidth = getProductStepWidth();
            if (stepWidth <= 0) return;

            productCarouselAnimating = true;
            let finished = false;
            let fallbackTimer = null;

            const finalizeMove = (afterFinalize) => {
                if (finished) return;
                finished = true;
                if (fallbackTimer) {
                    clearTimeout(fallbackTimer);
                }
                if (typeof afterFinalize === 'function') {
                    afterFinalize();
                }
                productCarouselAnimating = false;
                consumeQueuedProductMove();
            };

            if (moveDir > 0) {
                track.style.transition = `transform ${PRODUCT_CAROUSEL_DURATION_MS}ms cubic-bezier(0.22, 0.61, 0.36, 1)`;
                track.style.transform = `translateX(-${stepWidth}px)`;

                const onEnd = (event) => {
                    if (event.propertyName && event.propertyName !== 'transform') return;
                    track.style.transition = 'none';
                    const firstCard = track.firstElementChild;
                    if (firstCard) {
                        track.appendChild(firstCard);
                    }
                    track.style.transform = 'translateX(0)';
                    void track.offsetHeight;
                    track.style.transition = `transform ${PRODUCT_CAROUSEL_DURATION_MS}ms cubic-bezier(0.22, 0.61, 0.36, 1)`;
                    finalizeMove();
                };
                track.addEventListener('transitionend', onEnd, { once: true });
                fallbackTimer = setTimeout(() => {
                    finalizeMove(() => {
                        track.style.transition = 'none';
                        const firstCard = track.firstElementChild;
                        if (firstCard) {
                            track.appendChild(firstCard);
                        }
                        track.style.transform = 'translateX(0)';
                        void track.offsetHeight;
                        track.style.transition = `transform ${PRODUCT_CAROUSEL_DURATION_MS}ms cubic-bezier(0.22, 0.61, 0.36, 1)`;
                    });
                }, PRODUCT_CAROUSEL_DURATION_MS + 120);
            } else {
                track.style.transition = 'none';
                const lastCard = track.lastElementChild;
                if (lastCard) {
                    track.insertBefore(lastCard, track.firstElementChild);
                }
                track.style.transform = `translateX(-${stepWidth}px)`;
                void track.offsetHeight;
                track.style.transition = `transform ${PRODUCT_CAROUSEL_DURATION_MS}ms cubic-bezier(0.22, 0.61, 0.36, 1)`;
                track.style.transform = 'translateX(0)';

                const onEnd = (event) => {
                    if (event.propertyName && event.propertyName !== 'transform') return;
                    finalizeMove();
                };
                track.addEventListener('transitionend', onEnd, { once: true });
                fallbackTimer = setTimeout(() => {
                    finalizeMove();
                }, PRODUCT_CAROUSEL_DURATION_MS + 120);
            }
        };

        window.addEventListener('resize', () => {
            if (productItems.length === 0) return;
            renderProductCarousel(false);
        });

        const _shopCarouselVp = document.querySelector('#arsenal .carousel-viewport');
        if (_shopCarouselVp) {
            attachHorizontalCarouselSwipe(_shopCarouselVp, {
                onPrev: () => window.moveProductCarousel(-1),
                onNext: () => window.moveProductCarousel(1),
            });
        }

        const wait = (ms) => new Promise((resolve) => setTimeout(resolve, ms));

        const fetchAll = async () => {
            const track = document.getElementById('product-track');
            if (track) {
                track.innerHTML = `
                    <article class="card-dark product-card p-8 text-center w-full">
                        <p class="text-zinc-400 uppercase tracking-[0.15em] text-xs">Ładowanie produktów...</p>
                    </article>
                `;
            }
            const maxAttempts = 3;

            for (let attempt = 1; attempt <= maxAttempts; attempt++) {
                try {
                    const { payload } = await loadWithVersionCache({
                        db,
                        getDoc,
                        doc,
                        idbKey: "list:products",
                        metaDocId: "products",
                        fetchFresh: async () => {
                            let snap;
                            try {
                                const q = query(collection(db, "products"), orderBy("order", "asc"));
                                snap = await getDocs(q);
                            } catch (orderError) {
                                console.warn("products orderBy failed, trying fallback:", orderError);
                                snap = await getDocs(collection(db, "products"));
                            }
                            const rows = [];
                            snap.forEach((d) => {
                                const p = d.data();
                                let mainImage = p.img || '';
                                if (p.images && Array.isArray(p.images) && p.images.length > 0) {
                                    mainImage = typeof p.images[0] === 'string' ? p.images[0] : p.images[0].url;
                                }
                                rows.push({
                                    id: d.id,
                                    title: p.title || '',
                                    price: p.price || 0,
                                    mainImage,
                                });
                            });
                            return rows;
                        },
                    });
                    productItems = Array.isArray(payload) ? payload : [];
                    renderProductCarousel(false);
                    return;
                } catch (error) {
                    console.warn(`Load products attempt ${attempt}/${maxAttempts} failed:`, error);
                    if (attempt < maxAttempts) {
                        await wait(450 * attempt);
                        continue;
                    }
                }
            }

            if (track) {
                track.innerHTML = `
                    <article class="card-dark product-card p-8 text-center w-full">
                        <p class="text-red-400 uppercase tracking-[0.1em] text-xs mb-3">Nie udało się załadować produktów</p>
                        <button onclick="window.reloadProducts()" class="px-4 py-2 border border-zinc-700 rounded text-zinc-300 hover:border-[#C19A6B] hover:text-[#C19A6B] transition text-xs uppercase tracking-[0.12em]">Spróbuj ponownie</button>
                    </article>
                `;
            }
            productLoopEnabled = false;
            productCarouselAnimating = false;
            productPendingMoves = 0;
            const prevBtn = document.getElementById('carousel-prev');
            const nextBtn = document.getElementById('carousel-next');
            if (prevBtn) prevBtn.disabled = true;
            if (nextBtn) nextBtn.disabled = true;
        };

        window.reloadProducts = async () => {
            await idbDeleteEntry("list:products");
            fetchAll();
        };

        window.showDetails = async (id) => {
            const d = await getDoc(doc(db, "products", id));
            const p = d.data();
            
            // Pobierz zdjęcia produktu
            let images = [];
            if (p.images && Array.isArray(p.images) && p.images.length > 0) {
                images = p.images.map(img => typeof img === 'string' ? img : img.url);
            } else if (p.img) {
                // Fallback dla starych produktów
                images = [p.img];
            }
            
            // Jeśli nie ma zdjęć w tablicy, spróbuj wyciągnąć z opisu
            if (images.length === 0 && p.description) {
                const tempDiv = document.createElement('div');
                tempDiv.innerHTML = p.description;
                const imgs = tempDiv.querySelectorAll('img');
                imgs.forEach(img => {
                    if (img.src && !images.includes(img.src)) {
                        images.push(img.src);
                    }
                });
            }
            
            // Generuj HTML galerii
            let galleryHTML = '';
            if (images.length > 0) {
                galleryHTML = `
                    <div class="product-gallery" id="product-gallery">
                        <img id="gallery-main-img" src="${images[0]}" alt="${p.title}" />
                        ${images.length > 1 ? `
                            <button class="gallery-nav prev" onclick="changeGalleryImage(-1, ${images.length})" id="gallery-prev" style="opacity: 0.3; cursor: not-allowed;">
                                <i class="fa-solid fa-chevron-left"></i>
                            </button>
                            <button class="gallery-nav next" onclick="changeGalleryImage(1, ${images.length})" id="gallery-next">
                                <i class="fa-solid fa-chevron-right"></i>
                            </button>
                            <div class="gallery-counter">
                                <span id="gallery-current">1</span> / <span id="gallery-total">${images.length}</span>
                            </div>
                        ` : ''}
                    </div>
                `;
                
                // Zapisz zdjęcia w zmiennej globalnej dla funkcji nawigacji
                window.currentProductImages = images;
                window.currentGalleryIndex = 0;
                
                // Dodaj obsługę klawiatury dla nawigacji
                const handleKeyPress = (e) => {
                    if (e.key === 'ArrowLeft' && window.currentGalleryIndex > 0) {
                        changeGalleryImage(-1, images.length);
                    } else if (e.key === 'ArrowRight' && window.currentGalleryIndex < images.length - 1) {
                        changeGalleryImage(1, images.length);
                    }
                };
                
                // Usuń poprzedni listener jeśli istnieje
                if (window.galleryKeyHandler) {
                    document.removeEventListener('keydown', window.galleryKeyHandler);
                }
                
                window.galleryKeyHandler = handleKeyPress;
                document.addEventListener('keydown', handleKeyPress);
            }
            
            // Przygotuj opis - usuń zdjęcia, które są już w galerii
            let descriptionHTML = p.description || p.desc || '';
            if (descriptionHTML && images.length > 0) {
                const tempDiv = document.createElement('div');
                tempDiv.innerHTML = descriptionHTML;
                const imgs = tempDiv.querySelectorAll('img');
                imgs.forEach(img => {
                    if (images.includes(img.src)) {
                        img.remove();
                    }
                });
                descriptionHTML = tempDiv.innerHTML;
            }
            
            document.getElementById('details-content').innerHTML = `
                <h2 class="text-3xl font-black uppercase mb-4 font-[Orbitron] text-white">${p.title}</h2>
                ${galleryHTML}
                <div class="text-zinc-400 text-sm mb-8 custom-render details-scroll-area leading-relaxed">
                    ${descriptionHTML}
                </div>
                <div class="flex justify-between items-center border-t border-zinc-800 pt-6">
                    <p class="text-2xl font-bold coyote-text">${p.price} PLN</p>
                    <button onclick="window.handleOrder('${p.title}', ${p.price || 0})" class="bg-[#C19A6B] text-black px-8 py-4 uppercase text-[10px] font-black rounded tracking-widest shadow-lg hover:bg-[#b18a5f] transition">Złóż zamówienie</button>
                </div>`;
            document.getElementById('details-modal').classList.remove('hidden');
        };
        
        // Funkcja zmiany zdjęcia w galerii
        window.changeGalleryImage = (direction, total) => {
            if (!window.currentProductImages || window.currentProductImages.length === 0) return;
            
            const newIndex = window.currentGalleryIndex + direction;
            if (newIndex < 0 || newIndex >= total) return; // Nie pozwól wyjść poza zakres
            
            window.currentGalleryIndex = newIndex;
            const img = document.getElementById('gallery-main-img');
            const counter = document.getElementById('gallery-current');
            
            if (img) {
                img.src = window.currentProductImages[window.currentGalleryIndex];
            }
            if (counter) {
                counter.textContent = window.currentGalleryIndex + 1;
            }
            
            // Aktualizuj stan przycisków (ukryj jeśli na początku/końcu)
            const prevBtn = document.getElementById('gallery-prev');
            const nextBtn = document.getElementById('gallery-next');
            if (prevBtn) {
                if (window.currentGalleryIndex === 0) {
                    prevBtn.style.opacity = '0.3';
                    prevBtn.style.cursor = 'not-allowed';
                } else {
                    prevBtn.style.opacity = '1';
                    prevBtn.style.cursor = 'pointer';
                }
            }
            if (nextBtn) {
                if (window.currentGalleryIndex === total - 1) {
                    nextBtn.style.opacity = '0.3';
                    nextBtn.style.cursor = 'not-allowed';
                } else {
                    nextBtn.style.opacity = '1';
                    nextBtn.style.cursor = 'pointer';
                }
            }
        };

        fetchAll();
    </script>
    <script
      type="module"
      src="https://strzelca.pl/auth-widget.mjs?v=2026-03-21-2"
    ></script>
    <script
      type="module"
      src="https://strzelca.pl/messages-widget.mjs?v=2026-03-21-4"
    ></script>
