<!DOCTYPE html>
<html lang="pl">
<head>

    <!-- Favicon -->

    <title>Sklep STRZELCA.PL</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Inter:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        :root { --coyote: #C19A6B; }
        html, body { height: 100%; overflow: hidden; }
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background-color: #0a0a0a;
            background-image: linear-gradient(rgba(10,10,10,0.22) 0%, rgba(10,10,10,0.55) 55%, rgba(10,10,10,0.9) 100%), url('https://strzelca.pl/tlo.png');
            background-size: cover;
            background-position: top center;
            color: #e5e5e5;
            margin: 0;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }
        
        .hero-bg {
            height: 65vh;
            background: linear-gradient(rgba(10,10,10,0.1) 0%, rgba(10,10,10,0.4) 50%, #0a0a0a 100%), url('https://strzelca.pl/tlo.png');
            background-size: cover;
            background-position: top center;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .coyote-text { color: var(--coyote); font-family: 'Orbitron', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif; }
        .card-dark { background: #111; border: 1px solid #1f1f1f; border-radius: 12px; overflow: hidden; }
        
        .product-img-container img { width: 100%; height: 100%; object-fit: contain; background: #080808; }

        .product-gallery { position: relative; width: 100%; height: 400px; background: #080808; border-radius: 12px; overflow: hidden; margin-bottom: 20px; }
        .product-gallery img { width: 100%; height: 100%; object-fit: contain; }
        .gallery-nav { position: absolute; top: 50%; transform: translateY(-50%); background: rgba(0,0,0,0.7); color: white; border: none; padding: 12px 16px; cursor: pointer; font-size: 18px; z-index: 10; transition: background 0.3s; }
        .gallery-nav:hover { background: rgba(193, 154, 107, 0.9); }
        .gallery-nav.prev { left: 10px; }
        .gallery-nav.next { right: 10px; }
        .gallery-nav:disabled { opacity: 0.3; cursor: not-allowed; }
        .gallery-counter { position: absolute; bottom: 15px; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,0.8); color: white; padding: 8px 16px; border-radius: 20px; font-size: 14px; font-weight: bold; }

        .custom-render ul { list-style-type: disc !important; padding-left: 20px !important; margin: 10px 0 !important; }
        .custom-render li { margin-bottom: 5px !important; display: list-item !important; }
        .custom-render b, .custom-render strong { font-weight: bold !important; color: var(--coyote) !important; }
        .custom-render div[style*="text-align: center"] { text-align: center !important; }
        .custom-render div[style*="text-align: right"] { text-align: right !important; }

        .details-scroll-area { max-height: 55vh; overflow-y: auto; padding-right: 20px; scrollbar-gutter: stable; }
        .details-scroll-area::-webkit-scrollbar { width: 6px; }
        .details-scroll-area::-webkit-scrollbar-thumb { background: #333; border-radius: 10px; }
        .details-scroll-area::-webkit-scrollbar-thumb:hover { background: var(--coyote); }

        #arsenal {
            flex: 1;
            min-height: 0;
            display: flex;
            align-items: center;
            width: 100%;
        }
        .shop-carousel {
            width: 100%;
            max-width: 1600px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: auto 1fr auto;
            align-items: center;
            gap: 14px;
        }
        .carousel-viewport {
            overflow: hidden;
            width: 100%;
        }
        #product-track {
            display: flex;
            gap: 20px;
            transition: transform 0.35s ease;
            will-change: transform;
        }
        .product-card {
            flex: 0 0 calc((100% - 40px) / 3);
            min-width: 0;
        }
        .carousel-arrow {
            width: 44px;
            height: 44px;
            border: 1px solid #2b2b2b;
            border-radius: 999px;
            color: #f4f4f5;
            background: rgba(10, 10, 10, 0.9);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
        }
        .carousel-arrow:hover:not(:disabled) {
            background: rgba(193, 154, 107, 0.95);
            color: #050505;
            border-color: rgba(193, 154, 107, 0.95);
        }
        .carousel-arrow:disabled {
            opacity: 0.35;
            cursor: not-allowed;
        }
        .product-card .product-img-container {
            height: clamp(140px, 24vh, 220px);
        }

        @media (max-width: 1024px) {
            .product-card {
                flex-basis: calc((100% - 20px) / 2);
            }
        }

        @media (max-width: 700px) {
            .shop-carousel {
                gap: 8px;
            }
            #product-track {
                gap: 12px;
            }
            .product-card {
                flex-basis: 100%;
            }
            .carousel-arrow {
                width: 38px;
                height: 38px;
            }
        }
    </style>
    <!-- Wspólne poprawki responsywności -->
    <link rel="stylesheet" href="https://strzelca.pl/shared.css?v=2026-02-06-1" />
</head>
<body>
    <!-- Panel użytkownika -->
    <div id="user-panel" class="fixed top-4 right-4 z-50 hidden">
        <div class="relative">
            <!-- Avatar - widoczny zawsze -->
            <button
                id="user-avatar-button"
                class="w-12 h-12 rounded-full bg-coyote flex items-center justify-center text-white font-bold cursor-pointer hover:opacity-80 transition shadow-lg overflow-hidden"
                onclick="toggleUserMenu()"
            >
                <div id="user-avatar" class="w-full h-full flex items-center justify-center">
                    <i class="fa-solid fa-user"></i>
                </div>
            </button>
            
            <!-- Menu rozwijane -->
            <div
                id="user-menu"
                class="absolute top-14 right-0 bg-zinc-900/95 backdrop-blur-md border border-zinc-700 rounded-2xl p-4 shadow-2xl min-w-[200px] hidden"
            >
                <div class="space-y-2">
                    <div
                        id="user-display-name"
                        class="text-white font-semibold text-sm mb-3 pb-3 border-b border-zinc-700"
                    ></div>
                    <a
                        id="profile-link"
                        href="https://konto.strzelca.pl/profil.html"
                        class="block text-zinc-300 hover:text-coyote transition text-sm"
                    >
                        <i class="fa-solid fa-user mr-2"></i>Mój profil
                    </a>
                    <button onclick="logout()" class="block w-full text-left text-zinc-300 hover:text-red-400 transition text-sm">
                        <i class="fa-solid fa-sign-out-alt mr-2"></i>Wyloguj się
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Przycisk logowania dla niezalogowanych -->
    <div id="login-button" class="fixed top-4 right-4 z-50">
        <a href="https://konto.strzelca.pl/login.html" class="bg-coyote text-black w-10 h-10 rounded-full flex items-center justify-center hover:bg-white transition shadow-lg" title="Zaloguj się">
            <i class="fa-solid fa-sign-in-alt text-lg"></i>
        </a>
    </div>

    <nav class="h-[73px] border-b border-zinc-900 sticky top-0 bg-black/95 z-50 backdrop-blur-md flex items-center relative" role="navigation" aria-label="Nawigacja główna">
        <a href="https://strzelca.pl" aria-label="Powrót do centrum dowodzenia" class="absolute left-4 md:left-8 text-zinc-500 hover:text-white transition text-xl z-[60]">
            <i class="fa-solid fa-arrow-left" aria-hidden="true"></i>
        </a>
        <div class="container mx-auto px-6 flex justify-center items-center">
            <div class="uppercase font-bold text-[11px] tracking-[0.3em] font-[Orbitron] text-zinc-400">
                SKLEP.<span class="coyote-text">STRZELCA</span>.PL
            </div>
        </div>
    </nav>

    <section id="arsenal" class="px-4 md:px-8 py-6 md:py-10">
        <div class="shop-carousel">
            <button id="carousel-prev" class="carousel-arrow" type="button" aria-label="Poprzedni produkt" onclick="window.moveProductCarousel(-1)">
                <i class="fa-solid fa-chevron-left"></i>
            </button>
            <div class="carousel-viewport">
                <div id="product-track"></div>
            </div>
            <button id="carousel-next" class="carousel-arrow" type="button" aria-label="Następny produkt" onclick="window.moveProductCarousel(1)">
                <i class="fa-solid fa-chevron-right"></i>
            </button>
        </div>
    </section>

    <div id="details-modal" class="fixed inset-0 z-[100] hidden flex items-center justify-center p-4 md:p-6 bg-black/95 backdrop-blur-md">
        <div class="bg-zinc-900 p-4 md:p-8 rounded-2xl md:rounded-3xl max-w-2xl w-full border border-zinc-800 relative shadow-2xl max-h-[90vh] overflow-y-auto">
            <button onclick="document.getElementById('details-modal').classList.add('hidden')" class="absolute top-4 md:top-6 right-4 md:right-6 text-2xl md:text-3xl text-zinc-500 hover:text-white">&times;</button>
            <div id="details-content"></div>
        </div>
    </div>

    <footer class="w-full py-10 text-center text-zinc-700 text-[10px] uppercase font-bold tracking-[0.4em] bg-transparent" role="contentinfo">
        <a href="https://strzelca.pl" class="hover:text-zinc-500 transition">STRZELCA.PL</a> |
        <a href="?cookies=1" class="hover:text-zinc-500 transition ml-4">Ustawienia cookies</a>
    </footer>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, onAuthStateChanged, setPersistence, browserLocalPersistence } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { initializeFirestore, collection, getDocs, doc, getDoc, query, orderBy } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
        import { ensureFirebaseSSO } from "https://strzelca.pl/sso-client.mjs?v=2026-02-06-1";

        
      async function getFirebaseApiKey() {
        // Używamy pełnego URL, bo sklep jest na subdomenie sklep.strzelca.pl
        const urls = [
          "https://strzelca.pl/api/firebase-config",
          "/api/firebase-config" // fallback dla lokalnego developmentu
        ];

        for (const url of urls) {
          try {
            const res = await fetch(url, { cache: "no-store" });
            if (!res.ok) continue;
            const data = await res.json().catch(() => null);
            if (data && typeof data.apiKey === "string" && data.apiKey.length > 10) {
              return data.apiKey;
            }
          } catch (_) {
            // ignore and try next url
          }
        }

        throw new Error("Nie udało się pobrać FIREBASE_WEB_API_KEY z /api/firebase-config");
      }
const firebaseConfig = { 
            apiKey: await getFirebaseApiKey(), 
            authDomain: "strzelca-pl.firebaseapp.com", 
            projectId: "strzelca-pl", 
            storageBucket: "strzelca-pl.appspot.com", 
            messagingSenderId: "511362047688", 
            appId: "1:511362047688:web:9b82c0a4d19c1a3a878ffd" 
        };
        
        const app = initializeApp(firebaseConfig);
        const db = initializeFirestore(app, {
            experimentalAutoDetectLongPolling: true,
            useFetchStreams: true,
        });
        const auth = getAuth(app);

        // Obsługa błędów CORS z Firestore (często są to fałszywe alarmy)
        window.addEventListener('unhandledrejection', function(e) {
            if (e.reason && e.reason.message && (
                e.reason.message.includes('access control checks') ||
                e.reason.message.includes('CORS') ||
                e.reason.message.includes('firestore.googleapis.com')
            )) {
                console.warn('Ignored Firebase CORS promise rejection:', e.reason.message);
                e.preventDefault();
                return false;
            }
        });

        // Ustaw trwałość sesji na browserLocalPersistence dla wszystkich subdomen
        await setPersistence(auth, browserLocalPersistence);

        // SSO między subdomenami: jeśli tu nie ma usera, spróbuj zalogować z cookie (.strzelca.pl)
        try {
            await ensureFirebaseSSO(auth);
        } catch (e) {
            console.warn("SSO ensure failed (ignored):", e?.message || e);
        }

        let currentUser = null;

        // Funkcja pomocnicza do generowania domyślnego awatara
        function getDefaultAvatar(gender) {
            return '<i class="fa-solid fa-user text-white"></i>';
        }

        // Funkcja rozwijania/zwijania menu użytkownika
        window.toggleUserMenu = () => {
            const userMenu = document.getElementById("user-menu");
            if (userMenu) {
                userMenu.classList.toggle("hidden");
            }
        };

        // Zamykanie menu po kliknięciu poza nim
        document.addEventListener("click", (event) => {
            const userPanel = document.getElementById("user-panel");
            const userMenu = document.getElementById("user-menu");
            
            if (
                userPanel &&
                userMenu &&
                !userPanel.contains(event.target) &&
                !userMenu.classList.contains("hidden")
            ) {
                userMenu.classList.add("hidden");
            }
        });

        // Funkcja aktualizacji interfejsu użytkownika
        async function updateUserInterface(user) {
            const loginBtn = document.getElementById("login-button");
            const userPanel = document.getElementById("user-panel");
            const userDisplayName = document.getElementById("user-display-name");
            const userAvatar = document.getElementById("user-avatar");
            const profileLink = document.getElementById("profile-link");

            if (user) {
                // Użytkownik zalogowany
                loginBtn.classList.add("hidden");
                userPanel.classList.remove("hidden");

                // Wyświetl nazwę użytkownika
                const displayName = user.displayName || user.email.split("@")[0];
                if (userDisplayName) {
                    userDisplayName.textContent = displayName;
                }

                // Profil zawsze prowadzi do profilu (weryfikacja emaila jest sprawdzana wyłącznie przy logowaniu)
                if (profileLink) {
                    profileLink.href = "https://konto.strzelca.pl/profil.html";
                }

                // Pobierz awatar z profilu użytkownika
                try {
                    const profileDoc = await getDoc(doc(db, "userProfiles", user.uid));
                    if (profileDoc.exists()) {
                        const userProfile = profileDoc.data();
                        if (userProfile.displayName && userDisplayName) {
                            userDisplayName.textContent = userProfile.displayName;
                        }
                        if (userAvatar) {
                            if (userProfile.avatar) {
                                // Jeśli użytkownik ma awatar, wyświetl go
                                userAvatar.innerHTML = `<img src="${userProfile.avatar}" alt="Avatar" class="w-full h-full rounded-full object-cover">`;
                            } else {
                                // Użyj domyślnego awatara
                                userAvatar.innerHTML = getDefaultAvatar(userProfile.gender);
                            }
                        }
                    } else {
                        // Jeśli profil nie istnieje, użyj domyślnego awatara
                        if (userAvatar) {
                            userAvatar.innerHTML = getDefaultAvatar();
                        }
                    }
                } catch (error) {
                    console.error("Error loading user profile:", error);
                    if (userAvatar) {
                        userAvatar.innerHTML = getDefaultAvatar();
                    }
                }
            } else {
                // Użytkownik niezalogowany
                loginBtn.classList.remove("hidden");
                userPanel.classList.add("hidden");
            }
        }

        // Funkcja wylogowania
        window.logout = async () => {
            try {
                // SSO: wyczyść cookie wspólnej sesji
                try {
                    await fetch("https://strzelca.pl/api/sso-session-logout", {
                        method: "POST",
                        credentials: "include",
                    });
                } catch (e) {
                    console.warn("SSO logout failed (ignored):", e?.message || e);
                }

                const { signOut } = await import("https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js");
                await signOut(auth);
                // Zamknij menu po wylogowaniu
                const userMenu = document.getElementById("user-menu");
                if (userMenu) {
                    userMenu.classList.add("hidden");
                }
            } catch (error) {
                console.error("Logout error:", error);
            }
        };

        // Inicjalizuj śledzenie aktywności
        try {
            const { initActivityTracker } = await import("https://strzelca.pl/activity-tracker.mjs?v=2026-02-06-1");
            await initActivityTracker(auth, db);
            
            // Monitorowanie statusu użytkownika (blokowanie)
            const { initUserStatusMonitor } = await import("https://strzelca.pl/user-status-monitor.mjs?v=2026-02-06-1");
            await initUserStatusMonitor(auth, db);
        } catch (error) {
            console.warn("Could not initialize activity tracker:", error);
        }
        
        // Inicjalizuj śledzenie odwiedzin (działa dla wszystkich użytkowników, również niezalogowanych)
        try {
          const { initVisitTracker } = await import("https://strzelca.pl/visit-tracker.mjs?v=2026-02-06-3");
          await initVisitTracker(auth);
        } catch (error) {
          console.warn("Could not initialize visit tracker:", error);
        }

        // Monitorowanie stanu logowania
        onAuthStateChanged(auth, (user) => {
            currentUser = user;
            updateUserInterface(user);
        });

        // Funkcja logowania aktywności
        async function logActivity(type, userId, userName, details, timestamp = null) {
            try {
                const activityData = {
                    type: type,
                    userId: userId,
                    userName: userName,
                    details: details,
                    timestamp: timestamp || new Date()
                };

                const { addDoc, collection } = await import("https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js");
                await addDoc(collection(db, "activityLogs"), activityData);

                console.log('Aktywność zalogowana:', activityData);
            } catch (error) {
                console.error('Błąd podczas logowania aktywności:', error);
            }
        }

        // Funkcja do obsługi zamówienia
        window.handleOrder = async (productName, productPrice = null) => {
            const user = auth.currentUser;
            
            if (!user) {
                // Użytkownik niezalogowany - pokaż modal
                showOrderLoginModal(productName);
                return;
            }

            // Użytkownik zalogowany - pokaż formularz zamówienia
            showOrderForm(productName, productPrice);
        };

        // Modal dla niezalogowanych użytkowników
        function showOrderLoginModal(productName) {
            const modal = document.createElement('div');
            modal.id = 'order-login-modal';
            modal.className = 'fixed inset-0 z-[200] flex items-center justify-center p-4 bg-black/95 backdrop-blur-md';
            modal.onclick = function(e) {
                if (e.target.id === 'order-login-modal') {
                    modal.remove();
                }
            };

            modal.innerHTML = `
                <div class="bg-zinc-900 p-8 rounded-2xl max-w-md w-full border border-zinc-800 shadow-2xl" onclick="event.stopPropagation()">
                    <h2 class="text-2xl font-bold coyote-text mb-4">Zamówienie produktu</h2>
                    <p class="text-zinc-300 mb-6">
                        Aby złożyć zamówienie produktu <strong>${productName}</strong>, musisz być zalogowany.
                    </p>
                    <div class="space-y-3">
                        <a href="https://konto.strzelca.pl/logowanie.html?redirect=${encodeURIComponent(window.location.href)}" 
                           class="block w-full bg-coyote text-black px-6 py-3 rounded-lg font-bold text-center hover:bg-opacity-90 transition">
                            <i class="fa-solid fa-sign-in-alt mr-2"></i>
                            Zaloguj się
                        </a>
                        <a href="https://kontakt.strzelca.pl?topic=Zamówienie&product=${encodeURIComponent(productName)}" 
                           class="block w-full border border-zinc-700 text-zinc-300 px-6 py-3 rounded-lg font-bold text-center hover:bg-zinc-800 transition">
                            <i class="fa-solid fa-envelope mr-2"></i>
                            Przejdź do formularza kontaktowego
                        </a>
                        <button onclick="this.closest('#order-login-modal').remove()" 
                                class="block w-full text-zinc-400 px-6 py-2 text-sm hover:text-white transition">
                            Anuluj
                        </button>
                    </div>
                </div>
            `;

            document.body.appendChild(modal);
        }

        // Formularz zamówienia dla zalogowanych
        async function showOrderForm(productName, productPrice = null) {
            const user = auth.currentUser;
            if (!user) return;

            // Pobierz dane z profilu
            let userProfile = null;
            try {
                const profileDoc = await getDoc(doc(db, 'userProfiles', user.uid));
                if (profileDoc.exists()) {
                    userProfile = profileDoc.data();
                }
            } catch (error) {
                console.error('Error loading user profile:', error);
            }

            // Funkcja dekodowania base64
            function b64DecodeUtf8(str) {
                if (!str) return '';
                try {
                    return decodeURIComponent(escape(atob(str)));
                } catch {
                    return '';
                }
            }

            const modal = document.createElement('div');
            modal.id = 'order-form-modal';
            modal.className = 'fixed inset-0 z-[200] flex items-center justify-center p-4 bg-black/95 backdrop-blur-md';
            modal.style.overflowY = 'auto';
            modal.onclick = function(e) {
                if (e.target.id === 'order-form-modal') {
                    modal.remove();
                }
            };

            const address = userProfile?.address || {};
            const decodedAddress = {
                street: b64DecodeUtf8(address.street || ''),
                buildingNumber: b64DecodeUtf8(address.buildingNumber || ''),
                postalCode: b64DecodeUtf8(address.postalCode || ''),
                city: b64DecodeUtf8(address.city || '')
            };

            modal.innerHTML = `
                <div class="bg-zinc-900 p-6 md:p-8 rounded-2xl max-w-2xl w-full border border-zinc-800 shadow-2xl my-8" onclick="event.stopPropagation()">
                    <div class="flex justify-between items-center mb-6">
                        <h2 class="text-2xl font-bold coyote-text">Złóż zamówienie</h2>
                        <button onclick="document.getElementById('order-form-modal').remove()" 
                                class="text-zinc-400 hover:text-white">
                            <i class="fa-solid fa-times text-xl"></i>
                        </button>
                    </div>

                    <form id="shop-order-form" onsubmit="submitShopOrder(event, '${productName}', ${productPrice || 0})">
                        <div class="mb-6">
                            <label class="block text-sm font-medium mb-2">Produkt *</label>
                            <input type="text" value="${productName}" class="w-full bg-zinc-800" readonly>
                            ${productPrice ? `<p class="text-coyote font-bold text-lg mt-2">Cena: ${productPrice} PLN</p>` : ''}
                        </div>

                        <div class="mb-6">
                            <label class="block text-sm font-medium mb-2">Email *</label>
                            <input type="email" id="order-email" value="${userProfile?.email || user.email || ''}" 
                                   class="w-full" required>
                        </div>

                        <div class="mb-6">
                            <label class="block text-sm font-medium mb-2">Telefon</label>
                            <input type="text" id="order-phone" 
                                   value="${userProfile?.phone ? b64DecodeUtf8(userProfile.phone) : ''}" 
                                   class="w-full">
                        </div>

                        <div class="mb-6">
                            <label class="block text-sm font-medium mb-2">Paczkomat</label>
                            <input type="text" id="order-parcelLocker" 
                                   value="${userProfile?.parcelLocker ? b64DecodeUtf8(userProfile.parcelLocker) : ''}" 
                                   class="w-full" placeholder="Kod paczkomatu">
                        </div>

                        <div class="mb-6">
                            <label class="block text-sm font-medium mb-2">Adres</label>
                            <div class="grid grid-cols-2 gap-4">
                                <input type="text" id="order-address-street" 
                                       value="${decodedAddress.street}" 
                                       class="w-full" placeholder="Ulica">
                                <input type="text" id="order-address-building" 
                                       value="${decodedAddress.buildingNumber}" 
                                       class="w-full" placeholder="Nr budynku">
                                <input type="text" id="order-address-postal" 
                                       value="${decodedAddress.postalCode}" 
                                       class="w-full" placeholder="Kod pocztowy">
                                <input type="text" id="order-address-city" 
                                       value="${decodedAddress.city}" 
                                       class="w-full" placeholder="Miasto">
                            </div>
                        </div>

                        <div class="mb-6">
                            <label class="block text-sm font-medium mb-2">Uwagi</label>
                            <textarea id="order-notes" class="w-full" rows="3" 
                                      placeholder="Dodatkowe uwagi dotyczące zamówienia..."></textarea>
                        </div>

                        <div class="mb-6 p-4 bg-zinc-800/50 rounded-lg border border-zinc-700">
                            <p class="text-xs text-zinc-400">
                                <strong>Uwaga:</strong> Zamówienie może nie zostać zaakceptowane. 
                                Regulamin zamówień dostępny w <a href="https://dokumenty.strzelca.pl" 
                                target="_blank" class="text-coyote hover:underline">dokumentach strzelca.pl</a>.
                            </p>
                        </div>

                        <div class="flex justify-end gap-4">
                            <button type="button" onclick="document.getElementById('order-form-modal').remove()" 
                                    class="px-6 py-2 border border-zinc-700 rounded-lg hover:bg-zinc-800 transition">
                                Anuluj
                            </button>
                            <button type="submit" class="px-6 py-2 bg-coyote text-black rounded-lg font-bold hover:bg-opacity-90 transition">
                                <i class="fa-solid fa-shopping-cart mr-2"></i>
                                Złóż zamówienie
                            </button>
                        </div>
                    </form>
                </div>
            `;

            document.body.appendChild(modal);
        }

        // Wysyłanie zamówienia
        window.submitShopOrder = async function(event, productName, productPrice) {
            event.preventDefault();
            
            try {
                const user = auth.currentUser;
                if (!user) {
                    alert('Musisz być zalogowany, aby złożyć zamówienie');
                    return;
                }

                const orderData = {
                    userId: user.uid,
                    email: document.getElementById('order-email').value,
                    orderDetails: `Produkt: ${productName}${productPrice ? ` (${productPrice} PLN)` : ''}`,
                    notes: document.getElementById('order-notes').value || '',
                    phone: document.getElementById('order-phone').value || '',
                    parcelLocker: document.getElementById('order-parcelLocker').value || '',
                    address: {
                        street: document.getElementById('order-address-street').value || '',
                        buildingNumber: document.getElementById('order-address-building').value || '',
                        postalCode: document.getElementById('order-address-postal').value || '',
                        city: document.getElementById('order-address-city').value || '',
                    },
                    price: productPrice || 0,
                    shipping: 0,
                    additionalCosts: 0,
                    tax: 0,
                    status: 'zlozone'
                };

                const response = await fetch('/api/orders', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    credentials: 'include',
                    body: JSON.stringify(orderData),
                });

                const data = await response.json();
                
                if (!data.success) {
                    throw new Error(data.error || 'Failed to create order');
                }

                // Zaloguj aktywność
                    await logActivity(
                        'ORDER-PLACED',
                        user.uid,
                        user.displayName || user.email.split('@')[0] || 'Użytkownik',
                        `Zamówienie produktu: ${productName}`
                    );

                // Zamknij modal i pokaż komunikat
                document.getElementById('order-form-modal').remove();
                alert('Zamówienie zostało złożone pomyślnie! Otrzymasz potwierdzenie na adres email.');
                
                // Opcjonalnie: przekieruj do profilu z zamówieniami
                // window.location.href = 'https://konto.strzelca.pl/profil.html';
            } catch (error) {
                console.error('Error submitting order:', error);
                alert('Błąd składania zamówienia: ' + error.message);
            }
        };

        let productItems = [];
        let productLoopEnabled = false;
        let productCarouselAnimating = false;

        function getVisibleCardsCount() {
            if (window.innerWidth <= 700) return 1;
            if (window.innerWidth <= 1024) return 2;
            return 3;
        }

        function getProductStepWidth() {
            const track = document.getElementById('product-track');
            if (!track) return 0;

            const cards = track.querySelectorAll('.product-card');
            if (cards.length >= 2) {
                return cards[1].offsetLeft - cards[0].offsetLeft;
            }
            return cards[0] ? cards[0].offsetWidth : 0;
        }

        function buildProductCard(item) {
            const encodedTitle = encodeURIComponent(item.title || '');
            const mainImage = item.mainImage || '';

            return `
                <article class="card-dark product-card flex flex-col h-full shadow-2xl transition hover:border-[#C19A6B]/50" role="article">
                    <div class="product-img-container"><img src="${mainImage}" alt="${item.title}" loading="lazy"></div>
                    <div class="p-4 md:p-6 flex flex-col flex-grow text-center">
                        <h3 class="text-lg md:text-xl font-bold uppercase mb-2 font-[Orbitron] text-white tracking-tight">${item.title}</h3>
                        <p class="coyote-text font-black text-xl md:text-2xl mb-4 md:mb-5" aria-label="Cena: ${item.price} złotych">${item.price} PLN</p>
                        <div class="mt-auto flex flex-col gap-2 md:gap-3">
                            <button onclick="window.showDetails('${item.id}')" aria-label="Zobacz szczegóły produktu ${item.title}" class="w-full py-2 md:py-3 border border-zinc-800 text-[9px] md:text-[10px] uppercase font-bold hover:bg-zinc-800 transition rounded tracking-widest text-zinc-400">Szczegóły</button>
                            <button onclick="window.handleOrder(decodeURIComponent('${encodedTitle}'), ${item.price || 0})" aria-label="Zamów produkt ${item.title}" class="w-full py-3 md:py-4 bg-[#C19A6B] text-black text-[9px] md:text-[10px] uppercase font-black rounded tracking-[0.2em] flex items-center justify-center hover:bg-[#b18a5f] transition">Zamów</button>
                        </div>
                    </div>
                </article>
            `;
        }

        function renderProductCarousel(preservePosition = true) {
            const track = document.getElementById('product-track');
            const prevBtn = document.getElementById('carousel-prev');
            const nextBtn = document.getElementById('carousel-next');
            if (!track || !prevBtn || !nextBtn) return;
            productCarouselAnimating = false;

            if (productItems.length === 0) {
                track.innerHTML = `
                    <article class="card-dark product-card p-8 text-center w-full">
                        <p class="text-zinc-400 uppercase tracking-[0.15em] text-xs">Brak produktów wystawionych na sprzedaż</p>
                    </article>
                `;
                productLoopEnabled = false;
                prevBtn.disabled = true;
                nextBtn.disabled = true;
                track.style.transition = 'none';
                track.style.transform = 'translateX(0)';
                return;
            }

            if (!preservePosition) {
                track.innerHTML = productItems.map((item) => buildProductCard(item)).join('');
            }
            const visibleCards = getVisibleCardsCount();
            productLoopEnabled = productItems.length > visibleCards;
            prevBtn.disabled = !productLoopEnabled;
            nextBtn.disabled = !productLoopEnabled;
            track.style.transition = 'none';
            track.style.transform = 'translateX(0)';
            window.requestAnimationFrame(() => {
                track.style.transition = 'transform 0.35s ease';
            });
        }

        window.moveProductCarousel = (direction) => {
            if (!productLoopEnabled || productCarouselAnimating) return;
            const track = document.getElementById('product-track');
            if (!track) return;
            const stepWidth = getProductStepWidth();
            if (stepWidth <= 0) return;

            productCarouselAnimating = true;

            if (direction > 0) {
                track.style.transition = 'transform 0.35s ease';
                track.style.transform = `translateX(-${stepWidth}px)`;

                const onEnd = () => {
                    track.style.transition = 'none';
                    const firstCard = track.firstElementChild;
                    if (firstCard) {
                        track.appendChild(firstCard);
                    }
                    track.style.transform = 'translateX(0)';
                    // force layout before restoring transition
                    void track.offsetHeight;
                    track.style.transition = 'transform 0.35s ease';
                    productCarouselAnimating = false;
                };
                track.addEventListener('transitionend', onEnd, { once: true });
            } else {
                track.style.transition = 'none';
                const lastCard = track.lastElementChild;
                if (lastCard) {
                    track.insertBefore(lastCard, track.firstElementChild);
                }
                track.style.transform = `translateX(-${stepWidth}px)`;
                void track.offsetHeight;
                track.style.transition = 'transform 0.35s ease';
                track.style.transform = 'translateX(0)';

                const onEnd = () => {
                    productCarouselAnimating = false;
                };
                track.addEventListener('transitionend', onEnd, { once: true });
            }
        };

        window.addEventListener('resize', () => {
            if (productItems.length === 0) return;
            renderProductCarousel(false);
        });

        const fetchAll = async () => {
            const q = query(collection(db, "products"), orderBy("order", "asc"));
            const snap = await getDocs(q);
            productItems = [];

            snap.forEach((d) => {
                const p = d.data();
                let mainImage = p.img || '';
                if (p.images && Array.isArray(p.images) && p.images.length > 0) {
                    mainImage = typeof p.images[0] === 'string' ? p.images[0] : p.images[0].url;
                }

                productItems.push({
                    id: d.id,
                    title: p.title || '',
                    price: p.price || 0,
                    mainImage,
                });
            });

            renderProductCarousel(false);
        };

        window.showDetails = async (id) => {
            const d = await getDoc(doc(db, "products", id));
            const p = d.data();
            
            // Pobierz zdjęcia produktu
            let images = [];
            if (p.images && Array.isArray(p.images) && p.images.length > 0) {
                images = p.images.map(img => typeof img === 'string' ? img : img.url);
            } else if (p.img) {
                // Fallback dla starych produktów
                images = [p.img];
            }
            
            // Jeśli nie ma zdjęć w tablicy, spróbuj wyciągnąć z opisu
            if (images.length === 0 && p.description) {
                const tempDiv = document.createElement('div');
                tempDiv.innerHTML = p.description;
                const imgs = tempDiv.querySelectorAll('img');
                imgs.forEach(img => {
                    if (img.src && !images.includes(img.src)) {
                        images.push(img.src);
                    }
                });
            }
            
            // Generuj HTML galerii
            let galleryHTML = '';
            if (images.length > 0) {
                galleryHTML = `
                    <div class="product-gallery" id="product-gallery">
                        <img id="gallery-main-img" src="${images[0]}" alt="${p.title}" />
                        ${images.length > 1 ? `
                            <button class="gallery-nav prev" onclick="changeGalleryImage(-1, ${images.length})" id="gallery-prev" style="opacity: 0.3; cursor: not-allowed;">
                                <i class="fa-solid fa-chevron-left"></i>
                            </button>
                            <button class="gallery-nav next" onclick="changeGalleryImage(1, ${images.length})" id="gallery-next">
                                <i class="fa-solid fa-chevron-right"></i>
                            </button>
                            <div class="gallery-counter">
                                <span id="gallery-current">1</span> / <span id="gallery-total">${images.length}</span>
                            </div>
                        ` : ''}
                    </div>
                `;
                
                // Zapisz zdjęcia w zmiennej globalnej dla funkcji nawigacji
                window.currentProductImages = images;
                window.currentGalleryIndex = 0;
                
                // Dodaj obsługę klawiatury dla nawigacji
                const handleKeyPress = (e) => {
                    if (e.key === 'ArrowLeft' && window.currentGalleryIndex > 0) {
                        changeGalleryImage(-1, images.length);
                    } else if (e.key === 'ArrowRight' && window.currentGalleryIndex < images.length - 1) {
                        changeGalleryImage(1, images.length);
                    }
                };
                
                // Usuń poprzedni listener jeśli istnieje
                if (window.galleryKeyHandler) {
                    document.removeEventListener('keydown', window.galleryKeyHandler);
                }
                
                window.galleryKeyHandler = handleKeyPress;
                document.addEventListener('keydown', handleKeyPress);
            }
            
            // Przygotuj opis - usuń zdjęcia, które są już w galerii
            let descriptionHTML = p.description || p.desc || '';
            if (descriptionHTML && images.length > 0) {
                const tempDiv = document.createElement('div');
                tempDiv.innerHTML = descriptionHTML;
                const imgs = tempDiv.querySelectorAll('img');
                imgs.forEach(img => {
                    if (images.includes(img.src)) {
                        img.remove();
                    }
                });
                descriptionHTML = tempDiv.innerHTML;
            }
            
            document.getElementById('details-content').innerHTML = `
                <h2 class="text-2xl font-black uppercase mb-4 font-[Orbitron] text-white">${p.title}</h2>
                ${galleryHTML}
                <div class="text-zinc-400 text-sm mb-8 custom-render details-scroll-area leading-relaxed">
                    ${descriptionHTML}
                </div>
                <div class="flex justify-between items-center border-t border-zinc-800 pt-6">
                    <p class="text-3xl font-black coyote-text">${p.price} PLN</p>
                    <button onclick="window.handleOrder('${p.title}', ${p.price || 0})" class="bg-[#C19A6B] text-black px-8 py-4 uppercase text-[10px] font-black rounded tracking-widest shadow-lg hover:bg-[#b18a5f] transition">Złóż zamówienie</button>
                </div>`;
            document.getElementById('details-modal').classList.remove('hidden');
        };
        
        // Funkcja zmiany zdjęcia w galerii
        window.changeGalleryImage = (direction, total) => {
            if (!window.currentProductImages || window.currentProductImages.length === 0) return;
            
            const newIndex = window.currentGalleryIndex + direction;
            if (newIndex < 0 || newIndex >= total) return; // Nie pozwól wyjść poza zakres
            
            window.currentGalleryIndex = newIndex;
            const img = document.getElementById('gallery-main-img');
            const counter = document.getElementById('gallery-current');
            
            if (img) {
                img.src = window.currentProductImages[window.currentGalleryIndex];
            }
            if (counter) {
                counter.textContent = window.currentGalleryIndex + 1;
            }
            
            // Aktualizuj stan przycisków (ukryj jeśli na początku/końcu)
            const prevBtn = document.getElementById('gallery-prev');
            const nextBtn = document.getElementById('gallery-next');
            if (prevBtn) {
                if (window.currentGalleryIndex === 0) {
                    prevBtn.style.opacity = '0.3';
                    prevBtn.style.cursor = 'not-allowed';
                } else {
                    prevBtn.style.opacity = '1';
                    prevBtn.style.cursor = 'pointer';
                }
            }
            if (nextBtn) {
                if (window.currentGalleryIndex === total - 1) {
                    nextBtn.style.opacity = '0.3';
                    nextBtn.style.cursor = 'not-allowed';
                } else {
                    nextBtn.style.opacity = '1';
                    nextBtn.style.cursor = 'pointer';
                }
            }
        };

        fetchAll();
    </script>
    <script
      type="module"
      src="https://strzelca.pl/auth-widget.mjs?v=2026-02-06-1"
    ></script>
    <script
      type="module"
      src="https://strzelca.pl/messages-widget.mjs?v=2026-02-05-14"
    ></script>
  </body>
</html>
