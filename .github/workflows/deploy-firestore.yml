name: Deploy Firestore

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    env:
      # Firebase CLI odczytuje token ze zmiennej (bezpieczniej niż interpolacja w shellu).
      FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Deploy Firestore rules and indexes
        run: npx --yes firebase-tools@latest deploy --only firestore --project strzelca-pl
