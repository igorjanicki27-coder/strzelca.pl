name: Sync public env to Vercel

on:
  push:
    branches:
      - main
    paths:
      - ".env.vercel.production"
      - ".github/workflows/sync-vercel-public-env.yml"

jobs:
  sync-vercel-env:
    runs-on: ubuntu-latest

    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Vercel CLI
        run: npm install -g vercel

      - name: Sync env file to Vercel Production
        shell: bash
        run: |
          set -euo pipefail

          while IFS= read -r line || [ -n "$line" ]; do
            line="$(echo "$line" | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')"

            if [[ -z "$line" || "$line" == \#* ]]; then
              continue
            fi

            key="${line%%=*}"
            value="${line#*=}"

            key="$(echo "$key" | xargs)"
            value="$(printf '%s' "$value")"

            echo "Syncing $key"
            vercel env rm "$key" production --yes --token="$VERCEL_TOKEN" >/dev/null 2>&1 || true
            printf "%s" "$value" | vercel env add "$key" production --token="$VERCEL_TOKEN"
          done < .env.vercel.production
