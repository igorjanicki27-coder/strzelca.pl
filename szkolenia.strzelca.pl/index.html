        <title>Szkolenia STRZELCA.PL</title>
        <script src="https://cdn.tailwindcss.com"></script>
        <link

        <style>
            :root {
                --coyote: #c19a6b;
            }
            html,
            body {
                height: 100%;
                overflow: hidden;
            }
            body {
                font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
                background-color: #0a0a0a;
                background-image:
                    linear-gradient(
                        rgba(10, 10, 10, 0.22) 0%,
                        rgba(10, 10, 10, 0.55) 55%,
                        rgba(10, 10, 10, 0.9) 100%
                    ),
                    url("https://strzelca.pl/tlo.png");
                background-size: cover;
                background-position: top center;
                color: #e5e5e5;
                margin: 0;
                display: flex;
                flex-direction: column;
                min-height: 100vh;
            }

            .coyote-text {
                color: var(--coyote);
                font-family: "Orbitron", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            }
            .card-dark {
                background: #111;
                border: 1px solid #1f1f1f;
                border-radius: 12px;
                overflow: hidden;
            }

            .training-img-container img {
                width: 100%;
                height: 100%;
                object-fit: contain;
                background: #080808;
            }

            .custom-render ul {
                list-style-type: disc !important;
                padding-left: 20px !important;
                margin: 10px 0 !important;
            }
            .custom-render li {
                margin-bottom: 5px !important;
                display: list-item !important;
            }
            .custom-render b,
            .custom-render strong {
                font-weight: bold !important;
                color: var(--coyote) !important;
            }
            .custom-render div[style*="text-align: center"] {
                text-align: center !important;
            }
            .custom-render div[style*="text-align: right"] {
                text-align: right !important;
            }

            .details-scroll-area {
                max-height: 55vh;
                overflow-y: auto;
                padding-right: 20px;
                scrollbar-gutter: stable;
            }
            .details-scroll-area::-webkit-scrollbar {
                width: 6px;
            }
            .details-scroll-area::-webkit-scrollbar-thumb {
                background: #333;
                border-radius: 10px;
            }
            .details-scroll-area::-webkit-scrollbar-thumb:hover {
                background: var(--coyote);
            }

            #training {
                flex: 1;
                min-height: 0;
                display: flex;
                align-items: center;
                width: 100%;
            }
            .training-carousel {
                width: 100%;
                max-width: 1600px;
                margin: 0 auto;
                display: grid;
                grid-template-columns: auto 1fr auto;
                align-items: center;
                gap: 14px;
            }
            .carousel-viewport {
                overflow: hidden;
                width: 100%;
            }
            #training-track {
                display: flex;
                gap: 20px;
                transition: transform 0.18s cubic-bezier(0.22, 0.61, 0.36, 1);
                will-change: transform;
            }
            .training-card {
                flex: 0 0 calc((100% - 40px) / 3);
                min-width: 0;
            }
            .training-card.card-dark {
                background: rgba(17, 17, 17, 0.72);
                backdrop-filter: blur(6px);
                -webkit-backdrop-filter: blur(6px);
            }
            .training-card .training-img-container img {
                background: rgba(8, 8, 8, 0.55);
            }
            .carousel-arrow {
                width: 44px;
                height: 44px;
                border: 1px solid #2b2b2b;
                border-radius: 999px;
                color: #f4f4f5;
                background: rgba(10, 10, 10, 0.9);
                display: inline-flex;
                align-items: center;
                justify-content: center;
                transition: all 0.2s ease;
            }
            .carousel-arrow:hover:not(:disabled) {
                background: rgba(193, 154, 107, 0.95);
                color: #050505;
                border-color: rgba(193, 154, 107, 0.95);
            }
            .carousel-arrow:disabled {
                opacity: 0.35;
                cursor: not-allowed;
            }
            .training-card .training-img-container {
                height: clamp(140px, 24vh, 220px);
            }

            @media (max-width: 1024px) {
                .training-card {
                    flex-basis: calc((100% - 20px) / 2);
                }
            }

            @media (max-width: 700px) {
                .training-carousel {
                    gap: 8px;
                }
                #training-track {
                    gap: 12px;
                }
                .training-card {
                    flex-basis: 100%;
                }
                .carousel-arrow {
                    width: 38px;
                    height: 38px;
                }
            }

            .training-unavailable {
                opacity: 0.5;
                position: relative;
            }
            .training-unavailable::after {
                content: "Niedostępne";
                position: absolute;
                top: 10px;
                right: 10px;
                background: rgba(193, 154, 107, 0.9);
                color: #000;
                padding: 4px 8px;
                border-radius: 4px;
                font-size: 10px;
                font-weight: bold;
                text-transform: uppercase;
                letter-spacing: 0.5px;
            }
        </style>
    </head>
    <body>
        <!-- Panel użytkownika -->
        <div id="user-panel" class="fixed top-4 right-4 z-50 hidden">
            <div class="relative">
                <!-- Avatar - widoczny zawsze -->
                <button
                    id="user-avatar-button"
                    class="w-12 h-12 rounded-full bg-coyote flex items-center justify-center text-white font-bold cursor-pointer hover:opacity-80 transition shadow-lg overflow-hidden"
                    onclick="toggleUserMenu()"
                >
                    <div id="user-avatar" class="w-full h-full flex items-center justify-center">
                        <i class="fa-solid fa-user"></i>
                    </div>
                </button>
                
                <!-- Menu rozwijane -->
                <div
                    id="user-menu"
                    class="absolute top-14 right-0 bg-zinc-900/95 backdrop-blur-md border border-zinc-700 rounded-2xl p-4 shadow-2xl min-w-[200px] hidden"
                >
                    <div class="space-y-2">
                        <div
                            id="user-display-name"
                            class="text-white font-semibold text-sm mb-3 pb-3 border-b border-zinc-700"
                        ></div>
                        <a
                            id="profile-link"
                            href="https://konto.strzelca.pl/profil.html"
                            class="block text-zinc-300 hover:text-coyote transition text-sm"
                        >
                            <i class="fa-solid fa-user mr-2"></i>Mój profil
                        </a>
                        <button onclick="logout()" class="block w-full text-left text-zinc-300 hover:text-red-400 transition text-sm">
                            <i class="fa-solid fa-sign-out-alt mr-2"></i>Wyloguj się
                        </button>
                    </div>
                </div>
            </div>
        </div>

        <!-- Przycisk logowania dla niezalogowanych -->
        <div id="login-button" class="fixed top-4 right-4 z-50">
            <a href="https://konto.strzelca.pl/login.html" class="bg-coyote text-black w-10 h-10 rounded-full flex items-center justify-center hover:bg-white transition shadow-lg" title="Zaloguj się">
                <i class="fa-solid fa-sign-in-alt text-lg"></i>
            </a>
        </div>

        <nav
            class="h-[73px] border-b border-zinc-900 sticky top-0 bg-black/95 z-50 backdrop-blur-md flex items-center relative"
            role="navigation"
            aria-label="Nawigacja główna"
        >
            <a
                href="https://strzelca.pl"
                aria-label="Powrót do centrum dowodzenia"
                class="absolute left-4 md:left-8 text-zinc-500 hover:text-white transition text-xl z-[60]"
            >
                <i class="fa-solid fa-arrow-left" aria-hidden="true"></i>
            </a>
            <div
                class="container mx-auto px-6 flex justify-center items-center"
            >
                <div
                    class="uppercase font-bold text-[11px] tracking-[0.3em] font-[Orbitron] text-zinc-400"
                >
                    SZKOLENIA.<span class="coyote-text">STRZELCA</span>.PL
                </div>
            </div>
        </nav>

        <section id="training" class="px-4 md:px-8 py-6 md:py-10">
            <div class="training-carousel">
                <button id="training-carousel-prev" class="carousel-arrow" type="button" aria-label="Poprzednie szkolenie" onclick="window.moveTrainingCarousel(-1)">
                    <i class="fa-solid fa-chevron-left"></i>
                </button>
                <div class="carousel-viewport">
                    <div id="training-track"></div>
                </div>
                <button id="training-carousel-next" class="carousel-arrow" type="button" aria-label="Następne szkolenie" onclick="window.moveTrainingCarousel(1)">
                    <i class="fa-solid fa-chevron-right"></i>
                </button>
            </div>
        </section>

        <div
            id="details-modal"
            class="fixed inset-0 z-[100] hidden flex items-center justify-center p-4 md:p-6 bg-black/95 backdrop-blur-md"
            onclick="if(!event.target.closest('#details-modal-panel')) document.getElementById('details-modal').classList.add('hidden')"
        >
            <div
                id="details-modal-panel"
                class="bg-zinc-900 p-4 md:p-8 rounded-2xl md:rounded-3xl max-w-2xl w-full border border-zinc-800 relative shadow-2xl max-h-[90vh] overflow-y-auto"
            >
                <button
                    onclick="
                        document
                            .getElementById('details-modal')
                            .classList.add('hidden')
                    "
                    class="absolute top-4 md:top-6 right-4 md:right-6 text-2xl md:text-3xl text-zinc-500 hover:text-white"
                >
                    &times;
                </button>
                <div id="details-content"></div>
            </div>
        </div>

        <footer
            class="w-full py-10 text-center text-zinc-700 text-[10px] uppercase font-bold tracking-[0.4em] bg-transparent"
            role="contentinfo"
        >
            <a href="https://strzelca.pl" class="hover:text-zinc-500 transition"
                >STRZELCA.PL</a
            > |
            <a
                href="?cookies=1"
                class="hover:text-zinc-500 transition ml-4"
                >Ustawienia cookies</a
            >
        </footer>

        <script type="module">
            import { initializeApp, getApps } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
            import {
                getAuth,
                onAuthStateChanged,
                setPersistence,
                browserLocalPersistence,
            } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
            import { ensureFirebaseSSO } from "https://strzelca.pl/sso-client.mjs?v=2026-02-06-1";
            import {
                initializeFirestore,
                getFirestore,
                collection,
                getDocs,
                doc,
                getDoc,
                query,
                orderBy,
                where,
            } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

            
      async function getFirebaseApiKey() {
        const cachedKey = localStorage.getItem("firebase_web_api_key");
        if (cachedKey) return cachedKey;

        const urls = [
          "https://strzelca.pl/api/firebase-config",
          "/api/firebase-config" // fallback dla lokalnego developmentu
        ];

        for (const url of urls) {
          try {
            const res = await fetch(url, { cache: "force-cache" });
            if (!res.ok) continue;
            const data = await res.json().catch(() => null);
            if (data && typeof data.apiKey === "string" && data.apiKey.length > 10) {
              localStorage.setItem("firebase_web_api_key", data.apiKey);
              return data.apiKey;
            }
          } catch (_) {
            // ignore and try next url
          }
        }

        throw new Error("Nie udało się pobrać FIREBASE_WEB_API_KEY z /api/firebase-config");
      }
const firebaseConfig = {
                apiKey: await getFirebaseApiKey(),
                authDomain: "strzelca-pl.firebaseapp.com",
                projectId: "strzelca-pl",
                storageBucket: "strzelca-pl.appspot.com",
                messagingSenderId: "511362047688",
                appId: "1:511362047688:web:9b82c0a4d19c1a3a878ffd",
            };

            // Sprawdź czy aplikacja Firebase już istnieje (np. z auth-widget.mjs lub messages-widget.mjs)
            const existingApps = getApps();
            const app = existingApps.length > 0 ? existingApps[0] : initializeApp(firebaseConfig);
            
            // Inicjalizuj Firestore - jeśli już istnieje, użyj getFirestore
            let db;
            try {
                db = initializeFirestore(app, {
                    experimentalAutoDetectLongPolling: true,
                    useFetchStreams: true,
                });
            } catch {
                // Firestore już zainicjalizowany, użyj istniejącej instancji
                db = getFirestore(app);
            }
            
            const auth = getAuth(app);

            // Ustaw trwałość sesji na browserLocalPersistence dla wszystkich subdomen
            await setPersistence(auth, browserLocalPersistence);

            // SSO między subdomenami: jeśli tu nie ma usera, spróbuj zalogować z cookie (.strzelca.pl)
            try {
                await ensureFirebaseSSO(auth);
            } catch (e) {
                console.warn("SSO ensure failed (ignored):", e?.message || e);
            }

            let currentUser = null;

            // Funkcja pomocnicza do generowania domyślnego awatara
            function getDefaultAvatar(gender) {
                return '<i class="fa-solid fa-user text-white"></i>';
            }

            // Funkcja rozwijania/zwijania menu użytkownika
            window.toggleUserMenu = () => {
                const userMenu = document.getElementById("user-menu");
                if (userMenu) {
                    userMenu.classList.toggle("hidden");
                }
            };

            // Zamykanie menu po kliknięciu poza nim
            document.addEventListener("click", (event) => {
                const userPanel = document.getElementById("user-panel");
                const userMenu = document.getElementById("user-menu");
                
                if (
                    userPanel &&
                    userMenu &&
                    !userPanel.contains(event.target) &&
                    !userMenu.classList.contains("hidden")
                ) {
                    userMenu.classList.add("hidden");
                }
            });

            // Funkcja aktualizacji interfejsu użytkownika
            async function updateUserInterface(user) {
                const loginBtn = document.getElementById("login-button");
                const userPanel = document.getElementById("user-panel");
                const userDisplayName = document.getElementById("user-display-name");
                const userAvatar = document.getElementById("user-avatar");
                const profileLink = document.getElementById("profile-link");

                if (user) {
                    // Użytkownik zalogowany
                    loginBtn.classList.add("hidden");
                    userPanel.classList.remove("hidden");

                    // Wyświetl nazwę użytkownika
                    const displayName = user.displayName || user.email.split("@")[0];
                    if (userDisplayName) {
                        userDisplayName.textContent = displayName;
                    }

                // Profil zawsze prowadzi do profilu (weryfikacja emaila jest sprawdzana wyłącznie przy logowaniu)
                if (profileLink) {
                    profileLink.href = "https://konto.strzelca.pl/profil.html";
                }

                    // Pobierz awatar z profilu użytkownika
                    try {
                        const profileDoc = await getDoc(doc(db, "userProfiles", user.uid));
                        if (profileDoc.exists()) {
                            const userProfile = profileDoc.data();
                            if (userProfile.displayName && userDisplayName) {
                                userDisplayName.textContent = userProfile.displayName;
                            }
                            if (userAvatar) {
                                if (userProfile.avatar) {
                                    // Jeśli użytkownik ma awatar, wyświetl go
                                    userAvatar.innerHTML = `<img src="${userProfile.avatar}" alt="Avatar" class="w-full h-full rounded-full object-cover">`;
                                } else {
                                    // Użyj domyślnego awatara
                                    userAvatar.innerHTML = getDefaultAvatar(userProfile.gender);
                                }
                            }
                        } else {
                            // Jeśli profil nie istnieje, użyj domyślnego awatara
                            if (userAvatar) {
                                userAvatar.innerHTML = getDefaultAvatar();
                            }
                        }
                    } catch (error) {
                        console.error("Error loading user profile:", error);
                        if (userAvatar) {
                            userAvatar.innerHTML = getDefaultAvatar();
                        }
                    }
                } else {
                    // Użytkownik niezalogowany
                    loginBtn.classList.remove("hidden");
                    userPanel.classList.add("hidden");
                }
            }

            // Funkcja wylogowania
            window.logout = async () => {
                try {
                    // SSO: wyczyść cookie wspólnej sesji
                    try {
                        await fetch("https://strzelca.pl/api/sso-session-logout", {
                            method: "POST",
                            credentials: "include",
                        });
                    } catch (e) {
                        console.warn("SSO logout failed (ignored):", e?.message || e);
                    }
                    const { signOut } = await import("https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js");
                    await signOut(auth);
                    // Zamknij menu po wylogowaniu
                    const userMenu = document.getElementById("user-menu");
                    if (userMenu) {
                        userMenu.classList.add("hidden");
                    }
                } catch (error) {
                    console.error("Logout error:", error);
                }
            };

            // Monitorowanie stanu logowania
            // Inicjalizuj śledzenie aktywności
            try {
                const { initActivityTracker } = await import("https://strzelca.pl/activity-tracker.mjs?v=2026-02-06-1");
                await initActivityTracker(auth, db);
                
                // Monitorowanie statusu użytkownika (blokowanie)
                const { initUserStatusMonitor } = await import("https://strzelca.pl/user-status-monitor.mjs?v=2026-02-06-1");
                await initUserStatusMonitor(auth, db);
            } catch (error) {
                console.warn("Could not initialize activity tracker:", error);
            }
            
            // Inicjalizuj śledzenie odwiedzin (działa dla wszystkich użytkowników, również niezalogowanych)
            try {
              const { initVisitTracker } = await import("https://strzelca.pl/visit-tracker.mjs?v=2026-02-06-3");
              await initVisitTracker(auth);
            } catch (error) {
              console.warn("Could not initialize visit tracker:", error);
            }

            // Funkcja do obsługi zapytania o ofertę
            window.handleOfferInquiry = async (trainingName) => {
                const regulaminCb = document.getElementById("training-regulamin-accept");
                if (regulaminCb && !regulaminCb.checked) {
                    alert("Zaznacz pole potwierdzające zapoznanie się z Regulaminem Szkoleń i akceptację kar umownych za rozpowszechnianie materiałów — wtedy możesz wysłać zapytanie.");
                    return;
                }

                // Jeśli zapytanie jest wywołane z modala szczegółów, schowaj modal,
                // aby nie zasłaniał otwieranego widgetu wiadomości.
                const detailsModal = document.getElementById("details-modal");
                if (detailsModal && !detailsModal.classList.contains("hidden")) {
                    detailsModal.classList.add("hidden");
                }

                const user = auth.currentUser;
                
                if (user) {
                    // Użytkownik zalogowany - otwórz czat z administracją
                    try {
                        // Ustaw localStorage aby widget wybrał konwersację z adminem
                        localStorage.setItem("__strzelca_messages_widget_selected", JSON.stringify({ peerId: "admin" }));
                        localStorage.setItem("__strzelca_messages_widget_open", "true");
                        
                        // Poczekaj na załadowanie widgetu (maksymalnie 2 sekundy)
                        let attempts = 0;
                        const maxAttempts = 20;
                        const checkWidget = () => {
                            const widgetHost = document.getElementById("strzelca-messages-widget");
                            if (widgetHost && widgetHost.shadowRoot) {
                                const btn = widgetHost.shadowRoot.querySelector("button.btn");
                                if (btn) {
                                    btn.click();
                                    
                                    // Poczekaj chwilę i wypełnij textarea z informacją o szkoleniu
                                    setTimeout(() => {
                                        const textarea = widgetHost.shadowRoot.querySelector("textarea");
                                        if (textarea) {
                                            textarea.value = `Zapytanie o ofertę szkolenia: ${trainingName}`;
                                            textarea.dispatchEvent(new Event("input", { bubbles: true }));
                                            textarea.focus();
                                        }
                                    }, 500);
                                    return true;
                                }
                            }
                            return false;
                        };
                        
                        // Sprawdź od razu
                        if (checkWidget()) {
                            return;
                        }
                        
                        // Jeśli widget nie jest jeszcze załadowany, poczekaj
                        const interval = setInterval(() => {
                            attempts++;
                            if (checkWidget() || attempts >= maxAttempts) {
                                clearInterval(interval);
                                if (attempts >= maxAttempts) {
                                    // Fallback: jeśli widget się nie załadował, otwórz formularz kontaktowy
                                    const offerUrl = `https://kontakt.strzelca.pl?topic=Pytanie o szkolenie&product=${encodeURIComponent(trainingName)}`;
                                    window.location.href = offerUrl;
                                }
                            }
                        }, 100);
                    } catch (error) {
                        console.error("Error opening chat:", error);
                        // Fallback: otwórz formularz kontaktowy
                        const offerUrl = `https://kontakt.strzelca.pl?topic=Pytanie o szkolenie&product=${encodeURIComponent(trainingName)}`;
                        window.location.href = offerUrl;
                    }
                } else {
                    // Użytkownik niezalogowany - przekieruj do formularza kontaktowego
                    const offerUrl = `https://kontakt.strzelca.pl?topic=Pytanie o szkolenie&product=${encodeURIComponent(trainingName)}`;
                    window.location.href = offerUrl;
                }
            };

            let trainingItems = [];
            let trainingLoopEnabled = false;
            let trainingCarouselAnimating = false;
            let trainingPendingMoves = 0;
            const TRAINING_CAROUSEL_DURATION_MS = 180;

            function getVisibleTrainingCardsCount() {
                if (window.innerWidth <= 700) return 1;
                if (window.innerWidth <= 1024) return 2;
                return 3;
            }

            function getTrainingStepWidth() {
                const track = document.getElementById("training-track");
                if (!track) return 0;

                const cards = track.querySelectorAll(".training-card");
                if (cards.length >= 2) {
                    return cards[1].offsetLeft - cards[0].offsetLeft;
                }
                return cards[0] ? cards[0].offsetWidth : 0;
            }

            function buildTrainingCard(item) {
                const encodedTitle = encodeURIComponent(item.title || "");

                let buttonHtml = "";
                if (item.hasAccess) {
                    buttonHtml = `<button onclick="event.stopPropagation(); window.location.href='https://szkolenia.strzelca.pl/kurs.html?id=${item.id}'" aria-label="Rozpocznij kurs ${item.title}" class="w-full py-3 md:py-4 bg-[#C19A6B] text-black text-[9px] md:text-[10px] uppercase font-black rounded tracking-[0.2em] flex items-center justify-center hover:bg-[#b18a5f] transition">Rozpocznij kurs</button>`;
                } else {
                    buttonHtml = `<button onclick="event.stopPropagation(); window.handleOfferInquiry(decodeURIComponent('${encodedTitle}'))" aria-label="Zapytaj o ofertę szkolenia ${item.title}" class="w-full py-3 md:py-4 bg-[#C19A6B] text-black text-[9px] md:text-[10px] uppercase font-black rounded tracking-[0.2em] flex items-center justify-center hover:bg-[#b18a5f] transition">Zapytaj o ofertę</button>`;
                }

                return `
                    <article onclick="window.showTrainingDetails('${item.id}')" class="card-dark training-card flex flex-col h-full shadow-2xl transition hover:border-[#C19A6B]/50 cursor-pointer" role="article">
                        <div class="training-img-container"><img src="${item.img}" alt="${item.title}" loading="lazy"></div>
                        <div class="p-4 md:p-6 flex flex-col flex-grow text-center">
                            <h3 class="text-xl md:text-2xl font-black uppercase mb-2 font-[Orbitron] text-white tracking-tight">${item.title}</h3>
                            <p class="coyote-text font-bold text-lg md:text-xl mb-4 md:mb-5" aria-label="Cena: ${item.price} złotych">${item.price} PLN</p>
                            <div class="mt-auto flex flex-col gap-2 md:gap-3">
                                ${buttonHtml}
                            </div>
                        </div>
                    </article>
                `;
            }

            function renderTrainingCarousel(preservePosition = true) {
                const track = document.getElementById("training-track");
                const prevBtn = document.getElementById("training-carousel-prev");
                const nextBtn = document.getElementById("training-carousel-next");
                if (!track || !prevBtn || !nextBtn) return;
                trainingCarouselAnimating = false;
                trainingPendingMoves = 0;

                if (trainingItems.length === 0) {
                    track.innerHTML = `
                        <article class="card-dark training-card p-8 text-center w-full">
                            <p class="text-zinc-400 uppercase tracking-[0.15em] text-xs">Brak szkoleń wystawionych do sprzedaży</p>
                        </article>
                    `;
                    trainingLoopEnabled = false;
                    prevBtn.disabled = true;
                    nextBtn.disabled = true;
                    track.style.transition = "none";
                    track.style.transform = "translateX(0)";
                    return;
                }

                if (!preservePosition) {
                    track.innerHTML = trainingItems.map((item) => buildTrainingCard(item)).join("");
                }
                const visibleCards = getVisibleTrainingCardsCount();
                trainingLoopEnabled = trainingItems.length > visibleCards;
                prevBtn.disabled = !trainingLoopEnabled;
                nextBtn.disabled = !trainingLoopEnabled;
                track.style.transition = "none";
                track.style.transform = "translateX(0)";
                window.requestAnimationFrame(() => {
                    track.style.transition = `transform ${TRAINING_CAROUSEL_DURATION_MS}ms cubic-bezier(0.22, 0.61, 0.36, 1)`;
                });
            }

            function consumeQueuedTrainingMove() {
                if (!trainingLoopEnabled || trainingPendingMoves === 0 || trainingCarouselAnimating) return;
                const nextDir = trainingPendingMoves > 0 ? 1 : -1;
                trainingPendingMoves -= nextDir;
                window.moveTrainingCarousel(nextDir);
            }

            window.moveTrainingCarousel = (direction) => {
                if (!trainingLoopEnabled) return;
                const moveDir = direction > 0 ? 1 : -1;

                if (trainingCarouselAnimating) {
                    trainingPendingMoves += moveDir;
                    trainingPendingMoves = Math.max(-8, Math.min(8, trainingPendingMoves));
                    return;
                }

                const track = document.getElementById("training-track");
                if (!track) return;
                const stepWidth = getTrainingStepWidth();
                if (stepWidth <= 0) return;

                trainingCarouselAnimating = true;
                let finished = false;
                let fallbackTimer = null;

                const finalizeMove = (afterFinalize) => {
                    if (finished) return;
                    finished = true;
                    if (fallbackTimer) {
                        clearTimeout(fallbackTimer);
                    }
                    if (typeof afterFinalize === "function") {
                        afterFinalize();
                    }
                    trainingCarouselAnimating = false;
                    consumeQueuedTrainingMove();
                };

                if (moveDir > 0) {
                    track.style.transition = `transform ${TRAINING_CAROUSEL_DURATION_MS}ms cubic-bezier(0.22, 0.61, 0.36, 1)`;
                    track.style.transform = `translateX(-${stepWidth}px)`;

                    const onEnd = (event) => {
                        if (event.propertyName && event.propertyName !== "transform") return;
                        track.style.transition = "none";
                        const firstCard = track.firstElementChild;
                        if (firstCard) {
                            track.appendChild(firstCard);
                        }
                        track.style.transform = "translateX(0)";
                        void track.offsetHeight;
                        track.style.transition = `transform ${TRAINING_CAROUSEL_DURATION_MS}ms cubic-bezier(0.22, 0.61, 0.36, 1)`;
                        finalizeMove();
                    };
                    track.addEventListener("transitionend", onEnd, { once: true });
                    fallbackTimer = setTimeout(() => {
                        finalizeMove(() => {
                            track.style.transition = "none";
                            const firstCard = track.firstElementChild;
                            if (firstCard) {
                                track.appendChild(firstCard);
                            }
                            track.style.transform = "translateX(0)";
                            void track.offsetHeight;
                            track.style.transition = `transform ${TRAINING_CAROUSEL_DURATION_MS}ms cubic-bezier(0.22, 0.61, 0.36, 1)`;
                        });
                    }, TRAINING_CAROUSEL_DURATION_MS + 120);
                } else {
                    track.style.transition = "none";
                    const lastCard = track.lastElementChild;
                    if (lastCard) {
                        track.insertBefore(lastCard, track.firstElementChild);
                    }
                    track.style.transform = `translateX(-${stepWidth}px)`;
                    void track.offsetHeight;
                    track.style.transition = `transform ${TRAINING_CAROUSEL_DURATION_MS}ms cubic-bezier(0.22, 0.61, 0.36, 1)`;
                    track.style.transform = "translateX(0)";

                    const onEnd = (event) => {
                        if (event.propertyName && event.propertyName !== "transform") return;
                        finalizeMove();
                    };
                    track.addEventListener("transitionend", onEnd, { once: true });
                    fallbackTimer = setTimeout(() => {
                        finalizeMove();
                    }, TRAINING_CAROUSEL_DURATION_MS + 120);
                }
            };

            window.addEventListener("resize", () => {
                if (trainingItems.length === 0) return;
                renderTrainingCarousel(false);
            });

            const fetchAll = async () => {
                const track = document.getElementById("training-track");
                if (track) {
                    track.innerHTML = `
                        <article class="card-dark training-card p-8 text-center w-full">
                            <p class="text-zinc-400 uppercase tracking-[0.15em] text-xs">Ładowanie szkoleń...</p>
                        </article>
                    `;
                }
                const wait = (ms) => new Promise((resolve) => setTimeout(resolve, ms));
                const maxAttempts = 3;
                let snap;
                for (let attempt = 1; attempt <= maxAttempts; attempt++) {
                    try {
                        const q = query(
                            collection(db, "trainings"),
                            orderBy("order", "asc"),
                        );
                        snap = await getDocs(q);
                        break;
                    } catch (error) {
                        console.warn(`Load trainings attempt ${attempt}/${maxAttempts} failed:`, error);
                        if (attempt < maxAttempts) {
                            await wait(450 * attempt);
                        } else {
                            if (track) {
                                track.innerHTML = `
                                    <article class="card-dark training-card p-8 text-center w-full">
                                        <p class="text-red-400 uppercase tracking-[0.1em] text-xs mb-3">Nie udało się załadować szkoleń</p>
                                        <button onclick="fetchAll()" class="px-4 py-2 border border-zinc-700 rounded text-zinc-300 hover:border-[#C19A6B] hover:text-[#C19A6B] transition text-xs uppercase tracking-[0.12em]">Spróbuj ponownie</button>
                                    </article>
                                `;
                            }
                            trainingLoopEnabled = false;
                            trainingCarouselAnimating = false;
                            trainingPendingMoves = 0;
                            const prevBtn = document.getElementById('training-carousel-prev');
                            const nextBtn = document.getElementById('training-carousel-next');
                            if (prevBtn) prevBtn.disabled = true;
                            if (nextBtn) nextBtn.disabled = true;
                            return;
                        }
                    }
                }
                trainingItems = [];

                // Sprawdź czy użytkownik jest zalogowany
                const user = auth.currentUser;

                // Pobierz listę dostępów użytkownika (jeśli jest zalogowany)
                let userAccessList = [];
                if (user) {
                    try {
                        const accessRef = collection(db, "trainingAccess");
                        const accessQuery = query(accessRef, where("userId", "==", user.uid));
                        const accessSnap = await getDocs(accessQuery);
                        userAccessList = accessSnap.docs.map(doc => doc.data().trainingId);
                    } catch (error) {
                        console.error("Error loading user access:", error);
                    }
                }

                snap.forEach((d) => {
                    const t = d.data();
                    // Sprawdź czy użytkownik ma dostęp do kursu
                    const isAvailableForAll = t.available === true;
                    const hasUserAccess = user && userAccessList.includes(d.id);
                    const hasAccess = isAvailableForAll || hasUserAccess;

                    trainingItems.push({
                        id: d.id,
                        title: t.title || "",
                        price: t.price || 0,
                        img: t.img || "",
                        hasAccess,
                    });
                });

                renderTrainingCarousel(false);
            };

            window.showTrainingDetails = async (id) => {
                const d = await getDoc(doc(db, "trainings", id));
                const t = d.data();
                
                // Sprawdź dostęp użytkownika
                let user = auth.currentUser;
                let hasAccess = t.available === true;
                const encodedTitle = encodeURIComponent(t.title || "");
                
                if (!hasAccess && user) {
                    const accessRef = collection(db, "trainingAccess");
                    const accessQuery = query(
                        accessRef,
                        where("trainingId", "==", id),
                        where("userId", "==", user.uid)
                    );
                    const accessSnap = await getDocs(accessQuery);
                    hasAccess = !accessSnap.empty;
                }

                // Przygotuj przycisk w zależności od dostępu
                let buttonHtml = '';
                if (hasAccess) {
                    buttonHtml = `<button onclick="window.location.href='https://szkolenia.strzelca.pl/kurs.html?id=${id}'" class="bg-[#C19A6B] text-black px-8 py-4 uppercase text-[10px] font-black rounded tracking-widest shadow-lg hover:bg-[#b18a5f] transition flex items-center justify-center gap-2">
                        <i class="fas fa-play"></i>
                        Rozpocznij kurs
                    </button>`;
                } else {
                    buttonHtml = `<button type="button" id="training-inquiry-btn" disabled onclick="window.handleOfferInquiry(decodeURIComponent('${encodedTitle}'))" class="bg-[#C19A6B] text-black px-8 py-4 uppercase text-[10px] font-black rounded tracking-widest shadow-lg hover:bg-[#b18a5f] transition flex items-center justify-center gap-2 disabled:opacity-40 disabled:cursor-not-allowed disabled:hover:bg-[#C19A6B]">
                        <i class="fas fa-envelope"></i>
                        Zapytaj o ofertę
                    </button>`;
                }

                const regulaminBlock = !hasAccess
                    ? `<div class="mb-5 text-left border-t border-zinc-800 pt-5">
                        <label class="flex gap-3 items-start text-xs text-zinc-400 cursor-pointer select-none">
                            <input type="checkbox" id="training-regulamin-accept" class="mt-1 shrink-0 rounded border-zinc-600 bg-zinc-900 accent-[#C19A6B]" onchange="var b=document.getElementById('training-inquiry-btn');if(b)b.disabled=!this.checked;">
                            <span>Zapoznałem/am się z <a href="https://dokumenty.strzelca.pl#regulamin-szkolen" target="_blank" rel="noopener noreferrer" class="text-[#C19A6B] hover:underline">Regulaminem Szkoleń Strzeleckich</a> i akceptuję jego postanowienia, w tym kary umowne za naruszenie zakazu rozpowszechniania materiałów szkoleniowych.</span>
                        </label>
                    </div>`
                    : "";

                // Pobierz zdjęcia szkolenia
                let images = [];
                if (t.images && Array.isArray(t.images) && t.images.length > 0) {
                    images = t.images.map(img => typeof img === 'string' ? img : img.url);
                } else if (t.img) {
                    images = [t.img];
                }
                
                if (images.length === 0 && t.desc) {
                    const tempDiv = document.createElement('div');
                    tempDiv.innerHTML = t.desc;
                    const imgs = tempDiv.querySelectorAll('img');
                    imgs.forEach(img => {
                        if (img.src && !images.includes(img.src)) {
                            images.push(img.src);
                        }
                    });
                }
                
                let galleryHTML = '';
                if (images.length > 0) {
                    galleryHTML = `
                        <div class="product-gallery" id="product-gallery">
                            <img id="gallery-main-img" src="${images[0]}" alt="${t.title}" />
                            ${images.length > 1 ? `
                                <button class="gallery-nav prev" onclick="changeGalleryImage(-1, ${images.length})" id="gallery-prev" style="opacity: 0.3; cursor: not-allowed;">
                                    <i class="fa-solid fa-chevron-left"></i>
                                </button>
                                <button class="gallery-nav next" onclick="changeGalleryImage(1, ${images.length})" id="gallery-next">
                                    <i class="fa-solid fa-chevron-right"></i>
                                </button>
                                <div class="gallery-counter">
                                    <span id="gallery-current">1</span> / <span id="gallery-total">${images.length}</span>
                                </div>
                            ` : ''}
                        </div>
                    `;
                    
                    window.currentTrainingImages = images;
                    window.currentGalleryIndex = 0;
                    
                    const handleKeyPress = (e) => {
                        if (e.key === 'ArrowLeft' && window.currentGalleryIndex > 0) {
                            changeGalleryImage(-1, images.length);
                        } else if (e.key === 'ArrowRight' && window.currentGalleryIndex < images.length - 1) {
                            changeGalleryImage(1, images.length);
                        }
                    };
                    
                    if (window.galleryKeyHandler) {
                        document.removeEventListener('keydown', window.galleryKeyHandler);
                    }
                    window.galleryKeyHandler = handleKeyPress;
                    document.addEventListener('keydown', handleKeyPress);
                }

                let descriptionHTML = t.desc || '';
                if (descriptionHTML && images.length > 0) {
                    const tempDiv = document.createElement('div');
                    tempDiv.innerHTML = descriptionHTML;
                    const imgs = tempDiv.querySelectorAll('img');
                    imgs.forEach(img => {
                        if (images.includes(img.src)) {
                            img.remove();
                        }
                    });
                    descriptionHTML = tempDiv.innerHTML;
                }

                document.getElementById("details-content").innerHTML = `
                <h2 class="text-3xl font-black uppercase mb-4 font-[Orbitron] text-white">${t.title}</h2>
                ${galleryHTML}
                <div class="text-zinc-400 text-sm mb-8 custom-render details-scroll-area leading-relaxed">
                    ${descriptionHTML}
                </div>
                ${regulaminBlock}
                <div class="flex justify-between items-center border-t border-zinc-800 pt-6">
                    <p class="text-2xl font-bold coyote-text">${t.price} PLN</p>
                    ${buttonHtml}
                </div>`;
                document
                    .getElementById("details-modal")
                    .classList.remove("hidden");
            };

            window.changeGalleryImage = (direction, total) => {
                if (!window.currentTrainingImages || window.currentTrainingImages.length === 0) return;
                
                const newIndex = window.currentGalleryIndex + direction;
                if (newIndex < 0 || newIndex >= total) return;
                
                window.currentGalleryIndex = newIndex;
                const img = document.getElementById('gallery-main-img');
                const counter = document.getElementById('gallery-current');
                
                if (img) img.src = window.currentTrainingImages[window.currentGalleryIndex];
                if (counter) counter.textContent = window.currentGalleryIndex + 1;
                
                const prevBtn = document.getElementById('gallery-prev');
                const nextBtn = document.getElementById('gallery-next');
                if (prevBtn) {
                    if (window.currentGalleryIndex === 0) {
                        prevBtn.style.opacity = '0.3'; prevBtn.style.cursor = 'not-allowed';
                    } else {
                        prevBtn.style.opacity = '1'; prevBtn.style.cursor = 'pointer';
                    }
                }
                if (nextBtn) {
                    if (window.currentGalleryIndex === total - 1) {
                        nextBtn.style.opacity = '0.3'; nextBtn.style.cursor = 'not-allowed';
                    } else {
                        nextBtn.style.opacity = '1'; nextBtn.style.cursor = 'pointer';
                    }
                }
            };

            // Flaga zapobiegająca wielokrotnemu wywołaniu fetchAll()
            let trainingsLoaded = false;

            // Jeden listener dla zmian stanu autoryzacji - aktualizuje UI i odświeża listę szkoleń
            onAuthStateChanged(auth, (user) => {
                currentUser = user;
                updateUserInterface(user);
                if (!trainingsLoaded) {
                    trainingsLoaded = true;
                    fetchAll();
                }
            });

            // Poczekaj na gotowość auth - jeśli onAuthStateChanged nie wywołał się jeszcze, załaduj szkolenia
            try {
                await auth.authStateReady();
                // Jeśli onAuthStateChanged jeszcze się nie wywołał (nie powinno się zdarzyć, ale na wszelki wypadek)
                if (!trainingsLoaded) {
                    trainingsLoaded = true;
                    fetchAll();
                }
            } catch (error) {
                // W przypadku błędu, załaduj szkolenia dla niezalogowanych
                if (!trainingsLoaded) {
                    trainingsLoaded = true;
                    fetchAll();
                }
            }
        </script>
    <script
      type="module"
      src="https://strzelca.pl/auth-widget.mjs?v=2026-02-06-1"
    ></script>
    <script
      type="module"
      src="https://strzelca.pl/messages-widget.mjs?v=2026-02-05-14"
    ></script>
  </body>
