            import { initializeApp, getApps } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";

      async function getFirebaseApiKey() {
        const cachedKey = localStorage.getItem("firebase_web_api_key");
        if (cachedKey) return cachedKey;

        const urls = [
          "https://strzelca.pl/api/firebase-config",
          "/api/firebase-config" // fallback dla lokalnego developmentu
        ];

        for (const url of urls) {
          try {
            const res = await fetch(url, { cache: "force-cache" });
            if (!res.ok) continue;
            const data = await res.json().catch(() => null);
            if (data && typeof data.apiKey === "string" && data.apiKey.length > 10) {
              localStorage.setItem("firebase_web_api_key", data.apiKey);
              return data.apiKey;
            }
          } catch (_) {
            // ignore and try next url
          }
        }

        throw new Error("Nie udało się pobrać FIREBASE_WEB_API_KEY z /api/firebase-config");
      }
const firebaseConfig = {
                apiKey: await getFirebaseApiKey(),
                authDomain: (() => { try { const h = window.location.hostname.toLowerCase().replace(/^www\./, ""); return h === "strzelca.pl" || h.endsWith(".strzelca.pl") ? h : "strzelca-pl.firebaseapp.com"; } catch (_) { return "strzelca-pl.firebaseapp.com"; } })(),
                projectId: "strzelca-pl",
                storageBucket: "strzelca-pl.appspot.com",
                messagingSenderId: "511362047688",
                appId: "1:511362047688:web:9b82c0a4d19c1a3a878ffd",
            };

            // Sprawdź czy aplikacja Firebase już istnieje (np. z auth-widget.mjs lub messages-widget.mjs)
            const existingApps = getApps();
            const app = existingApps.length > 0 ? existingApps[0] : initializeApp(firebaseConfig);
            
            // Inicjalizuj Firestore - jeśli już istnieje, użyj getFirestore
            let db;
            try {
                db = initializeFirestore(app, {
                    experimentalAutoDetectLongPolling: true,
                    useFetchStreams: true,
                });
            } catch {
                // Firestore już zainicjalizowany, użyj istniejącej instancji
                db = getFirestore(app);
            }
            
            const auth = getAuth(app);

            // Ustaw trwałość sesji na browserLocalPersistence dla wszystkich subdomen
            await setPersistence(auth, browserLocalPersistence);

            // SSO między subdomenami: jeśli tu nie ma usera, spróbuj zalogować z cookie (.strzelca.pl)
            try {
                await ensureFirebaseSSO(auth);
            } catch (e) {
                console.warn("SSO ensure failed (ignored):", e?.message || e);
            }

            initNewsletterOptInFromEmptyCarousels({
                auth,
                db,
                doc,
                getDoc,
                setDoc,
                updateDoc,
            });

            void (async () => {
                try {
                    const [{ initActivityTracker }, { initUserStatusMonitor }, { initVisitTracker }] =
                        await Promise.all([
                            import("https://strzelca.pl/activity-tracker.mjs?v=2026-03-23-1"),
                            import("https://strzelca.pl/user-status-monitor.mjs?v=2026-02-06-1"),
                            import("https://strzelca.pl/visit-tracker.mjs?v=2026-03-23-1"),
                        ]);
                    await Promise.all([
                        initActivityTracker(auth, db),
                        initUserStatusMonitor(auth, db),
                        initVisitTracker(auth),
                    ]);
                } catch (error) {
                    console.warn("Could not initialize trackers:", error);
                }
            })();

            let currentUser = null;
            const STRZELCA_ORDERS_API = "https://strzelca.pl/api/orders";
            let regulaminTextCache = null;

            // Funkcja pomocnicza do generowania domyślnego awatara
            function getDefaultAvatar(gender) {
                return '<i class="fa-solid fa-user text-white"></i>';
            }

            // Funkcja rozwijania/zwijania menu użytkownika
            window.toggleUserMenu = () => {
                const userMenu = document.getElementById("user-menu");
                if (userMenu) {

            // Funkcja aktualizacji interfejsu użytkownika
            async function updateUserInterface(user) {
                const loginBtn = document.getElementById("login-button");
                const userPanel = document.getElementById("user-panel");
                const userDisplayName = document.getElementById("user-display-name");
                const userAvatar = document.getElementById("user-avatar");

                }

                    // Pobierz awatar z profilu (cache localStorage → mniej odczytów Firestore)
                    try {

                        const fallbackName = user.displayName || user.email.split("@")[0];

                        if (cached) {
                            if (userDisplayName) {
                                userDisplayName.textContent = cached.displayName || fallbackName;

                                    userAvatar.innerHTML = `<img src="${cached.avatar}" alt="Avatar" class="w-full h-full rounded-full object-cover">`;
                                } else {
                                    userAvatar.innerHTML = getDefaultAvatar(cached.gender);

                        } else {
                            if (userDisplayName) {
                                userDisplayName.textContent = fallbackName;
                            }
                            if (userAvatar) {
                                userAvatar.innerHTML = getDefaultAvatar();
                            }

                            const profileDoc = await getDoc(doc(db, "userProfiles", user.uid));
                            if (profileDoc.exists()) {
                                const userProfile = profileDoc.data();

                                    avatar: userProfile.avatar || "",
                                    gender: userProfile.gender ?? null,
                                    role: userProfile.role || "user",
                                    profileExists: true,

                                if (userProfile.displayName && userDisplayName) {
                                    userDisplayName.textContent = userProfile.displayName;

                                if (userAvatar) {
                                    if (userProfile.avatar) {
                                        userAvatar.innerHTML = `<img src="${userProfile.avatar}" alt="Avatar" class="w-full h-full rounded-full object-cover">`;
                                    } else {
                                        userAvatar.innerHTML = getDefaultAvatar(userProfile.gender);
                                    }
                                }
                            } else {
                                setHeaderProfileCache(user.uid, {
                                    displayName: fallbackName,
                                    avatar: "",
                                    gender: null,
                                    role: "user",
                                    profileExists: false,
                                });
                                if (userAvatar) {
                                    userAvatar.innerHTML = getDefaultAvatar();
                                }

                    } catch (error) {
                        console.error("Error loading user profile:", error);
                        if (userAvatar) {
                            userAvatar.innerHTML = getDefaultAvatar();

                    loginBtn.classList.remove("hidden");

            // Funkcja wylogowania

            // Zamówienie szkolenia — ten sam formularz co w sklepie (bez adresu i paczkomatu), POST /api/orders
            window.handleOfferInquiry = async (trainingId, trainingName, trainingPrice = 0, individualPricing = false) => {
                const detailsModal = document.getElementById("details-modal");
                if (detailsModal && !detailsModal.classList.contains("hidden")) {
                    detailsModal.classList.add("hidden");
                }

                await openOrderInquiryFlow({
                    auth,
                    db,
                    getDoc,
                    doc,

                    itemId: trainingId || "",
                    individualPricing: individualPricing === true,
                });
            };

            let trainingItems = [];
            let trainingCarouselLeftIndex = 0;
            let trainingLoopEnabled = false;
            let trainingCarouselAnimating = false;
            let trainingPendingMoves = 0;
            const TRAINING_CAROUSEL_DURATION_MS = 180;

            function trainingOptionalNumber(v) {
                if (typeof v === "number" && Number.isFinite(v)) return v;
                if (typeof v === "string" && v.trim() !== "") {
                    const n = Number(v);
                    if (Number.isFinite(n)) return n;
                }
                return undefined;
            }

            function trainingImageEntryUrl(entry) {
                if (typeof entry === "string") return entry.trim() || "";
                if (entry && typeof entry === "object" && typeof entry.url === "string") return entry.url.trim() || "";
                return "";
            }

            /** Tak jak w panelu admina: sortuj po `order`, pierwsze zdjęcie z URL = okładka kafelka. */
            function normalizedTrainingImagesList(images, legacyImg) {
                const out = [];
                if (Array.isArray(images) && images.length > 0) {
                    images.forEach((img, idx) => {
                        const url = trainingImageEntryUrl(img);
                        if (!url) return;
                        const o = img && typeof img === "object" && !Array.isArray(img) ? img : null;
                        const order = o && trainingOptionalNumber(o.order);
                        out.push({
                            url,
                            order: order !== undefined ? order : idx,
                            posX: trainingOptionalNumber(o?.posX) ?? 50,
                            posY: trainingOptionalNumber(o?.posY) ?? 50,
                            zoom: trainingOptionalNumber(o?.zoom) ?? 1,
                        });
                    });
                    out.sort((a, b) => a.order - b.order);
                }
                if (out.length === 0 && typeof legacyImg === "string" && legacyImg.trim()) {
                    out.push({ url: legacyImg.trim(), order: 0, posX: 50, posY: 50, zoom: 1 });
                }
                return out;
            }

            function pickTrainingCarouselCover(t) {
                const list = normalizedTrainingImagesList(t.images, t.img);
                const first = list[0];
                if (!first) {
                    return {
                        img: "",
                        imgObjectPosition: null,
                        imgObjectScale: null,
                    };
                }
                return {
                    img: first.url,
                    imgObjectPosition: `${first.posX}% ${first.posY}%`,
                    imgObjectScale: first.zoom,
                };
            }

            function isOrderBlockingStatus(status) {
                return status !== "zakonczone" && status !== "anulowane";
            }

            async function fetchActiveOrderItemIdsByContext(context) {
                if (!currentUser) return new Set();
                try {
                    const idToken = await currentUser.getIdToken();
                    const response = await fetch(`${STRZELCA_ORDERS_API}?scope=mine`, {
                        method: "GET",
                        headers: {
                            Authorization: `Bearer ${idToken}`,
                        },
                        credentials: "include",
                    });
                    const data = await response.json().catch(() => ({}));
                    if (!response.ok || !data?.success || !Array.isArray(data?.data)) {
                        return new Set();
                    }
                    const ids = new Set();
                    data.data.forEach((order) => {
                        if (!order || order.orderContext !== context) return;
                        const orderItemId = String(order.orderItemId || "").trim();
                        const status = String(order.status || "").trim();
                        if (orderItemId && isOrderBlockingStatus(status)) {
                            ids.add(orderItemId);
                        }
                    });
                    return ids;
                } catch (error) {
                    console.warn("Nie udało się pobrać statusów zamówień:", error);
                    return new Set();
                }
            }

            function normalizeTrainingProgressItem(row) {
                const progressPercent = Number.isFinite(row.progressPercent) ? row.progressPercent : 0;
                const isCompleted = progressPercent >= 100;
                const hasStarted = row.hasProgressEntry === true || isCompleted;
                const actionLabel = isCompleted
                    ? "Ukończono"
                    : hasStarted
                      ? "Kontynuuj szkolenie"
                      : "Rozpocznij szkolenie";
                return {
                    ...row,
                    progressPercent,
                    isCompleted,
                    hasStarted,
                    actionLabel,
                };
            }

            function calculateTrainingProgressPercent(progressData, regularLessonsCount, certificateIssued) {
                if (!progressData || regularLessonsCount <= 0) {
                    return certificateIssued ? 100 : 0;
                }

                const finishedSet = new Set((progressData.finishedLessons || progressData.completedLessons || []).filter((id) => id !== 'certificate'));
                const openedSet = new Set((progressData.openedLessons || []).filter((id) => id !== 'certificate'));
                const openedOnlyCount = [...openedSet].filter((id) => !finishedSet.has(id)).length;
                const progressPerLesson = 99 / regularLessonsCount;
                const rawProgress = finishedSet.size * progressPerLesson + openedOnlyCount * progressPerLesson * 0.5 + (certificateIssued ? 1 : 0);
                return Math.max(0, Math.min(100, Math.round(rawProgress)));
            }

            function syncTrainingCarouselDots() {
                const dots = document.getElementById("training-carousel-dots");
                const n = trainingItems.length;
                syncCarouselDotsNav(dots, n, trainingCarouselLeftIndex, (idx) => window.goToTrainingCarousel(idx), trainingLoopEnabled);
            }

            window.goToTrainingCarousel = (idx) => {
                if (!trainingLoopEnabled) return;
                const n = trainingItems.length;
                if (n <= 1 || idx < 0 || idx >= n || idx === trainingCarouselLeftIndex) return;
                const track = document.getElementById("training-track");
                const prevBtn = document.getElementById("training-carousel-prev");
                const nextBtn = document.getElementById("training-carousel-next");
                if (!track || !prevBtn || !nextBtn) return;
                trainingCarouselAnimating = false;
                trainingPendingMoves = 0;
                const ordered = [...trainingItems.slice(idx), ...trainingItems.slice(0, idx)];
                track.innerHTML = ordered.map((item) => buildTrainingCard(item)).join("");
                trainingCarouselLeftIndex = idx;
                track.classList.toggle("carousel-track--single", n === 1);
                const visibleCards = getVisibleTrainingCardsCount();
                trainingLoopEnabled = n > visibleCards;
                prevBtn.disabled = !trainingLoopEnabled;
                nextBtn.disabled = !trainingLoopEnabled;
                track.style.transition = "none";
                track.style.transform = "translateX(0)";
                window.requestAnimationFrame(() => {
                    track.style.transition = `transform ${TRAINING_CAROUSEL_DURATION_MS}ms cubic-bezier(0.22, 0.61, 0.36, 1)`;
                });
                syncTrainingCarouselDots();
            };

            function getVisibleTrainingCardsCount() {
                if (window.innerWidth <= 700) return 1;
                if (window.innerWidth <= 1024) return 2;
                return 3;
            }

            function getTrainingStepWidth() {
                const track = document.getElementById("training-track");
                if (!track) return 0;

                const cards = track.querySelectorAll(".training-card");
                if (cards.length >= 2) {
                    return cards[1].offsetLeft - cards[0].offsetLeft;
                }
                return cards[0] ? cards[0].offsetWidth : 0;
            }

            function buildTrainingCard(item) {
                const encodedTitle = encodeURIComponent(item.title || "");
                const priceLabel = item.individualPricing ? "Cena ustalana indywidualnie" : `${item.price} PLN`;
                const priceAriaLabel = item.individualPricing ? "Cena ustalana indywidualnie" : `Cena: ${item.price} złotych`;
                const imgStyleAttr = (() => {
                    const pos = item.imgObjectPosition;
                    const z = item.imgObjectScale;
                    if (!pos && typeof z !== "number") return "";
                    const origin = pos || "50% 50%";
                    const styles = [];
                    if (pos) styles.push(`object-position:${pos};`);
                    if (typeof z === "number") {
                        styles.push(`transform:scale(${z});transform-origin:${origin};`);
                    }
                    return styles.length ? `style="${styles.join("")}"` : "";
                })();
                const progressPercent = Math.max(0, Math.min(100, item.progressPercent || 0));
                const progressTextClass = item.isCompleted ? 'text-emerald-400' : 'text-zinc-300';
                const cardStateClass = item.isCompleted
                    ? 'border border-emerald-500/70 hover:border-emerald-400/80'
                    : 'hover:border-[#C19A6B]/50';
                const shouldShowProgress = item.hasAccess && (item.hasStarted || item.isCompleted);

                let buttonHtml = "";
                if (item.hasAccess) {
                    if (currentUser) {
                        const buttonTextClass = item.isCompleted ? 'text-white' : 'text-black';
                        buttonHtml = `<button onclick="event.stopPropagation(); window.location.href='https://szkolenia.strzelca.pl/kurs.html?id=${item.id}'" aria-label="${item.actionLabel} ${item.title}" class="w-full py-3 md:py-4 bg-[#C19A6B] ${buttonTextClass} text-[11px] md:text-xs uppercase font-black rounded tracking-[0.12em] flex items-center justify-center hover:bg-[#b18a5f] transition">${item.actionLabel}</button>`;
                    } else {
                        buttonHtml = `<button type="button" disabled aria-label="Szkolenie ${item.title} jest dostępne dla zalogowanych" class="w-full py-3 md:py-4 bg-zinc-700 text-zinc-300 text-[11px] md:text-xs uppercase font-black rounded tracking-[0.12em] flex items-center justify-center cursor-not-allowed">Dla zalogowanych</button>`;
                    }
                } else if (item.hasActiveOrder) {
                    buttonHtml = `<button type="button" disabled aria-label="Szkolenie ${item.title} zostało już zamówione" class="w-full py-3 md:py-4 bg-emerald-600 text-white text-[11px] md:text-xs uppercase font-black rounded tracking-[0.12em] flex items-center justify-center cursor-not-allowed opacity-95">Zamówiono</button>`;
                } else {
                    buttonHtml = `<button onclick="event.stopPropagation(); window.showTrainingDetails('${item.id}')" aria-label="Pokaż szczegóły szkolenia ${item.title}" class="w-full py-3 md:py-4 bg-zinc-600 text-zinc-50 text-[11px] md:text-xs uppercase font-black rounded tracking-[0.12em] flex items-center justify-center hover:bg-zinc-500 transition">${item.detailActionLabel || 'Złóż zamówienie'}</button>`;
                }

                const progressBlockHtml = item.hasAccess
                    ? `
                        <div class="mb-4 min-h-[44px] flex items-center">
                            ${shouldShowProgress ? `
                                <div class="w-full">
                                    <div class="flex items-center justify-between gap-3 mb-2 text-[11px] uppercase tracking-[0.12em] font-bold ${progressTextClass}">
                                        <span>Postęp szkolenia</span>
                                        <span>${progressPercent}%</span>
                                    </div>
                                    <div class="h-2 rounded-full bg-zinc-800 overflow-hidden">
                                        <div class="h-full ${item.isCompleted ? 'bg-emerald-500' : 'bg-[#C19A6B]'} transition-all duration-300" style="width:${progressPercent}%"></div>
                                    </div>
                                </div>
                            ` : '<div class="w-full h-2"></div>'}
                        </div>
                    `
                    : '<div class="mb-4 min-h-[44px]"></div>';

                return `
                    <article onclick="window.showTrainingDetails('${item.id}')" class="card-dark training-card flex flex-col h-full shadow-2xl transition ${cardStateClass} cursor-pointer" role="article">
                        <div class="training-img-container"><img src="${item.img}" alt="${item.title}" loading="lazy" ${imgStyleAttr}></div>
                        <div class="p-4 md:p-6 flex flex-col flex-grow text-center">
                            <h3 class="text-xl md:text-2xl font-black uppercase mb-2 font-[Orbitron] text-white tracking-tight min-h-[3.5rem] md:min-h-[4rem] flex items-center justify-center">${item.title}</h3>
                            <p class="coyote-text font-bold text-lg md:text-xl mb-4 md:mb-5 min-h-[2rem] flex items-center justify-center" aria-label="${priceAriaLabel}">${priceLabel}</p>
                            ${progressBlockHtml}
                            <div class="mt-auto flex flex-col gap-2 md:gap-3">
                                ${buttonHtml}
                            </div>
                        </div>
                    </article>
                `;
            }

            function renderTrainingCarousel(preservePosition = true) {
                const track = document.getElementById("training-track");
                const prevBtn = document.getElementById("training-carousel-prev");
                const nextBtn = document.getElementById("training-carousel-next");
                if (!track || !prevBtn || !nextBtn) return;
                track.classList.remove("carousel-track--status-single");
                trainingCarouselAnimating = false;
                trainingPendingMoves = 0;

                if (trainingItems.length === 0) {
                    track.classList.remove("carousel-track--single");
                    track.innerHTML = buildEmptyCarouselArticleHtml(
                        "card-dark training-card carousel-status-message p-8 w-full",
                    );
                    trainingLoopEnabled = false;
                    trainingCarouselLeftIndex = 0;
                    prevBtn.disabled = true;
                    nextBtn.disabled = true;
                    track.style.transition = "none";
                    track.style.transform = "translateX(0)";
                    syncTrainingCarouselDots();
                    return;
                }

                if (!preservePosition) {
                    trainingCarouselLeftIndex = 0;
                    track.innerHTML = trainingItems.map((item) => buildTrainingCard(item)).join("");
                }
                track.classList.toggle("carousel-track--single", trainingItems.length === 1);
                const visibleCards = getVisibleTrainingCardsCount();
                trainingLoopEnabled = trainingItems.length > visibleCards;
                prevBtn.disabled = !trainingLoopEnabled;
                nextBtn.disabled = !trainingLoopEnabled;
                track.style.transition = "none";
                track.style.transform = "translateX(0)";
                window.requestAnimationFrame(() => {
                    track.style.transition = `transform ${TRAINING_CAROUSEL_DURATION_MS}ms cubic-bezier(0.22, 0.61, 0.36, 1)`;
                });
                syncTrainingCarouselDots();
            }

            function consumeQueuedTrainingMove() {
                if (!trainingLoopEnabled || trainingPendingMoves === 0 || trainingCarouselAnimating) return;
                const nextDir = trainingPendingMoves > 0 ? 1 : -1;
                trainingPendingMoves -= nextDir;
                window.moveTrainingCarousel(nextDir);
            }

            window.moveTrainingCarousel = (direction) => {
                if (!trainingLoopEnabled) return;
                const moveDir = direction > 0 ? 1 : -1;

                if (trainingCarouselAnimating) {
                    trainingPendingMoves += moveDir;
                    trainingPendingMoves = Math.max(-8, Math.min(8, trainingPendingMoves));
                    return;
                }

                const track = document.getElementById("training-track");
                if (!track) return;
                const stepWidth = getTrainingStepWidth();
                if (stepWidth <= 0) return;

                const n = trainingItems.length;

                trainingCarouselAnimating = true;
                let finished = false;
                let fallbackTimer = null;

                const finalizeMove = (afterFinalize) => {
                    if (finished) return;
                    finished = true;
                    if (fallbackTimer) {
                        clearTimeout(fallbackTimer);
                    }
                    if (typeof afterFinalize === "function") {
                        afterFinalize();
                    }
                    trainingCarouselAnimating = false;
                    consumeQueuedTrainingMove();
                };

                if (moveDir > 0) {
                    track.style.transition = `transform ${TRAINING_CAROUSEL_DURATION_MS}ms cubic-bezier(0.22, 0.61, 0.36, 1)`;
                    track.style.transform = `translateX(-${stepWidth}px)`;

                    const onEnd = (event) => {
                        if (event.propertyName && event.propertyName !== "transform") return;
                        track.style.transition = "none";
                        const firstCard = track.firstElementChild;
                        if (firstCard) {
                            track.appendChild(firstCard);
                        }
                        track.style.transform = "translateX(0)";
                        void track.offsetHeight;
                        track.style.transition = `transform ${TRAINING_CAROUSEL_DURATION_MS}ms cubic-bezier(0.22, 0.61, 0.36, 1)`;
                        trainingCarouselLeftIndex = (trainingCarouselLeftIndex + 1) % n;
                        syncTrainingCarouselDots();
                        finalizeMove();
                    };
                    track.addEventListener("transitionend", onEnd, { once: true });
                    fallbackTimer = setTimeout(() => {
                        finalizeMove(() => {
                            track.style.transition = "none";
                            const firstCard = track.firstElementChild;
                            if (firstCard) {
                                track.appendChild(firstCard);
                            }
                            track.style.transform = "translateX(0)";
                            void track.offsetHeight;
                            track.style.transition = `transform ${TRAINING_CAROUSEL_DURATION_MS}ms cubic-bezier(0.22, 0.61, 0.36, 1)`;
                            trainingCarouselLeftIndex = (trainingCarouselLeftIndex + 1) % n;
                            syncTrainingCarouselDots();
                        });
                    }, TRAINING_CAROUSEL_DURATION_MS + 120);
                } else {
                    track.style.transition = "none";
                    const lastCard = track.lastElementChild;
                    if (lastCard) {
                        track.insertBefore(lastCard, track.firstElementChild);
                    }
                    trainingCarouselLeftIndex = (trainingCarouselLeftIndex - 1 + n) % n;
                    syncTrainingCarouselDots();
                    track.style.transform = `translateX(-${stepWidth}px)`;
                    void track.offsetHeight;
                    track.style.transition = `transform ${TRAINING_CAROUSEL_DURATION_MS}ms cubic-bezier(0.22, 0.61, 0.36, 1)`;
                    track.style.transform = "translateX(0)";

                    const onEnd = (event) => {
                        if (event.propertyName && event.propertyName !== "transform") return;
                        finalizeMove();
                    };
                    track.addEventListener("transitionend", onEnd, { once: true });
                    fallbackTimer = setTimeout(() => {
                        finalizeMove();
                    }, TRAINING_CAROUSEL_DURATION_MS + 120);
                }
            };

            window.addEventListener("resize", () => {
                if (trainingItems.length === 0) return;
                renderTrainingCarousel(false);
            });

            const _trainingVp = document.querySelector("#training .carousel-viewport");
            if (_trainingVp) {
                attachHorizontalCarouselSwipe(_trainingVp, {
                    onPrev: () => window.moveTrainingCarousel(-1),
                    onNext: () => window.moveTrainingCarousel(1),
                });
            }

            const fetchAll = async () => {
                const track = document.getElementById("training-track");
                if (track) {
                    track.classList.add("carousel-track--status-single");
                    track.innerHTML = `
                        <article class="card-dark training-card carousel-status-message p-8 w-full">
                            <p class="text-zinc-400 uppercase tracking-[0.15em] text-xs w-full text-center">Ładowanie ...</p>
                        </article>
                    `;
                }
                const wait = (ms) => new Promise((resolve) => setTimeout(resolve, ms));
                const maxAttempts = 3;
                for (let attempt = 1; attempt <= maxAttempts; attempt++) {
                    try {
                        const { payload: trainingRows } = await loadWithVersionCache({
                            db,
                            getDoc,
                            doc,
                            idbKey: "list:trainings",
                            metaDocId: "trainings",
                            fetchFresh: async () => {
                                const q = query(collection(db, "trainings"), orderBy("order", "asc"));
                                const snap = await getDocs(q);
                                const rows = [];
                                snap.forEach((d) => {
                                    const t = d.data();
                                    const cover = pickTrainingCarouselCover(t);
                                    rows.push({

                                        individualPricing: t.individualPricing === true,

                                        imgObjectPosition: cover.imgObjectPosition,
                                        imgObjectScale: cover.imgObjectScale,
                                        available: t.available === true,
                                    });
                                });
                                return rows;
                            },
                        });
                        const user = auth.currentUser;
                        let userAccessList = [];
                        const progressMap = new Map();
                        const certificateSet = new Set();
                        const lessonsCountByTraining = {};
                        if (user) {
                            try {
                                const accessRef = collection(db, "trainingAccess");
                                const accessQuery = query(accessRef, where("userId", "==", user.uid));
                                const progressQuery = query(collection(db, "courseProgress"), where("userId", "==", user.uid));
                                const certificatesQuery = query(collection(db, "publicTrainingCertificates"), where("userId", "==", user.uid));
                                const lessonsQuery = getDocs(collection(db, "courseLessons"));
                                const [accessSnap, progressSnap, certificatesSnap, lessonsSnap] = await Promise.all([
                                    getDocs(accessQuery),
                                    getDocs(progressQuery),
                                    getDocs(certificatesQuery),
                                    lessonsQuery,
                                ]);
                                userAccessList = accessSnap.docs.map((x) => x.data().trainingId);
                                progressSnap.forEach((docSnap) => {
                                    const data = docSnap.data();
                                    if (data?.trainingId) {
                                        progressMap.set(data.trainingId, data);
                                    }
                                });
                                certificatesSnap.forEach((docSnap) => {
                                    const data = docSnap.data();
                                    if (data?.trainingId) {
                                        certificateSet.add(data.trainingId);
                                    }
                                });
                                lessonsSnap.forEach((docSnap) => {
                                    const data = docSnap.data();
                                    if (data?.trainingId) {
                                        lessonsCountByTraining[data.trainingId] = (lessonsCountByTraining[data.trainingId] || 0) + 1;
                                    }
                                });
                            } catch (error) {
                                console.error("Error loading user access:", error);
                            }
                        }
                        const rows = Array.isArray(trainingRows) ? trainingRows : [];
                        const activeOrderIds = await fetchActiveOrderItemIdsByContext("training");
                        trainingItems = rows.map((row, listIndex) => {
                            const hasUserAccess = user && userAccessList.includes(row.id);
                            const hasAccess = row.available === true || hasUserAccess;
                            const progressData = progressMap.get(row.id);
                            const openedLessons = Array.isArray(progressData?.openedLessons) ? progressData.openedLessons : [];
                            const finishedLessons = Array.isArray(progressData?.finishedLessons)
                                ? progressData.finishedLessons
                                : (Array.isArray(progressData?.completedLessons) ? progressData.completedLessons : []);
                            const hasProgressEntry = openedLessons.length > 0 || finishedLessons.length > 0 || certificateSet.has(row.id);
                            return {
                                id: row.id,
                                title: row.title,
                                price: row.price,
                                individualPricing: row.individualPricing === true,
                                img: row.img,
                                imgObjectPosition: row.imgObjectPosition,
                                imgObjectScale: row.imgObjectScale,
                                hasAccess,
                                hasActiveOrder: activeOrderIds.has(row.id),
                                detailActionLabel: user ? "Złóż zamówienie" : "Zapytaj o ofertę",
                                hasProgressEntry,
                                progressPercent: hasAccess
                                    ? calculateTrainingProgressPercent(
                                        progressData,
                                        lessonsCountByTraining[row.id] || 0,
                                        certificateSet.has(row.id),
                                      )
                                    : 0,
                                _adminListIndex: listIndex,
                            };
                        }).map(normalizeTrainingProgressItem);
                        trainingItems.sort((a, b) => {
                            if (a.isCompleted !== b.isCompleted) return a.isCompleted ? 1 : -1;
                            if (a.hasAccess !== b.hasAccess) return a.hasAccess ? -1 : 1;
                            return a._adminListIndex - b._adminListIndex;
                        });
                        trainingItems = trainingItems.map(({ _adminListIndex, ...rest }) => rest);
                        renderTrainingCarousel(false);
                        return;
                    } catch (error) {
                        console.warn(`Load trainings attempt ${attempt}/${maxAttempts} failed:`, error);
                        if (attempt < maxAttempts) {
                            await wait(450 * attempt);
                        } else {
                            if (track) {
                                track.classList.add("carousel-track--status-single");
                                track.innerHTML = `
                                    <article class="card-dark training-card carousel-status-message p-8 w-full">
                                        <div class="flex flex-col items-center justify-center gap-3 w-full">
                                            <p class="text-red-400 uppercase tracking-[0.15em] text-xs text-center">Nie udało się załadować szkoleń</p>
                                            <button type="button" onclick="window.fetchAllTrainings && window.fetchAllTrainings()" class="px-4 py-2 border border-zinc-700 rounded text-zinc-300 hover:border-[#C19A6B] hover:text-[#C19A6B] transition text-xs uppercase tracking-[0.12em]">Spróbuj ponownie</button>
                                        </div>
                                    </article>
                                `;
                            }
                            trainingLoopEnabled = false;
                            trainingCarouselAnimating = false;
                            trainingPendingMoves = 0;
                            const prevBtn = document.getElementById('training-carousel-prev');
                            const nextBtn = document.getElementById('training-carousel-next');
                            if (prevBtn) prevBtn.disabled = true;
                            if (nextBtn) nextBtn.disabled = true;
                            return;
                        }
                    }
                }
            };
            window.fetchAllTrainings = fetchAll;

            window.showTrainingDetails = async (id) => {
                const d = await getDoc(doc(db, "trainings", id));
                const t = d.data();
                const trainingState = trainingItems.find((item) => item.id === id) || null;
                
                // Sprawdź dostęp użytkownika
                let user = auth.currentUser;
                let hasAccess = trainingState ? trainingState.hasAccess : t.available === true;
                const encodedTitle = encodeURIComponent(t.title || "");
                
                if (!hasAccess && user) {
                    const accessRef = collection(db, "trainingAccess");
                    const accessQuery = query(
                        accessRef,
                        where("trainingId", "==", id),
                        where("userId", "==", user.uid)
                    );
                    const accessSnap = await getDocs(accessQuery);
                    hasAccess = !accessSnap.empty;
                }

                // Przygotuj przycisk w zależności od dostępu
                let buttonHtml = '';
                if (hasAccess) {
                    if (user) {
                        const actionLabel = trainingState?.actionLabel || 'Rozpocznij szkolenie';
                        const actionTextClass = trainingState?.isCompleted ? 'text-white' : 'text-black';
                        buttonHtml = `<button onclick="window.location.href='https://szkolenia.strzelca.pl/kurs.html?id=${id}'" class="bg-[#C19A6B] ${actionTextClass} px-8 py-4 uppercase text-[10px] font-black rounded tracking-widest shadow-lg hover:bg-[#b18a5f] transition flex items-center justify-center gap-2">
                            <i class="fas fa-play"></i>
                            ${actionLabel}
                        </button>`;
                    } else {
                        buttonHtml = `<button type="button" disabled class="bg-zinc-700 text-zinc-300 px-8 py-4 uppercase text-[10px] font-black rounded tracking-widest shadow-lg cursor-not-allowed">Dla zalogowanych</button>`;
                    }
                } else if (trainingState?.hasActiveOrder) {
                    buttonHtml = `<button type="button" disabled class="bg-emerald-600 text-white px-8 py-4 uppercase text-[10px] font-black rounded tracking-widest shadow-lg cursor-not-allowed opacity-95">Zamówiono</button>`;
                } else {
                    const isLoggedIn = !!user;
                    const actionLabel = trainingState?.detailActionLabel || (isLoggedIn ? "Złóż zamówienie" : "Zapytaj o ofertę");
                    const actionIcon = isLoggedIn ? "fa-shopping-cart" : "fa-envelope";
                    buttonHtml = `<button type="button" onclick="window.handleOfferInquiry('${id}', decodeURIComponent('${encodedTitle}'), ${t.price || 0}, ${t.individualPricing === true})" class="bg-zinc-600 text-zinc-50 px-8 py-4 uppercase text-[10px] font-black rounded tracking-widest shadow-lg hover:bg-zinc-500 transition flex items-center justify-center gap-2">
                        <i class="fas ${actionIcon}"></i>
                        ${actionLabel}
                    </button>`;
                }

                const regulaminBlock = !hasAccess
                    ? `<div class="mb-5 text-left border-t border-zinc-800 pt-5">
                        <p class="text-xs text-zinc-400 leading-relaxed">
                            Decydując się na zakup szkolenia, akceptujesz
                            <a
                                href="#"
                                onclick="event.preventDefault(); event.stopPropagation(); window.openRegulaminModal()"
                                class="text-coyote hover:underline transition-colors"
                            >regulamin witryny</a>.
                        </p>
                    </div>`
                    : "";

                // Pobierz zdjęcia szkolenia (ta sama kolejność co w adminie: order, potem fallback img)
                let images = normalizedTrainingImagesList(t.images, t.img).map((x) => ({
                    url: x.url,
                    posX: x.posX,
                    posY: x.posY,
                    zoom: x.zoom,
                }));
                
                if (images.length === 0 && t.desc) {
                    const tempDiv = document.createElement('div');
                    tempDiv.innerHTML = t.desc;
                    const imgs = tempDiv.querySelectorAll('img');
                    const imageUrls = [];
                    imgs.forEach(img => {
                        const url = img.src;
                        if (url && !imageUrls.includes(url)) {
                            imageUrls.push(url);
                            images.push({ url });
                        }
                    });
                }

                const getObjectPositionStyleAttr = (meta) => {
                    if (!meta) return '';
                    const posOk = typeof meta.posX === 'number' && typeof meta.posY === 'number';
                    const zoomOk = typeof meta.zoom === 'number';
                    if (!posOk && !zoomOk) return '';
                    const x = posOk ? meta.posX : 50;
                    const y = posOk ? meta.posY : 50;
                    const styles = [
                        posOk ? `object-position:${x}% ${y}%;` : '',
                        zoomOk ? `transform: scale(${meta.zoom}); transform-origin:${x}% ${y}%;` : '',
                    ].filter(Boolean).join('');
                    return `style="${styles}"`;
                };
                
                let galleryHTML = '';
                if (images.length > 0) {
                    galleryHTML = `
                        <div class="product-gallery training-details-gallery" id="product-gallery">
                            <img id="gallery-main-img" src="${images[0].url}" alt="${t.title}" ${getObjectPositionStyleAttr(images[0])} />
                            ${images.length > 1 ? `
                                <button class="gallery-nav prev" onclick="changeGalleryImage(-1, ${images.length})" id="gallery-prev" style="opacity: 0.3; cursor: not-allowed;">
                                    <i class="fa-solid fa-chevron-left"></i>
                                </button>
                                <button class="gallery-nav next" onclick="changeGalleryImage(1, ${images.length})" id="gallery-next">
                                    <i class="fa-solid fa-chevron-right"></i>
                                </button>
                                <div class="gallery-counter">
                                    <span id="gallery-current">1</span> / <span id="gallery-total">${images.length}</span>
                                </div>
                            ` : ''}
                        </div>
                    `;
                    
                    window.currentTrainingImages = images;
                    window.currentGalleryIndex = 0;
                    
                    const handleKeyPress = (e) => {
                        if (e.key === 'ArrowLeft' && window.currentGalleryIndex > 0) {
                            changeGalleryImage(-1, images.length);
                        } else if (e.key === 'ArrowRight' && window.currentGalleryIndex < images.length - 1) {
                            changeGalleryImage(1, images.length);
                        }
                    };
                    
                    if (window.galleryKeyHandler) {
                        document.removeEventListener('keydown', window.galleryKeyHandler);
                    }
                    window.galleryKeyHandler = handleKeyPress;
                    document.addEventListener('keydown', handleKeyPress);
                }

                let descriptionHTML = t.desc || '';
                if (descriptionHTML && images.length > 0) {
                    const tempDiv = document.createElement('div');
                    tempDiv.innerHTML = descriptionHTML;
                    const imageUrls = images.map((i) => i.url).filter(Boolean);
                    const imgs = tempDiv.querySelectorAll('img');
                    imgs.forEach(img => {
                        if (imageUrls.includes(img.src)) {
                            img.remove();
                        }
                    });
                    descriptionHTML = tempDiv.innerHTML;
                }

                document.getElementById("details-content").innerHTML = `
                <h2 class="text-3xl font-black uppercase mb-4 font-[Orbitron] text-white">${t.title}</h2>
                ${galleryHTML}
                <div class="text-zinc-400 text-sm mb-8 custom-render details-scroll-area leading-relaxed">
                    ${descriptionHTML}
                </div>
                ${regulaminBlock}
                <div class="flex justify-between items-center border-t border-zinc-800 pt-6">
                    <p class="text-2xl font-bold coyote-text">${t.individualPricing === true ? 'Cena ustalana indywidualnie' : `${t.price} PLN`}</p>
                    ${buttonHtml}
                </div>`;
                document
                    .getElementById("details-modal")
                    .classList.remove("hidden");
            };

            window.openRegulaminModal = async () => {
                const modal = document.getElementById("regulamin-modal");
                const content = document.getElementById("regulamin-modal-content");
                if (!modal || !content) return;

                modal.classList.remove("hidden");
                content.textContent = "Ładowanie regulaminu...";

                try {
                    if (!regulaminTextCache) {
                        const response = await fetch("https://dokumenty.strzelca.pl/regulamin-witryny.txt", {
                            cache: "no-store",
                        });
                        if (!response.ok) {
                            throw new Error(`HTTP ${response.status}`);
                        }
                        regulaminTextCache = await response.text();
                    }
                    content.textContent = regulaminTextCache || "Brak treści regulaminu.";
                } catch (error) {
                    console.error("Nie udało się wczytać regulaminu:", error);
                    content.textContent = "Nie udało się wczytać regulaminu. Spróbuj ponownie za chwilę.";
                }
            };

            window.changeGalleryImage = (direction, total) => {
                if (!window.currentTrainingImages || window.currentTrainingImages.length === 0) return;
                
                const newIndex = window.currentGalleryIndex + direction;
                if (newIndex < 0 || newIndex >= total) return;
                
                window.currentGalleryIndex = newIndex;
                const img = document.getElementById('gallery-main-img');
                const counter = document.getElementById('gallery-current');
                
                if (img) {
                    const meta = window.currentTrainingImages[window.currentGalleryIndex];
                    img.src = meta?.url || '';
                    if (meta && typeof meta.posX === 'number' && typeof meta.posY === 'number') {
                        img.style.objectPosition = `${meta.posX}% ${meta.posY}%`;
                    } else {
                        img.style.objectPosition = '';
                    }
                    if (meta && typeof meta.zoom === 'number') {
                        const x = typeof meta.posX === 'number' ? meta.posX : 50;
                        const y = typeof meta.posY === 'number' ? meta.posY : 50;
                        img.style.transform = `scale(${meta.zoom})`;
                        img.style.transformOrigin = `${x}% ${y}%`;
                    } else {
                        img.style.transform = '';
                        img.style.transformOrigin = '';
                    }
                }
                if (counter) counter.textContent = window.currentGalleryIndex + 1;
                
                const prevBtn = document.getElementById('gallery-prev');
                const nextBtn = document.getElementById('gallery-next');
                if (prevBtn) {
                    if (window.currentGalleryIndex === 0) {
                        prevBtn.style.opacity = '0.3'; prevBtn.style.cursor = 'not-allowed';
                    } else {
                        prevBtn.style.opacity = '1'; prevBtn.style.cursor = 'pointer';
                    }
                }
                if (nextBtn) {
                    if (window.currentGalleryIndex === total - 1) {
                        nextBtn.style.opacity = '0.3'; nextBtn.style.cursor = 'not-allowed';
                    } else {
                        nextBtn.style.opacity = '1'; nextBtn.style.cursor = 'pointer';
                    }
                }
            };

            // Flaga zapobiegająca wielokrotnemu wywołaniu fetchAll()
            let trainingsLoaded = false;

            // Jeden listener dla zmian stanu autoryzacji - aktualizuje UI i odświeża listę szkoleń
            onAuthStateChanged(auth, (user) => {
                currentUser = user;
                updateUserInterface(user);
                if (!trainingsLoaded) {
                    trainingsLoaded = true;
                    fetchAll();
                } else {
                    fetchAll();
                }
            });

            window.addEventListener("strzelca-order-created", (event) => {
                const orderContext = event?.detail?.context;
                const orderItemId = String(event?.detail?.orderItemId || "").trim();
                const promoApplication = String(event?.detail?.promoApplication || "").trim();
                if (orderContext !== "training" || !orderItemId) return;
                if (promoApplication === "training_access") {
                    return;
                }
                trainingItems = trainingItems.map((item) =>
                    item.id === orderItemId ? { ...item, hasActiveOrder: true } : item
                );
                renderTrainingCarousel(false);
                const detailsModal = document.getElementById("details-modal");
                if (detailsModal && !detailsModal.classList.contains("hidden")) {
                    void window.showTrainingDetails(orderItemId);
                }
            });

            // Poczekaj na gotowość auth - jeśli onAuthStateChanged nie wywołał się jeszcze, załaduj szkolenia
            try {
                await auth.authStateReady();
                // Jeśli onAuthStateChanged jeszcze się nie wywołał (nie powinno się zdarzyć, ale na wszelki wypadek)
                if (!trainingsLoaded) {
                    trainingsLoaded = true;
                    fetchAll();
                }
            } catch (error) {
                // W przypadku błędu, załaduj szkolenia dla niezalogowanych
                if (!trainingsLoaded) {
                    trainingsLoaded = true;
                    fetchAll();
                }
            }
        </script>
    <script
      type="module"
      src="https://strzelca.pl/auth-widget.mjs?v=2026-04-12-2"
    ></script>
    <script
      type="module"
      src="https://strzelca.pl/messages-widget.mjs?v=2026-03-23-1"
    ></script>
    <script type="module" src="https://strzelca.pl/global-search-widget.mjs?v=2026-03-26-1"></script>
  </body>
</html>
