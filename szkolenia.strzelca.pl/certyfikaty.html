    <style>
        :root {
            --coyote: #C19A6B;
            --coyote-dark: #9a7a55;
            --coyote-light: #d4b896;
        }
        html { height: 100%; }
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: #0a0a0a;
            background-image:
                var(--strzelca-bg-vignette),
                linear-gradient(rgba(10,10,10,0.22) 0%, rgba(10,10,10,0.55) 55%, rgba(10,10,10,0.9) 100%),
                url('https://strzelca.pl/tlo.png');
            background-size: cover, cover, cover;
            background-position: center center, top center, top center;
            color: #e5e5e5;
            margin: 0;
            min-height: 100%;
            min-height: 100dvh;
            display: flex;
            flex-direction: column;
        }
        .coyote-text {
            color: var(--coyote);
            font-family: 'Orbitron', sans-serif;
        }
        .cert-list-item {
            position: relative;
            padding: 1.02rem 1.12rem;
            background: rgba(17, 17, 17, 0.72);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 16px;
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
            transition: transform 0.2s ease, border-color 0.2s ease, box-shadow 0.2s ease;
            cursor: pointer;
            text-align: left;
            width: 100%;
        }
        .cert-list-item::before {
            content: '';
            position: absolute;
            inset: 0 auto 0 0;
            width: 3px;
            background: linear-gradient(180deg, rgba(193, 154, 107, 0.22) 0%, rgba(193, 154, 107, 0.75) 52%, rgba(193, 154, 107, 0.2) 100%);
            border-radius: 16px 0 0 16px;
            opacity: 0.65;
        }
        .cert-list-item:hover {
            transform: translateY(-2px);
            border-color: rgba(193, 154, 107, 0.5);
            box-shadow: 0 10px 24px rgba(0, 0, 0, 0.32), 0 0 0 1px rgba(193, 154, 107, 0.18);
        }
        .cert-modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            z-index: 100;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1rem;
        }
        .cert-modal {
            width: 100%;
            max-width: 420px;
            background: rgba(17, 17, 17, 0.92);
            border: 1px solid rgba(193, 154, 107, 0.45);
            border-radius: 18px;
            box-shadow: 0 24px 80px rgba(0, 0, 0, 0.8);
            overflow: hidden;
        }
        #cert-search-input:focus {
            outline: none;
            border-color: #C19A6B;
        }
        /* Jedno „X”: ukryj natywny przycisk czyszczenia przeglądarki (zostaje #cert-search-clear) */
        #cert-search-input::-webkit-search-cancel-button {
            -webkit-appearance: none;
            appearance: none;
        }
    </style>
</head>
<body>
    <nav class="min-h-[73px] border-b border-zinc-900 sticky top-0 bg-black/95 z-50 backdrop-blur-md flex items-center relative w-full py-2 md:py-2.5" role="navigation" aria-label="Nawigacja główna">
        <a href="https://szkolenia.strzelca.pl/" aria-label="Powrót do szkoleń STRZELCA.PL" class="absolute left-4 md:left-8 text-zinc-500 hover:text-white transition text-xl z-[60] top-1/2 -translate-y-1/2">
            <i class="fa-solid fa-arrow-left" aria-hidden="true"></i>
        </a>
        <div class="w-full max-w-4xl mx-auto pl-14 pr-4 md:pl-20 md:pr-8">
            <label for="cert-search-input" class="sr-only">Szukaj po numerze certyfikatu</label>
            <div class="relative flex items-center">
                <i class="fa-solid fa-magnifying-glass absolute left-3 text-zinc-500 pointer-events-none text-sm" aria-hidden="true"></i>
                <input
                    type="search"
                    id="cert-search-input"
                    autocomplete="off"
                    placeholder="Numer lub fragment numeru…"
                    class="w-full bg-zinc-900/90 border border-zinc-700 rounded-lg pl-9 pr-10 py-2.5 text-sm text-white placeholder:text-zinc-500 transition"
                />
                <button type="button" id="cert-search-clear" class="absolute right-2 text-zinc-500 hover:text-white p-1 hidden" aria-label="Wyczyść">
                    <i class="fa-solid fa-times"></i>
                </button>
            </div>
        </div>
    </nav>

    <main class="flex-1 w-full max-w-4xl mx-auto px-4 py-6 pb-16">
        <p id="cert-status" class="text-zinc-500 text-sm text-center mb-4" role="status">Wczytywanie rejestru…</p>
        <div id="cert-list" class="flex flex-col gap-3" aria-live="polite"></div>
    </main>


    <div id="cert-detail-modal" class="cert-modal-overlay hidden" role="dialog" aria-modal="true" aria-labelledby="cert-modal-title" aria-hidden="true">
        <div class="cert-modal">
            <div class="flex items-center justify-between gap-3 px-4 py-3 border-b border-zinc-800 bg-zinc-900/80">
                <h2 id="cert-modal-title" class="text-white font-semibold text-sm md:text-base">Certyfikat</h2>
                <button type="button" id="cert-modal-close" class="text-zinc-400 hover:text-white p-1 rounded-lg" aria-label="Zamknij">
                    <i class="fa-solid fa-times text-lg"></i>
                </button>
            </div>
            <div class="p-4 md:p-5 space-y-4 text-sm">
                <div>
                    <div class="text-[10px] uppercase tracking-wider text-zinc-500 mb-1">Numer certyfikatu</div>
                    <div id="cert-modal-number" class="coyote-text font-mono text-xs leading-relaxed break-all font-semibold"></div>
                </div>
                <div>
                    <div class="text-[10px] uppercase tracking-wider text-zinc-500 mb-1">Nazwa kursu</div>
                    <div id="cert-modal-course" class="text-zinc-200"></div>
                </div>
                <div>
                    <div class="text-[10px] uppercase tracking-wider text-zinc-500 mb-1">Data wystawienia</div>
                    <div id="cert-modal-date" class="text-zinc-200"></div>
                </div>
                <div>
                    <div class="text-[10px] uppercase tracking-wider text-zinc-500 mb-1">Użytkownik</div>
                    <div id="cert-modal-user" class="text-zinc-200"></div>
                </div>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp, getApps } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import {
            initializeFirestore,
            getFirestore,
            collection,
            getDocs,
        } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        async function getFirebaseApiKey() {
            const urls = [
                "https://strzelca.pl/api/firebase-config",
                "/api/firebase-config",
            ];
            for (const url of urls) {
                try {
                    const res = await fetch(url, {
                        cache: "no-store",
                        credentials: url.startsWith("http") ? "omit" : "same-origin",
                    });
                    if (!res.ok) continue;
                    const data = await res.json().catch(() => null);
                    if (data && typeof data.apiKey === "string" && data.apiKey.length > 10) {
                        return data.apiKey;
                    }
                } catch (_) {}
            }
            throw new Error("Nie udało się pobrać FIREBASE_WEB_API_KEY");
        }

        const firebaseConfig = {
            apiKey: await getFirebaseApiKey(),
            authDomain: (() => { try { const h = window.location.hostname.toLowerCase().replace(/^www\./, ""); return h === "strzelca.pl" || h.endsWith(".strzelca.pl") ? h : "strzelca-pl.firebaseapp.com"; } catch (_) { return "strzelca-pl.firebaseapp.com"; } })(),
            projectId: "strzelca-pl",
            storageBucket: "strzelca-pl.appspot.com",
            messagingSenderId: "511362047688",
            appId: "1:511362047688:web:9b82c0a4d19c1a3a878ffd",
        };

        const existingApps = getApps();
        const app = existingApps.length > 0 ? existingApps[0] : initializeApp(firebaseConfig);
        let db;
        try {
            db = initializeFirestore(app, {
                experimentalAutoDetectLongPolling: true,
                useFetchStreams: true,
            });
        } catch {
            db = getFirestore(app);
        }

        const listEl = document.getElementById("cert-list");
        const statusEl = document.getElementById("cert-status");
        const searchInput = document.getElementById("cert-search-input");
        const searchClear = document.getElementById("cert-search-clear");
        const modal = document.getElementById("cert-detail-modal");
        const modalClose = document.getElementById("cert-modal-close");

        /** @type {Array<{id:string,certificateNumber:string,courseTitle:string,recipientName:string,issuedAt:Date|null}>} */
        let allCerts = [];

        function issuedAtToDate(ts) {
            if (!ts) return null;
            if (typeof ts.toDate === "function") return ts.toDate();
            return null;
        }

        function formatPlDate(d) {
            if (!d) return "—";
            return d.toLocaleDateString("pl-PL", { year: "numeric", month: "long", day: "numeric" });
        }

        function renderList(filtered) {
            listEl.innerHTML = "";
            if (!filtered.length) {
                listEl.innerHTML =
                    '<p class="text-zinc-500 text-center text-sm py-8">Brak wpisów dla podanego wyszukiwania.</p>';
                return;
            }
            for (const c of filtered) {
                const btn = document.createElement("button");
                btn.type = "button";
                btn.className = "cert-list-item";
                const dateStr = formatPlDate(c.issuedAt);
                btn.innerHTML = `
                    <div class="font-mono text-xs coyote-text font-semibold break-all pr-2">${escapeHtml(c.certificateNumber)}</div>
                    <div class="text-zinc-300 text-sm mt-2 font-medium">${escapeHtml(c.courseTitle || "—")}</div>
                    <div class="text-zinc-500 text-xs mt-1">${escapeHtml(dateStr)} · ${escapeHtml(c.recipientName || "—")}</div>
                `;
                btn.addEventListener("click", () => openModal(c));
                listEl.appendChild(btn);
            }
        }

        function escapeHtml(s) {
            return String(s)
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;");
        }

        function applyFilter() {
            const q = (searchInput?.value || "").trim().toLowerCase();
            if (searchClear) {
                searchClear.classList.toggle("hidden", !q);
            }
            if (!q) {
                renderList(allCerts);
                return;
            }
            const filtered = allCerts.filter((c) => (c.certificateNumber || "").toLowerCase().includes(q));
            renderList(filtered);
        }

        function openModal(c) {
            document.getElementById("cert-modal-number").textContent = c.certificateNumber || "—";
            document.getElementById("cert-modal-course").textContent = c.courseTitle || "—";
            document.getElementById("cert-modal-date").textContent = formatPlDate(c.issuedAt);
            document.getElementById("cert-modal-user").textContent = c.recipientName || "—";
            modal.classList.remove("hidden");
            modal.setAttribute("aria-hidden", "false");
            document.body.classList.add("overflow-hidden");
            modalClose?.focus();
        }

        function closeModal() {
            modal.classList.add("hidden");
            modal.setAttribute("aria-hidden", "true");
            document.body.classList.remove("overflow-hidden");
        }

        try {
            const snap = await getDocs(collection(db, "publicTrainingCertificates"));
            allCerts = snap.docs.map((d) => {
                const x = d.data();
                return {
                    id: d.id,
                    certificateNumber: x.certificateNumber || "",
                    courseTitle: x.courseTitle || "",
                    recipientName: x.recipientName || "",
                    issuedAt: issuedAtToDate(x.issuedAt),
                };
            });
            allCerts.sort((a, b) => {
                const ta = a.issuedAt ? a.issuedAt.getTime() : 0;
                const tb = b.issuedAt ? b.issuedAt.getTime() : 0;
                return tb - ta;
            });
            statusEl.textContent = allCerts.length ? `Wpisy w rejestrze: ${allCerts.length}` : "Rejestr jest pusty.";
            renderList(allCerts);
        } catch (e) {
            console.error(e);
            statusEl.textContent =
                "Nie udało się wczytać rejestru. Jeśli problem się powtarza, odśwież stronę lub skontaktuj się z administratorem.";
            statusEl.classList.add("text-red-400");
        }

        searchInput?.addEventListener("input", applyFilter);
        searchClear?.addEventListener("click", () => {
            searchInput.value = "";
            applyFilter();
            searchInput.focus();
        });
        modalClose?.addEventListener("click", closeModal);
        modal?.addEventListener("click", (ev) => {
            if (ev.target === modal) closeModal();
        });
        document.addEventListener("keydown", (ev) => {
            if (ev.key === "Escape" && !modal.classList.contains("hidden")) closeModal();
        });
    </script>
</body>
</html>
