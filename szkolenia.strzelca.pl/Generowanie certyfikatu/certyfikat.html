<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <link rel="canonical" href="https://szkolenia.strzelca.pl/Generowanie%20certyfikatu/certyfikat.html" />
  <title>Certyfikat - STRZELCA.PL</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="page-wrap cert-page">
    <div class="certificate">
      <img class="certificate-bg" src="assets/cert-bg.png" alt="" crossorigin="anonymous" />

      <div class="certificate-overlay">
        <div class="certificate-top-logo">
          <img src="assets/cert-logo.png" alt="STRZELCA.PL" crossorigin="anonymous" />
        </div>

        <div class="certificate-stars" aria-hidden="true">★ ★ ★</div>

        <div class="certificate-title">CERTYFIKAT</div>

        <div class="certificate-subtitle">
          Niniejszym potwierdzamy, że
        </div>

        <div class="certificate-name field-line field-line-lg">
          {{USER_NAME}}
        </div>

        <div class="certificate-course-label">
          ukończył(a) kurs
        </div>

        <div class="certificate-course field-line field-line-lg">
          {{COURSE_TITLE}}
        </div>

        <div class="certificate-bottom-row">
          <div class="certificate-meta-box">
            <div class="meta-col">
              <div class="meta-label">NR CERTYFIKATU</div>
              <div class="meta-value meta-value-cert">{{CERTIFICATE_NUMBER}}</div>
            </div>

            <div class="meta-col">
              <div class="meta-label">DATA WYSTAWIENIA</div>
              <div class="meta-value">{{ISSUE_DATE}}</div>
            </div>
          </div>

          <div class="certificate-qr-block">
            <div class="certificate-qr-box">
              <img class="certificate-qr-img" src="{{QR_DATA_URI}}" alt="" width="120" height="120" />
            </div>
            <div class="certificate-qr-caption">ZESKANUJ, ABY ZWERYFIKOWAĆ</div>
          </div>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
