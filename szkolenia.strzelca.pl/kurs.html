        <script type="module">
            import { initializeApp, getApps } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
            import { getAuth, onAuthStateChanged, setPersistence, browserLocalPersistence, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
            import { ensureFirebaseSSO } from "https://strzelca.pl/sso-client.mjs?v=2026-03-29-4";
            import {
                getHeaderProfileFromCache,
                setHeaderProfileCache,
            } from "https://strzelca.pl/header-profile-cache.mjs?v=2026-03-21-1";
            import {
                initializeFirestore,
                getFirestore,
                collection,
                getDocs,
                doc,
                getDoc,
                query,
                orderBy,
                where,
                setDoc,
                serverTimestamp,
                runTransaction,
            } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
            import { openOrderInquiryFlow } from "https://strzelca.pl/order-inquiry-form.mjs?v=2026-04-07-1";

            async function getFirebaseApiKey() {
                // Używamy pełnego URL, bo szkolenia są na subdomenie szkolenia.strzelca.pl
                const urls = [
                    "https://strzelca.pl/api/firebase-config",
                    "/api/firebase-config" // fallback dla lokalnego developmentu
                ];
                for (const url of urls) {
                    try {
                        const res = await fetch(url, { 
                            cache: "no-store",
                            credentials: url.startsWith("http") ? "omit" : "same-origin"
                        });
                        if (!res.ok) continue;
                        const data = await res.json().catch(() => null);
                        if (data && typeof data.apiKey === "string" && data.apiKey.length > 10) {
                            return data.apiKey;
                        }
                    } catch (_) {}
                }
                throw new Error("Nie udało się pobrać FIREBASE_WEB_API_KEY");
            }

            const firebaseConfig = {
                apiKey: await getFirebaseApiKey(),
                authDomain: (() => { try { const h = window.location.hostname.toLowerCase().replace(/^www\./, ""); return h === "strzelca.pl" || h.endsWith(".strzelca.pl") ? "strzelca.pl" : "strzelca-pl.firebaseapp.com"; } catch (_) { return "strzelca-pl.firebaseapp.com"; } })(),
                projectId: "strzelca-pl",
                storageBucket: "strzelca-pl.appspot.com",
                messagingSenderId: "511362047688",
                appId: "1:511362047688:web:9b82c0a4d19c1a3a878ffd",
            };

            // Sprawdź czy aplikacja Firebase już istnieje (np. z auth-widget.mjs lub messages-widget.mjs)
            const existingApps = getApps();
            const app = existingApps.length > 0 ? existingApps[0] : initializeApp(firebaseConfig);
            
            // Inicjalizuj Firestore - jeśli już istnieje, użyj getFirestore
            let db;
            try {
                db = initializeFirestore(app, {
                    experimentalAutoDetectLongPolling: true,
                    useFetchStreams: true,
                });
            } catch {
                // Firestore już zainicjalizowany, użyj istniejącej instancji
                db = getFirestore(app);
            }
            
            const auth = getAuth(app);
            await setPersistence(auth, browserLocalPersistence);

            try {
                await ensureFirebaseSSO(auth);
            } catch (e) {
                console.warn("SSO ensure failed:", e?.message || e);
            }

            let currentUser = null;
            let currentTrainingId = null;
            let lessons = [];
            let completedLessons = new Set();
            let openedLessons = new Set(); // Lekcje które zostały otwarte (50% progresu)
            let finishedLessons = new Set(); // Lekcje które zostały zakończone (100% progresu)
            let certificateIssued = false;
            let currentLessonIndex = 0;
            let trainingTitle = "";
            let guestOrderPromptShown = false;
            /** Nazwa na certyfikat — ustawiana przy pierwszym rozwiązaniu (unika podwójnego getDoc userProfiles: ekran + „Pobierz”). */
            let lastCertificateRecipientName = null;

            async function resolveRecipientNameForCertificate() {
                if (!currentUser) return "";
                if (lastCertificateRecipientName) return lastCertificateRecipientName;

                const cached = getHeaderProfileFromCache(currentUser.uid);
                if (cached?.displayName?.trim()) {
                    lastCertificateRecipientName = cached.displayName.trim();
                    return lastCertificateRecipientName;
                }

                const profileDoc = await getDoc(doc(db, "userProfiles", currentUser.uid));
                const profile = profileDoc.exists() ? profileDoc.data() : {};
                const userName =
                    profile.displayName ||
                    `${profile.firstName || ""} ${profile.lastName || ""}`.trim() ||
                    (currentUser.displayName || "").trim() ||
                    currentUser.email.split("@")[0];
                lastCertificateRecipientName = userName;
                return userName;
            }

            // Funkcje UI
            window.toggleUserMenu = () => {
                const menu = document.getElementById("user-menu");
                if (menu) menu.classList.toggle("hidden");
            };

            window.logout = async () => {
                const { logoutWithSSO } = await import("https://strzelca.pl/sso-client.mjs?v=2026-04-12-3");
                await logoutWithSSO(auth);
                window.location.href = "index.html";
            };

            async function updateUserInterface(user) {
                const loginBtn = document.getElementById("login-button");
                const userPanel = document.getElementById("user-panel");
                const userDisplayName = document.getElementById("user-display-name");
                const userAvatar = document.getElementById("user-avatar");
                const fallbackName = user ? user.displayName || user.email.split("@")[0] : "";

                if (user) {
                    if (loginBtn) loginBtn.classList.add("hidden");
                    if (userPanel) userPanel.classList.remove("hidden");
                    try {
                        const cached = getHeaderProfileFromCache(user.uid);
                        if (cached) {
                            if (userDisplayName) {
                                userDisplayName.textContent = cached.displayName || fallbackName;
                            }
                            if (userAvatar) {
                                if (cached.avatar) {
                                    userAvatar.innerHTML = `<img src="${cached.avatar}" alt="Avatar" class="w-full h-full rounded-full object-cover">`;
                                } else {
                                    userAvatar.innerHTML = '<i class="fa-solid fa-user text-white"></i>';
                                }
                            }
                        } else {
                            if (userDisplayName) userDisplayName.textContent = fallbackName;
                            if (userAvatar) userAvatar.innerHTML = '<i class="fa-solid fa-user text-white"></i>';

                            const profileDoc = await getDoc(doc(db, "userProfiles", user.uid));
                            if (profileDoc.exists()) {
                                const profile = profileDoc.data();
                                setHeaderProfileCache(user.uid, {
                                    displayName: profile.displayName || "",
                                    avatar: profile.avatar || "",
                                    gender: profile.gender ?? null,
                                    role: profile.role || "user",
                                    profileExists: true,
                                });
                                if (userDisplayName) {
                                    userDisplayName.textContent = profile.displayName || fallbackName;
                                }
                                if (userAvatar) {
                                    if (profile.avatar) {
                                        userAvatar.innerHTML = `<img src="${profile.avatar}" alt="Avatar" class="w-full h-full rounded-full object-cover">`;
                                    } else {
                                        userAvatar.innerHTML = '<i class="fa-solid fa-user text-white"></i>';
                                    }
                                }
                            } else {
                                setHeaderProfileCache(user.uid, {
                                    displayName: fallbackName,
                                    avatar: "",
                                    gender: null,
                                    role: "user",
                                    profileExists: false,
                                });
                            }
                        }
                    } catch (_) {
                        if (userDisplayName) userDisplayName.textContent = fallbackName;
                    }
                } else {
                    lastCertificateRecipientName = null;
                    if (loginBtn) loginBtn.classList.remove("hidden");
                    if (userPanel) userPanel.classList.add("hidden");
                }
            }

            // Pobierz ID kursu z URL
            const urlParams = new URLSearchParams(window.location.search);
            currentTrainingId = urlParams.get('id');

            if (!currentTrainingId) {
                document.body.innerHTML = '<div class="container mx-auto px-6 py-20 text-center"><h1 class="text-2xl font-bold text-red-400 mb-4">Błąd</h1><p class="text-zinc-400">Nie podano ID kursu.</p><a href="index.html" class="text-coyote hover:underline mt-4 inline-block">Powrót do szkoleń</a></div>';
            } else {
                // Sprawdź dostęp i załaduj kurs
                onAuthStateChanged(auth, async (user) => {
                    currentUser = user;
                    await updateUserInterface(user);
                    
                    if (user) {
                        guestOrderPromptShown = false;
                        await checkAccessAndLoadCourse();
                    } else {
                        if (!guestOrderPromptShown) {
                            guestOrderPromptShown = true;
                            let rawTitle = "Wybrane szkolenie";
                            try {
                                const trainingDoc = await getDoc(doc(db, "trainings", currentTrainingId));
                                if (trainingDoc.exists()) {
                                    rawTitle = trainingDoc.data()?.title || rawTitle;
                                }
                            } catch (_) {}
                            await openOrderInquiryFlow({
                                auth,
                                db,
                                getDoc,
                                doc,
                                context: "training",
                                rawTitle,
                                price: 0,
                                itemId: currentTrainingId || "",
                                individualPricing: true,
                            });
                        }
                    }
                });
            }

            function trainingRegulaminStorageKey() {
                return `strzelca_training_regulamin_v1_${currentTrainingId}_${currentUser.uid}`;
            }

            function showCourseRegulaminModal(onAccept) {
                const modal = document.getElementById("course-regulamin-modal");
                const btn = document.getElementById("course-regulamin-accept-btn");
                if (!modal || !btn) {
                    onAccept();
                    return;
                }
                modal.classList.remove("hidden");
                document.body.classList.add("overflow-hidden");
                btn.onclick = () => {
                    modal.classList.add("hidden");
                    document.body.classList.remove("overflow-hidden");
                    btn.onclick = null;
                    onAccept();
                };
            }

            async function applyCourseLoadedState(training) {
                trainingTitle = training.title || "Kurs";
                document.getElementById("course-title").textContent = trainingTitle;
                await loadLessons();
                await loadProgress();
            }

            async function checkAccessAndLoadCourse() {
                try {
                    // Sprawdź dostęp użytkownika
                    const trainingDoc = await getDoc(doc(db, "trainings", currentTrainingId));
                    if (!trainingDoc.exists()) {
                        showError("Kurs nie istnieje.");
                        return;
                    }

                    const training = trainingDoc.data();
                    const isAvailableForAll = training.available === true;
                    
                    let hasAccess = isAvailableForAll;
                    if (!hasAccess && currentUser) {
                        const accessRef = collection(db, "trainingAccess");
                        const accessQuery = query(
                            accessRef,
                            where("trainingId", "==", currentTrainingId),
                            where("userId", "==", currentUser.uid)
                        );
                        const accessSnap = await getDocs(accessQuery);
                        hasAccess = !accessSnap.empty;
                    }

                    if (!hasAccess) {
                        showError("Nie masz dostępu do tego kursu.");
                        return;
                    }

                    const regulaminKey = trainingRegulaminStorageKey();
                    if (!localStorage.getItem(regulaminKey)) {
                        showCourseRegulaminModal(() => {
                            localStorage.setItem(regulaminKey, "1");
                            applyCourseLoadedState(training).catch((err) => {
                                console.error("Error loading course after regulamin:", err);
                                showError("Błąd ładowania kursu.");
                            });
                        });
                        return;
                    }

                    await applyCourseLoadedState(training);
                } catch (error) {
                    console.error("Error checking access:", error);
                    showError("Błąd podczas sprawdzania dostępu.");
                }
            }

            async function loadLessons() {
                try {
                    const lessonsRef = collection(db, "courseLessons");
                    const lessonsQuery = query(
                        lessonsRef,
                        where("trainingId", "==", currentTrainingId),
                        orderBy("order", "asc")
                    );
                    const snapshot = await getDocs(lessonsQuery);
                    
                    lessons = snapshot.docs.map(doc => ({
                        id: doc.id,
                        ...doc.data()
                    }));

                    renderLessonsSidebar();
                    if (lessons.length > 0) {
                        loadLesson(0);
                    } else {
                        document.getElementById("lesson-content-area").innerHTML = '<div class="text-center text-zinc-500 py-12"><i class="fa-solid fa-book-open text-4xl mb-4"></i><p>Ten kurs nie ma jeszcze lekcji.</p></div>';
                    }
                } catch (error) {
                    console.error("Error loading lessons:", error);
                    showError("Błąd ładowania lekcji.");
                }
            }

            function renderLessonsSidebar() {
                const sidebar = document.getElementById("lessons-sidebar");
                if (!sidebar) return;

                if (lessons.length === 0) {
                    sidebar.innerHTML = '<div class="text-sm text-zinc-500 text-center py-4">Brak lekcji</div>';
                    return;
                }

                sidebar.innerHTML = lessons.map((lesson, index) => {
                    const isFinished = finishedLessons.has(lesson.id);
                    const isOpened = openedLessons.has(lesson.id) || isFinished;
                    const isActive = index === currentLessonIndex;
                    const isCertificate = lesson.id === 'certificate';
                    
                    return `
                        <div class="flex items-center gap-3 p-3 rounded-lg cursor-pointer transition-all ${isActive ? 'bg-coyote/30 border-2 border-coyote shadow-lg' : 'hover:bg-zinc-800/50 border-2 border-transparent'} ${isFinished ? '' : ''}" 
                             onclick="${isCertificate ? 'downloadCertificate()' : `loadLesson(${index})`}">
                            <div class="flex-shrink-0 w-8 h-8 rounded-full flex items-center justify-center text-xs font-bold ${isFinished ? 'bg-green-600 text-white shadow-md' : isOpened ? 'bg-yellow-500 text-black shadow-md' : isActive ? 'bg-coyote text-black shadow-md' : 'bg-zinc-700 text-zinc-300'}"}>
                                ${isFinished ? '<i class="fa-solid fa-check text-sm"></i>' : isOpened ? '<i class="fa-solid fa-circle-half-stroke text-xs"></i>' : isCertificate ? '<i class="fa-solid fa-certificate text-sm"></i>' : index + 1}
                            </div>
                            <div class="flex-1 min-w-0">
                                <div class="text-sm font-medium truncate ${isActive ? 'text-coyote' : 'text-white'}">${lesson.title || "Bez tytułu"}</div>
                            </div>
                            ${isCertificate ? '<i class="fa-solid fa-download text-coyote text-xs flex-shrink-0"></i>' : ''}
                        </div>
                    `;
                }).join("");
            }

            window.loadLesson = async (index) => {
                if (index < 0 || index >= lessons.length) return;
                
                currentLessonIndex = index;
                const lesson = lessons[index];
                
                // Jeśli to certyfikat, pokaż go
                if (lesson.id === 'certificate') {
                    await showCertificate();
                    return;
                }
                
                // Oznacz lekcję jako otwartą (50% progresu)
                if (currentUser && !openedLessons.has(lesson.id)) {
                    await markLessonOpened(lesson.id);
                    await updateProgress(); // Zaktualizuj postęp po oznaczeniu jako otwarta
                }

                // Renderuj treść lekcji
                const contentArea = document.getElementById("lesson-content-area");
                if (!contentArea) return;

                const isFinished = finishedLessons.has(lesson.id);
                const isLastLesson = index === lessons.length - 1;
                const allLessonsFinished = lessons.filter(l => l.id !== 'certificate').every(l => finishedLessons.has(l.id));

                contentArea.innerHTML = `
                    <div class="mb-8 pb-6 border-b border-zinc-800/50 relative">
                        <div class="absolute top-0 left-0 w-1 h-full bg-gradient-to-b from-coyote to-transparent rounded-full"></div>
                        <h2 class="text-3xl md:text-4xl lg:text-5xl font-bold mb-2 coyote-text font-[Orbitron] drop-shadow-lg pl-4">${lesson.title || "Bez tytułu"}</h2>
                    </div>
                    <div class="lesson-content custom-render mb-10 text-zinc-300 leading-relaxed prose prose-invert max-w-none">
                        ${lesson.content || '<p class="text-zinc-500">Brak treści.</p>'}
                    </div>
                    ${!isFinished && lesson.id !== 'certificate' ? `
                        <div class="mt-12 pt-8 border-t border-zinc-800/50 relative overflow-hidden rounded-xl">
                            <div class="absolute inset-0 bg-gradient-to-r from-coyote/10 via-transparent to-coyote/10"></div>
                            <button 
                                onclick="finishLesson('${lesson.id}', ${index})" 
                                class="relative w-full px-8 py-5 bg-gradient-to-r from-coyote via-[#b18a5f] to-coyote text-white rounded-xl font-bold hover:from-[#b18a5f] hover:via-coyote hover:to-[#b18a5f] transition-all text-lg shadow-2xl hover:shadow-coyote/50 transform hover:scale-[1.02] flex items-center justify-center gap-3 group"
                            >
                                <i class="fa-solid fa-check-circle text-xl group-hover:scale-110 transition-transform"></i>
                                <span class="text-lg">Zakończ lekcję</span>
                            </button>
                        </div>
                    ` : ''}
                    <div class="flex justify-between items-center mt-8 pt-6 border-t border-zinc-800/50">
                        <button 
                            onclick="loadLesson(${index - 1})" 
                            class="px-6 py-3 border border-zinc-700/50 bg-zinc-900/30 text-zinc-300 rounded-lg hover:bg-zinc-800/50 hover:border-zinc-600 hover:text-white transition-all font-medium backdrop-blur-sm ${index === 0 ? 'opacity-50 cursor-not-allowed' : ''}"
                            ${index === 0 ? 'disabled' : ''}
                        >
                            <i class="fa-solid fa-arrow-left mr-2"></i>Poprzednia
                        </button>
                        ${!isLastLesson && lesson.id !== 'certificate' ? `
                            <button 
                                onclick="loadLesson(${index + 1})" 
                                class="px-6 py-3 bg-gradient-to-r from-coyote to-[#b18a5f] text-white rounded-lg font-bold hover:from-[#b18a5f] hover:to-coyote hover:shadow-lg transition-all shadow-md"
                            >
                                Następna<i class="fa-solid fa-arrow-right ml-2"></i>
                            </button>
                        ` : ''}
                        ${lesson.id === 'certificate' ? `
                            <button 
                                onclick="generateCertificate()" 
                                class="px-6 py-3 bg-gradient-to-r from-coyote via-[#b18a5f] to-coyote text-white rounded-lg font-bold hover:from-[#b18a5f] hover:via-coyote hover:to-[#b18a5f] transition-all shadow-lg hover:shadow-xl"
                            >
                                <i class="fa-solid fa-download mr-2"></i>Pobierz Certyfikat
                            </button>
                        ` : ''}
                    </div>
                `;

                await updateProgress();
                
                // Odśwież panel lekcji po zakończeniu wszystkich aktualizacji stanu
                renderLessonsSidebar();
                
                // Jeśli wszystkie lekcje są zakończone, pokaż certyfikat
                if (allLessonsFinished && !lessons.find(l => l.id === 'certificate')) {
                    await addCertificateLesson();
                }
            };
            
            async function showCertificate() {
                const contentArea = document.getElementById("lesson-content-area");
                if (!contentArea || !currentUser) return;

                await resolveRecipientNameForCertificate();

                contentArea.innerHTML = `
                    <div class="text-center py-12">
                        <div class="mb-8">
                            <i class="fa-solid fa-certificate text-6xl text-coyote mb-4"></i>
                            <h2 class="text-3xl md:text-4xl font-bold mb-4">Certyfikat ukończenia</h2>
                            <p class="text-xl text-zinc-400 mb-8">Gratulacje! Ukończyłeś kurs</p>
                        </div>
                        <button 
                            onclick="downloadCertificate()" 
                            class="px-8 py-4 rounded-lg font-bold transition text-lg border-2 border-[var(--coyote)] text-[var(--coyote)] bg-zinc-950/60 hover:bg-[rgba(193,154,107,0.12)] backdrop-blur-sm"
                        >
                            <i class="fa-solid fa-download mr-2"></i>Pobierz certyfikat
                        </button>
                    </div>
                `;
            }
            
            window.downloadCertificate = async () => {
                if (!currentUser) return;

                try {
                    const userName = await resolveRecipientNameForCertificate();
                    await generateCertificate(userName);
                } catch (error) {
                    console.error("Error downloading certificate:", error);
                    const code = error?.code || "";
                    const msg = String(error?.message || "");
                    if (code === "resource-exhausted" || msg.includes("Quota") || msg.includes("RESOURCE_EXHAUSTED")) {
                        alert(
                            "Baza danych chwilowo odrzuca zapytania (limit zapytań / quota Firestore). Spróbuj za kilka minut. Jeśli komunikat się powtarza, sprawdź limity projektu w konsoli Firebase (ew. plan Blaze) lub skontaktuj się z administratorem."
                        );
                    } else {
                        alert("Błąd podczas generowania certyfikatu.");
                    }
                }
            };

            /** Fragment kursu do numeru certyfikatu (tylko A–Z, 0–9, _) — zgodnie z regułami Firestore. */
            function courseSlugFromTitle(title) {
                let t = (title || "KURS").trim().toUpperCase();
                t = t.normalize("NFD").replace(/\p{M}/gu, "");
                t = t.replace(/Ł/g, "L").replace(/ł/g, "L");
                t = t.replace(/[^A-Z0-9]+/g, "_").replace(/^_+|_+$/g, "");
                return (t || "KURS").slice(0, 100);
            }

            /** Rejestracja w Firestore + stały numer dla użytkownika i kursu. */
            async function ensureCertificateIssued(recipientName) {
                const certId = `${currentTrainingId}_${currentUser.uid}`;
                const certRef = doc(db, "publicTrainingCertificates", certId);
                const existing = await getDoc(certRef);
                if (existing.exists()) {
                    const d = existing.data();
                    return {
                        certificateNumber: d.certificateNumber,
                        issuedAtDate: d.issuedAt?.toDate?.() || new Date(),
                    };
                }
                const courseSlug = courseSlugFromTitle(trainingTitle);
                const counterRef = doc(db, "trainingCertificateCounters", currentTrainingId);
                let issuedNumber = null;
                await runTransaction(db, async (tx) => {
                    issuedNumber = null;
                    const cSnap = await tx.get(certRef);
                    if (cSnap.exists()) return;
                    const counterSnap = await tx.get(counterRef);
                    const last = counterSnap.exists() ? (counterSnap.data().lastSerial || 0) : 0;
                    const serial = last + 1;
                    const certificateNumber = `STRZELCA.PL/${courseSlug}/${serial}`;
                    issuedNumber = certificateNumber;
                    tx.set(counterRef, { lastSerial: serial }, { merge: true });
                    tx.set(certRef, {
                        certificateNumber,
                        courseSlug,
                        courseTitle: trainingTitle,
                        serialNumber: serial,
                        trainingId: currentTrainingId,
                        recipientName,
                        userId: currentUser.uid,
                        issuedAt: serverTimestamp(),
                    });
                });
                if (issuedNumber) {
                    return {
                        certificateNumber: issuedNumber,
                        issuedAtDate: new Date(),
                    };
                }
                const snap = await getDoc(certRef);
                if (!snap.exists()) throw new Error("Brak rekordu certyfikatu po zapisie");
                const d = snap.data();
                return {
                    certificateNumber: d.certificateNumber,
                    issuedAtDate: d.issuedAt?.toDate?.() || new Date(),
                };
            }

            function escapeCertHtml(s) {
                return String(s)
                    .replace(/&/g, "&amp;")
                    .replace(/</g, "&lt;")
                    .replace(/>/g, "&gt;")
                    .replace(/"/g, "&quot;");
            }

            function waitImages(root) {
                const imgs = [...root.querySelectorAll("img")];
                return Promise.all(
                    imgs.map((img) =>
                        img.complete
                            ? Promise.resolve()
                            : new Promise((res) => {
                                  img.onload = img.onerror = res;
                              })
                    )
                );
            }

            /** PNG z szablonu HTML + tła (Generowanie certyfikatu/). */
            async function generateCertificate(userName) {
                const { certificateNumber, issuedAtDate } = await ensureCertificateIssued(userName);
                const baseUrl = new URL("Generowanie certyfikatu/", window.location.href).href;
                const tplUrl = new URL("certyfikat.html", baseUrl).href;
                const res = await fetch(tplUrl, { cache: "no-store" });
                if (!res.ok) throw new Error("Nie udało się wczytać szablonu certyfikatu");
                let html = await res.text();
                html = html.replace(/href="styles\.css"/i, `href="${baseUrl}styles.css"`);
                html = html.replace(/src="assets\//g, `src="${baseUrl}assets/`);

                const verifyUrl = new URL("certyfikaty.html", window.location.href).href;
                const { default: QRCode } = await import("https://esm.sh/qrcode@1.5.3");
                const qrDataUrl = await QRCode.toDataURL(verifyUrl, {
                    width: 240,
                    margin: 1,
                    color: { dark: "#1a1510", light: "#ffffff" },
                });
                const dateStr = issuedAtDate.toLocaleDateString("pl-PL", {
                    year: "numeric",
                    month: "long",
                    day: "numeric",
                });
                html = html
                    .replace(/\{\{USER_NAME\}\}/g, escapeCertHtml(userName))
                    .replace(/\{\{COURSE_TITLE\}\}/g, escapeCertHtml(trainingTitle))
                    .replace(/\{\{CERTIFICATE_NUMBER\}\}/g, escapeCertHtml(certificateNumber))
                    .replace(/\{\{ISSUE_DATE\}\}/g, escapeCertHtml(dateStr))
                    .replace(/\{\{QR_DATA_URI\}\}/g, qrDataUrl);

                const parsed = new DOMParser().parseFromString(html, "text/html");
                const linkEl = parsed.querySelector('link[rel="stylesheet"]');
                let appendedLink = null;
                if (linkEl?.href) {
                    appendedLink = linkEl.cloneNode(true);
                    document.head.appendChild(appendedLink);
                }
                const wrap = parsed.querySelector(".page-wrap.cert-page");
                if (!wrap) throw new Error("Nieprawidłowy szablon certyfikatu");

                const mount = document.createElement("div");
                mount.id = "strzelca-cert-temp-export";
                mount.setAttribute("aria-hidden", "true");
                mount.style.cssText =
                    "position:fixed;left:-20000px;top:0;width:auto;height:auto;overflow:hidden;opacity:0;pointer-events:none;";
                mount.appendChild(wrap);
                document.body.appendChild(mount);

                try {
                    const fontWait =
                        typeof document.fonts !== "undefined" && document.fonts.ready
                            ? document.fonts.ready.catch(() => {})
                            : Promise.resolve();
                    await Promise.all([
                        fontWait,
                        waitImages(mount),
                        new Promise((r) => requestAnimationFrame(() => requestAnimationFrame(r))),
                    ]);
                    const { default: html2canvas } = await import("https://esm.sh/html2canvas@1.4.1?target=es2022");
                    const certEl = mount.querySelector(".certificate");
                    if (!certEl) throw new Error("Brak .certificate w szablonie");
                    const canvas = await html2canvas(certEl, {
                        scale: 2,
                        useCORS: true,
                        allowTaint: false,
                        backgroundColor: null,
                        logging: false,
                    });
                    canvas.toBlob((blob) => {
                        if (!blob) return;
                        const url = URL.createObjectURL(blob);
                        const a = document.createElement("a");
                        a.href = url;
                        a.download = `Certyfikat_${trainingTitle.replace(/[^a-z0-9]/gi, "_")}_${userName.replace(/[^a-z0-9]/gi, "_")}.png`;
                        document.body.appendChild(a);
                        a.click();
                        document.body.removeChild(a);
                        URL.revokeObjectURL(url);
                    }, "image/png");
                } finally {
                    mount.remove();
                    if (appendedLink?.parentNode) appendedLink.remove();
                }

                certificateIssued = true;
                finishedLessons.add('certificate');
                await updateProgress();
                renderLessonsSidebar();
            }

            window.generateCertificate = window.downloadCertificate;
            
            window.finishLesson = async (lessonId, index) => {
                if (!currentUser) return;
                
                if (!finishedLessons.has(lessonId)) {
                    await markLessonFinished(lessonId);
                    finishedLessons.add(lessonId);
                    await updateProgress();
                    
                    // Sprawdź czy wszystkie lekcje są zakończone (bez certyfikatu)
                    const regularLessons = lessons.filter(l => l.id !== 'certificate');
                    const allFinished = regularLessons.every(l => finishedLessons.has(l.id));
                    
                    if (allFinished && !lessons.find(l => l.id === 'certificate')) {
                        await addCertificateLesson();
                    }
                    
                    renderLessonsSidebar();
                    
                    // Przeładuj aktualną lekcję aby pokazać zaktualizowany stan
                    await loadLesson(index);
                }
            };
            
            async function addCertificateLesson() {
                lessons.push({
                    id: 'certificate',
                    title: 'Certyfikat',
                    content: '',
                    order: lessons.length
                });
                renderLessonsSidebar();
            }

            async function markLessonOpened(lessonId) {
                if (!currentUser || lessonId === 'certificate') return;
                
                try {
                    const progressRef = doc(db, "courseProgress", `${currentUser.uid}_${currentTrainingId}`);
                    const progressSnap = await getDoc(progressRef);
                    
                    let opened = [];
                    if (progressSnap.exists()) {
                        opened = progressSnap.data().openedLessons || [];
                    }
                    
                    if (!opened.includes(lessonId)) {
                        opened.push(lessonId);
                        await setDoc(progressRef, {
                            userId: currentUser.uid,
                            trainingId: currentTrainingId,
                            openedLessons: opened,
                            lastUpdated: serverTimestamp()
                        }, { merge: true });
                        
                        openedLessons.add(lessonId);
                    }
                } catch (error) {
                    console.error("Error marking lesson opened:", error);
                }
            }
            
            async function markLessonFinished(lessonId) {
                if (!currentUser || lessonId === 'certificate') return;
                
                try {
                    const progressRef = doc(db, "courseProgress", `${currentUser.uid}_${currentTrainingId}`);
                    const progressSnap = await getDoc(progressRef);
                    
                    let finished = [];
                    if (progressSnap.exists()) {
                        finished = progressSnap.data().finishedLessons || [];
                    }
                    
                    if (!finished.includes(lessonId)) {
                        finished.push(lessonId);
                        await setDoc(progressRef, {
                            userId: currentUser.uid,
                            trainingId: currentTrainingId,
                            finishedLessons: finished,
                            lastUpdated: serverTimestamp()
                        }, { merge: true });
                        
                        finishedLessons.add(lessonId);
                    }
                } catch (error) {
                    console.error("Error marking lesson finished:", error);
                }
            }

            async function syncCertificateProgressState() {
                if (!currentUser) return;
                try {
                    const certRef = doc(db, "publicTrainingCertificates", `${currentTrainingId}_${currentUser.uid}`);
                    const certSnap = await getDoc(certRef);
                    certificateIssued = certSnap.exists();
                    if (certificateIssued) {
                        finishedLessons.add('certificate');
                        if (!lessons.find((lesson) => lesson.id === 'certificate')) {
                            await addCertificateLesson();
                        }
                    }
                } catch (error) {
                    console.error("Error syncing certificate progress:", error);
                }
            }

            async function loadProgress() {
                if (!currentUser) return;
                
                try {
                    const progressRef = doc(db, "courseProgress", `${currentUser.uid}_${currentTrainingId}`);
                    const progressSnap = await getDoc(progressRef);
                    
                    if (progressSnap.exists()) {
                        const progress = progressSnap.data();
                        openedLessons = new Set(progress.openedLessons || []);
                        finishedLessons = new Set(progress.finishedLessons || []);
                        // Dla kompatybilności wstecznej
                        if (progress.completedLessons) {
                            completedLessons = new Set(progress.completedLessons || []);
                            finishedLessons = completedLessons;
                        }
                    }
                    await syncCertificateProgressState();
                    
                    await updateProgress();
                    // Odśwież panel lekcji po załadowaniu postępu, aby ikony były poprawne od razu
                    renderLessonsSidebar();

                    // Przy pierwszym wejściu użytkownik może mieć 99% (wszystkie lekcje ukończone,
                    // ale certyfikat jeszcze nie wydany). W takim przypadku pokaż certyfikat od razu.
                    const regularLessons = lessons.filter((lesson) => lesson.id !== "certificate");
                    const allRegularLessonsFinished =
                        regularLessons.length > 0 &&
                        regularLessons.every((lesson) => finishedLessons.has(lesson.id));

                    if (allRegularLessonsFinished) {
                        if (!lessons.find((lesson) => lesson.id === "certificate")) {
                            await addCertificateLesson();
                        }
                        const certificateIndex = lessons.findIndex((lesson) => lesson.id === "certificate");
                        if (certificateIndex !== -1 && currentLessonIndex !== certificateIndex) {
                            await loadLesson(certificateIndex);
                        }
                    }
                } catch (error) {
                    console.error("Error loading progress:", error);
                }
            }

            async function updateProgress() {
                const regularLessons = lessons.filter(l => l.id !== 'certificate');
                if (regularLessons.length === 0) return;
                
                // Regularne lekcje składają się na 99%, ostatni 1% wpada po pierwszym pobraniu certyfikatu.
                const progressPerLesson = 99 / regularLessons.length;
                let totalProgress = 0;
                
                regularLessons.forEach(lesson => {
                    if (finishedLessons.has(lesson.id)) {
                        totalProgress += progressPerLesson; // 100% za zakończoną lekcję
                    } else if (openedLessons.has(lesson.id)) {
                        totalProgress += progressPerLesson * 0.5; // 50% za otwartą lekcję
                    }
                });

                if (certificateIssued) {
                    totalProgress += 1;
                }
                
                const percentage = Math.round(totalProgress);
                
                const progressText = document.getElementById("course-progress-text");
                const progressFill = document.getElementById("course-progress-fill");
                
                if (progressText) {
                    progressText.textContent = `${percentage}% ukończone`;
                }
                if (progressFill) {
                    progressFill.style.width = `${percentage}%`;
                }
            }

            function showError(message) {
                document.body.innerHTML = `
                    <div class="container mx-auto px-6 py-20 text-center">
                        <h1 class="text-2xl font-bold text-red-400 mb-4">Błąd</h1>
                        <p class="text-zinc-400 mb-4">${message}</p>
                        <a href="index.html" class="text-coyote hover:underline">Powrót do szkoleń</a>
                    </div>
                `;
            }

            // Zamykanie menu po kliknięciu poza nim
            document.addEventListener("click", (event) => {
                const userPanel = document.getElementById("user-panel");
