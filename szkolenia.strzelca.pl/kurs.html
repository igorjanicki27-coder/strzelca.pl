<!doctype html>
<html lang="pl">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <!-- Cookies/zgody + warunkowe ładowanie analityki -->
        <script src="https://strzelca.pl/consent.js?v=2026-02-06-1"></script>
        <meta name="description" content="Kurs strzelca.pl - profesjonalne szkolenia strzeleckie online" />
        <meta name="robots" content="noindex, nofollow" />
        
        <title>Kurs - STRZELCA.PL</title>
        <script src="https://cdn.tailwindcss.com"></script>
        <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Inter:wght@400;700&display=swap" rel="stylesheet">
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
        <link rel="stylesheet" href="https://strzelca.pl/shared.css?v=2026-02-06-1" />
        <style>
            :root {
                --coyote: #c19a6b;
            }
            body {
                font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
                background-color: #0a0a0a;
                color: #e5e5e5;
            }
            .coyote-text {
                color: var(--coyote);
                font-family: "Orbitron", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            }
            .lesson-content {
                line-height: 1.8;
            }
            .lesson-content ul, .lesson-content ol {
                margin: 1rem 0;
                padding-left: 2rem;
            }
            .lesson-content img {
                max-width: 100%;
                height: auto;
                border-radius: 8px;
                margin: 1rem 0;
            }
            .lesson-content h1, .lesson-content h2, .lesson-content h3 {
                margin: 1.5rem 0 1rem 0;
                font-weight: bold;
            }
            .lesson-content h1 { font-size: 2rem; }
            .lesson-content h2 { font-size: 1.5rem; }
            .lesson-content h3 { font-size: 1.25rem; }
            .lesson-content p {
                margin: 1rem 0;
            }
            .video-container {
                position: relative;
                padding-bottom: 56.25%;
                height: 0;
                overflow: hidden;
                margin: 2rem 0;
                border-radius: 8px;
            }
            .video-container iframe {
                position: absolute;
                top: 0;
                left: 0;
                width: 100%;
                height: 100%;
            }
            .progress-bar {
                height: 4px;
                background: #1f1f1f;
                border-radius: 2px;
                overflow: hidden;
            }
            .progress-fill {
                height: 100%;
                background: linear-gradient(90deg, var(--coyote), #b18a5f);
                transition: width 0.3s ease;
            }
        </style>
    </head>
    <body>
        <!-- Panel użytkownika -->
        <div id="user-panel" class="fixed top-4 right-4 z-50 hidden">
            <div class="relative">
                <button
                    id="user-avatar-button"
                    class="w-12 h-12 rounded-full bg-coyote flex items-center justify-center text-white font-bold cursor-pointer hover:opacity-80 transition shadow-lg overflow-hidden"
                    onclick="toggleUserMenu()"
                >
                    <div id="user-avatar" class="w-full h-full flex items-center justify-center">
                        <i class="fa-solid fa-user"></i>
                    </div>
                </button>
                
                <div
                    id="user-menu"
                    class="absolute top-14 right-0 bg-zinc-900/95 backdrop-blur-md border border-zinc-700 rounded-2xl p-4 shadow-2xl min-w-[200px] hidden"
                >
                    <div class="space-y-2">
                        <div id="user-display-name" class="text-white font-semibold text-sm mb-3 pb-3 border-b border-zinc-700"></div>
                        <a href="https://konto.strzelca.pl/profil.html" class="block text-zinc-300 hover:text-coyote transition text-sm">
                            <i class="fa-solid fa-user mr-2"></i>Mój profil
                        </a>
                        <button onclick="logout()" class="block w-full text-left text-zinc-300 hover:text-red-400 transition text-sm">
                            <i class="fa-solid fa-sign-out-alt mr-2"></i>Wyloguj się
                        </button>
                    </div>
                </div>
            </div>
        </div>

        <!-- Przycisk logowania -->
        <div id="login-button" class="fixed top-4 right-4 z-50">
            <a href="https://konto.strzelca.pl/login.html" class="bg-coyote text-black w-10 h-10 rounded-full flex items-center justify-center hover:bg-white transition shadow-lg" title="Zaloguj się">
                <i class="fa-solid fa-sign-in-alt text-lg"></i>
            </a>
        </div>

        <nav class="h-[73px] border-b border-zinc-900 sticky top-0 bg-black/95 z-50 backdrop-blur-md flex items-center relative">
            <a href="index.html" class="absolute left-4 md:left-8 text-zinc-500 hover:text-white transition text-xl z-[60]">
                <i class="fa-solid fa-arrow-left"></i>
            </a>
            <div class="container mx-auto px-6 flex justify-center items-center">
                <div class="uppercase font-bold text-[11px] tracking-[0.3em] font-[Orbitron] text-zinc-400">
                    KURS.<span class="coyote-text">STRZELCA</span>.PL
                </div>
            </div>
        </nav>

        <div class="container mx-auto px-4 md:px-6 py-8 max-w-7xl">
            <!-- Nagłówek kursu -->
            <div id="course-header" class="mb-8">
                <h1 id="course-title" class="text-3xl md:text-4xl font-bold coyote-text mb-2 font-[Orbitron]">Ładowanie...</h1>
                <div class="flex items-center gap-4 text-sm text-zinc-400">
                    <span id="course-progress-text">0% ukończone</span>
                    <div class="progress-bar flex-1 max-w-xs">
                        <div id="course-progress-fill" class="progress-fill" style="width: 0%"></div>
                    </div>
                </div>
            </div>

            <div class="grid grid-cols-1 lg:grid-cols-4 gap-8">
                <!-- Sidebar z lekcjami -->
                <aside class="lg:col-span-1">
                    <div class="bg-zinc-900 border border-zinc-800 rounded-lg p-4 sticky top-24">
                        <h2 class="text-lg font-bold mb-4">Lekcje</h2>
                        <div id="lessons-sidebar" class="space-y-2 max-h-[calc(100vh-200px)] overflow-y-auto">
                            <div class="text-center text-zinc-500 py-8">
                                <i class="fa-solid fa-spinner fa-spin text-2xl mb-2"></i>
                                <p>Ładowanie lekcji...</p>
                            </div>
                        </div>
                    </div>
                </aside>

                <!-- Główna treść -->
                <main class="lg:col-span-3">
                    <div id="lesson-content-area" class="bg-zinc-900 border border-zinc-800 rounded-lg p-6 md:p-8">
                        <div class="text-center text-zinc-500 py-12">
                            <i class="fa-solid fa-spinner fa-spin text-3xl mb-4"></i>
                            <p>Ładowanie lekcji...</p>
                        </div>
                    </div>
                </main>
            </div>
        </div>

        <footer class="text-center py-12 border-t border-zinc-900 text-zinc-700 text-[10px] uppercase font-bold tracking-[0.5em] mt-12">
            <a href="https://strzelca.pl" class="hover:text-white transition">STRZELCA.PL</a>
        </footer>

        <script type="module">
            import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
            import { getAuth, onAuthStateChanged, setPersistence, browserLocalPersistence, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
            import { ensureFirebaseSSO } from "https://strzelca.pl/sso-client.mjs?v=2026-02-06-1";
            import {
                initializeFirestore,
                collection,
                getDocs,
                doc,
                getDoc,
                query,
                orderBy,
                where,
                setDoc,
                serverTimestamp
            } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

            async function getFirebaseApiKey() {
                // Używamy pełnego URL, bo szkolenia są na subdomenie szkolenia.strzelca.pl
                const urls = [
                    "https://strzelca.pl/api/firebase-config",
                    "/api/firebase-config" // fallback dla lokalnego developmentu
                ];
                for (const url of urls) {
                    try {
                        const res = await fetch(url, { 
                            cache: "no-store",
                            credentials: url.startsWith("http") ? "omit" : "same-origin"
                        });
                        if (!res.ok) continue;
                        const data = await res.json().catch(() => null);
                        if (data && typeof data.apiKey === "string" && data.apiKey.length > 10) {
                            return data.apiKey;
                        }
                    } catch (_) {}
                }
                throw new Error("Nie udało się pobrać FIREBASE_WEB_API_KEY");
            }

            const firebaseConfig = {
                apiKey: await getFirebaseApiKey(),
                authDomain: "strzelca-pl.firebaseapp.com",
                projectId: "strzelca-pl",
                storageBucket: "strzelca-pl.appspot.com",
                messagingSenderId: "511362047688",
                appId: "1:511362047688:web:9b82c0a4d19c1a3a878ffd",
            };

            const app = initializeApp(firebaseConfig);
            const db = initializeFirestore(app, {
                experimentalAutoDetectLongPolling: true,
                useFetchStreams: true,
            });
            const auth = getAuth(app);
            await setPersistence(auth, browserLocalPersistence);

            try {
                await ensureFirebaseSSO(auth);
            } catch (e) {
                console.warn("SSO ensure failed:", e?.message || e);
            }

            let currentUser = null;
            let currentTrainingId = null;
            let lessons = [];
            let completedLessons = new Set();
            let openedLessons = new Set(); // Lekcje które zostały otwarte (50% progresu)
            let finishedLessons = new Set(); // Lekcje które zostały zakończone (100% progresu)
            let currentLessonIndex = 0;
            let trainingTitle = "";

            // Funkcje UI
            window.toggleUserMenu = () => {
                const menu = document.getElementById("user-menu");
                if (menu) menu.classList.toggle("hidden");
            };

            window.logout = async () => {
                try {
                    await fetch("https://strzelca.pl/api/sso-session-logout", {
                        method: "POST",
                        credentials: "include",
                    });
                } catch (e) {}
                const { signOut } = await import("https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js");
                await signOut(auth);
                window.location.href = "index.html";
            };

            async function updateUserInterface(user) {
                const loginBtn = document.getElementById("login-button");
                const userPanel = document.getElementById("user-panel");
                const userDisplayName = document.getElementById("user-display-name");
                const userAvatar = document.getElementById("user-avatar");

                if (user) {
                    if (loginBtn) loginBtn.classList.add("hidden");
                    if (userPanel) userPanel.classList.remove("hidden");
                    if (userDisplayName) {
                        const profileDoc = await getDoc(doc(db, "userProfiles", user.uid));
                        if (profileDoc.exists()) {
                            const profile = profileDoc.data();
                            userDisplayName.textContent = profile.displayName || user.email.split("@")[0];
                            if (userAvatar) {
                                if (profile.avatar) {
                                    userAvatar.innerHTML = `<img src="${profile.avatar}" alt="Avatar" class="w-full h-full rounded-full object-cover">`;
                                } else {
                                    userAvatar.innerHTML = '<i class="fa-solid fa-user text-white"></i>';
                                }
                            }
                        } else {
                            if (userDisplayName) userDisplayName.textContent = user.email.split("@")[0];
                        }
                    }
                } else {
                    if (loginBtn) loginBtn.classList.remove("hidden");
                    if (userPanel) userPanel.classList.add("hidden");
                }
            }

            // Pobierz ID kursu z URL
            const urlParams = new URLSearchParams(window.location.search);
            currentTrainingId = urlParams.get('id');

            if (!currentTrainingId) {
                document.body.innerHTML = '<div class="container mx-auto px-6 py-20 text-center"><h1 class="text-2xl font-bold text-red-400 mb-4">Błąd</h1><p class="text-zinc-400">Nie podano ID kursu.</p><a href="index.html" class="text-coyote hover:underline mt-4 inline-block">Powrót do szkoleń</a></div>';
            } else {
                // Sprawdź dostęp i załaduj kurs
                onAuthStateChanged(auth, async (user) => {
                    currentUser = user;
                    await updateUserInterface(user);
                    
                    if (user) {
                        await checkAccessAndLoadCourse();
                    } else {
                        document.body.innerHTML = '<div class="container mx-auto px-6 py-20 text-center"><h1 class="text-2xl font-bold text-red-400 mb-4">Wymagane logowanie</h1><p class="text-zinc-400 mb-4">Musisz być zalogowany, aby przeglądać kurs.</p><a href="https://konto.strzelca.pl/login.html?redirect=' + encodeURIComponent(window.location.href) + '" class="text-coyote hover:underline">Zaloguj się</a></div>';
                    }
                });
            }

            async function checkAccessAndLoadCourse() {
                try {
                    // Sprawdź dostęp użytkownika
                    const trainingDoc = await getDoc(doc(db, "trainings", currentTrainingId));
                    if (!trainingDoc.exists()) {
                        showError("Kurs nie istnieje.");
                        return;
                    }

                    const training = trainingDoc.data();
                    const isAvailableForAll = training.available === true;
                    
                    let hasAccess = isAvailableForAll;
                    if (!hasAccess && currentUser) {
                        const accessRef = collection(db, "trainingAccess");
                        const accessQuery = query(
                            accessRef,
                            where("trainingId", "==", currentTrainingId),
                            where("userId", "==", currentUser.uid)
                        );
                        const accessSnap = await getDocs(accessQuery);
                        hasAccess = !accessSnap.empty;
                    }

                    if (!hasAccess) {
                        showError("Nie masz dostępu do tego kursu.");
                        return;
                    }

                    // Załaduj kurs
                    trainingTitle = training.title || "Kurs";
                    document.getElementById("course-title").textContent = trainingTitle;
                    await loadLessons();
                    await loadProgress();
                } catch (error) {
                    console.error("Error checking access:", error);
                    showError("Błąd podczas sprawdzania dostępu.");
                }
            }

            async function loadLessons() {
                try {
                    const lessonsRef = collection(db, "courseLessons");
                    const lessonsQuery = query(
                        lessonsRef,
                        where("trainingId", "==", currentTrainingId),
                        orderBy("order", "asc")
                    );
                    const snapshot = await getDocs(lessonsQuery);
                    
                    lessons = snapshot.docs.map(doc => ({
                        id: doc.id,
                        ...doc.data()
                    }));

                    renderLessonsSidebar();
                    if (lessons.length > 0) {
                        loadLesson(0);
                    } else {
                        document.getElementById("lesson-content-area").innerHTML = '<div class="text-center text-zinc-500 py-12"><i class="fa-solid fa-book-open text-4xl mb-4"></i><p>Ten kurs nie ma jeszcze lekcji.</p></div>';
                    }
                } catch (error) {
                    console.error("Error loading lessons:", error);
                    showError("Błąd ładowania lekcji.");
                }
            }

            function renderLessonsSidebar() {
                const sidebar = document.getElementById("lessons-sidebar");
                if (!sidebar) return;

                if (lessons.length === 0) {
                    sidebar.innerHTML = '<div class="text-sm text-zinc-500 text-center py-4">Brak lekcji</div>';
                    return;
                }

                sidebar.innerHTML = lessons.map((lesson, index) => {
                    const isFinished = finishedLessons.has(lesson.id);
                    const isOpened = openedLessons.has(lesson.id) || isFinished;
                    const isActive = index === currentLessonIndex;
                    const isCertificate = lesson.id === 'certificate';
                    
                    return `
                        <div class="flex items-center gap-2 p-2 rounded-lg cursor-pointer transition ${isActive ? 'bg-coyote/20 border border-coyote' : 'hover:bg-zinc-800'} ${isFinished ? 'opacity-75' : ''}" 
                             onclick="${isCertificate ? 'downloadCertificate()' : `loadLesson(${index})`}">
                            <div class="flex-shrink-0 w-6 h-6 rounded-full flex items-center justify-center text-xs ${isFinished ? 'bg-green-500 text-white' : isOpened ? 'bg-yellow-500 text-white' : isActive ? 'bg-coyote text-black' : 'bg-zinc-700 text-zinc-400'}">
                                ${isFinished ? '<i class="fa-solid fa-check"></i>' : isOpened ? '<i class="fa-solid fa-circle-half-stroke"></i>' : isCertificate ? '<i class="fa-solid fa-certificate"></i>' : index + 1}
                            </div>
                            <div class="flex-1 min-w-0">
                                <div class="text-sm font-medium truncate ${isActive ? 'text-coyote' : 'text-white'}">${lesson.title || "Bez tytułu"}</div>
                            </div>
                            ${isCertificate ? '<i class="fa-solid fa-download text-coyote text-xs flex-shrink-0"></i>' : ''}
                        </div>
                    `;
                }).join("");
            }

            window.loadLesson = async (index) => {
                if (index < 0 || index >= lessons.length) return;
                
                currentLessonIndex = index;
                const lesson = lessons[index];
                
                // Jeśli to certyfikat, pokaż go
                if (lesson.id === 'certificate') {
                    await showCertificate();
                    return;
                }
                
                // Oznacz lekcję jako otwartą (50% progresu)
                if (currentUser && !openedLessons.has(lesson.id)) {
                    await markLessonOpened(lesson.id);
                }

                // Renderuj treść lekcji
                const contentArea = document.getElementById("lesson-content-area");
                if (!contentArea) return;

                const isFinished = finishedLessons.has(lesson.id);
                const isLastLesson = index === lessons.length - 1;
                const allLessonsFinished = lessons.filter(l => l.id !== 'certificate').every(l => finishedLessons.has(l.id));

                contentArea.innerHTML = `
                    <div class="mb-6">
                        <h2 class="text-2xl md:text-3xl font-bold mb-2">${lesson.title || "Bez tytułu"}</h2>
                    </div>
                    <div class="lesson-content custom-render">
                        ${lesson.content || '<p class="text-zinc-500">Brak treści.</p>'}
                    </div>
                    ${!isFinished ? `
                        <div class="mt-8 pt-6 border-t border-zinc-800">
                            <button 
                                onclick="finishLesson('${lesson.id}', ${index})" 
                                class="w-full px-6 py-3 bg-coyote text-black rounded-lg font-bold hover:bg-opacity-90 transition text-lg"
                            >
                                <i class="fa-solid fa-check-circle mr-2"></i>Zakończ lekcję
                            </button>
                        </div>
                    ` : ''}
                    <div class="flex justify-between items-center mt-4">
                        <button 
                            onclick="loadLesson(${index - 1})" 
                            class="px-4 py-2 border border-zinc-700 rounded-lg hover:bg-zinc-800 transition ${index === 0 ? 'opacity-50 cursor-not-allowed' : ''}"
                            ${index === 0 ? 'disabled' : ''}
                        >
                            <i class="fa-solid fa-arrow-left mr-2"></i>Poprzednia
                        </button>
                        ${!isLastLesson ? `
                            <button 
                                onclick="loadLesson(${index + 1})" 
                                class="px-4 py-2 bg-coyote text-black rounded-lg font-bold hover:bg-opacity-90 transition"
                            >
                                Następna<i class="fa-solid fa-arrow-right ml-2"></i>
                            </button>
                        ` : ''}
                    </div>
                `;

                renderLessonsSidebar();
                await updateProgress();
                
                // Jeśli wszystkie lekcje są zakończone, pokaż certyfikat
                if (allLessonsFinished && !lessons.find(l => l.id === 'certificate')) {
                    await addCertificateLesson();
                }
            };
            
            async function showCertificate() {
                const contentArea = document.getElementById("lesson-content-area");
                if (!contentArea || !currentUser) return;
                
                // Pobierz dane użytkownika
                const profileDoc = await getDoc(doc(db, "userProfiles", currentUser.uid));
                const profile = profileDoc.exists() ? profileDoc.data() : {};
                const userName = profile.displayName || `${profile.firstName || ''} ${profile.lastName || ''}`.trim() || currentUser.email.split('@')[0];
                
                contentArea.innerHTML = `
                    <div class="text-center py-12">
                        <div class="mb-8">
                            <i class="fa-solid fa-certificate text-6xl text-coyote mb-4"></i>
                            <h2 class="text-3xl md:text-4xl font-bold mb-4">Certyfikat ukończenia</h2>
                            <p class="text-xl text-zinc-400 mb-8">Gratulacje! Ukończyłeś kurs</p>
                        </div>
                        <button 
                            onclick="downloadCertificate()" 
                            class="px-8 py-4 bg-coyote text-black rounded-lg font-bold hover:bg-opacity-90 transition text-lg"
                        >
                            <i class="fa-solid fa-download mr-2"></i>Pobierz certyfikat
                        </button>
                    </div>
                `;
            }
            
            window.downloadCertificate = async () => {
                if (!currentUser) return;
                
                try {
                    // Pobierz dane użytkownika
                    const profileDoc = await getDoc(doc(db, "userProfiles", currentUser.uid));
                    const profile = profileDoc.exists() ? profileDoc.data() : {};
                    const userName = profile.displayName || `${profile.firstName || ''} ${profile.lastName || ''}`.trim() || currentUser.email.split('@')[0];
                    
                    // Generuj certyfikat
                    await generateCertificate(userName);
                } catch (error) {
                    console.error("Error downloading certificate:", error);
                    alert("Błąd podczas generowania certyfikatu.");
                }
            };
            
            async function generateCertificate(userName) {
                // Utwórz canvas dla certyfikatu
                const canvas = document.createElement('canvas');
                canvas.width = 1200;
                canvas.height = 800;
                const ctx = canvas.getContext('2d');
                
                // Tło - gradient ciemny z akcentem coyote
                const gradient = ctx.createLinearGradient(0, 0, canvas.width, canvas.height);
                gradient.addColorStop(0, '#0a0a0a');
                gradient.addColorStop(0.5, '#1a1a1a');
                gradient.addColorStop(1, '#0a0a0a');
                ctx.fillStyle = gradient;
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                
                // Ramka w kolorze coyote
                ctx.strokeStyle = '#c19a6b';
                ctx.lineWidth = 8;
                ctx.strokeRect(40, 40, canvas.width - 80, canvas.height - 80);
                
                // Wewnętrzna ramka
                ctx.strokeStyle = '#c19a6b';
                ctx.lineWidth = 2;
                ctx.strokeRect(80, 80, canvas.width - 160, canvas.height - 160);
                
                // Logo/tytuł STRZELCA.PL na górze
                ctx.fillStyle = '#c19a6b';
                ctx.font = 'bold 32px Orbitron, sans-serif';
                ctx.textAlign = 'center';
                ctx.fillText('STRZELCA.PL', canvas.width / 2, 150);
                
                // Linia dekoracyjna
                ctx.strokeStyle = '#c19a6b';
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.moveTo(canvas.width / 2 - 150, 180);
                ctx.lineTo(canvas.width / 2 + 150, 180);
                ctx.stroke();
                
                // Tekst "CERTIFIKAT"
                ctx.fillStyle = '#c19a6b';
                ctx.font = 'bold 48px Orbitron, sans-serif';
                ctx.fillText('CERTIFIKAT', canvas.width / 2, 250);
                
                // Tekst "Niniejszym potwierdzamy, że"
                ctx.fillStyle = '#e5e5e5';
                ctx.font = '24px Inter, sans-serif';
                ctx.fillText('Niniejszym potwierdzamy, że', canvas.width / 2, 320);
                
                // Imię i nazwisko użytkownika
                ctx.fillStyle = '#c19a6b';
                ctx.font = 'bold 36px Inter, sans-serif';
                ctx.fillText(userName, canvas.width / 2, 380);
                
                // Tekst "ukończył(a) kurs"
                ctx.fillStyle = '#e5e5e5';
                ctx.font = '24px Inter, sans-serif';
                ctx.fillText('ukończył(a) kurs', canvas.width / 2, 430);
                
                // Nazwa kursu
                ctx.fillStyle = '#c19a6b';
                ctx.font = 'bold 32px Inter, sans-serif';
                ctx.fillText(trainingTitle, canvas.width / 2, 490);
                
                // Data
                const date = new Date();
                const dateStr = date.toLocaleDateString('pl-PL', { year: 'numeric', month: 'long', day: 'numeric' });
                ctx.fillStyle = '#999';
                ctx.font = '20px Inter, sans-serif';
                ctx.fillText(dateStr, canvas.width / 2, 580);
                
                // Podpis STRZELCA.PL na dole
                ctx.strokeStyle = '#c19a6b';
                ctx.lineWidth = 1;
                ctx.beginPath();
                ctx.moveTo(canvas.width / 2 - 200, 680);
                ctx.lineTo(canvas.width / 2 + 200, 680);
                ctx.stroke();
                
                ctx.fillStyle = '#c19a6b';
                ctx.font = 'bold 24px Orbitron, sans-serif';
                ctx.fillText('STRZELCA.PL', canvas.width / 2, 720);
                
                // Konwertuj canvas do obrazu i pobierz
                canvas.toBlob((blob) => {
                    const url = URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = `Certyfikat_${trainingTitle.replace(/[^a-z0-9]/gi, '_')}_${userName.replace(/[^a-z0-9]/gi, '_')}.png`;
                    document.body.appendChild(a);
                    a.click();
                    document.body.removeChild(a);
                    URL.revokeObjectURL(url);
                }, 'image/png');
            }
            
            window.finishLesson = async (lessonId, index) => {
                if (!currentUser) return;
                
                if (!finishedLessons.has(lessonId)) {
                    await markLessonFinished(lessonId);
                    finishedLessons.add(lessonId);
                    await updateProgress();
                    
                    // Sprawdź czy wszystkie lekcje są zakończone (bez certyfikatu)
                    const regularLessons = lessons.filter(l => l.id !== 'certificate');
                    const allFinished = regularLessons.every(l => finishedLessons.has(l.id));
                    
                    if (allFinished && !lessons.find(l => l.id === 'certificate')) {
                        await addCertificateLesson();
                    }
                    
                    renderLessonsSidebar();
                    
                    // Przeładuj aktualną lekcję aby pokazać zaktualizowany stan
                    await loadLesson(index);
                }
            };
            
            async function addCertificateLesson() {
                lessons.push({
                    id: 'certificate',
                    title: 'Certyfikat',
                    content: '',
                    order: lessons.length
                });
                renderLessonsSidebar();
            }

            async function markLessonOpened(lessonId) {
                if (!currentUser || lessonId === 'certificate') return;
                
                try {
                    const progressRef = doc(db, "courseProgress", `${currentUser.uid}_${currentTrainingId}`);
                    const progressSnap = await getDoc(progressRef);
                    
                    let opened = [];
                    if (progressSnap.exists()) {
                        opened = progressSnap.data().openedLessons || [];
                    }
                    
                    if (!opened.includes(lessonId)) {
                        opened.push(lessonId);
                        await setDoc(progressRef, {
                            userId: currentUser.uid,
                            trainingId: currentTrainingId,
                            openedLessons: opened,
                            lastUpdated: serverTimestamp()
                        }, { merge: true });
                        
                        openedLessons.add(lessonId);
                    }
                } catch (error) {
                    console.error("Error marking lesson opened:", error);
                }
            }
            
            async function markLessonFinished(lessonId) {
                if (!currentUser || lessonId === 'certificate') return;
                
                try {
                    const progressRef = doc(db, "courseProgress", `${currentUser.uid}_${currentTrainingId}`);
                    const progressSnap = await getDoc(progressRef);
                    
                    let finished = [];
                    if (progressSnap.exists()) {
                        finished = progressSnap.data().finishedLessons || [];
                    }
                    
                    if (!finished.includes(lessonId)) {
                        finished.push(lessonId);
                        await setDoc(progressRef, {
                            userId: currentUser.uid,
                            trainingId: currentTrainingId,
                            finishedLessons: finished,
                            lastUpdated: serverTimestamp()
                        }, { merge: true });
                        
                        finishedLessons.add(lessonId);
                    }
                } catch (error) {
                    console.error("Error marking lesson finished:", error);
                }
            }

            async function loadProgress() {
                if (!currentUser) return;
                
                try {
                    const progressRef = doc(db, "courseProgress", `${currentUser.uid}_${currentTrainingId}`);
                    const progressSnap = await getDoc(progressRef);
                    
                    if (progressSnap.exists()) {
                        const progress = progressSnap.data();
                        openedLessons = new Set(progress.openedLessons || []);
                        finishedLessons = new Set(progress.finishedLessons || []);
                        // Dla kompatybilności wstecznej
                        if (progress.completedLessons) {
                            completedLessons = new Set(progress.completedLessons || []);
                            finishedLessons = completedLessons;
                        }
                    }
                    
                    await updateProgress();
                } catch (error) {
                    console.error("Error loading progress:", error);
                }
            }

            async function updateProgress() {
                const regularLessons = lessons.filter(l => l.id !== 'certificate');
                if (regularLessons.length === 0) return;
                
                // Każda lekcja daje równy procent (100% / liczba lekcji)
                const progressPerLesson = 100 / regularLessons.length;
                let totalProgress = 0;
                
                regularLessons.forEach(lesson => {
                    if (finishedLessons.has(lesson.id)) {
                        totalProgress += progressPerLesson; // 100% za zakończoną lekcję
                    } else if (openedLessons.has(lesson.id)) {
                        totalProgress += progressPerLesson * 0.5; // 50% za otwartą lekcję
                    }
                });
                
                const percentage = Math.round(totalProgress);
                
                const progressText = document.getElementById("course-progress-text");
                const progressFill = document.getElementById("course-progress-fill");
                
                if (progressText) {
                    progressText.textContent = `${percentage}% ukończone`;
                }
                if (progressFill) {
                    progressFill.style.width = `${percentage}%`;
                }
            }

            function showError(message) {
                document.body.innerHTML = `
                    <div class="container mx-auto px-6 py-20 text-center">
                        <h1 class="text-2xl font-bold text-red-400 mb-4">Błąd</h1>
                        <p class="text-zinc-400 mb-4">${message}</p>
                        <a href="index.html" class="text-coyote hover:underline">Powrót do szkoleń</a>
                    </div>
                `;
            }

            // Zamykanie menu po kliknięciu poza nim
            document.addEventListener("click", (event) => {
                const userPanel = document.getElementById("user-panel");
                const userMenu = document.getElementById("user-menu");
                if (userPanel && userMenu && !userPanel.contains(event.target) && !userMenu.classList.contains("hidden")) {
                    userMenu.classList.add("hidden");
                }
            });
        </script>
        <script type="module" src="https://strzelca.pl/auth-widget.mjs?v=2026-02-06-1"></script>
        <script type="module" src="https://strzelca.pl/messages-widget.mjs?v=2026-02-05-14"></script>
    </body>
