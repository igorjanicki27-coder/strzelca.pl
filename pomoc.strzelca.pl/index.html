            border: 1px solid #1f1f1f;
            border-radius: 12px;
            backdrop-filter: blur(6px);

        .charity-card-inner {
            height: 100%;

            flex-direction: column;

        .charity-card.pinned-donate {

            border-color: rgba(193, 154, 107, 0.65);
        }
        .charity-image-wrap {

            display: inline-flex;

            letter-spacing: 0.12em;

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { initializeFirestore, doc, setDoc, getDoc, getDocs, collection, deleteDoc, query, orderBy, updateDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
        import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut, setPersistence, browserLocalPersistence } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { ensureFirebaseSSO } from "https://strzelca.pl/sso-client.mjs?v=2026-02-06-1";

        
      async function getFirebaseApiKey() {
        const urls = [
          "https://strzelca.pl/api/firebase-config",
          "/api/firebase-config"
        ];

        for (const url of urls) {
          try {
            const res = await fetch(url, {
              cache: "no-store",
              credentials: url.startsWith("http") ? "omit" : "same-origin",
            });
            if (!res.ok) continue;
            const data = await res.json().catch(() => null);
            if (data && typeof data.apiKey === "string" && data.apiKey.length > 10) {
              return data.apiKey;
            }
          } catch (_) {
            // ignore and try next url
          }
        }

        throw new Error("Nie udało się pobrać FIREBASE_WEB_API_KEY z /api/firebase-config");
      }
const firebaseConfig = {
            apiKey: await getFirebaseApiKey(),
            authDomain: "strzelca-pl.firebaseapp.com",
            projectId: "strzelca-pl",
            storageBucket: "strzelca-pl.appspot.com",
            messagingSenderId: "511362047688",
            appId: "1:511362047688:web:9b82c0a4d19c1a3a878ffd",
            measurementId: "G-9EJ2R3JPVD"
        };

        const app = initializeApp(firebaseConfig);
        const db = initializeFirestore(app, {
            experimentalAutoDetectLongPolling: true,
            useFetchStreams: true,
        });
        const auth = getAuth(app);

        // Ustaw trwałość sesji na browserLocalPersistence dla wszystkich subdomen
        await setPersistence(auth, browserLocalPersistence);

        // SSO między subdomenami: jeśli tu nie ma usera, spróbuj zalogować z cookie (.strzelca.pl)
        try {
            await ensureFirebaseSSO(auth);
        } catch (e) {
            console.warn("SSO ensure failed (ignored):", e?.message || e);
        }
        
        // Inicjalizuj śledzenie aktywności
        try {
            const { initActivityTracker } = await import("https://strzelca.pl/activity-tracker.mjs?v=2026-02-06-1");
            await initActivityTracker(auth, db);
            
            // Monitorowanie statusu użytkownika (blokowanie)
            const { initUserStatusMonitor } = await import("https://strzelca.pl/user-status-monitor.mjs?v=2026-02-06-1");
            await initUserStatusMonitor(auth, db);
        } catch (error) {
            console.warn("Could not initialize activity tracker:", error);
        }
        
        // Inicjalizuj śledzenie odwiedzin (działa dla wszystkich użytkowników, również niezalogowanych)
        try {
          const { initVisitTracker } = await import("https://strzelca.pl/visit-tracker.mjs?v=2026-02-06-3");
          await initVisitTracker(auth);
        } catch (error) {
          console.warn("Could not initialize visit tracker:", error);
        }
        
        let charityActions = [];
        let publicCharityItems = [];
        let charityImages = []; // Local admin state for images
        let currentUser = null;
        const CHARITY_CAROUSEL_DURATION_MS = 180;
        let charityLoopEnabled = false;
        let charityCarouselAnimating = false;
        let charityPendingMoves = 0;

        function getVisibleCharityCardsCount() {
            if (window.innerWidth <= 700) return 1;
            if (window.innerWidth <= 1024) return 2;
            return 3;
        }

        function getCharityStepWidth() {
            const track = document.getElementById('charity-track');
            if (!track) return 0;
            const cards = track.querySelectorAll('.charity-card');
            if (cards.length >= 2) {
                return cards[1].offsetLeft - cards[0].offsetLeft;
            }
            return cards[0] ? cards[0].offsetWidth : 0;
        }

        function updateCharityCarouselControls() {
            const track = document.getElementById('charity-track');
            const prevBtn = document.getElementById('charity-carousel-prev');
            const nextBtn = document.getElementById('charity-carousel-next');
            if (!track || !prevBtn || !nextBtn) return;

            const cards = track.querySelectorAll('.charity-card');
            const visibleCards = getVisibleCharityCardsCount();
            charityLoopEnabled = cards.length > visibleCards;
            prevBtn.disabled = !charityLoopEnabled;
            nextBtn.disabled = !charityLoopEnabled;

            if (!charityLoopEnabled) {
                track.style.transition = 'none';
                track.style.transform = 'translateX(0)';
                window.requestAnimationFrame(() => {
                    track.style.transition = `transform ${CHARITY_CAROUSEL_DURATION_MS}ms cubic-bezier(0.22, 0.61, 0.36, 1)`;
                });
            }
        }

        function consumeQueuedCharityMove() {
            if (!charityLoopEnabled || charityPendingMoves === 0 || charityCarouselAnimating) return;
            const nextDir = charityPendingMoves > 0 ? 1 : -1;
            charityPendingMoves -= nextDir;
            window.moveCharityCarousel(nextDir);
        }

        window.moveCharityCarousel = (direction) => {
            if (!charityLoopEnabled) return;
            const moveDir = direction > 0 ? 1 : -1;

            if (charityCarouselAnimating) {
                charityPendingMoves += moveDir;
                charityPendingMoves = Math.max(-8, Math.min(8, charityPendingMoves));
                return;
            }

            const track = document.getElementById('charity-track');
            if (!track) return;
            const stepWidth = getCharityStepWidth();
            if (stepWidth <= 0) return;

            charityCarouselAnimating = true;
            let finished = false;
            let fallbackTimer = null;

            const finalizeMove = (afterFinalize) => {
                if (finished) return;
                finished = true;
                if (fallbackTimer) clearTimeout(fallbackTimer);
                if (typeof afterFinalize === 'function') afterFinalize();
                charityCarouselAnimating = false;
                consumeQueuedCharityMove();
            };

            if (moveDir > 0) {
                track.style.transition = `transform ${CHARITY_CAROUSEL_DURATION_MS}ms cubic-bezier(0.22, 0.61, 0.36, 1)`;
                track.style.transform = `translateX(-${stepWidth}px)`;

                const onEnd = (event) => {
                    if (event.propertyName && event.propertyName !== 'transform') return;
                    track.style.transition = 'none';
                    const firstCard = track.firstElementChild;
                    if (firstCard) track.appendChild(firstCard);
                    track.style.transform = 'translateX(0)';
                    void track.offsetHeight;
                    track.style.transition = `transform ${CHARITY_CAROUSEL_DURATION_MS}ms cubic-bezier(0.22, 0.61, 0.36, 1)`;
                    finalizeMove();
                };
                track.addEventListener('transitionend', onEnd, { once: true });
                fallbackTimer = setTimeout(() => {
                    finalizeMove(() => {
                        track.style.transition = 'none';
                        const firstCard = track.firstElementChild;
                        if (firstCard) track.appendChild(firstCard);
                        track.style.transform = 'translateX(0)';
                        void track.offsetHeight;
                        track.style.transition = `transform ${CHARITY_CAROUSEL_DURATION_MS}ms cubic-bezier(0.22, 0.61, 0.36, 1)`;
                    });
                }, CHARITY_CAROUSEL_DURATION_MS + 120);
            } else {
                track.style.transition = 'none';
                const lastCard = track.lastElementChild;
                if (lastCard) track.insertBefore(lastCard, track.firstElementChild);
                track.style.transform = `translateX(-${stepWidth}px)`;
                void track.offsetHeight;
                track.style.transition = `transform ${CHARITY_CAROUSEL_DURATION_MS}ms cubic-bezier(0.22, 0.61, 0.36, 1)`;
                track.style.transform = 'translateX(0)';

                const onEnd = (event) => {
                    if (event && event.propertyName && event.propertyName !== 'transform') return;
                    finalizeMove();
                };
                track.addEventListener('transitionend', onEnd, { once: true });
                fallbackTimer = setTimeout(() => {
                    finalizeMove();
                }, CHARITY_CAROUSEL_DURATION_MS + 120);
            }
        };

        function escapeHtml(value) {
            return String(value ?? '')
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;');
        }

        function buildPinnedDonateCard() {
            return `
                <article class="card-dark charity-card pinned-donate">
                    <div class="charity-card-inner text-center">
                        <div class="pinned-badge mx-auto">
                            <i class="fa-solid fa-thumbtack"></i>
                            <span>Przypięte</span>
                        </div>
                        <h3 class="text-base md:text-lg font-bold uppercase font-[Orbitron] coyote-text leading-snug">
                            Dobrowolne wpłaty na rzecz rozwoju firmy
                        </h3>
                        <p class="text-sm text-zinc-300 leading-relaxed">
                            Twoja wpłata pomoże nam rozwijać działalność, wprowadzać nowe produkty i usługi, oraz wspierać społeczność strzelecką. Każda kwota ma znaczenie i przyczynia się do budowania lepszej przyszłości dla naszego środowiska.
                        </p>
                        <div class="mt-auto flex flex-col items-center gap-3 pt-2">
                            <stripe-buy-button
                              buy-button-id="buy_btn_1SmzvBCoixAPjvnwGm1XsRpP"
                              publishable-key="pk_test_51SmzhGCoixAPjvnwV7RfZLsfOnNOgYabPHMhKOJL1wLRaNLJcNd3O1mHxkUZw8QTytyUEwk25aqTPNDB3aGoIOSg00a7BAlDzj"
                            ></stripe-buy-button>
                            <p class="text-xs text-zinc-500">
                                Wszystkie wpłaty są dobrowolne i nie wiążą się z żadnymi zobowiązaniami. Za pośrednictwem bezpiecznej bramki płatniczej Stripe.
                            </p>
                            <a href="https://dokumenty.strzelca.pl#donation-clause" onclick="expandDonationClause(); return false;" class="text-xs text-zinc-400 hover:text-coyote transition underline">
                                Klauzula Donacji
                            </a>
                        </div>
                    </div>
                </article>
            `;
        }

        window.handleCharityActionClick = (e, itemLink) => {
            e.stopPropagation();
            if (itemLink && itemLink.trim() !== '') {
                window.open(itemLink, '_blank');
            } else {
                // Gdy brak linku, otwórz szczegóły (kliknięcie w przycisk odpala modal)
                e.target.closest('article').click();
            }
        };

        function buildCharityCard(item) {
            const title = escapeHtml(item.title || '');
            let coverImage = '';
            if (item.images && item.images.length > 0) {
                coverImage = escapeHtml(item.images[0].url);
            } else if (item.image) {
                coverImage = escapeHtml(item.image);
            }
            const eventDate = item.date ? new Date(item.date) : null;
            const hasValidDate = eventDate && !isNaN(eventDate.getTime());
            
            let dateLabel = 'Brak daty';
            if (hasValidDate) {
                const isTimeProvided = item.date.includes('T') && item.date.length > 10;
                if (isTimeProvided) {
                    dateLabel = `Otwarta do: ${eventDate.toLocaleDateString('pl-PL')} <i class="fa-solid fa-clock ml-2"></i> ${eventDate.toLocaleTimeString('pl-PL', {hour: '2-digit', minute:'2-digit'})}`;
                } else {
                    dateLabel = `Otwarta do: ${eventDate.toLocaleDateString('pl-PL')}`;
                }
            }

            const isPast = hasValidDate ? eventDate < new Date() : false;

            return `
                <article class="card-dark charity-card cursor-pointer hover:border-coyote transition flex flex-col h-full ${isPast ? 'opacity-75 grayscale-[0.3]' : ''}" onclick="window.openCharityDetails('${item.id}')">
                    <div class="charity-card-inner flex-1 flex flex-col justify-between p-0">
                        <div>
                            ${coverImage ? `<div class="charity-image-wrap h-48 md:h-56"><img src="${coverImage}" alt="${title}" class="w-full h-full object-cover"></div>` : '<div class="charity-image-wrap h-48 md:h-56 bg-zinc-800 flex items-center justify-center"><i class="fa-solid fa-hand-holding-heart text-4xl text-zinc-600"></i></div>'}
                            <div class="p-4 md:p-6 pb-2">
                                <h3 class="text-lg md:text-xl font-bold uppercase font-[Orbitron] coyote-text leading-tight mb-2">${title}</h3>
                                <div class="text-xs text-zinc-400 uppercase font-medium flex items-center gap-1">
                                    <i class="fa-regular fa-calendar text-coyote"></i> ${dateLabel}
                                </div>
                            </div>
                        </div>
                        <div class="p-4 md:p-6 pt-2 mt-auto">
                            <button onclick="window.handleCharityActionClick(event, '${escapeHtml(item.buttonLink || '')}')" class="w-full bg-red-800/20 hover:bg-coyote text-coyote hover:text-black border border-red-800/50 hover:border-coyote transition-all duration-300 font-bold text-sm tracking-widest py-3 px-4 rounded-lg uppercase flex items-center justify-center gap-2 group">
                                <i class="fa-solid fa-heart text-red-500 group-hover:text-black transition-colors"></i> 
                                WESPRZYJ 
                                <i class="fa-solid fa-heart text-red-500 group-hover:text-black transition-colors"></i>
                            </button>
                        </div>
                    </div>
                </article>
            `;
        }

        window.openCharityDetails = (id) => {
            const item = publicCharityItems.find(c => c.id === id);
            if (!item) return;

            const modal = document.getElementById('charity-details-modal');
            const content = document.getElementById('charity-details-content');
            const body = document.getElementById('charity-details-body');
            
            // Przygotowanie karuzeli zdjęć wewnątrz modala
            let imagesHtml = '';
            const allImages = item.images && item.images.length > 0 
                ? item.images.map(img => img.url) 
                : (item.image ? [item.image] : []);

            if (allImages.length > 0) {
                const slides = allImages.map((src, i) => `
                    <div class="min-w-full h-64 md:h-96 snap-center relative">
                        <img src="${src}" class="w-full h-full object-cover" alt="Zdjęcie ${i+1}" />
                        ${allImages.length > 1 ? `<div class="absolute bottom-2 right-4 bg-black/60 text-white text-xs px-2 py-1 rounded backdrop-blur-sm">${i+1}/${allImages.length}</div>` : ''}
                    </div>
                `).join('');

                imagesHtml = `
                    <div class="w-full flex overflow-x-auto snap-x snap-mandatory scrollbar-hide relative char-details-carousel">
                        ${slides}
                    </div>
                `;
            } else {
                imagesHtml = `
                    <div class="w-full h-48 bg-zinc-800 flex items-center justify-center">
                        <i class="fa-solid fa-hand-holding-heart text-5xl text-zinc-700"></i>
                    </div>
                `;
            }

            const title = escapeHtml(item.title || '');
            const description = escapeHtml(item.description || '').replace(/\n/g, '<br>');
            
            body.innerHTML = `
                ${imagesHtml}
                <div class="p-6 md:p-8">
                    <h2 class="text-2xl md:text-3xl font-bold uppercase font-[Orbitron] coyote-text mb-4">${title}</h2>
                    <div class="prose prose-invert prose-stone max-w-none text-zinc-300 tracking-wide leading-relaxed text-sm md:text-base">
                        ${description || 'Brak dodatkowego opisu.'}
                    </div>
                    
                    <div class="mt-8 pt-6 border-t border-zinc-800 flex flex-col md:flex-row gap-4 items-center justify-between">
                        <button onclick="window.handleCharityActionClick(event, '${escapeHtml(item.buttonLink || '')}')" class="w-full md:w-auto bg-coyote hover:bg-white text-black transition font-bold text-sm tracking-widest py-4 px-8 rounded-lg uppercase flex items-center justify-center gap-3">
                            <i class="fa-solid fa-heart text-red-600"></i> WESPRZYJ AKCJĘ
                        </button>
                        <button onclick="closeCharityDetails()" class="w-full md:w-auto px-6 py-4 text-sm font-bold uppercase tracking-widest text-zinc-400 hover:text-white transition">
                            Zamknij
                        </button>
                    </div>
                </div>
            `;

            modal.classList.remove('hidden');
            // Allow display block to apply before changing opacity
            requestAnimationFrame(() => {
                modal.classList.remove('opacity-0');
                content.classList.remove('scale-95');
            });
        };

        window.closeCharityDetails = () => {
            const modal = document.getElementById('charity-details-modal');
            const content = document.getElementById('charity-details-content');
            
            modal.classList.add('opacity-0');
            content.classList.add('scale-95');
            
            setTimeout(() => {
                modal.classList.add('hidden');
            }, 300); // Matches duration-300
        };

        function renderCharityCarousel() {
            const track = document.getElementById('charity-track');
            if (!track) return;

            charityCarouselAnimating = false;
            charityPendingMoves = 0;

            const cardsHtml = [buildPinnedDonateCard(), ...publicCharityItems.map((item) => buildCharityCard(item))];
            track.innerHTML = cardsHtml.join('');
            track.style.transition = 'none';
            track.style.transform = 'translateX(0)';
            void track.offsetHeight;
            track.style.transition = `transform ${CHARITY_CAROUSEL_DURATION_MS}ms cubic-bezier(0.22, 0.61, 0.36, 1)`;

            window.requestAnimationFrame(updateCharityCarouselControls);
        }

        window.addEventListener('resize', () => {
            window.requestAnimationFrame(updateCharityCarouselControls);
        });

        // Globalne funkcje
        window.toggleAdminModal = () => document.getElementById('admin-modal').classList.toggle('hidden');
        window.switchTab = (id) => {
            document.querySelectorAll('.admin-tab').forEach(t => t.classList.add('hidden'));
            document.getElementById('tab-' + id).classList.remove('hidden');
            if(id === 'charity') fetchCharityActions();
        };


        // Funkcja do rozwinięcia klauzuli donacji na stronie dokumentów
        window.expandDonationClause = () => {
            // Przechowujemy informację o tym, że należy rozwinąć klauzulę donacji
            sessionStorage.setItem('expandDonationClause', 'true');
            // Przenosimy do strony dokumentów
            window.location.href = 'https://dokumenty.strzelca.pl#donation-clause';
        };

        // Funkcje autoryzacji
        window.handleLogin = async () => {
            const email = document.getElementById('adm-user').value;
            const pass = document.getElementById('adm-pass').value;

            if (!email || !pass) {
                alert("Wprowadź email i hasło.");
                return;
            }

            try {
                await signInWithEmailAndPassword(auth, email, pass);
            } catch (err) {
                alert("Błąd autoryzacji: Nieuprawniony dostęp.");
            }
        };

        onAuthStateChanged(auth, async (user) => {
            if (user) {
                // Sprawdź czy sesja jest ważna wg SessionManager
                if (typeof window.sessionManager !== 'undefined' && window.sessionManager) {
                    if (!window.sessionManager.isSessionValid()) {
                        console.log('Session expired according to SessionManager, signing out from Firebase');
                        await signOut(auth);
                        return;
                    }
                }

                document.getElementById('login-section').classList.add('hidden');
                document.getElementById('admin-panel').classList.remove('hidden');
                window.switchTab('charity');
                currentUser = user;
                updateUserPanel();
            } else {
                document.getElementById('login-section').classList.remove('hidden');
                document.getElementById('admin-panel').classList.add('hidden');
                currentUser = null;
            }
        });

        window.handleLogout = async () => {
            if(confirm("Czy na pewno wylogować?")) {
                await signOut(auth);
                // Zatrzymaj sprawdzanie sesji przez SessionManager
                if (typeof window.sessionManager !== 'undefined' && window.sessionManager) {
                    window.sessionManager.stopSessionCheck();
                }
            }
        };

        // Funkcja pomocnicza do generowania domyślnego awatara
        function getDefaultAvatar(gender) {
            return '<i class="fa-solid fa-user text-white"></i>';
        }

        // Funkcja rozwijania/zwijania menu użytkownika
        window.toggleUserMenu = () => {
            const userMenu = document.getElementById("user-menu");
            if (userMenu) {
                userMenu.classList.toggle("hidden");
            }
        };

        // Zamykanie menu po kliknięciu poza nim
        document.addEventListener("click", (event) => {
            const userPanel = document.getElementById("user-panel");
            const userMenu = document.getElementById("user-menu");
            
            if (
                userPanel &&
                userMenu &&
                !userPanel.contains(event.target) &&
                !userMenu.classList.contains("hidden")
            ) {
                userMenu.classList.add("hidden");
            }
        });

        // Funkcja panelu użytkownika
        async function updateUserPanel() {
            const loginBtn = document.getElementById('login-button');
            const userPanel = document.getElementById('user-panel');
            const userDisplayName = document.getElementById('user-display-name');
            const userAvatar = document.getElementById('user-avatar');
            const profileLink = document.getElementById('profile-link');

            if (currentUser) {
                loginBtn.classList.add('hidden');
                userPanel.classList.remove('hidden');

                // Wyświetl nazwę użytkownika
                const displayName = currentUser.displayName || currentUser.email.split("@")[0];
                if (userDisplayName) {
                    userDisplayName.textContent = displayName;
                }

                // Profil zawsze prowadzi do profilu (weryfikacja emaila jest sprawdzana wyłącznie przy logowaniu)
                if (profileLink) {
                    profileLink.href = "https://konto.strzelca.pl/profil.html";
                }

                // Pobierz awatar z profilu użytkownika
                try {
                    const profileDoc = await getDoc(doc(db, "userProfiles", currentUser.uid));
                    if (profileDoc.exists()) {
                        const profile = profileDoc.data();
                        if (profile.displayName && userDisplayName) {
                            userDisplayName.textContent = profile.displayName;
                        }
                        if (userAvatar) {
                            if (profile.avatar) {
                                // Jeśli użytkownik ma awatar, wyświetl go
                                userAvatar.innerHTML = `<img src="${profile.avatar}" alt="Avatar" class="w-full h-full rounded-full object-cover">`;
                            } else {
                                // Użyj domyślnego awatara
                                userAvatar.innerHTML = getDefaultAvatar(profile.gender);
                            }
                        }
                    } else {
                        // Jeśli profil nie istnieje, użyj domyślnego awatara
                        if (userAvatar) {
                            userAvatar.innerHTML = getDefaultAvatar();
                        }
                    }
                } catch (error) {
                    console.error('Error loading user profile:', error);
                    if (userAvatar) {
                        userAvatar.innerHTML = getDefaultAvatar();
                    }
                }
            } else {
                loginBtn.classList.remove('hidden');
                userPanel.classList.add('hidden');
            }
        }

        window.logout = async () => {
            try {
                // SSO: wyczyść cookie wspólnej sesji
                try {
                    await fetch("https://strzelca.pl/api/sso-session-logout", {
                        method: "POST",
                        credentials: "include",
                    });
                } catch (e) {
                    console.warn("SSO logout failed (ignored):", e?.message || e);
                }
                await signOut(auth);
                // Zamknij menu po wylogowaniu
                const userMenu = document.getElementById("user-menu");
                if (userMenu) {
                    userMenu.classList.add("hidden");
                }
            } catch (error) {
                console.error('Logout error:', error);
            }
        };

        // Funkcje kompresji obrazów
        async function compressImage(file) {
            return new Promise((resolve) => {
                const reader = new FileReader(); reader.readAsDataURL(file);
                reader.onload = (e) => {
                    const img = new Image(); img.src = e.target.result;
                    img.onload = () => {
                        const canvas = document.createElement('canvas');
                        const MAX_W = 800; let w = img.width, h = img.height;
                        if (w > MAX_W) { h *= MAX_W / w; w = MAX_W; }
                        canvas.width = w; canvas.height = h;
                        const ctx = canvas.getContext('2d'); ctx.drawImage(img, 0, 0, w, h);
                        resolve(canvas.toDataURL('image/jpeg', 0.7));
                    };
                };
            });
        }

        // Funkcje dla obsługi wielu zdjęć (podobnie jak w admin/index.html)
        window.handleCharityImageUpload = async (event) => {
            const files = event.target.files;
            if (!files || files.length === 0) return;
            try {
                const processPromises = Array.from(files).map(file => compressImage(file));
                const base64Images = await Promise.all(processPromises);
                base64Images.forEach(base64 => {
                    charityImages.push({ url: base64, order: charityImages.length });
                });
                renderCharityImagesAdmin();
                alert(`Dodano ${base64Images.length} zdjęć.`);
            } catch (error) {
                console.error("Błąd przesyłania zdjęć:", error);
                alert("Błąd podczas wgrywania zdjęć.");
            }
        };

        window.removeCharityImage = (index) => {
            if (confirm("Usunąć to zdjęcie?")) {
                charityImages.splice(index, 1);
                charityImages.forEach((img, idx) => img.order = idx);
                renderCharityImagesAdmin();
            }
        };

        window.moveCharityImageUp = (index) => {
            if (index > 0) {
                [charityImages[index], charityImages[index - 1]] = [charityImages[index - 1], charityImages[index]];
                charityImages.forEach((img, idx) => img.order = idx);
                renderCharityImagesAdmin();
            }
        };

        window.moveCharityImageDown = (index) => {
            if (index < charityImages.length - 1) {
                [charityImages[index], charityImages[index + 1]] = [charityImages[index + 1], charityImages[index]];
                charityImages.forEach((img, idx) => img.order = idx);
                renderCharityImagesAdmin();
            }
        };

        function renderCharityImagesAdmin() {
            const container = document.getElementById("charity-images-container");
            if (!container) return;

            if (charityImages.length === 0) {
                container.innerHTML = '<div class="col-span-full py-4 text-center text-zinc-500 text-xs bg-zinc-800/50 rounded border border-zinc-700">Brak dodanych zdjęć</div>';
                return;
            }

            container.innerHTML = charityImages.map((img, index) => `
                <div class="relative group bg-zinc-800 rounded overflow-hidden border border-zinc-700 aspect-square text-xs">
                    <img src="${img.url}" alt="Zdjęcie ${index + 1}" class="w-full h-full object-cover">
                    ${index === 0 ? '<div class="absolute top-1 left-1 bg-coyote text-black text-[9px] font-bold px-1 rounded">Okładka</div>' : ''}
                    <div class="absolute inset-0 bg-black/60 opacity-0 group-hover:opacity-100 transition-opacity flex items-center justify-center gap-1">
                        <button type="button" onclick="window.moveCharityImageUp(${index})" class="p-1.5 bg-zinc-900 rounded-full hover:bg-coyote hover:text-black transition ${index === 0 ? 'opacity-50 cursor-not-allowed' : ''}" ${index === 0 ? 'disabled' : ''}>
                            <i class="fa-solid fa-arrow-left"></i>
                        </button>
                        <button type="button" onclick="window.removeCharityImage(${index})" class="p-1.5 bg-red-900/80 rounded-full hover:bg-red-500 transition text-white">
                            <i class="fa-solid fa-trash"></i>
                        </button>
                        <button type="button" onclick="window.moveCharityImageDown(${index})" class="p-1.5 bg-zinc-900 rounded-full hover:bg-coyote hover:text-black transition ${index === charityImages.length - 1 ? 'opacity-50 cursor-not-allowed' : ''}" ${index === charityImages.length - 1 ? 'disabled' : ''}>
                            <i class="fa-solid fa-arrow-right"></i>
                        </button>
                    </div>
                </div>
            `).join("");
        }

        // Funkcje zarządzania akcjami charytatywnymi
        window.saveCharity = async () => {
            const id = document.getElementById('charity-edit-id').value || Date.now().toString();

            try {
                let finalImages = [...charityImages];
                let finalImage = finalImages.length > 0 ? finalImages[0].url : "";

                await setDoc(doc(db, "charity", id), {
                    title: document.getElementById('charity-title').value,
                    date: document.getElementById('charity-date').value,
                    description: document.getElementById('charity-description').value,
                    buttonLink: document.getElementById('charity-button-link').value,
                    image: finalImage,
                    images: finalImages,
                    active: document.getElementById('charity-active').checked,
                    order: document.getElementById('charity-edit-id').value ? (charityActions.find(c => c.id === id)?.order || charityActions.length) : charityActions.length,
                    created: Date.now()
                });

                alert("Akcja została zapisana!");
                clearCharityForm();
                fetchCharityActions();
            } catch (err) {
                console.error(err);
                alert("Błąd podczas zapisywania akcji.");
            }
        };

        function clearCharityForm() {
            document.getElementById('charity-edit-id').value = '';
            document.getElementById('charity-title').value = '';
            document.getElementById('charity-date').value = '';
            document.getElementById('charity-description').value = '';
            document.getElementById('charity-button-link').value = '';
            document.getElementById('charity-image-file').value = '';
            document.getElementById('charity-active').checked = true;
            charityImages = [];
            renderCharityImagesAdmin();
        }

        async function fetchCharityActions() {
            const q = query(collection(db, "charity"), orderBy("order", "asc"));
            const snap = await getDocs(q);
            const list = document.getElementById('charity-list-admin');

            list.innerHTML = "";
            charityActions = [];
            publicCharityItems = [];

            snap.forEach(d => {
                const data = d.data();
                charityActions.push({id: d.id, ...data});

                // Lista w panelu admina
                list.innerHTML += `<div class="flex justify-between items-center p-3 bg-black/40 border border-zinc-800 rounded mb-1">
                    <span class="text-[10px] font-bold uppercase">${data.title}</span>
                    <div class="flex space-x-2">
                        <button onclick="window.editCharity('${d.id}')" class="text-blue-400 text-xs">Edytuj</button>
                        <button onclick="window.deleteCharity('${d.id}')" class="text-red-400 text-xs">Usuń</button>
                    </div>
                </div>`;

                // Wyświetlanie na stronie publicznej tylko aktywne akcje
                if(data.active) {
                    publicCharityItems.push({id: d.id, ...data});
                }
            });

            renderCharityCarousel();
        }

        function formatDateTimeForInput(date) {
            if (!date) return "";
            const d = date instanceof Date ? date : new Date(date);
            const year = d.getFullYear();
            const month = String(d.getMonth() + 1).padStart(2, "0");
            const day = String(d.getDate()).padStart(2, "0");
            const hours = String(d.getHours()).padStart(2, "0");
            const minutes = String(d.getMinutes()).padStart(2, "0");
            return `${year}-${month}-${day}T${hours}:${minutes}`;
        }

        window.editCharity = (id) => {
            const charity = charityActions.find(c => c.id === id);
            if(charity) {
                document.getElementById('charity-edit-id').value = charity.id;
                document.getElementById('charity-title').value = charity.title;
                document.getElementById('charity-date').value = charity.date ? formatDateTimeForInput(charity.date) : '';
                document.getElementById('charity-description').value = charity.description;
                document.getElementById('charity-button-link').value = charity.buttonLink || '';
                document.getElementById('charity-active').checked = charity.active;
                
                charityImages = [...(charity.images || (charity.image ? [{url: charity.image, order: 0}] : []))];
                renderCharityImagesAdmin();
            }
        };

        window.deleteCharity = async (id) => {
            if(confirm("Usuń akcję?")) {
                await deleteDoc(doc(db, "charity", id));
                fetchCharityActions();
            }
        };

        // Załaduj akcje przy starcie strony
        fetchCharityActions();
    </script>
