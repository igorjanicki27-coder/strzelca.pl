        // Load events from Firebase
        async function loadEvents() {
            try {
                const wait = (ms) => new Promise((resolve) => setTimeout(resolve, ms));
                const maxAttempts = 3;

                for (let attempt = 1; attempt <= maxAttempts; attempt++) {
                    try {
                        const { payload } = await loadWithVersionCache({
                            db,
                            getDoc,
                            doc,
                            idbKey: "list:blogPosts",
                            metaDocId: "blogPosts",
                            fetchFresh: async () => {
                                let querySnapshot;
                                try {
                                    const q = query(collection(db, "blogPosts"), where("status", "==", "published"));
                                    querySnapshot = await getDocs(q);
                                } catch (orderByError) {
                                    console.warn("blogPosts query failed, fallback:", orderByError);
                                    querySnapshot = await getDocs(collection(db, "blogPosts"));
                                }
                                const built = [];
                                querySnapshot.forEach((docSnap) => {
                                    const event = docSnap.data();
                                    if (event.status === 'published') {
                                        let dateObj = new Date();
                                        const ca = event.createdAt;
                                        if (ca) {
                                            if (typeof ca.toDate === 'function') {
                                                dateObj = ca.toDate();
                                            } else if (typeof ca === 'object' && ca.seconds != null) {
                                                dateObj = new Date(ca.seconds * 1000);
                                            } else {
                                                dateObj = new Date(ca);
                                            }
                                        }
                                        built.push({
                                            id: docSnap.id,
                                            ...event,
                                            dateObj: dateObj,
                                            category: event.category || 'news',
                                            pinned: !!event.pinned
                                        });
                                    }
                                });
                                return built;
                            },
                        });
                        allEvents = Array.isArray(payload) ? payload : [];
                        allEvents.sort((a, b) => compareBlogPosts(a, b));
                        updateLastUpdate();
                        applyBlogSearch();
                        if (!blogAutoOpenDone && blogAutoOpenId) {
                            blogAutoOpenDone = true;
                            showEventDetail(blogAutoOpenId);
                        }
                        return;
                    } catch (error) {
                        console.warn(`Load blog attempt ${attempt}/${maxAttempts} failed:`, error);
                        if (attempt < maxAttempts) {
                            await wait(450 * attempt);
                            continue;
                        }
                        throw error;
                    }
                }
            } catch (error) {
                console.error('Error loading events:', error);
                console.error('Error details:', {
                    message: error.message,
                    code: error.code,
                    stack: error.stack
                });
                
                // Jeśli błąd związany z indeksem, pokaż bardziej pomocny komunikat
                let errorMessage = 'Błąd ładowania wydarzeń';
                if (error.code === 'failed-precondition') {
                    errorMessage = 'Błąd: Brak indeksu w Firestore. Skontaktuj się z administratorem.';
                } else if (error.message?.includes('index')) {
                    errorMessage = 'Błąd: Wymagany indeks Firestore. Sprawdź konsolę przeglądarki.';
                }
                
                const track = document.getElementById('events-track');
                if (track) {
                    track.classList.remove('carousel-track--single');
                    track.innerHTML = `
                        <article class="card-dark event-carousel-card carousel-status-message">
                            <p class="text-red-500 font-bold mb-2">${errorMessage}</p>
                            <p class="text-sm text-zinc-500">${error.message || 'Nieznany błąd'}</p>
                        </article>
                    `;
                    updateEventsCarouselControls();
                }
            }
        }

        function updateLastUpdate() {
            const el = document.getElementById('last-update');
            if (el) {
                el.textContent = new Date().toLocaleString('pl-PL');
            }
        }

        function updateEventsCount() {
            const now = new Date();
            const totalCount = filteredEvents.length;
            const activeCount = filteredEvents.filter(e => !isEventCompleted(e, now)).length;

            const legacyEl = document.getElementById('events-count');
            if (legacyEl) {
                if (totalCount === 0) {
                    legacyEl.textContent = 'Brak wydarzeń';
                } else if (activeCount === totalCount) {
                    legacyEl.textContent = `${totalCount} ${totalCount === 1 ? 'wydarzenie' : totalCount < 5 ? 'wydarzenia' : 'wydarzeń'}`;
                } else {
                    legacyEl.textContent = `${activeCount} aktywnych z ${totalCount}`;
                }
            }
        }

        function applyBlogSearch() {
            const q = '';
            const qLower = q.toLowerCase();
            if (!qLower) {
                filteredEvents = [...allEvents];
            } else {
                filteredEvents = allEvents.filter((post) => blogPostMatchesQuery(post, qLower));
            }

            updateEventsCount();
            renderEventsList();
        }

        // Scroll tracking for calendar highlighting
        function setupScrollTracking() {
            const container = document.getElementById('events-container');
            if (!container) return;
            container.addEventListener('scroll', updateScrollPosition, { passive: true });

            // Also track window scroll if needed
            window.addEventListener('scroll', updateScrollPosition, { passive: true });
        }

        function updateScrollPosition() {
            const dayHeaders = document.querySelectorAll('.day-header');
            const calendarDays = document.querySelectorAll('.calendar-day');

            // Find which day is currently most visible
            let currentDay = null;
            dayHeaders.forEach(header => {
                const rect = header.getBoundingClientRect();
                if (rect.top <= window.innerHeight / 2 && rect.bottom >= window.innerHeight / 2) {
                    currentDay = header.dataset.date;
                }
            });

            if (currentDay) {
                userScrollPosition = currentDay;
                highlightCalendarDay(currentDay);
            }
        }

        function highlightCalendarDay(dateStr) {
            document.querySelectorAll('.calendar-day').forEach(day => {
                day.classList.remove('selected');
                if (day.dataset.date === dateStr) {
                    day.classList.add('selected');
                }
            });
        }

        function buildBlogCarouselCardHtml(event) {
            const safeTitle = escapeHtml(event.title || 'Bez tytułu');
            const safeCategory = escapeHtml(getEventCategoryName(event.category).toLocaleUpperCase('pl-PL'));
            const dateLabel = getBlogPostDate(event).toLocaleDateString('pl-PL', {
                day: '2-digit',
                month: '2-digit',
                year: 'numeric'
            });
            const likeCount = Number(event.likeCount || 0);
            const commentCount = Number(event.commentCount || 0);

            const cardThumb = getBlogPostImageUrls(event)[0];
            return `
                    <article class="card-dark event-carousel-card" style="padding: 0; padding-bottom: 1rem;" data-event-id="${encodeURIComponent(event.id)}">
                        ${cardThumb ? `<img src="${cardThumb}" style="width: 100%; height: 160px; object-fit: cover; border-top-left-radius: 12px; border-top-right-radius: 12px; margin-bottom: 0.5rem;" alt="">` : ''}
                        <div style="padding: 0 1rem;">
                            <p class="event-category-slot" style="margin-top: 0.5rem;">${safeCategory}</p>
                            <div class="event-divider"></div>
                            <h3 class="event-title">${safeTitle}</h3>
                            <div class="event-divider"></div>
                            <div class="event-data-slot" style="margin-top: 0.5rem;">
                                <p class="event-meta-row"><i class="fa-solid fa-calendar-day text-coyote/80 mr-1"></i>${dateLabel}</p>
                            </div>
                            <div class="blog-card-stats">
                                <span class="blog-card-stat"><i class="fa-solid fa-heart text-coyote/80"></i>${likeCount}</span>
                                <span class="blog-card-stat"><i class="fa-solid fa-comments text-coyote/80"></i>${commentCount}</span>
                            </div>
                            <div class="mt-3 pt-2 border-t border-zinc-700/50">
                                <button type="button" data-blog-read-id="${encodeURIComponent(event.id)}" aria-label="Czytaj wpis ${safeTitle}" class="shop-cta-btn">
                                    CZYTAJ
                                </button>
                            </div>
                        </div>
                    </article>
                `;
        }

        function bindBlogCarouselInteractions(track) {
            track.querySelectorAll('.event-carousel-card[data-event-id]').forEach((cardEl) => {
                cardEl.addEventListener('click', () => {
                    const eventId = decodeURIComponent(cardEl.dataset.eventId || '');
                    if (eventId) showEventDetail(eventId);
                });
            });
            track.querySelectorAll('[data-blog-read-id]').forEach((btn) => {
                btn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    const eventId = decodeURIComponent(btn.getAttribute('data-blog-read-id') || '');
                    if (eventId) showEventDetail(eventId);
                });
            });
        }

        // Render events as a single carousel track in shop style
        function renderEventsList() {
            const track = document.getElementById('events-track');
            if (!track) return;

            eventCarouselAnimating = false;
            eventPendingMoves = 0;

            if (filteredEvents.length === 0) {
                blogCarouselSorted = [];
                blogCarouselLeftIndex = 0;
                track.classList.remove('carousel-track--single');
                track.innerHTML = buildEmptyCarouselArticleHtml(
                    'card-dark event-carousel-card carousel-status-message event-carousel-empty-wide',
                );
                updateEventsCarouselControls();
                syncBlogCarouselDots();
                return;
            }

            const sortedEvents = [...filteredEvents].sort((a, b) => compareBlogPosts(a, b));

            blogCarouselSorted = sortedEvents;
            blogCarouselLeftIndex = 0;

            track.innerHTML = sortedEvents.map((event) => buildBlogCarouselCardHtml(event)).join('');

            track.classList.toggle('carousel-track--single', sortedEvents.length === 1);

            bindBlogCarouselInteractions(track);

            track.style.transition = 'none';
            track.style.transform = 'translateX(0)';
            void track.offsetHeight;
            track.style.transition = `transform ${EVENT_CAROUSEL_DURATION_MS}ms cubic-bezier(0.22, 0.61, 0.36, 1)`;
            window.requestAnimationFrame(updateEventsCarouselControls);
        }

        // Calendar functions
        function renderCalendar() {
            const grid = document.getElementById('calendar-grid');
            grid.innerHTML = '';

            const today = new Date();
            const todayStr = today.toDateString();

            if (currentView === 'month') {
                // Month view - current month
                const firstDay = new Date(currentDate.getFullYear(), currentDate.getMonth(), 1);
                const lastDay = new Date(currentDate.getFullYear(), currentDate.getMonth() + 1, 0);
                const startDate = new Date(firstDay);
                startDate.setDate(startDate.getDate() - firstDay.getDay() + 1); // Start from Monday

                for (let i = 0; i < 42; i++) {
                    const date = new Date(startDate);
                    date.setDate(startDate.getDate() + i);

                    const dateStr = date.toDateString();
                    const isCurrentMonth = date.getMonth() === currentDate.getMonth() && date.getFullYear() === currentDate.getFullYear();
                    const isToday = dateStr === todayStr;
                    const dayEvents = allEvents.filter(event =>
                        getBlogPostDate(event).toDateString() === dateStr
                    );

                    const dayDiv = document.createElement('div');
                    dayDiv.className = `calendar-day text-center ${isCurrentMonth ? '' : 'text-zinc-600'} ${isToday ? 'today' : ''} ${dayEvents.length > 0 ? 'has-events' : ''}`;
                    dayDiv.dataset.date = dateStr;
                    dayDiv.onclick = () => selectDate(date);

                    dayDiv.innerHTML = `
                        <div class="font-bold">${date.getDate()}</div>
                        ${dayEvents.length > 0 ? `<div class="text-xs">${dayEvents.length}</div>` : ''}
                    `;

                    grid.appendChild(dayDiv);
                }
            } else {
                // Week view - current week
                const startOfWeek = new Date(currentDate);
                startOfWeek.setDate(currentDate.getDate() - currentDate.getDay() + 1); // Monday

                for (let i = 0; i < 7; i++) {
                    const date = new Date(startOfWeek);
                    date.setDate(startOfWeek.getDate() + i);

                    const dateStr = date.toDateString();
                    const isToday = dateStr === todayStr;
                    const dayEvents = allEvents.filter(event =>
                        getBlogPostDate(event).toDateString() === dateStr
                    );

                    const dayDiv = document.createElement('div');
                    dayDiv.className = `calendar-day text-center ${isToday ? 'today' : ''} ${dayEvents.length > 0 ? 'has-events' : ''}`;
                    dayDiv.dataset.date = dateStr;
                    dayDiv.onclick = () => selectDate(date);

                    dayDiv.innerHTML = `
                        <div class="font-bold">${date.getDate()}</div>
                        ${dayEvents.length > 0 ? `<div class="text-xs">${dayEvents.length}</div>` : ''}
                    `;

                    grid.appendChild(dayDiv);
                }
            }
        }

        function updateCalendarPeriodDisplay() {
            const display = document.getElementById('calendar-period-display');
            if (currentView === 'month') {
                const monthNames = ['Styczeń', 'Luty', 'Marzec', 'Kwiecień', 'Maj', 'Czerwiec',
                                   'Lipiec', 'Sierpień', 'Wrzesień', 'Październik', 'Listopad', 'Grudzień'];
                display.textContent = `${monthNames[currentDate.getMonth()]} ${currentDate.getFullYear()}`;
            } else {
                const startOfWeek = new Date(currentDate);
                startOfWeek.setDate(currentDate.getDate() - currentDate.getDay() + 1);
                const endOfWeek = new Date(startOfWeek);
                endOfWeek.setDate(startOfWeek.getDate() + 6);

                const startDay = startOfWeek.getDate();
                const endDay = endOfWeek.getDate();
                const monthNames = ['Sty', 'Lut', 'Mar', 'Kwi', 'Maj', 'Cze',
                                   'Lip', 'Sie', 'Wrz', 'Paź', 'Lis', 'Gru'];

                if (startOfWeek.getMonth() === endOfWeek.getMonth()) {
                    display.textContent = `${startDay}-${endDay} ${monthNames[startOfWeek.getMonth()]}`;
                } else {
                    display.textContent = `${startDay} ${monthNames[startOfWeek.getMonth()]} - ${endDay} ${monthNames[endOfWeek.getMonth()]}`;
                }
            }
        }

        function toggleCalendarView() {
            currentView = currentView === 'week' ? 'month' : 'week';
            const toggleBtn = document.getElementById('view-toggle-btn');
            toggleBtn.innerHTML = currentView === 'week' ?
                '<i class="fa-solid fa-calendar-week"></i>' :
                '<i class="fa-solid fa-calendar"></i>';
            toggleBtn.title = currentView === 'week' ? 'Widok tygodnia' : 'Widok miesiąca';
            updateCalendarPeriodDisplay();
            renderCalendar();
        }

        function previousPeriod() {
            if (currentView === 'month') {
                currentDate.setMonth(currentDate.getMonth() - 1);
            } else {
                currentDate.setDate(currentDate.getDate() - 7);
            }
            updateCalendarPeriodDisplay();
            renderCalendar();
        }

        function nextPeriod() {
            if (currentView === 'month') {
                currentDate.setMonth(currentDate.getMonth() + 1);
            } else {
                currentDate.setDate(currentDate.getDate() + 7);
            }
            updateCalendarPeriodDisplay();
            renderCalendar();
        }

        function selectDate(date) {
            const dateStr = date.toDateString();

            // Highlight selected date
            highlightCalendarDay(dateStr);

            // Scroll to the day in the events list
            const dayHeader = document.querySelector(`.day-header[data-date="${dateStr}"]`);
            if (dayHeader) {
                dayHeader.scrollIntoView({
                    behavior: 'smooth',
                    block: 'start',
                    inline: 'nearest'
                });
            } else {
                showNotification(`Brak wydarzeń w dniu ${date.toLocaleDateString('pl-PL')}`);
            }
        }

        function showNotification(message) {
            // Simple notification - you can enhance this
            const notification = document.createElement('div');
            notification.className = 'fixed top-4 right-4 bg-zinc-900 border border-zinc-700 rounded-lg p-4 z-50 max-w-sm';
            notification.innerHTML = `
                <div class="text-sm">${message}</div>
                <button onclick="this.parentElement.remove()" class="mt-2 text-coyote hover:underline text-xs">Zamknij</button>
            `;
            document.body.appendChild(notification);
            setTimeout(() => notification.remove(), 5000);
        }

        // Event detail modal
        function showEventDetail(eventId) {
            const event = allEvents.find(e => e.id === eventId);
            if (!event) {
                console.error('Event not found:', eventId);
                if (blogEmbedMode) {
                    notifyParentCloseInEmbedMode();
                }
                return;
            }

            document.getElementById('modal-title').textContent = event.title;

            const meta = [];
            meta.push(`<div class="detail-meta-item"><i class="fa-solid fa-calendar text-coyote"></i><span>${getBlogPostDate(event).toLocaleString('pl-PL', {
                year: 'numeric',
                month: 'long',
                day: 'numeric'
            })}</span></div>`);
            meta.push(`<div class="detail-meta-item"><i class="fa-solid fa-tag text-coyote"></i><span>${getEventCategoryName(event.category)}</span></div>`);

            document.getElementById('modal-meta').innerHTML = `<div class="detail-meta-grid">${meta.join('')}</div>`;

            if (window.blogGalleryKeyHandler) {
                document.removeEventListener('keydown', window.blogGalleryKeyHandler);
                window.blogGalleryKeyHandler = null;
            }

            const images = getBlogPostImageUrls(event);
            const safeTitle = escapeHtml(event.title || 'Wpis');
            let htmlContent = '';

            if (images.length > 0) {
                htmlContent += `
                    <div class="blog-post-gallery" id="blog-post-gallery">
                        <img id="blog-gallery-main-img" src="${images[0]}" alt="${safeTitle}" />
                        ${images.length > 1 ? `
                            <button type="button" class="blog-gallery-nav prev" onclick="window.changeBlogGalleryImage(-1, ${images.length})" id="blog-gallery-prev" disabled aria-label="Poprzednie zdjęcie">
                                <i class="fa-solid fa-chevron-left"></i>
                            </button>
                            <button type="button" class="blog-gallery-nav next" onclick="window.changeBlogGalleryImage(1, ${images.length})" id="blog-gallery-next" aria-label="Następne zdjęcie">
                                <i class="fa-solid fa-chevron-right"></i>
                            </button>
                            <div class="blog-gallery-counter" aria-live="polite">
                                <span id="blog-gallery-current">1</span> / <span id="blog-gallery-total">${images.length}</span>
                            </div>
                        ` : ''}
                    </div>`;
                window.currentBlogPostImages = images;
                window.currentBlogGalleryIndex = 0;
                if (images.length > 1) {
                    const handleKeyPress = (e) => {
                        if (e.key === 'ArrowLeft' && window.currentBlogGalleryIndex > 0) {
                            window.changeBlogGalleryImage(-1, images.length);
                        } else if (e.key === 'ArrowRight' && window.currentBlogGalleryIndex < images.length - 1) {
                            window.changeBlogGalleryImage(1, images.length);
                        }
                    };
                    window.blogGalleryKeyHandler = handleKeyPress;
                    document.addEventListener('keydown', handleKeyPress);
                }
                updateBlogGalleryNavButtons(images.length);
            } else {
                window.currentBlogPostImages = [];
                window.currentBlogGalleryIndex = 0;
            }

            htmlContent += `<div class="blog-post-body">${formatBlogPostBody(event.content)}</div>`;
            htmlContent += `
                <div class="blog-social-row">
                    <button type="button" id="blog-post-like-btn" class="blog-social-btn ${currentBlogPostLiked ? 'is-active' : ''}">
                        <i class="fa-solid fa-heart"></i>
                        <span id="blog-post-like-count">${Number(event.likeCount || 0)}</span>
                    </button>
                    <div class="blog-social-btn blog-social-btn--static">
                        <i class="fa-solid fa-comments"></i>
                        <span id="blog-post-comments-count">${Number(event.commentCount || 0)}</span>
                    </div>
                </div>
                <section class="blog-comments-section">
                    <div class="blog-comments-title">
                        <h3 class="text-lg md:text-xl font-bold text-white">Komentarze</h3>
                        <div class="text-xs text-zinc-500">Odpowiadaj, lajkuj i edytuj własne komentarze.</div>
                    </div>
                    <div class="blog-comment-form-card">
                        <div id="blog-comment-banner" class="blog-comment-banner">
                            <span id="blog-comment-banner-text"></span>
                            <button type="button" class="text-zinc-300 hover:text-white" onclick="window.cancelBlogCommentMode()">
                                <i class="fa-solid fa-times"></i>
                            </button>
                        </div>
                        <textarea id="blog-comment-textarea" class="blog-comment-textarea" placeholder="Napisz komentarz do wpisu..."></textarea>
                        <div class="blog-comment-toolbar">
                            <div id="blog-comment-note" class="blog-comment-note"></div>
                            <div class="flex flex-wrap items-center gap-3">
                                <button type="button" class="blog-comment-action" onclick="window.cancelBlogCommentMode()">Anuluj</button>
                                <button type="button" id="blog-comment-submit" class="blog-social-btn">
                                    <i class="fa-solid fa-paper-plane mr-2"></i>Dodaj komentarz
                                </button>
                            </div>
                        </div>
                    </div>
                    <div id="blog-comments-list"></div>
                </section>
            `;

            document.getElementById('modal-content').innerHTML = htmlContent;
            const likeBtn = document.getElementById('blog-post-like-btn');
            const submitBtn = document.getElementById('blog-comment-submit');
            if (likeBtn) {
                likeBtn.addEventListener('click', () => window.toggleBlogPostLike(event.id));
            }
            if (submitBtn) {
                submitBtn.addEventListener('click', () => window.submitBlogComment(event.id));
            }
            loadBlogPostInteractions(event.id);

            document.getElementById('event-modal').classList.remove('hidden');
        }

        function closeEventModal() {
            document.getElementById('event-modal').classList.add('hidden');
            document.getElementById('comment-history-modal')?.classList.add('hidden');
            currentBlogDetailId = null;
            resetBlogCommentComposer();
            stopBlogCommentCooldownTimer();
            if (window.blogGalleryKeyHandler) {
                document.removeEventListener('keydown', window.blogGalleryKeyHandler);
                window.blogGalleryKeyHandler = null;
            }
            notifyParentCloseInEmbedMode();
        }

        window.closeCommentHistoryModal = () => {
            document.getElementById('comment-history-modal')?.classList.add('hidden');
        };

        window.cancelBlogCommentMode = () => {
            resetBlogCommentComposer();
        };

        window.toggleBlogPostLike = async (postId) => {
            if (!currentUser) {
                showNotification("Musisz być zalogowany, aby polubić wpis.");
                return;
            }
            try {
                const result = await fetchBlogInteractionsApi({
                    action: "post.toggleLike",
                    postId,
                });
                currentBlogPostLiked = !!result.liked;
                const likeBtn = document.getElementById("blog-post-like-btn");
                const likeCount = document.getElementById("blog-post-like-count");
                if (likeBtn) likeBtn.classList.toggle("is-active", currentBlogPostLiked);
                if (likeCount) likeCount.textContent = String(result.likeCount || 0);
                updateBlogPostStatsInLocalState(postId, { likeCount: Number(result.likeCount || 0) });
            } catch (error) {
                showNotification(error.message || "Nie udało się polubić wpisu.");
            }
        };

        window.submitBlogComment = async (postId) => {
            if (!currentUser) {
                showNotification("Musisz być zalogowany, aby dodać komentarz.");
                return;
            }

            const textarea = document.getElementById("blog-comment-textarea");
            const content = textarea?.value || "";
            try {
                const result = await fetchBlogInteractionsApi({
                    action: currentEditingCommentId ? "comment.edit" : "comment.create",
                    postId,
                    commentId: currentEditingCommentId || undefined,
                    parentId: currentEditingCommentId ? undefined : (currentReplyToCommentId || undefined),
                    content,
                });

                if (!currentEditingCommentId) {
                    persistBlogCommentCooldown(postId, currentUser.uid, Number(result.cooldownUntil || (Date.now() + 5 * 60 * 1000)));
                    const post = allEvents.find((entry) => entry.id === postId);
                    updateBlogPostStatsInLocalState(postId, {
                        commentCount: Number(post?.commentCount || 0) + 1,
                    });
                }

                resetBlogCommentComposer();
                await loadBlogPostInteractions(postId);
            } catch (error) {
                if (error.code === "comment_cooldown" && error.remainingSeconds) {
                    persistBlogCommentCooldown(postId, currentUser.uid, Date.now() + Number(error.remainingSeconds) * 1000);
                }
                showNotification(error.message || "Nie udało się zapisać komentarza.");
            }
        };

        // Global functions for onclick handlers
        window.showEventDetail = showEventDetail;
        window.closeEventModal = closeEventModal;
        window.toggleCalendarView = toggleCalendarView;
        window.previousPeriod = previousPeriod;
        window.nextPeriod = nextPeriod;
    </script>
    <script
      type="module"
      src="https://strzelca.pl/auth-widget.mjs?v=2026-03-25-1"
    ></script>
    <script
      type="module"
      src="https://strzelca.pl/messages-widget.mjs?v=2026-03-23-1"
    ></script>
    <script type="module" src="https://strzelca.pl/global-search-widget.mjs?v=2026-03-24-1"></script>
  </body>
</html>
