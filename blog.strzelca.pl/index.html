        function escapeHtml(value) {
            return String(value ?? '')
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;');
        }

        function formatDate(value) {
            let date = null;
            if (value instanceof Date) {
                date = value;
            } else if (value && typeof value.toDate === 'function') {
                try {
                    date = value.toDate();
                } catch (_) {}
            } else if (value && typeof value === 'object' && value.seconds != null) {
                date = new Date(value.seconds * 1000);
            } else if (value && typeof value === 'object' && value._seconds != null) {
                date = new Date(value._seconds * 1000);
            } else if (value) {
                const parsed = new Date(value);
                if (!Number.isNaN(parsed.getTime())) {
                    date = parsed;
                }
            }
            if (!date || Number.isNaN(date.getTime())) return 'przed chwilą';
            return new Intl.DateTimeFormat('pl-PL', {
                day: '2-digit',
                month: '2-digit',
                year: 'numeric',
                hour: '2-digit',
                minute: '2-digit',
            }).format(date);
        }

        /** Data publikacji — zawsze Date (Firestore, cache IndexedDB, string ISO, { seconds }). */
        function getBlogPostDate(event) {
            if (!event) return new Date(0);
            const fromValue = (v) => {
                if (v instanceof Date && !Number.isNaN(v.getTime())) return v;
                if (typeof v === 'string' || typeof v === 'number') {
                    const x = new Date(v);
                    if (!Number.isNaN(x.getTime())) return x;
                }
                if (v && typeof v === 'object') {
                    if (typeof v.toDate === 'function') {
                        try {
                            const x = v.toDate();
                            if (x instanceof Date && !Number.isNaN(x.getTime())) return x;
                        } catch (_) { /* ignore */ }
                    }
                    if (v.seconds != null) {
                        const x = new Date(Number(v.seconds) * 1000);
                        if (!Number.isNaN(x.getTime())) return x;
                    }
                }
                return null;
            };
            let d = fromValue(event.dateObj);
            if (d) return d;
            d = fromValue(event.createdAt);
            if (d) return d;
            const legacy = new Date(event.date || 0);
            return Number.isNaN(legacy.getTime()) ? new Date(0) : legacy;
        }

        function isEventCompleted(event, now = new Date()) {
            return getBlogPostDate(event) < now;
        }

        function plainTextFromHtml(html) {
            return String(html || '')
                .replace(/<script[\s\S]*?<\/script>/gi, ' ')
                .replace(/<[^>]+>/g, ' ')
                .replace(/\s+/g, ' ')
                .trim();
        }

        /** Treść z panelu (Quill HTML) albo stary zwykły tekst — bezpieczne wyświetlanie w modalu. */
        function formatBlogPostBody(raw) {
            const s = String(raw || '').trim();
            if (!s) return '<p class="text-zinc-500">Brak treści wpisu.</p>';
            if (/<[a-z][\s\S]*>/i.test(s)) return s;
            return `<p>${escapeHtml(s).replace(/\n/g, '<br>')}</p>`;
        }

        /** Zdjęcia wpisu w kolejności z panelu (tablica images lub pojedyncze imageUrl). */
        function getBlogPostImages(event) {
            if (!event) return [];
            const images = [];
            if (event.images && Array.isArray(event.images) && event.images.length > 0) {
                const items = event.images
                    .map((img, idx) => {
                        if (typeof img === 'string') {
                            return { url: img, order: idx };
                        }
                        const url = img && img.url;
                        const order = img && typeof img === 'object' && img.order != null ? img.order : idx;
                        return {
                            url,
                            order,
                            posX: typeof img?.posX === 'number' ? img.posX : undefined,
                            posY: typeof img?.posY === 'number' ? img.posY : undefined,
                            zoom: typeof img?.zoom === 'number' ? img.zoom : undefined,
                        };
                    })
                    .filter((x) => x.url);
                items.sort((a, b) => a.order - b.order);
                items.forEach((x) => images.push({ url: x.url, posX: x.posX, posY: x.posY, zoom: x.zoom }));
            }
            if (images.length === 0 && event.imageUrl) {
                images.push({ url: event.imageUrl });
            }
            return images;
        }

        function updateBlogGalleryNavButtons(total) {
            const prevBtn = document.getElementById('blog-gallery-prev');
            const nextBtn = document.getElementById('blog-gallery-next');
            const idx = window.currentBlogGalleryIndex || 0;
            if (prevBtn) prevBtn.disabled = idx <= 0;
            if (nextBtn) nextBtn.disabled = idx >= total - 1;
        }

        window.changeBlogGalleryImage = (direction, total) => {
            if (!window.currentBlogPostImages || window.currentBlogPostImages.length === 0) return;
            const newIndex = (window.currentBlogGalleryIndex || 0) + direction;
            if (newIndex < 0 || newIndex >= total) return;
            window.currentBlogGalleryIndex = newIndex;
            const imgEl = document.getElementById('blog-gallery-main-img');
            if (imgEl) {
                const meta = window.currentBlogPostImages[window.currentBlogGalleryIndex];
                imgEl.src = meta?.url || '';
                if (meta && typeof meta.posX === 'number' && typeof meta.posY === 'number') {
                    imgEl.style.objectPosition = `${meta.posX}% ${meta.posY}%`;
                } else {
                    imgEl.style.objectPosition = '';
                }
                if (meta && typeof meta.zoom === 'number') {
                    const x = typeof meta.posX === 'number' ? meta.posX : 50;
                    const y = typeof meta.posY === 'number' ? meta.posY : 50;
                    imgEl.style.transform = `scale(${meta.zoom})`;
                    imgEl.style.transformOrigin = `${x}% ${y}%`;
                } else {
                    imgEl.style.transform = '';
                    imgEl.style.transformOrigin = '';
                }
            }
            const counter = document.getElementById('blog-gallery-current');
            if (counter) {
                counter.textContent = String(window.currentBlogGalleryIndex + 1);
            }
            updateBlogGalleryNavButtons(total);
        };

        function blogPostMatchesQuery(post, qLower) {
            if (!qLower) return true;
            const parts = [
                post.title,
                post.excerpt,
                plainTextFromHtml(post.content),
                getEventCategoryName(post.category),
            ];
            return parts.some((p) => String(p || '').toLowerCase().includes(qLower));
        }

        function compareBlogPosts(a, b) {
            if (a.pinned && !b.pinned) return -1;
            if (!a.pinned && b.pinned) return 1;
            const oa = typeof a.order === 'number' && !Number.isNaN(a.order) ? a.order : Infinity;
            const ob = typeof b.order === 'number' && !Number.isNaN(b.order) ? b.order : Infinity;
            if (oa !== ob) return oa - ob;
            return getBlogPostDate(b) - getBlogPostDate(a);
        }

        function showFatalError(err, label) {
            try {
                const track = document.getElementById('events-track');
                if (!track) return;
                track.classList.remove('carousel-track--single');
                track.classList.add('carousel-track--status-single');
                const msg = (err && (err.message || String(err))) || 'Nieznany błąd';
                track.innerHTML = `
                    <article class="card-dark event-carousel-card carousel-status-message">
                        <div class="flex flex-col items-center justify-center gap-2 w-full px-1 min-w-0">
                            <p class="text-red-400 uppercase tracking-[0.15em] text-xs text-center font-semibold">${label || 'Błąd aplikacji'}</p>
                            <p class="text-sm text-zinc-500 break-words text-center">${msg}</p>
                        </div>
                    </article>
                `;
                updateEventsCarouselControls();
            } catch (_) {}
        }

        function initPage() {
            try {
                loadEvents();
            } catch (e) {
                console.error('initPage/loadEvents failed:', e);
                showFatalError(e, 'Błąd inicjalizacji');
            }
        }

        window.addEventListener('error', (e) => {
            console.error('Window error:', e?.error || e);
            showFatalError(e?.error || e, 'Błąd skryptu');
        });
        window.addEventListener('unhandledrejection', (e) => {
            console.error('Unhandled promise rejection:', e?.reason || e);
            showFatalError(e?.reason || e, 'Błąd ładowania (Promise)');
        });

        // Initialize (działa też, gdy DOM już załadowany)
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', initPage);
        } else {
            initPage();
        }

        // Load events from Firebase
        async function loadEvents() {
            try {
                const wait = (ms) => new Promise((resolve) => setTimeout(resolve, ms));
                const maxAttempts = 3;
                const applyLoadedBlogPosts = (rawPayload) => {
                    allEvents = Array.isArray(rawPayload) ? rawPayload : [];
                    allEvents.sort((a, b) => compareBlogPosts(a, b));
                    updateLastUpdate();
                    applyBlogSearch();
                    void refreshBlogPostUserLikes();
                };

                for (let attempt = 1; attempt <= maxAttempts; attempt++) {
                    try {
                        const { payload } = await loadWithVersionCache({
                            db,
                            getDoc,
                            doc,
                            idbKey: "list:blogPosts",
                            metaDocId: "blogPosts",
                            onCachedData: (cachedPayload) => {
                                if (!Array.isArray(cachedPayload)) return;
                                applyLoadedBlogPosts(cachedPayload);
                            },
                            fetchFresh: async () => {
                                let querySnapshot;
                                try {
                                    const q = query(collection(db, "blogPosts"), where("status", "==", "published"));
                                    querySnapshot = await getDocs(q);
                                } catch (orderByError) {
                                    console.warn("blogPosts query failed, fallback:", orderByError);
                                    querySnapshot = await getDocs(collection(db, "blogPosts"));
                                }
                                const built = [];
                                querySnapshot.forEach((docSnap) => {
                                    const event = docSnap.data();
                                    if (event.status === 'published') {
                                        let dateObj = new Date();
                                        const ca = event.createdAt;
                                        if (ca) {
                                            if (typeof ca.toDate === 'function') {
                                                dateObj = ca.toDate();
                                            } else if (typeof ca === 'object' && ca.seconds != null) {
                                                dateObj = new Date(ca.seconds * 1000);
                                            } else {
                                                dateObj = new Date(ca);
                                            }
                                        }
                                        built.push({
                                            id: docSnap.id,
                                            ...event,
                                            dateObj: dateObj,
                                            category: event.category || 'news',
                                            pinned: !!event.pinned
                                        });
                                    }
                                });
                                return built;
                            },
                        });
                        applyLoadedBlogPosts(payload);
                        if (!blogAutoOpenDone && blogAutoOpenId) {
                            blogAutoOpenDone = true;
                            showEventDetail(blogAutoOpenId);
                        }
                        return;
                    } catch (error) {
                        console.warn(`Load blog attempt ${attempt}/${maxAttempts} failed:`, error);
                        if (attempt < maxAttempts) {
                            await wait(450 * attempt);
                            continue;
                        }
                        throw error;
                    }
                }
            } catch (error) {
                console.error('Error loading blog posts:', error);
                console.error('Error details:', {
                    message: error.message,
                    code: error.code,
                    stack: error.stack
                });
                
                // Jeśli błąd związany z indeksem, pokaż bardziej pomocny komunikat
                let errorMessage = 'Błąd ładowania wpisów';
                if (error.code === 'failed-precondition') {
                    errorMessage = 'Błąd: Brak indeksu w Firestore. Skontaktuj się z administratorem.';
                } else if (error.message?.includes('index')) {
                    errorMessage = 'Błąd: Wymagany indeks Firestore. Sprawdź konsolę przeglądarki.';
                }
                
                const track = document.getElementById('events-track');
                if (track) {
                    track.classList.remove('carousel-track--single');
                    track.classList.add('carousel-track--status-single');
                    track.innerHTML = `
                        <article class="card-dark event-carousel-card carousel-status-message">
                            <div class="flex flex-col items-center justify-center gap-2 w-full px-1 min-w-0">
                                <p class="text-red-400 uppercase tracking-[0.15em] text-xs text-center font-semibold">${errorMessage}</p>
                                <p class="text-sm text-zinc-500 break-words text-center">${error.message || 'Nieznany błąd'}</p>
                            </div>
                        </article>
                    `;
                    updateEventsCarouselControls();
                }
            }
        }

        function updateLastUpdate() {
            const el = document.getElementById('last-update');
            if (el) {
                el.textContent = new Date().toLocaleString('pl-PL');
            }
        }

        function updateEventsCount() {
            const now = new Date();
            const totalCount = filteredEvents.length;
            const activeCount = filteredEvents.filter(e => !isEventCompleted(e, now)).length;

            const legacyEl = document.getElementById('events-count');
            if (legacyEl) {
                if (totalCount === 0) {
                    legacyEl.textContent = 'Brak wydarzeń';
                } else if (activeCount === totalCount) {
                    legacyEl.textContent = `${totalCount} ${totalCount === 1 ? 'wydarzenie' : totalCount < 5 ? 'wydarzenia' : 'wydarzeń'}`;
                } else {
                    legacyEl.textContent = `${activeCount} aktywnych z ${totalCount}`;
                }
            }
        }

        function applyBlogSearch() {
            const q = '';
            const qLower = q.toLowerCase();
            if (!qLower) {
                filteredEvents = [...allEvents];
            } else {
                filteredEvents = allEvents.filter((post) => blogPostMatchesQuery(post, qLower));
            }

            updateEventsCount();
            renderEventsList();
        }

        // Scroll tracking for calendar highlighting
        function setupScrollTracking() {
            const container = document.getElementById('events-container');
            if (!container) return;
            container.addEventListener('scroll', updateScrollPosition, { passive: true });

            // Also track window scroll if needed
            window.addEventListener('scroll', updateScrollPosition, { passive: true });
        }

        function updateScrollPosition() {
            const dayHeaders = document.querySelectorAll('.day-header');
            const calendarDays = document.querySelectorAll('.calendar-day');

            // Find which day is currently most visible
            let currentDay = null;
            dayHeaders.forEach(header => {
                const rect = header.getBoundingClientRect();
                if (rect.top <= window.innerHeight / 2 && rect.bottom >= window.innerHeight / 2) {
                    currentDay = header.dataset.date;
                }
            });

            if (currentDay) {
                userScrollPosition = currentDay;
                highlightCalendarDay(currentDay);
            }
        }

        function highlightCalendarDay(dateStr) {
            document.querySelectorAll('.calendar-day').forEach(day => {
                day.classList.remove('selected');
                if (day.dataset.date === dateStr) {
                    day.classList.add('selected');
                }
            });
        }

        function buildBlogCarouselCardHtml(event) {
            const safeTitle = escapeHtml(event.title || 'Bez tytułu');
            const safeCategory = escapeHtml(getEventCategoryName(event.category).toLocaleUpperCase('pl-PL'));
            const dateLabel = getBlogPostDate(event).toLocaleDateString('pl-PL', {
                day: '2-digit',
                month: '2-digit',
                year: 'numeric'
            });

            const cardThumb = getBlogPostImages(event)[0];
            const cardThumbObjectPosition =
                cardThumb && typeof cardThumb.posX === 'number' && typeof cardThumb.posY === 'number'
                    ? `${cardThumb.posX}% ${cardThumb.posY}%`
                    : null;
            const cardThumbObjectScale = cardThumb && typeof cardThumb.zoom === 'number' ? cardThumb.zoom : null;
            const cardThumbTransformOrigin = cardThumbObjectPosition || '50% 50%';
            const encPostId = encodeURIComponent(event.id);
            const thumbLiked = getActiveAuthUser() && blogPostLikedByUser.has(event.id);
            const thumbWrap = cardThumb
                ? `<div class="event-card-media">
                        <img src="${cardThumb.url}" class="event-card-thumb" style="${cardThumbObjectPosition ? `object-position: ${cardThumbObjectPosition};` : ''}${cardThumbObjectScale != null ? `transform: scale(${cardThumbObjectScale}); transform-origin: ${cardThumbTransformOrigin};` : ''}" alt="">
                        <button type="button" class="event-card-like-fab blog-social-btn ${thumbLiked ? "is-active" : ""}" data-blog-card-like="${encPostId}" aria-label="Polub wpis" aria-pressed="${thumbLiked ? "true" : "false"}">
                            <i class="fa-solid fa-heart" aria-hidden="true"></i>
                        </button>
                   </div>`
                : "";
            return `
                    <article class="card-dark event-carousel-card event-carousel-card--blog" data-event-id="${encPostId}">
                        ${thumbWrap}
                        <div class="event-card-body">
                            <p class="event-category-slot">
                                <i class="fa-solid fa-calendar-day text-coyote/80" aria-hidden="true"></i>
                                <span>${dateLabel}</span>
                            </p>
                            <div class="event-divider"></div>
                            <p class="event-blog-card-category">${safeCategory}</p>
                            <div class="event-divider"></div>
                            <div class="event-data-slot">
                                <h3 class="event-blog-card-headline">${safeTitle}</h3>
                            </div>
                            <div class="event-card-action">
                                <button type="button" data-blog-read-id="${encPostId}" aria-label="Czytaj wpis ${safeTitle}" class="shop-cta-btn">
                                    CZYTAJ
                                </button>
                            </div>
                        </div>
                    </article>
                `;
        }

        function bindBlogCarouselInteractions(track) {
            track.querySelectorAll('.event-carousel-card[data-event-id]').forEach((cardEl) => {
                cardEl.addEventListener('click', () => {
                    const eventId = decodeURIComponent(cardEl.dataset.eventId || '');
                    if (eventId) showEventDetail(eventId);
                });
            });
            track.querySelectorAll('[data-blog-read-id]').forEach((btn) => {
                btn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    const eventId = decodeURIComponent(btn.getAttribute('data-blog-read-id') || '');
                    if (eventId) showEventDetail(eventId);
                });
            });
            track.querySelectorAll("[data-blog-card-like]").forEach((btn) => {
                btn.addEventListener("click", (e) => {
                    e.stopPropagation();
                    const postId = decodeURIComponent(btn.getAttribute("data-blog-card-like") || "");
                    if (postId) window.toggleBlogPostLike(postId);
                });
            });
            syncBlogGuestLikeControls();
        }

        // Render events as a single carousel track in shop style
        function renderEventsList() {
            const track = document.getElementById('events-track');
            if (!track) return;
            track.classList.remove('carousel-track--status-single');

            eventCarouselAnimating = false;
            eventPendingMoves = 0;

            if (filteredEvents.length === 0) {
                blogCarouselSorted = [];
                blogCarouselLeftIndex = 0;
                track.classList.remove('carousel-track--single');
                track.innerHTML = buildEmptyCarouselArticleHtml(
                    'card-dark event-carousel-card carousel-status-message event-carousel-empty-wide',
                );
                updateEventsCarouselControls();
                syncBlogCarouselDots();
                return;
            }

            const sortedEvents = [...filteredEvents].sort((a, b) => compareBlogPosts(a, b));

            blogCarouselSorted = sortedEvents;
            blogCarouselLeftIndex = 0;

            track.innerHTML = sortedEvents.map((event) => buildBlogCarouselCardHtml(event)).join('');

            track.classList.toggle('carousel-track--single', sortedEvents.length === 1);

            bindBlogCarouselInteractions(track);

            track.style.transition = 'none';
            track.style.transform = 'translateX(0)';
            void track.offsetHeight;
            track.style.transition = `transform ${EVENT_CAROUSEL_DURATION_MS}ms cubic-bezier(0.22, 0.61, 0.36, 1)`;
            window.requestAnimationFrame(updateEventsCarouselControls);
            blogPostLikeInflightIds.forEach((pid) => setBlogPostLikePending(pid, true));
        }

        // Calendar functions
        function renderCalendar() {
            const grid = document.getElementById('calendar-grid');
            grid.innerHTML = '';

            const today = new Date();
            const todayStr = today.toDateString();

            if (currentView === 'month') {
                // Month view - current month
                const firstDay = new Date(currentDate.getFullYear(), currentDate.getMonth(), 1);
                const lastDay = new Date(currentDate.getFullYear(), currentDate.getMonth() + 1, 0);
                const startDate = new Date(firstDay);
                startDate.setDate(startDate.getDate() - firstDay.getDay() + 1); // Start from Monday

                for (let i = 0; i < 42; i++) {
                    const date = new Date(startDate);
                    date.setDate(startDate.getDate() + i);

                    const dateStr = date.toDateString();
                    const isCurrentMonth = date.getMonth() === currentDate.getMonth() && date.getFullYear() === currentDate.getFullYear();
                    const isToday = dateStr === todayStr;
                    const dayEvents = allEvents.filter(event =>
                        getBlogPostDate(event).toDateString() === dateStr
                    );

                    const dayDiv = document.createElement('div');
                    dayDiv.className = `calendar-day text-center ${isCurrentMonth ? '' : 'text-zinc-600'} ${isToday ? 'today' : ''} ${dayEvents.length > 0 ? 'has-events' : ''}`;
                    dayDiv.dataset.date = dateStr;
                    dayDiv.onclick = () => selectDate(date);

                    dayDiv.innerHTML = `
                        <div class="font-bold">${date.getDate()}</div>
                        ${dayEvents.length > 0 ? `<div class="text-xs">${dayEvents.length}</div>` : ''}
                    `;

                    grid.appendChild(dayDiv);
                }
            } else {
                // Week view - current week
                const startOfWeek = new Date(currentDate);
                startOfWeek.setDate(currentDate.getDate() - currentDate.getDay() + 1); // Monday

                for (let i = 0; i < 7; i++) {
                    const date = new Date(startOfWeek);
                    date.setDate(startOfWeek.getDate() + i);

                    const dateStr = date.toDateString();
                    const isToday = dateStr === todayStr;
                    const dayEvents = allEvents.filter(event =>
                        getBlogPostDate(event).toDateString() === dateStr
                    );

                    const dayDiv = document.createElement('div');
                    dayDiv.className = `calendar-day text-center ${isToday ? 'today' : ''} ${dayEvents.length > 0 ? 'has-events' : ''}`;
                    dayDiv.dataset.date = dateStr;
                    dayDiv.onclick = () => selectDate(date);

                    dayDiv.innerHTML = `
                        <div class="font-bold">${date.getDate()}</div>
                        ${dayEvents.length > 0 ? `<div class="text-xs">${dayEvents.length}</div>` : ''}
                    `;

                    grid.appendChild(dayDiv);
                }
            }
        }

        function updateCalendarPeriodDisplay() {
            const display = document.getElementById('calendar-period-display');
            if (currentView === 'month') {
                const monthNames = ['Styczeń', 'Luty', 'Marzec', 'Kwiecień', 'Maj', 'Czerwiec',
                                   'Lipiec', 'Sierpień', 'Wrzesień', 'Październik', 'Listopad', 'Grudzień'];
                display.textContent = `${monthNames[currentDate.getMonth()]} ${currentDate.getFullYear()}`;
            } else {
                const startOfWeek = new Date(currentDate);
                startOfWeek.setDate(currentDate.getDate() - currentDate.getDay() + 1);
                const endOfWeek = new Date(startOfWeek);
                endOfWeek.setDate(startOfWeek.getDate() + 6);

                const startDay = startOfWeek.getDate();
                const endDay = endOfWeek.getDate();
                const monthNames = ['Sty', 'Lut', 'Mar', 'Kwi', 'Maj', 'Cze',
                                   'Lip', 'Sie', 'Wrz', 'Paź', 'Lis', 'Gru'];

                if (startOfWeek.getMonth() === endOfWeek.getMonth()) {
                    display.textContent = `${startDay}-${endDay} ${monthNames[startOfWeek.getMonth()]}`;
                } else {
                    display.textContent = `${startDay} ${monthNames[startOfWeek.getMonth()]} - ${endDay} ${monthNames[endOfWeek.getMonth()]}`;
                }
            }
        }

        function toggleCalendarView() {
            currentView = currentView === 'week' ? 'month' : 'week';
            const toggleBtn = document.getElementById('view-toggle-btn');
            toggleBtn.innerHTML = currentView === 'week' ?
                '<i class="fa-solid fa-calendar-week"></i>' :
                '<i class="fa-solid fa-calendar"></i>';
            toggleBtn.title = currentView === 'week' ? 'Widok tygodnia' : 'Widok miesiąca';
            updateCalendarPeriodDisplay();
            renderCalendar();
        }

        function previousPeriod() {
            if (currentView === 'month') {
                currentDate.setMonth(currentDate.getMonth() - 1);
            } else {
                currentDate.setDate(currentDate.getDate() - 7);
            }
            updateCalendarPeriodDisplay();
            renderCalendar();
        }

        function nextPeriod() {
            if (currentView === 'month') {
                currentDate.setMonth(currentDate.getMonth() + 1);
            } else {
                currentDate.setDate(currentDate.getDate() + 7);
            }
            updateCalendarPeriodDisplay();
            renderCalendar();
        }

        function selectDate(date) {
            const dateStr = date.toDateString();

            // Highlight selected date
            highlightCalendarDay(dateStr);

            // Scroll to the day in the events list
            const dayHeader = document.querySelector(`.day-header[data-date="${dateStr}"]`);
            if (dayHeader) {
                dayHeader.scrollIntoView({
                    behavior: 'smooth',
                    block: 'start',
                    inline: 'nearest'
                });
            } else {
                showNotification(`Brak wydarzeń w dniu ${date.toLocaleDateString('pl-PL')}`);
            }
        }

        function showNotification(message) {
            // Simple notification - you can enhance this
            const notification = document.createElement('div');
            notification.className = 'fixed top-4 right-4 bg-zinc-900 border border-zinc-700 rounded-lg p-4 z-50 max-w-sm';
            notification.innerHTML = `
                <div class="text-sm">${message}</div>
                <button onclick="this.parentElement.remove()" class="mt-2 text-coyote hover:underline text-xs">Zamknij</button>
            `;
            document.body.appendChild(notification);
            setTimeout(() => notification.remove(), 5000);
        }

        // Event detail modal
        function showEventDetail(eventId) {
            const event = allEvents.find(e => e.id === eventId);
            if (!event) {
                console.error('Event not found:', eventId);
                if (blogEmbedMode) {
                    notifyParentCloseInEmbedMode();
                }
                return;
            }

            document.getElementById('modal-title').textContent = event.title;

            const dateStr = getBlogPostDate(event).toLocaleString('pl-PL', {
                year: 'numeric',
                month: 'long',
                day: 'numeric'
            });
            const categoryStr = getEventCategoryName(event.category);
            document.getElementById('modal-meta').textContent = `${dateStr} | ${categoryStr}`;

            if (window.blogGalleryKeyHandler) {
                document.removeEventListener('keydown', window.blogGalleryKeyHandler);
                window.blogGalleryKeyHandler = null;
            }

            const images = getBlogPostImages(event);
            const safeTitle = escapeHtml(event.title || 'Wpis');
            const getObjectPositionStyleAttr = (meta) => {
                if (!meta) return '';
                const posOk = typeof meta.posX === 'number' && typeof meta.posY === 'number';
                const zoomOk = typeof meta.zoom === 'number';
                if (!posOk && !zoomOk) return '';
                const x = posOk ? meta.posX : 50;
                const y = posOk ? meta.posY : 50;
                const styles = [
                    posOk ? `object-position:${x}% ${y}%;` : '',
                    zoomOk ? `transform: scale(${meta.zoom}); transform-origin:${x}% ${y}%;` : '',
                ].filter(Boolean).join('');
                return `style="${styles}"`;
            };
            let htmlContent = '';

            if (images.length > 0) {
                htmlContent += `
                    <div class="blog-post-gallery" id="blog-post-gallery">
                        <img id="blog-gallery-main-img" src="${images[0].url}" alt="${safeTitle}" ${getObjectPositionStyleAttr(images[0])} />
                        ${images.length > 1 ? `
                            <button type="button" class="blog-gallery-nav prev" onclick="window.changeBlogGalleryImage(-1, ${images.length})" id="blog-gallery-prev" disabled aria-label="Poprzednie zdjęcie">
                                <i class="fa-solid fa-chevron-left"></i>
                            </button>
                            <button type="button" class="blog-gallery-nav next" onclick="window.changeBlogGalleryImage(1, ${images.length})" id="blog-gallery-next" aria-label="Następne zdjęcie">
                                <i class="fa-solid fa-chevron-right"></i>
                            </button>
                            <div class="blog-gallery-counter" aria-live="polite">
                                <span id="blog-gallery-current">1</span> / <span id="blog-gallery-total">${images.length}</span>
                            </div>
                        ` : ''}
                    </div>`;
                window.currentBlogPostImages = images;
                window.currentBlogGalleryIndex = 0;
                if (images.length > 1) {
                    const handleKeyPress = (e) => {
                        if (e.key === 'ArrowLeft' && window.currentBlogGalleryIndex > 0) {
                            window.changeBlogGalleryImage(-1, images.length);
                        } else if (e.key === 'ArrowRight' && window.currentBlogGalleryIndex < images.length - 1) {
                            window.changeBlogGalleryImage(1, images.length);
                        }
                    };
                    window.blogGalleryKeyHandler = handleKeyPress;
                    document.addEventListener('keydown', handleKeyPress);
                }
                updateBlogGalleryNavButtons(images.length);
            } else {
                window.currentBlogPostImages = [];
                window.currentBlogGalleryIndex = 0;
            }

            htmlContent += `<div class="blog-post-body">${formatBlogPostBody(event.content)}</div>`;
            htmlContent += `
                <section class="blog-comments-section">
                    <div class="blog-comments-title">
                        <h3 class="text-lg md:text-xl font-bold text-white">Komentarze</h3>
                    </div>
                    <div id="blog-comment-composer-anchor" class="blog-comment-form-card">
                        <div id="blog-comment-banner" class="blog-comment-banner">
                            <span id="blog-comment-banner-text"></span>
                            <button type="button" class="text-zinc-300 hover:text-white" onclick="window.cancelBlogCommentMode()">
                                <i class="fa-solid fa-times"></i>
                            </button>
                        </div>
                        <div class="blog-comment-field-wrap">
                            <textarea id="blog-comment-textarea" class="blog-comment-textarea" placeholder="Napisz komentarz do wpisu..." rows="4" maxlength="3000" spellcheck="true" autocapitalize="sentences"></textarea>
                            <div id="blog-comment-guest-overlay" class="blog-comment-guest-overlay hidden" aria-hidden="true">
                                <div class="blog-comment-guest-card">
                                    <div class="blog-comment-guest-copy">
                                        <span class="blog-comment-guest-icon" aria-hidden="true">
                                            <i class="fa-solid fa-user-lock"></i>
                                        </span>
                                        <p class="blog-comment-guest-overlay-text">
                                            <strong>Komentarze są dostępne po zalogowaniu</strong>
                                            Zaloguj się, żeby dodać komentarz i brać udział w dyskusji pod wpisem.
                                        </p>
                                    </div>
                                    <button type="button" data-open-login-modal class="blog-comment-guest-login-link">Zaloguj się</button>
                                </div>
                            </div>
                            <button
                                type="button"
                                id="blog-comment-submit"
                                class="blog-comment-send-btn"
                                aria-label="Dodaj komentarz"
                                title="Dodaj komentarz"
                            >
                                <i class="fa-solid fa-paper-plane" aria-hidden="true"></i>
                            </button>
                        </div>
                        <div class="blog-comment-toolbar">
                            <div id="blog-comment-note" class="blog-comment-note"></div>
                        </div>
                    </div>
                    <div id="blog-comments-list"></div>
                </section>
            `;

            document.getElementById('modal-content').innerHTML = htmlContent;
            const submitBtn = document.getElementById('blog-comment-submit');
            if (submitBtn) {
                submitBtn.addEventListener('click', () => window.submitBlogComment(event.id));
            }
            bindBlogCommentComposer();
            const floatBar = document.getElementById('modal-floating-social');
            const likeCountEl = document.getElementById('blog-post-like-count');
            const commentsCountEl = document.getElementById('blog-post-comments-count');
            const floatLikeBtn = document.getElementById('blog-post-like-btn');
            if (likeCountEl) likeCountEl.textContent = String(Number(event.likeCount || 0));
            if (commentsCountEl) commentsCountEl.textContent = String(Number(event.commentCount || 0));
            if (floatLikeBtn) {
                floatLikeBtn.classList.remove('is-active', 'is-pending');
                floatLikeBtn.setAttribute('aria-pressed', 'false');
                floatLikeBtn.setAttribute('aria-busy', 'false');
            }
            floatBar?.classList.remove('modal-floating-social--off');
            void resyncBlogAuthState();
            loadBlogPostInteractions(event.id);

            document.getElementById('event-modal').classList.remove('hidden');
        }

        function closeEventModal() {
            document.getElementById('modal-floating-social')?.classList.add('modal-floating-social--off');
            document.getElementById('event-modal').classList.add('hidden');
            document.getElementById('comment-history-modal')?.classList.add('hidden');
            currentBlogDetailId = null;
            resetBlogCommentComposer();
            stopBlogCommentCooldownTimer();
            if (window.blogGalleryKeyHandler) {
                document.removeEventListener('keydown', window.blogGalleryKeyHandler);
                window.blogGalleryKeyHandler = null;
            }
            notifyParentCloseInEmbedMode();
        }

        window.closeCommentHistoryModal = () => {
            document.getElementById('comment-history-modal')?.classList.add('hidden');
        };

        window.cancelBlogCommentMode = () => {
            resetBlogCommentComposer();
        };

        window.toggleBlogPostLike = async (postId) => {
            if (!getActiveAuthUser()) {
                showNotification("Musisz być zalogowany, aby polubić wpis.");
                return;
            }
            if (blogPostLikeInflightIds.has(postId)) return;

            const modalOpenForPost = currentBlogDetailId === postId;
            const likeBtn = document.getElementById("blog-post-like-btn");
            const likeCount = document.getElementById("blog-post-like-count");
            const post = allEvents.find((e) => e.id === postId);
            const prevLiked = blogPostLikedByUser.has(postId);
            const prevCount = modalOpenForPost && likeCount
                ? Number(likeCount.textContent || 0)
                : Number(post?.likeCount || 0);
            const nextLiked = !prevLiked;
            const nextCount = Math.max(0, prevCount + (nextLiked ? 1 : -1));

            blogPostLikeInflightIds.add(postId);
            setBlogPostLikePending(postId, true);

            if (nextLiked) blogPostLikedByUser.add(postId);
            else blogPostLikedByUser.delete(postId);
            if (modalOpenForPost) {
                currentBlogPostLiked = nextLiked;
                if (likeBtn) likeBtn.classList.toggle("is-active", nextLiked);
                if (likeBtn) likeBtn.setAttribute("aria-pressed", nextLiked ? "true" : "false");
                if (likeCount) likeCount.textContent = String(nextCount);
            }
            updateBlogPostStatsInLocalState(postId, { likeCount: nextCount });

            try {
                const result = await fetchBlogInteractionsApi({
                    action: "post.toggleLike",
                    postId,
                });
                if (result.liked) blogPostLikedByUser.add(postId);
                else blogPostLikedByUser.delete(postId);
                if (modalOpenForPost) {
                    currentBlogPostLiked = !!result.liked;
                    if (likeBtn) likeBtn.classList.toggle("is-active", currentBlogPostLiked);
                    if (likeBtn) likeBtn.setAttribute("aria-pressed", currentBlogPostLiked ? "true" : "false");
                    if (likeCount) likeCount.textContent = String(result.likeCount || 0);
                }
                updateBlogPostStatsInLocalState(postId, { likeCount: Number(result.likeCount || 0) });
            } catch (error) {
                if (prevLiked) blogPostLikedByUser.add(postId);
                else blogPostLikedByUser.delete(postId);
                if (modalOpenForPost) {
                    currentBlogPostLiked = prevLiked;
                    if (likeBtn) likeBtn.classList.toggle("is-active", prevLiked);
                    if (likeBtn) likeBtn.setAttribute("aria-pressed", prevLiked ? "true" : "false");
                    if (likeCount) likeCount.textContent = String(prevCount);
                }
                updateBlogPostStatsInLocalState(postId, { likeCount: prevCount });
                showNotification(error.message || "Nie udało się polubić wpisu.");
            } finally {
                blogPostLikeInflightIds.delete(postId);
                setBlogPostLikePending(postId, false);
            }
        };

        window.submitBlogComment = async (postId, options = {}) => {
            const activeUser = getActiveAuthUser();
            if (!activeUser) {
                showNotification("Musisz być zalogowany, aby dodać komentarz.");
                return;
            }

            const editCommentId = String(options.commentId || "");
            const isInlineEdit = !!editCommentId;
            const textarea = document.getElementById("blog-comment-textarea");
            const content = typeof options.content === "string" ? options.content : (textarea?.value || "");
            try {
                const result = await fetchBlogInteractionsApi({
                    action: isInlineEdit ? "comment.edit" : "comment.create",
                    postId,
                    commentId: editCommentId || undefined,
                    parentId: isInlineEdit ? undefined : (currentReplyToCommentId || undefined),
                    content,
                });

                if (!isInlineEdit) {
                    persistBlogCommentCooldown(postId, activeUser.uid, Number(result.cooldownUntil || (Date.now() + 30 * 1000)));
                    const post = allEvents.find((entry) => entry.id === postId);
                    updateBlogPostStatsInLocalState(postId, {
                        commentCount: Number(post?.commentCount || 0) + 1,
                    });
                }

                if (isInlineEdit) {
                    currentEditingCommentId = "";
                } else {
                    resetBlogCommentComposer();
                }
                await loadBlogPostInteractions(postId);
            } catch (error) {
                if (!isInlineEdit && error.code === "comment_cooldown" && error.remainingSeconds) {
                    persistBlogCommentCooldown(postId, activeUser.uid, Date.now() + Number(error.remainingSeconds) * 1000);
                }
                showNotification(error.message || "Nie udało się zapisać komentarza.");
            }
        };

        // Global functions for onclick handlers
        window.showEventDetail = showEventDetail;
        window.closeEventModal = closeEventModal;
        window.toggleCalendarView = toggleCalendarView;
        window.previousPeriod = previousPeriod;
        window.nextPeriod = nextPeriod;
    </script>
    <script
      type="module"
      src="https://strzelca.pl/auth-widget.mjs?v=2026-04-12-4"
    ></script>
    <script
      type="module"
      src="https://strzelca.pl/messages-widget.mjs?v=2026-03-23-1"
    ></script>
    <script type="module" src="https://strzelca.pl/global-search-widget.mjs?v=2026-03-24-1"></script>
    <script type="module" src="https://strzelca.pl/token-balance-badge.mjs?v=2026-04-13-2"></script>
</body>
