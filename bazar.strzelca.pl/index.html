    <script type="module">
        import { initializeApp, getApps, getApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, onAuthStateChanged, setPersistence, browserLocalPersistence } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { initializeFirestore, getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
        import { ensureFirebaseSSO } from "https://strzelca.pl/sso-client.mjs?v=2026-03-29-4";
        import {
          getHeaderProfileFromCache,
          setHeaderProfileCache,
        } from "https://strzelca.pl/header-profile-cache.mjs?v=2026-03-21-1";
        import { loadBazarOffersWithCache } from "https://strzelca.pl/public-firestore-list-cache.mjs?v=2026-03-21-1";
        import { redirectIfHubTileDisabled } from "https://strzelca.pl/hub-tile-subdomain-guard.mjs?v=2026-04-08-1";

        await redirectIfHubTileDisabled("bazar");

        async function getFirebaseApiKey() {
            const cachedKey = localStorage.getItem("firebase_web_api_key");
            if (cachedKey) return cachedKey;
            const urls = ["https://strzelca.pl/api/firebase-config", "/api/firebase-config"];
            for (const url of urls) {
                try {
                    const res = await fetch(url, { cache: "force-cache" });
                    if (!res.ok) continue;
                    const data = await res.json().catch(() => null);
                    if (data && typeof data.apiKey === "string" && data.apiKey.length > 10) {
                        localStorage.setItem("firebase_web_api_key", data.apiKey);
                        return data.apiKey;
                    }
                } catch (_) {}
            }
            throw new Error("Nie udało się pobrać FIREBASE_WEB_API_KEY");
        }

        const baseFirebaseConfig = {
            authDomain: (() => { try { const h = window.location.hostname.toLowerCase().replace(/^www\./, ""); return h === "strzelca.pl" || h.endsWith(".strzelca.pl") ? "strzelca.pl" : "strzelca-pl.firebaseapp.com"; } catch (_) { return "strzelca-pl.firebaseapp.com"; } })(),
            projectId: "strzelca-pl",
            storageBucket: "strzelca-pl.appspot.com",
            messagingSenderId: "511362047688",
            appId: "1:511362047688:web:9b82c0a4d19c1a3a878ffd"
        };

        let app;
        const existingApps = getApps();
        if (existingApps.length > 0) { app = getApp(); } else {
            const apiKey = await getFirebaseApiKey();
            app = initializeApp({ apiKey, ...baseFirebaseConfig });
        }

        let db;
        try { db = initializeFirestore(app, { experimentalAutoDetectLongPolling: true, useFetchStreams: true }); } catch (_) { db = getFirestore(app); }
        const auth = getAuth(app);
        window.strzelcaFirebaseAuth = auth;

        window.addEventListener('unhandledrejection', function(e) {
            if (e.reason && e.reason.message && (e.reason.message.includes('CORS') || e.reason.message.includes('firestore.googleapis.com'))) { e.preventDefault(); }
        });

        await setPersistence(auth, browserLocalPersistence);
        try { await ensureFirebaseSSO(auth); } catch (_) {}

        void (async () => {
            try {
                const [{ initActivityTracker }, { initUserStatusMonitor }, { initVisitTracker }] =
                    await Promise.all([
                        import("https://strzelca.pl/activity-tracker.mjs?v=2026-03-23-1"),
                        import("https://strzelca.pl/user-status-monitor.mjs?v=2026-02-06-1"),
                        import("https://strzelca.pl/visit-tracker.mjs?v=2026-03-23-1"),
                    ]);
                await Promise.all([
                    initActivityTracker(auth, db),
                    initUserStatusMonitor(auth, db),
                    initVisitTracker(auth),
                ]);
            } catch (_) {}
        })();

        let currentUser = null;
        const API_BASE = 'https://strzelca.pl/api/bazar';
        window.STRZELCA_BAZAR_API = API_BASE;
        const bazarUrlParams = new URLSearchParams(window.location.search || '');
        const bazarAutoOfferParam = (bazarUrlParams.get('offer') || '').trim();
        const bazarEmbedMode = bazarUrlParams.get('embedModal') === '1';

        function notifyParentCloseInEmbedMode() {
            if (!bazarEmbedMode) return;
            try {
                window.parent?.postMessage({ source: 'strzelca-modal', action: 'close' }, '*');
            } catch (_) {}
        }

        function applyBazarEmbedMode() {
            if (!bazarEmbedMode) return;
            document.getElementById('user-panel')?.classList.add('hidden');
            document.getElementById('login-button')?.classList.add('hidden');
            const wrapper = document.querySelector('.main-wrapper');
            if (wrapper) {
                Array.from(wrapper.children).forEach((child) => {
                    child.style.display = 'none';
                });
            }
            document.body.style.background = '#000';
        }

        applyBazarEmbedMode();

        const CATEGORY_LABELS = {
            PISTOLET: 'Pistolety', REWOLWER: 'Rewolwery', KARABIN: 'Karabiny',
            BRON_GLADKOLUFOWA: 'Broń gładkolufowa', BRON_CZARNOPROCHOWA: 'Broń czarnoprochowa',
            AMUNICJA: 'Amunicja', AKCESORIA: 'Akcesoria', INNE: 'Inne'
        };
        const CATEGORY_CSS = {
            PISTOLET: 'cat-firearms', REWOLWER: 'cat-firearms', KARABIN: 'cat-firearms',
            BRON_GLADKOLUFOWA: 'cat-firearms', BRON_CZARNOPROCHOWA: 'cat-czarnoprochowa',
            AMUNICJA: 'cat-amunicja', AKCESORIA: 'cat-akcesoria', INNE: 'cat-inne'
        };
        const CATEGORIES_ORDER = ['PISTOLET','REWOLWER','KARABIN','BRON_GLADKOLUFOWA','BRON_CZARNOPROCHOWA','AMUNICJA','AKCESORIA','INNE'];
        const WOJ_LABELS = {
            'dolnoslaskie':'Dolnośląskie','kujawsko-pomorskie':'Kujawsko-Pomorskie','lubelskie':'Lubelskie',
            'lubuskie':'Lubuskie','lodzkie':'Łódzkie','malopolskie':'Małopolskie','mazowieckie':'Mazowieckie',
            'opolskie':'Opolskie','podkarpackie':'Podkarpackie','podlaskie':'Podlaskie','pomorskie':'Pomorskie',
            'slaskie':'Śląskie','swietokrzyskie':'Świętokrzyskie','warminsko-mazurskie':'Warmińsko-Mazurskie',
            'wielkopolskie':'Wielkopolskie','zachodniopomorskie':'Zachodniopomorskie'
        };

        async function getAuthHeaders() {
            if (!auth.currentUser) return {};
            try {
                const token = await auth.currentUser.getIdToken();
                return { 'Authorization': `Bearer ${token}` };
            } catch (_) { return {}; }
        }

        const DEFAULT_REPORT_REASONS = [
            'Podejrzenie oszustwa',
            'Duplikat ogłoszenia',
            'Przedmiot niedozwolony',
            'Nielegalna część lub akcesorium',
            'Naruszenie regulaminu',
            'Fałszywa firma',
            'Inne',
        ];

        let commerceConfigCache = null;

        function escapeHtml(value) {
            return String(value ?? '')
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;');
        }

        function offerPlaceholderImage() {
            return 'data:image/svg+xml,%3Csvg xmlns="http://www.w3.org/2000/svg" fill="%23333" viewBox="0 0 24 24"%3E%3Cpath d="M21 19V5c0-1.1-.9-2-2-2H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2zM8.5 13.5l2.5 3.01L14.5 12l4.5 6H5l3.5-4.5z"/%3E%3C/svg%3E';
        }

        function getOfferLocation(offer) {
            if (offer.location_label) return offer.location_label;
            return [offer.miejscowosc, WOJ_LABELS[offer.wojewodztwo] || offer.wojewodztwo].filter(Boolean).join(', ');
        }

        function isCompanyOffer(offer) {
            return String(offer?.seller_role || '').toLowerCase() === 'company';
        }

        function getSellerDisplayName(offer) {
            if (isCompanyOffer(offer)) {
                return offer?.seller_company_name || offer?.seller_name || 'Firma';
            }
            return offer?.seller_name || 'Uzytkownik';
        }

        function getSellerRoleLabel(offer) {
            if (isCompanyOffer(offer)) {
                return offer?.seller_company_verified ? 'Firma zweryfikowana' : 'Firma w katalogu';
            }
            return 'Ogłoszenie prywatne';
        }

        function getSellerAvatarMarkup(offer, large = false) {
            const isCompany = isCompanyOffer(offer);
            const cls = large
                ? `seller-card-avatar${isCompany ? ' seller-card-avatar--company' : ''}`
                : `seller-avatar${isCompany ? ' seller-avatar--company' : ''}`;
            const icon = large
                ? '<i class="fa-solid fa-user text-zinc-400 text-xl"></i>'
                : '<i class="fa-solid fa-user text-zinc-400"></i>';
            if (offer?.seller_avatar) {
                return `<div class="${cls}"><img src="${escapeHtml(offer.seller_avatar)}" alt="${escapeHtml(getSellerDisplayName(offer))}"></div>`;
            }
            return `<div class="${cls}">${icon}</div>`;
        }

        function formatUiDateTime(value) {
            if (!value) return '—';
            const seconds = value?._seconds ?? value?.seconds;
            const date = seconds != null ? new Date(seconds * 1000) : new Date(value);
            if (!Number.isFinite(date.getTime())) return '—';
            return date.toLocaleString('pl-PL');
        }

        function renderHeroStats() {
            const activeOffers = allOffers.filter((offer) => offer.status === 'ACTIVE');
            const companyOffers = activeOffers.filter((offer) => isCompanyOffer(offer));
            const privateOffers = activeOffers.filter((offer) => !isCompanyOffer(offer));
            const promotedOffers = activeOffers.filter((offer) => offer.is_pinned || offer.is_highlighted);

            const statMap = {
                'hero-stat-active': activeOffers.length,
                'hero-stat-company': companyOffers.length,
                'hero-stat-private': privateOffers.length,
                'hero-stat-promoted': promotedOffers.length,
            };
            Object.entries(statMap).forEach(([id, value]) => {
                const node = document.getElementById(id);
                if (node) node.textContent = String(value);
            });
        }

        async function fetchCommerceConfig() {
            if (commerceConfigCache) return commerceConfigCache;
            try {
                const res = await fetch(`${API_BASE}/commerce-config`);
                const data = await res.json();
                if (data?.success) {
                    commerceConfigCache = data.config || {};
                    return commerceConfigCache;
                }
            } catch (_) {}
            commerceConfigCache = { reportingReasons: DEFAULT_REPORT_REASONS };
            return commerceConfigCache;
        }

        function syncSellerTypeButtons() {
            document.querySelectorAll('#seller-type-segment [data-seller-type]').forEach((btn) => {
                btn.classList.toggle('active', btn.getAttribute('data-seller-type') === (window.currentSellerTypeFilter || ''));
            });
        }

        function syncConditionButtons() {
            const v = document.getElementById('filter-condition')?.value || '';
            document.querySelectorAll('#condition-segment [data-condition]').forEach((btn) => {
                btn.classList.toggle('active', btn.getAttribute('data-condition') === v);
            });
        }

        function buildOfferCardHTML(offer) {
            const condLabel = offer.condition === 'NOWY' ? 'Nowy' : 'Używany';
            const condClass = offer.condition === 'NOWY' ? 'badge-nowy' : 'badge-uzywany';
            const imgSrc = offer.mainImage || offerPlaceholderImage();
            const loc = getOfferLocation(offer);
            const sellerName = getSellerDisplayName(offer);
            const sellerRole = getSellerRoleLabel(offer);
            const company = isCompanyOffer(offer);
            const cardClasses = `offer-card${offer.is_highlighted ? ' offer-card--highlighted' : ''}`;

                        <span class="${sellerBadgeClass}"><i class="fa-solid ${sellerBadgeIcon}"></i>${company ? 'Firma' : 'Prywatne'}</span>
                    </div>
                    <p class="text-[#C19A6B] font-bold text-lg">${offer.price ? Number(offer.price).toLocaleString('pl-PL') + ' PLN' : 'Cena do uzgodnienia'}</p>
                    <p class="text-zinc-500 text-xs mt-1"><i class="fa-solid fa-location-dot mr-1"></i>${escapeHtml(loc || 'Brak lokalizacji')}</p>
                    <div class="offer-meta-row">
                        <div class="seller-chip min-w-0">
                            ${getSellerAvatarMarkup(offer)}
                            <div class="min-w-0">
                                <div class="seller-name">${escapeHtml(sellerName)}</div>
                                <div class="seller-role">${escapeHtml(sellerRole)}</div>
                            </div>
                        </div>
                        <div class="text-[11px] text-zinc-500 text-right">
                            <div>${escapeHtml(CATEGORY_LABELS[offer.category] || offer.category || 'Oferta')}</div>
                        </div>
                    </div>
                </div>
            </div>`;
        }

        function buildSectionCarousel(title, offers, categoryKey, options = {}) {
            if (!offers || offers.length === 0) return '';
            const trackId = `track-${categoryKey || 'pinned'}`;
            const cardsHTML = offers.map(o => buildOfferCardHTML(o)).join('');
            const sectionIcon = options.icon ? `<i class="${options.icon} mr-2 text-[#C19A6B]"></i>` : (categoryKey === 'PINNED' ? '<i class="fa-solid fa-thumbtack mr-2 text-[#C19A6B]"></i>' : '');
            let showAllCard = '';
            if (options.showAllOnClick) {
                showAllCard = `<div class="show-all-card" onclick="${options.showAllOnClick}">
                <i class="fa-solid ${options.showAllIcon || 'fa-arrow-right'} text-2xl text-[#C19A6B] mb-2"></i>
                <span class="text-zinc-400 text-sm font-semibold">${options.showAllLabel || 'Pokaż wszystkie'}</span>

            } else if (categoryKey === 'PINNED') {
                showAllCard = `<div class="show-all-card" onclick="showPinnedList()">
                <i class="fa-solid fa-thumbtack text-2xl text-[#C19A6B] mb-2"></i>
                <span class="text-zinc-400 text-sm font-semibold">Pokaż wszystkie wyróżnione</span>
                <span class="text-zinc-500 text-xs">Tylko przypięte oferty</span>
            </div>`;
            } else if (categoryKey && CATEGORY_LABELS[categoryKey]) {
                showAllCard = `<div class="show-all-card" onclick="filterByCategory('${categoryKey}')">
                <i class="fa-solid fa-arrow-right text-2xl text-[#C19A6B] mb-2"></i>
                <span class="text-zinc-400 text-sm font-semibold">Pokaż wszystkie</span>
                <span class="text-zinc-500 text-xs">${CATEGORY_LABELS[categoryKey] || categoryKey}</span>
            </div>`;
            }

            return `<div class="mb-10 section-carousel" data-track="${trackId}">
                <div class="section-head">
                    <div>
                        <h2 class="text-lg md:text-xl font-bold uppercase tracking-wider font-[Orbitron] text-zinc-300">
                            ${sectionIcon}${escapeHtml(title)}
                        </h2>
                        ${options.description ? `<p class="section-copy mt-2">${escapeHtml(options.description)}</p>` : ''}
                    </div>
                </div>
                <div class="relative">
                    <button class="carousel-nav-btn prev" onclick="moveCarousel('${trackId}', -1)"><i class="fa-solid fa-chevron-left"></i></button>
                    <div class="overflow-hidden">
                        <div class="carousel-track" id="${trackId}">${cardsHTML}${showAllCard}</div>
                    </div>
                    <button class="carousel-nav-btn next" onclick="moveCarousel('${trackId}', 1)"><i class="fa-solid fa-chevron-right"></i></button>
                </div>

        }

        window.moveCarousel = (trackId, dir) => {
            const track = document.getElementById(trackId);
            if (!track) return;
            const card = track.querySelector('.offer-card, .show-all-card');
            if (!card) return;
            const cardW = card.offsetWidth + 20;
            const viewW = track.parentElement.offsetWidth;
            const maxScroll = track.scrollWidth - viewW;
            const current = parseInt(track.dataset.scroll || '0');
            let next = current + (dir * cardW * 2);
            next = Math.max(0, Math.min(next, maxScroll));
            track.style.transform = `translateX(-${next}px)`;
            track.dataset.scroll = next;
        };

        const SORT_LABELS = {
            newest: 'Najnowsze',
            price_asc: 'Cena: od najniższej',
            price_desc: 'Cena: od najwyższej',
            oldest: 'Najstarsze',
        };

        let allOffers = [];
        let priceRangeMax = 100000;
        const locationPickerState = {
            search: { selected: null, suggestions: [], mode: 'province_defaults', timer: null },
            create: { selected: null, suggestions: [], mode: 'create_defaults', timer: null },
        };

        function getOfferTimestampMs(offer) {
            const raw = offer?.last_refreshed_at || offer?.created_at || 0;
            const seconds = raw?._seconds ?? raw?.seconds;
            if (seconds != null) return seconds * 1000;
            const value = new Date(raw || 0).getTime();
            return Number.isFinite(value) ? value : 0;
        }

        function getOfferPriceValue(offer) {
            const value = Number(offer?.price || 0);
            return Number.isFinite(value) ? value : 0;
        }

        function getSortablePrice(offer) {
            const value = Number(offer?.price);
            return Number.isFinite(value) && value > 0 ? value : null;
        }

        function normalizeSearchText(value) {
            return String(value || '')
                .normalize('NFD')
                .replace(/[\u0300-\u036f]/g, '')
                .toLowerCase()
                .trim();
        }

        function getActiveOffers() {
            return allOffers.filter((offer) => offer.status === 'ACTIVE');
        }

        function calculatePriceRangeMax() {
            const highest = getActiveOffers().reduce((max, offer) => Math.max(max, getOfferPriceValue(offer)), 0);
            const rounded = highest > 0 ? Math.ceil(highest / 1000) * 1000 : 100000;
            return Math.max(1000, rounded);
        }

        function syncPriceRange(mode) {
            const minRange = document.getElementById('filter-price-min');
            const maxRange = document.getElementById('filter-price-max');
            const minField = document.getElementById('filter-price-min-field');
            const maxField = document.getElementById('filter-price-max-field');
            const active = document.getElementById('price-range-active');
            if (!minRange || !maxRange || !active) return;

            priceRangeMax = calculatePriceRangeMax();
            minRange.max = String(priceRangeMax);
            maxRange.max = String(priceRangeMax);
            if (minField) minField.max = String(priceRangeMax);
            if (maxField) maxField.max = String(priceRangeMax);

            if (mode === true || mode === 'reset') {
                minRange.value = '0';
                maxRange.value = String(priceRangeMax);
                if (minField) minField.value = '0';
                if (maxField) maxField.value = String(priceRangeMax);
            } else if (mode === 'field-min' || mode === 'field-max') {
                let minValue = parseFloat(String(minField?.value ?? '').replace(',', '.'));
                let maxValue = parseFloat(String(maxField?.value ?? '').replace(',', '.'));
                if (!Number.isFinite(minValue)) minValue = 0;
                if (!Number.isFinite(maxValue)) maxValue = priceRangeMax;
                minValue = Math.max(0, Math.min(minValue, priceRangeMax));
                maxValue = Math.max(0, Math.min(maxValue, priceRangeMax));
                if (minValue > maxValue) {
                    if (mode === 'field-min') maxValue = minValue;
                    else minValue = maxValue;
                }
                minValue = Math.round(minValue);
                maxValue = Math.round(maxValue);
                minRange.value = String(minValue);
                maxRange.value = String(maxValue);
                if (minField) minField.value = String(minValue);
                if (maxField) maxField.value = String(maxValue);
            } else {
                let minValue = Math.max(0, Number(minRange.value || 0));
                let maxValue = Math.max(0, Number(maxRange.value || priceRangeMax));
                if (mode === 'min' && minValue > maxValue) {
                    maxValue = minValue;
                    maxRange.value = String(maxValue);
                }
                if (mode === 'max' && maxValue < minValue) {
                    minValue = maxValue;
                    minRange.value = String(minValue);
                }
                minValue = Math.min(minValue, priceRangeMax);
                maxValue = Math.min(Math.max(maxValue, minValue), priceRangeMax);
                minRange.value = String(minValue);
                maxRange.value = String(maxValue);
                if (minField) minField.value = String(Math.round(minValue));
                if (maxField) maxField.value = String(Math.round(maxValue));
            }

            const minFinal = Math.max(0, Number(minRange.value || 0));
            const maxFinal = Math.min(Math.max(0, Number(maxRange.value || priceRangeMax)), priceRangeMax);
            active.style.left = `${(minFinal / priceRangeMax) * 100}%`;
            active.style.right = `${100 - (maxFinal / priceRangeMax) * 100}%`;
        }
        window.syncPriceRange = syncPriceRange;

        function haversineKm(lat1, lon1, lat2, lon2) {
            const toRad = (deg) => (Number(deg) * Math.PI) / 180;
            const dLat = toRad(Number(lat2) - Number(lat1));
            const dLon = toRad(Number(lon2) - Number(lon1));
            const a =
                Math.sin(dLat / 2) * Math.sin(dLat / 2) +
                Math.cos(toRad(lat1)) * Math.cos(toRad(lat2)) *
                Math.sin(dLon / 2) * Math.sin(dLon / 2);
            return 6371 * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
        }

        function getLocationState(kind) {
            return locationPickerState[kind];
        }

        function getLocationElements(kind) {
            if (kind === 'create') {
                return {
                    input: document.getElementById('new-location-text'),
                    clear: document.getElementById('new-location-clear'),
                    suggestions: document.getElementById('new-location-suggestions'),
                    meta: document.getElementById('new-location-meta'),
                    radius: null,
                };
            }
            return {
                input: document.getElementById('filter-location-text'),
                clear: document.getElementById('filter-location-clear'),
                suggestions: document.getElementById('filter-location-suggestions'),
                meta: document.getElementById('filter-location-meta'),
                radius: document.getElementById('filter-radius'),
            };
        }

        async function fetchLocationSuggestions(query, scope) {
            const params = new URLSearchParams({
                q: query || '',
                scope,
                limit: scope === 'create' ? '10' : '12',
            });
            const res = await fetch(`${API_BASE}/locations?${params.toString()}`);
            const data = await res.json().catch(() => null);
            if (!res.ok || !data?.success) throw new Error(data?.error || 'Nie udało się pobrać lokalizacji.');
            return data;
        }

        function syncLocationMeta(kind) {
            const state = getLocationState(kind);
            const { input, clear, meta, radius } = getLocationElements(kind);
            if (clear) clear.classList.toggle('hidden', !(state.selected || input?.value));
            if (radius) radius.disabled = !(state.selected && state.selected.type === 'locality');
            if (!meta) return;
            if (state.selected?.type === 'province') {
                meta.textContent = `Wybrane województwo: ${state.selected.wojewodztwoLabel}.`;
                meta.classList.remove('hidden');
                return;
            }
            if (state.selected?.type === 'locality') {
                meta.textContent = `${state.selected.label}${kind === 'search' ? ' — możesz ustawić promień.' : ''}`;
                meta.classList.remove('hidden');
                return;
            }
            if (kind === 'create') {
                meta.textContent = 'Wybierz konkretną miejscowość. Pokażemy domyślnie 10 największych miast w Polsce.';
                meta.classList.remove('hidden');
                return;
            }
            meta.textContent = '';
            meta.classList.add('hidden');
        }

        function hideLocationSuggestions(kind) {
            getLocationElements(kind).suggestions?.classList.add('hidden');
        }

        function renderLocationSuggestions(kind) {
            const state = getLocationState(kind);
            const { suggestions } = getLocationElements(kind);
            if (!suggestions) return;
            if (!state.suggestions.length) {
                suggestions.classList.add('hidden');
                suggestions.innerHTML = '';
                return;
            }
            suggestions.classList.remove('hidden');
            suggestions.innerHTML = state.suggestions.map((item) => {
                const payload = encodeURIComponent(JSON.stringify(item));
                return `<button type="button" class="location-option" data-payload="${payload}" onclick="selectLocationSuggestion(${JSON.stringify(kind)}, this.dataset.payload)">
                    ${escapeHtml(item.label || item.name || item.wojewodztwoLabel || '')}
                    <small>${escapeHtml(item.type === 'province' ? 'Województwo' : (item.wojewodztwoLabel || 'Miejscowość'))}</small>
                </button>`;
            }).join('');
        }

        window.selectLocationSuggestion = (kind, payload) => {
            const state = getLocationState(kind);
            const { input, radius } = getLocationElements(kind);
            const item = JSON.parse(decodeURIComponent(payload));
            state.selected = item;
            if (input) input.value = item.label || item.name || item.wojewodztwoLabel || '';
            if (radius && item.type !== 'locality') radius.value = '0';
            syncLocationMeta(kind);
            hideLocationSuggestions(kind);
        };

        window.clearLocationSelection = (kind) => {
            const state = getLocationState(kind);
            const { input, radius } = getLocationElements(kind);
            state.selected = null;
            state.suggestions = [];
            if (input) input.value = '';
            if (radius) radius.value = '0';
            syncLocationMeta(kind);
            hideLocationSuggestions(kind);
        };

        window.openLocationSuggestions = async (kind) => {
            const { input } = getLocationElements(kind);
            const state = getLocationState(kind);
            const data = await fetchLocationSuggestions(input?.value?.trim() || '', kind);
            state.suggestions = Array.isArray(data.suggestions) ? data.suggestions : [];
            state.mode = data.mode || '';
            renderLocationSuggestions(kind);
            syncLocationMeta(kind);
        };

        window.handleLocationInput = (kind) => {
            const state = getLocationState(kind);
            const { radius } = getLocationElements(kind);
            state.selected = null;
            if (radius) radius.value = '0';
            syncLocationMeta(kind);
            window.clearTimeout(state.timer);
            state.timer = window.setTimeout(() => {
                window.openLocationSuggestions(kind).catch(() => null);
            }, 180);
        };

        function compareOffersBySort(a, b, sort = 'newest') {
            if (sort === 'price_asc') {
                const aPrice = getSortablePrice(a);
                const bPrice = getSortablePrice(b);
                if (aPrice == null && bPrice == null) return getOfferTimestampMs(b) - getOfferTimestampMs(a);
                if (aPrice == null) return 1;
                if (bPrice == null) return -1;
                return aPrice - bPrice || getOfferTimestampMs(b) - getOfferTimestampMs(a);
            }
            if (sort === 'price_desc') {
                const aPrice = getSortablePrice(a);
                const bPrice = getSortablePrice(b);
                if (aPrice == null && bPrice == null) return getOfferTimestampMs(b) - getOfferTimestampMs(a);
                if (aPrice == null) return 1;
                if (bPrice == null) return -1;
                return bPrice - aPrice || getOfferTimestampMs(b) - getOfferTimestampMs(a);
            }
            if (sort === 'oldest') {
                return getOfferTimestampMs(a) - getOfferTimestampMs(b);
            }
            return getOfferTimestampMs(b) - getOfferTimestampMs(a);
        }

        function sortOffersWithPinnedPriority(offers, sort = 'newest') {
            const pinned = [];
            const regular = [];
            offers.forEach((offer) => {
                if (offer.is_pinned) pinned.push(offer);
                else regular.push(offer);
            });
            pinned.sort((a, b) => compareOffersBySort(a, b, sort));
            regular.sort((a, b) => compareOffersBySort(a, b, sort));
            return [...pinned, ...regular];
        }

        function getCurrentFilters() {
            return {
                search: document.getElementById('search-input')?.value.trim() || '',
                sort: document.getElementById('filter-sort')?.value || 'newest',
                priceMin: parseFloat(document.getElementById('filter-price-min')?.value || '0') || 0,
                priceMax: parseFloat(document.getElementById('filter-price-max')?.value || String(priceRangeMax)) || priceRangeMax,
                cond: document.getElementById('filter-condition')?.value || '',
                cat: window.currentCategoryFilter || '',
                sellerType: window.currentSellerTypeFilter || '',
                locationSelection: getLocationState('search').selected,
                radiusKm: parseInt(document.getElementById('filter-radius')?.value || '0', 10) || 0,
                pinnedOnly: window.currentPinnedOnly === true,
            };
        }

        function hasAnyActiveFilter(filters) {
            return Boolean(
                filters.search ||
                filters.cat ||
                filters.priceMin > 0 ||
                filters.priceMax < priceRangeMax ||
                filters.cond ||
                filters.sellerType ||
                filters.locationSelection ||
                filters.pinnedOnly ||
                filters.sort !== 'newest'
            );
        }

        function matchesSearchQuery(offer, query) {
            if (!query) return true;
            const needle = normalizeSearchText(query);
            const haystack = normalizeSearchText([
                offer.title,
                offer.description,
                offer.location_label,
                offer.miejscowosc,
                WOJ_LABELS[offer.wojewodztwo] || offer.wojewodztwo,
                getSellerDisplayName(offer),
                CATEGORY_LABELS[offer.category] || offer.category,
            ].filter(Boolean).join(' '));
            return haystack.includes(needle);
        }

        function filterOffers(offers, filters) {
            return offers.filter((offer) => {
                if (filters.cat && offer.category !== filters.cat) return false;
                if (filters.sellerType === 'company' && !isCompanyOffer(offer)) return false;
                if (filters.sellerType === 'private' && isCompanyOffer(offer)) return false;
                if (filters.cond && offer.condition !== filters.cond) return false;
                if (filters.priceMin > 0 && getOfferPriceValue(offer) < filters.priceMin) return false;
                if (filters.priceMax > 0 && filters.priceMax < priceRangeMax && getOfferPriceValue(offer) > filters.priceMax) return false;
                if (filters.pinnedOnly && !(offer.is_pinned || offer.is_highlighted)) return false;
                if (filters.locationSelection?.type === 'province' && offer.wojewodztwo !== filters.locationSelection.wojewodztwo) return false;
                if (filters.locationSelection?.type === 'locality') {
                    if (filters.radiusKm > 0) {
                        if (!offer.location_lat || !offer.location_lng) return false;
                        const distanceKm = haversineKm(filters.locationSelection.lat, filters.locationSelection.lng, offer.location_lat, offer.location_lng);
                        if (distanceKm > filters.radiusKm) return false;
                    } else if (offer.location_id !== filters.locationSelection.id) {
                        return false;
                    }
                }
                if (!matchesSearchQuery(offer, filters.search)) return false;
                return true;
            });
        }

        function buildResultsTitle(filters) {
            let title = 'Wszystkie oferty';
            if (filters.pinnedOnly) title = 'Promowane i przypiete';
            else if (filters.search) title = `Wyniki dla "${filters.search}"`;
            else if (filters.cat) title = CATEGORY_LABELS[filters.cat] || filters.cat;

            if (filters.sellerType === 'company') title += ' · firmy';
            if (filters.sellerType === 'private') title += ' · prywatne';
            if (filters.locationSelection?.label) title += ` · ${filters.locationSelection.label}`;
            return title;
        }

        function updateSortButtonLabel() {
            const currentSort = document.getElementById('filter-sort')?.value || 'newest';
            document.querySelectorAll('#sort-menu [data-sort]').forEach((btn) => {
                btn.classList.toggle('active', btn.getAttribute('data-sort') === currentSort);
            });
        }

        function updateActiveFilterChips(filters) {
            const wrap = document.getElementById('active-filters');
            if (!wrap) return;
            const chips = [];
            if (filters.search) chips.push(`Fraza: ${escapeHtml(filters.search)}`);
            if (filters.cat) chips.push(`Kategoria: ${escapeHtml(CATEGORY_LABELS[filters.cat] || filters.cat)}`);
            if (filters.sellerType === 'company') chips.push('Firmy');
            if (filters.sellerType === 'private') chips.push('Prywatne');
            if (filters.cond === 'NOWY') chips.push('Stan: nowy');
            if (filters.cond === 'UZYWANY') chips.push('Stan: używany');
            if (filters.locationSelection?.label) chips.push(`Lokalizacja: ${escapeHtml(filters.locationSelection.label)}`);
            if (filters.locationSelection?.type === 'locality' && filters.radiusKm > 0) chips.push(`Promień: ${filters.radiusKm} km`);
            if (filters.priceMin > 0) chips.push(`Od: ${escapeHtml(filters.priceMin.toLocaleString('pl-PL'))} PLN`);
            if (filters.priceMax > 0 && filters.priceMax < priceRangeMax) chips.push(`Do: ${escapeHtml(filters.priceMax.toLocaleString('pl-PL'))} PLN`);
            if (filters.pinnedOnly) chips.push('Tylko promowane');
            if (filters.sort !== 'newest') chips.push(`Sortowanie: ${escapeHtml(SORT_LABELS[filters.sort] || filters.sort)}`);

            if (!chips.length) {
                wrap.classList.add('hidden');
                wrap.innerHTML = '';
                return;
            }

            wrap.classList.remove('hidden');
            wrap.innerHTML = chips.map((chip) => `<span class="active-filter-chip">${chip}</span>`).join('');
        }

        function renderResultsView(offers, filters, titleText) {
            const grid = document.getElementById('filtered-grid');
            const empty = document.getElementById('filtered-empty');
            const title = document.getElementById('filtered-title');
            const count = document.getElementById('filtered-count');
            title.textContent = titleText;
            count.textContent = `(${offers.length})`;

            if (!offers.length) {
                grid.innerHTML = '';
                empty.classList.remove('hidden');
                return;
            }

            grid.innerHTML = offers.map((offer) => `<div>${buildOfferCardHTML(offer)}</div>`).join('');
            empty.classList.add('hidden');
        }

        async function loadAllOffers() {
            try {
                const { offers } = await loadBazarOffersWithCache(API_BASE, 'bazar:home100');
                allOffers = Array.isArray(offers) ? offers : [];
            } catch (e) {
                console.error('Error loading offers:', e);
            }
        }
        window.loadAllOffers = loadAllOffers;

        function renderCarousels() {
            const container = document.getElementById('carousels-container');
            const loading = document.getElementById('loading-main');
            if (loading) loading.classList.add('hidden');

            const activeOffers = getActiveOffers();
            renderHeroStats();
            updateSortButtonLabel();
            updateActiveFilterChips(getCurrentFilters());
            syncPriceRange();

            let html = '';
            const companyOffers = activeOffers.filter((offer) => isCompanyOffer(offer));
            const privateOffers = activeOffers.filter((offer) => !isCompanyOffer(offer));

            if (companyOffers.length > 0) {
                html += buildSectionCarousel('Oferty firmowe', sortOffersWithPinnedPriority(companyOffers, 'newest').slice(0, 10), 'COMPANY', {
                    icon: 'fa-solid fa-building',
                    description: 'Zweryfikowane konta firmowe, które warto przejrzeć jako osobny segment rynku.',
                    showAllOnClick: "setSellerTypeFilter('company'); applyFilters(true)",
                    showAllLabel: 'Tylko firmy',
                    showAllSubtext: 'Segment firmowy',
                    showAllIcon: 'fa-building',
                });
            }

            if (privateOffers.length > 0) {

        /** Ta sama idea co produkty w panelu admina: kompresja w przegladarce, zapis jako data URL w Firestore (bez Storage). */
        const BAZAR_MAX_IMAGES_CLIENT = 5;
        /** Laczny rozmiar stringow zdjec w UTF-8 (tak jak po stronie serwera) */
        const BAZAR_IMAGES_MAX_TOTAL_BYTES = 1048576;

        function bazarOfferImagesTotalUtf8Bytes(urls) {
            if (!urls || !urls.length) return 0;
            const enc = new TextEncoder();
            let n = 0;
            for (const s of urls) n += enc.encode(s).length;
            return n;
        }

        function formatBazarDataSize(bytes) {
            if (bytes < 1024) return bytes + ' B';
            if (bytes < 1048576) return (bytes / 1024).toFixed(1).replace('.', ',') + ' KB';
            return (bytes / 1048576).toFixed(2).replace('.', ',') + ' MiB';
        }

        function updateBazarImageUsageUi() {
            const el = document.getElementById('bazar-images-usage');
            if (!el) return;
            const urls = getBazarOfferImageUrls();
            const used = bazarOfferImagesTotalUtf8Bytes(urls);
            const maxB = BAZAR_IMAGES_MAX_TOTAL_BYTES;
            const over = used > maxB;
            const high = !over && used > maxB * 0.85;
            el.textContent =
                'Zajęte: ' +
                formatBazarDataSize(used) +
                ' / 1 MiB · ' +
                urls.length +
                '/' +
                BAZAR_MAX_IMAGES_CLIENT +
                ' zdjęć';
            el.className =
                'text-xs mt-2 font-medium ' +
                (over ? 'text-red-400' : high ? 'text-amber-400' : 'text-zinc-500');

            const submitBtn = document.getElementById('submit-offer-btn');
            if (submitBtn && !submitBtn.innerHTML.includes('fa-spinner')) {
                submitBtn.disabled = over;
                submitBtn.classList.toggle('opacity-50', over);
                submitBtn.classList.toggle('cursor-not-allowed', over);
                submitBtn.title = over
                    ? 'Łączny rozmiar zdjęć przekracza 1 MiB — usuń część zdjęć lub wgraj mniejsze pliki.'
                    : '';
            }
        }

        async function compressBazarImageToBase64(file, maxWidth = 1200, quality = 0.75) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = (e) => {
                    const img = new Image();
                    img.src = e.target.result;
                    img.onload = () => {
                        const canvas = document.createElement('canvas');
                        let width = img.width;
                        let height = img.height;
                        if (width > maxWidth) {
                            height *= maxWidth / width;
                            width = maxWidth;
                        }
                        canvas.width = width;
                        canvas.height = height;
                        canvas.getContext('2d').drawImage(img, 0, 0, width, height);
                        let base64 = canvas.toDataURL('image/jpeg', quality);
                        let base64Size = (base64.length * 3) / 4;
                        if (base64Size > 800000) {
                            const smallerBase64 = canvas.toDataURL('image/jpeg', quality * 0.7);
                            const smallerSize = (smallerBase64.length * 3) / 4;
                            if (smallerSize > 800000) {
                                reject(new Error('Obraz jest za duzy nawet po kompresji. Wybierz mniejsze zdjecie.'));
                                return;
                            }
                            base64 = smallerBase64;
                        }
                        resolve(base64);
                    };
                    img.onerror = () => reject(new Error('Nie mozna wczytac obrazu'));
                };
                reader.onerror = () => reject(new Error('Blad odczytu pliku'));
            });
        }

        function getBazarOfferImageUrls() {
            if (!window._bazarOfferImageUrls) window._bazarOfferImageUrls = [];
            return window._bazarOfferImageUrls;
        }

        window.handleBazarImagesSelected = async (event) => {
            const input = event.target;
            const files = input.files;
            if (!files?.length) return;
            const urls = getBazarOfferImageUrls();
            const status = document.getElementById('bazar-upload-status');
            const max = BAZAR_MAX_IMAGES_CLIENT;
            if (urls.length >= max) {
                alert('Maksymalnie ' + max + ' zdjec (limit rozmiaru dokumentu Firestore).');
                input.value = '';
                return;
            }
            const arr = Array.from(files).slice(0, max - urls.length);
            if (status) { status.classList.remove('hidden'); status.textContent = 'Kompresja zdjęć...'; }
            try {
                for (const file of arr) {
                    if (!file.type.startsWith('image/')) continue;
                    const dataUrl = await compressBazarImageToBase64(file);
                    const used = bazarOfferImagesTotalUtf8Bytes(urls);
                    const addBytes = new TextEncoder().encode(dataUrl).length;
                    if (used + addBytes > BAZAR_IMAGES_MAX_TOTAL_BYTES) {
                        throw new Error(
                            'Po dodaniu tego zdjęcia łączny rozmiar przekroczyłby 1 MiB. Usuń inne zdjęcie lub wybierz mniejszy plik.',
                        );
                    }
                    urls.push(dataUrl);
                    renderBazarImagePreviews();
                }
                if (status) status.textContent = 'Gotowe.';
            } catch (e) {
                alert(e.message || 'Błąd przetwarzania zdjęć');

                input.value = '';

                                <strong class="text-zinc-300">nie może przekroczyć 1 MiB</strong>.
                                Przed wysłaniem oferty sprawdzamy ten limit; przycisk „Wyślij” zostanie zablokowany, jeśli przekroczysz 1 MiB.
                            </p>
                            <label class="flex flex-col items-center justify-center border-2 border-dashed border-zinc-700 rounded-xl py-6 px-4 cursor-pointer hover:border-[#C19A6B]/50 transition bg-black/20">
                                <i class="fa-solid fa-images text-2xl text-[#C19A6B] mb-2"></i>
                                <span class="text-sm text-zinc-300">Wybierz zdjęcia z dysku</span>
                                <span class="text-[11px] text-zinc-500 mt-1">Kompresja w przeglądarce, zapis w Firestore (bez Firebase Storage)</span>
                                <input type="file" accept="image/jpeg,image/png,image/webp" multiple class="hidden" id="bazar-image-input" onchange="handleBazarImagesSelected(event)">
                            </label>
                            <p id="bazar-images-usage" class="text-xs mt-2 text-zinc-500 font-medium" aria-live="polite"></p>
                            <p id="bazar-upload-status" class="hidden text-xs text-[#C19A6B] mt-2 text-center"></p>
                            <div id="bazar-images-preview" class="mt-3 space-y-2 max-h-48 overflow-y-auto"></div>
                        </div>
                        <div class="bg-zinc-900 rounded-lg p-4 border border-zinc-800">
                            <label class="flex items-start gap-3 cursor-pointer">
                                <input type="checkbox" id="accept-regulations" required class="mt-1 accent-[#C19A6B]">
                                <span class="text-xs text-zinc-400 leading-relaxed">
                                    Oświadczam, że zapoznałem/am się z
                                    <a href="#" onclick="event.preventDefault(); event.stopPropagation(); openRegulationModal()" class="text-[#C19A6B] hover:underline">Regulaminem witryny</a>
                                    (w tym zasadami Bazaru) i akceptuję jego postanowienia. Potwierdzam, że posiadam wymagane prawem uprawnienia do posiadania i zbywania wystawianych przedmiotów.
                                </span>
                            </label>
                        </div>
                        <div class="flex justify-end gap-3 pt-2">
                            <button type="button" onclick="closeCreateOffer()" class="px-5 py-2.5 border border-zinc-700 rounded-lg text-sm text-zinc-300 hover:bg-zinc-800 transition">Anuluj</button>
                            <button type="submit" id="submit-offer-btn" class="px-5 py-2.5 bg-[#C19A6B] text-black rounded-lg text-sm font-bold hover:bg-white transition">
                                <i class="fa-solid fa-paper-plane mr-1"></i>${submitLabel}
                            </button>
                        </div>
                    </form>
                </div>
            </div>`;
            modal.classList.remove('hidden');
            document.body.style.overflow = 'hidden';
            setTimeout(() => {
                renderBazarImagePreviews();
                updateBazarImageUsageUi();
                syncLocationMeta('create');
            }, 0);
        }

        window.openCreateOfferModal = async () => {
            if (!currentUser) {
                alert('Musisz byc zalogowany, aby dodac oferte.');
                if (typeof window.strzelcaOpenLoginModal === 'function') {
                    window.strzelcaOpenLoginModal();
                } else {
                    window.location.href = 'https://konto.strzelca.pl/login.html?redirect=' + encodeURIComponent(window.location.href);
                }
                return;
            }
            try {
                const guide = await fetchFirstOfferGuideState();
                window.__bazarFirstOfferGuideStep = 0;
                if (guide?.shouldShowGuide) {
                    renderFirstOfferGuideModal();
                    return;
                }
                openCreateOfferFormModal();
            } catch (e) {
                alert(e.message || 'Nie udało się otworzyć formularza ogłoszenia.');
            }
        };

        window.closeCreateOffer = () => {
            window._bazarOfferImageUrls = [];
            document.getElementById('create-offer-modal').classList.add('hidden');
            document.getElementById('create-offer-modal').innerHTML = '';
            document.body.style.overflow = '';
        };

        window.submitNewOffer = async () => {
            const acceptEl = document.getElementById('accept-regulations');
            if (!acceptEl || !acceptEl.checked) {
                alert('Aby wysłać ofertę, zaznacz oświadczenie o zapoznaniu się z Regulaminem witryny.');
                acceptEl?.focus();
                return;
            }
            if (!getLocationState('create').selected || getLocationState('create').selected.type !== 'locality') {
                alert('Wybierz konkretną miejscowość z listy.');
                document.getElementById('new-location-text')?.focus();
                return;
            }

            const images = [...getBazarOfferImageUrls()];
            const totalBytes = bazarOfferImagesTotalUtf8Bytes(images);
            if (totalBytes > BAZAR_IMAGES_MAX_TOTAL_BYTES) {
                alert(
                    'Łączny rozmiar zdjęć (' +
                        formatBazarDataSize(totalBytes) +
                        ') przekracza 1 MiB. Usuń część zdjęć lub wgraj mniejsze pliki, potem spróbuj ponownie.',
                );
                return;
            }

            const btn = document.getElementById('submit-offer-btn');
            const submitIdleHtml = btn.innerHTML;
            btn.disabled = true;
            btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin mr-1"></i>Wysylanie...';

            const body = {
                title: document.getElementById('new-title').value.trim(),
                price: parseFloat(document.getElementById('new-price').value),
                category: document.getElementById('new-category').value,
                condition: document.getElementById('new-condition').value,
                locationId: getLocationState('create').selected.id,
                description: document.getElementById('new-description').value.trim(),
                images,
            };

            try {
                const headers = await getAuthHeaders();
                headers['Content-Type'] = 'application/json';
                const res = await fetch(`${API_BASE}/create`, { method: 'POST', headers, body: JSON.stringify(body) });
                const data = await res.json();
                if (!data.success) {
                    if (data.code === 'FIRST_OFFER_GUIDE_REQUIRED') {
                        window.__bazarFirstOfferGuideState = null;
                        await window.openCreateOfferModal();
                        return;
                    }
                    throw new Error(data.error);
                }

                closeCreateOffer();
                if (data.status === 'ACTIVE') {
                    alert('Oferta została opublikowana. W przypadku kont firmowych publikacja może nastąpić automatycznie po zużyciu żetonu.');
                } else {
                    alert('Oferta została wysłana do akceptacji przez administratora. Otrzymasz powiadomienie po zatwierdzeniu.');
                }
            } catch (e) {
                alert('Błąd: ' + (e.message || 'Nie udało się wysłać oferty'));
                btn.disabled = false;
                btn.innerHTML = submitIdleHtml;
                updateBazarImageUsageUi();
            }
        };

        window.showMyOffers = async () => {
            if (!currentUser) return;
            const modal = document.getElementById('my-offers-modal');
            modal.innerHTML = `<div class="modal-overlay" onclick="if(event.target===this)closeMyOffers()">
                <div class="modal-panel"><div class="flex items-center justify-between p-4 border-b border-zinc-800">
                    <span class="text-sm font-bold text-[#C19A6B] uppercase tracking-widest">Moje oferty</span>
                    <button onclick="closeMyOffers()" class="text-zinc-400 hover:text-white text-xl"><i class="fa-solid fa-times"></i></button>
                </div><div class="p-4" id="my-offers-content"><div class="text-center py-8"><i class="fa-solid fa-spinner fa-spin text-2xl text-zinc-400"></i></div></div></div></div>`;
            modal.classList.remove('hidden');
            document.body.style.overflow = 'hidden';

            try {
                const headers = await getAuthHeaders();
                const res = await fetch(`${API_BASE}/my`, { headers });
                const data = await res.json();

                const container = document.getElementById('my-offers-content');
                if (!data.success || !data.offers || data.offers.length === 0) {
                    container.innerHTML = '<div class="text-center py-8 text-zinc-500"><i class="fa-solid fa-box-open text-3xl mb-3"></i><p>Nie masz jeszcze żadnych ofert</p></div>';
                    return;
                }

                const statusLabels = { PENDING: 'Oczekująca', ACTIVE: 'Aktywna', REJECTED: 'Odrzucona', EXPIRED: 'Wygasła', SOLD: 'Sprzedana' };
                const statusColors = { PENDING: 'text-yellow-400', ACTIVE: 'text-green-400', REJECTED: 'text-red-400', EXPIRED: 'text-zinc-500', SOLD: 'text-blue-400' };

                container.innerHTML = data.offers.map(o => {
                    const lastRefresh = o.last_refreshed_at?._seconds ? new Date(o.last_refreshed_at._seconds * 1000) : new Date(o.last_refreshed_at);
                    const daysSince = (Date.now() - lastRefresh.getTime()) / (1000*60*60*24);
                    const canRefresh = daysSince >= 25 && (o.status === 'ACTIVE' || o.status === 'EXPIRED');

                    return `<div class="flex items-center gap-4 p-3 bg-zinc-900 rounded-lg mb-3 border border-zinc-800">
                        <div class="w-16 h-16 rounded-lg overflow-hidden bg-zinc-800 flex-shrink-0">
                            ${o.mainImage ? `<img src="${o.mainImage}" class="w-full h-full object-cover">` : '<div class="w-full h-full flex items-center justify-center text-zinc-600"><i class="fa-solid fa-image"></i></div>'}
                        </div>
                        <div class="flex-1 min-w-0">
                            <h4 class="text-sm font-bold text-white truncate">${o.title}</h4>
                            <p class="text-[#C19A6B] font-bold">${o.price ? o.price.toLocaleString('pl-PL') + ' PLN' : ''}</p>
                            <span class="text-xs ${statusColors[o.status] || 'text-zinc-400'}">${statusLabels[o.status] || o.status}</span>
                            ${o.rejection_reason ? `<p class="text-xs text-red-400 mt-1">Powód: ${o.rejection_reason}</p>` : ''}
                        </div>
                        <div class="flex flex-col gap-1">
                            ${canRefresh ? `<button onclick="refreshOffer('${o.id}')" class="text-xs bg-green-600 text-white px-3 py-1 rounded hover:bg-green-500 transition">Odśwież za darmo</button>` : ''}
                            <button type="button" disabled class="text-xs border border-zinc-600 text-zinc-500 px-3 py-1 rounded cursor-not-allowed opacity-70" title="Funkcja płatna — w przygotowaniu">Odśwież teraz (Premium)</button>
                            ${o.status === 'ACTIVE' ? `<button onclick="markSold('${o.id}')" class="text-xs bg-blue-600 text-white px-3 py-1 rounded hover:bg-blue-500 transition">Sprzedane</button>` : ''}
                        </div>
                    </div>`;
                }).join('');
            } catch (e) {
                document.getElementById('my-offers-content').innerHTML = '<p class="text-red-400 text-center py-4">Błąd ładowania ofert</p>';
            }
        };

        window.closeMyOffers = () => {
            document.getElementById('my-offers-modal').classList.add('hidden');
            document.getElementById('my-offers-modal').innerHTML = '';
            document.body.style.overflow = '';
        };

        window.refreshOffer = async (id) => {
            if (!confirm('Odświeżyć ofertę za darmo?')) return;
            try {
                const headers = await getAuthHeaders();
                headers['Content-Type'] = 'application/json';
                const res = await fetch(`${API_BASE}/refresh/${id}`, { method: 'POST', headers });
                const data = await res.json();
                if (!data.success) throw new Error(data.error);
                alert('Oferta została odświeżona!');
                showMyOffers();
            } catch (e) { alert('Błąd: ' + (e.message || 'Nie udało się odświeżyć oferty')); }
        };

        window.markSold = async (id) => {
            if (!confirm('Oznaczyć ofertę jako sprzedaną?')) return;
            try {
                const headers = await getAuthHeaders();
                headers['Content-Type'] = 'application/json';
                const res = await fetch(`${API_BASE}/sold/${id}`, { method: 'POST', headers });
                const data = await res.json();
                if (!data.success) throw new Error(data.error);
                alert('Oferta oznaczona jako sprzedana.');
                showMyOffers();
                loadAllOffers().then(renderCarousels);
            } catch (e) { alert('Błąd: ' + (e.message || 'Nie udało się zmienić statusu')); }
        };

        window.openRegulationModal = async () => {
            const txtUrl = 'https://dokumenty.strzelca.pl/regulamin-witryny.txt';
            try {
                const res = await fetch(txtUrl, { credentials: 'omit', cache: 'force-cache' });
                const raw = res.ok ? await res.text() : '';
                let contentHTML = '';
                if (raw) {
                    const { renderRegulaminTxtToHtml } = await import('https://strzelca.pl/regulamin-txt-render.mjs?v=2026-04-12-1');
                    contentHTML = renderRegulaminTxtToHtml(raw, { includeFooter: true });
                } else {
                    contentHTML = `<div class="p-6 text-center text-zinc-400"><p>Treść regulaminu niedostępna.</p><a href="${txtUrl}" target="_blank" rel="noopener noreferrer" class="text-[#C19A6B] hover:underline">Otwórz plik tekstowy</a></div>`;
                }

                const overlay = document.createElement('div');
                overlay.id = 'regulation-modal';
                overlay.className = 'fixed inset-0 z-[300] flex items-start justify-center overflow-y-auto p-4 bg-black/90 backdrop-blur-sm';
                overlay.onclick = (e) => { if (e.target === overlay) overlay.remove(); };
                overlay.innerHTML = `<div class="bg-zinc-900 border border-zinc-700 rounded-2xl max-w-3xl w-full my-8 overflow-hidden">
                    <div class="flex items-center justify-between px-5 py-4 border-b border-zinc-800">
                        <span class="text-xs uppercase font-bold tracking-widest text-zinc-500">Regulamin witryny</span>
                        <button type="button" onclick="document.getElementById('regulation-modal').remove()" class="text-zinc-400 hover:text-white" aria-label="Zamknij"><i class="fa-solid fa-times"></i></button>
                    </div>
                    <div class="p-5 max-h-[70vh] overflow-y-auto">${contentHTML}</div>
                </div>`;
                document.body.appendChild(overlay);
            } catch (e) {
                window.open(txtUrl, '_blank', 'noopener,noreferrer');
            }
        };

        function getDefaultAvatar() { return '<i class="fa-solid fa-user text-white"></i>'; }

        window.toggleUserMenu = () => {
            const m = document.getElementById("user-menu");
            if (m) m.classList.toggle("hidden");
        };

        document.addEventListener("click", (e) => {
            const panel = document.getElementById("user-panel");
            const menu = document.getElementById("user-menu");
            if (panel && menu && !panel.contains(e.target) && !menu.classList.contains("hidden")) menu.classList.add("hidden");
        });

        async function updateUserInterface(user) {
            const loginBtn = document.getElementById("login-button");
            const userPanel = document.getElementById("user-panel");
            const addOfferBtn = document.getElementById("btn-add-offer");
            const userDisplayName = document.getElementById("user-display-name");
            const userAvatar = document.getElementById("user-avatar");

            if (user) {
                loginBtn.classList.add("hidden");
                userPanel.classList.remove("hidden");
                if (addOfferBtn) addOfferBtn.classList.remove("hidden");
                const displayName = user.displayName || user.email.split("@")[0];
                if (userDisplayName) userDisplayName.textContent = displayName;

                try {
                    const cached = getHeaderProfileFromCache(user.uid);
                    const fallbackName = user.displayName || user.email.split("@")[0];
                    if (cached) {
                        if (userDisplayName) userDisplayName.textContent = cached.displayName || fallbackName;
                        if (userAvatar) {
                            userAvatar.innerHTML = cached.avatar
                                ? `<img src="${cached.avatar}" alt="Avatar" class="w-full h-full rounded-full object-cover">`
                                : getDefaultAvatar();
                        }
                    } else {
                        if (userDisplayName) userDisplayName.textContent = fallbackName;
                        const profileDoc = await getDoc(doc(db, "userProfiles", user.uid));
                        if (profileDoc.exists()) {
                            const p = profileDoc.data();
                            setHeaderProfileCache(user.uid, {
                                displayName: p.displayName || "",
                                avatar: p.avatar || "",
                                gender: p.gender ?? null,
                                role: p.role || "user",
                                profileExists: true,
                            });
                            if (p.displayName && userDisplayName) userDisplayName.textContent = p.displayName;
                            if (userAvatar) {
                                userAvatar.innerHTML = p.avatar ? `<img src="${p.avatar}" alt="Avatar" class="w-full h-full rounded-full object-cover">` : getDefaultAvatar();
                            }
                        } else {
                            setHeaderProfileCache(user.uid, {
                                displayName: fallbackName,
                                avatar: "",
                                gender: null,
                                role: "user",
                                profileExists: false,
                            });
                            if (userAvatar) userAvatar.innerHTML = getDefaultAvatar();
                        }
                    }
                } catch (_) {
                    if (userAvatar) userAvatar.innerHTML = getDefaultAvatar();
                }
            } else {
                loginBtn.classList.remove("hidden");
                userPanel.classList.add("hidden");
                if (addOfferBtn) addOfferBtn.classList.add("hidden");
            }
        }

        window.logout = async () => {
            try {
                const { logoutWithSSO } = await import("https://strzelca.pl/sso-client.mjs?v=2026-04-12-3");
                await logoutWithSSO(auth);
                document.getElementById("user-menu")?.classList.add("hidden");
            } catch (_) {}
        };

        onAuthStateChanged(auth, (user) => {
            currentUser = user;
            updateUserInterface(user);
        });

        syncPriceRange(true);
        syncLocationMeta('search');
        syncCategoryButtons();
        syncConditionButtons();

        async function openOfferFromSlugParam() {
            const offerParam = bazarAutoOfferParam;
            if (offerParam) {
                await window.showOfferDetail(offerParam);
                return;
            }
            const pathMatch = location.pathname.match(/\/oferta\/([^/]+)\/?$/);
            const hashMatch = location.hash.match(/^#\/oferta\/([^/?#]+)/);
            const slug = pathMatch ? decodeURIComponent(pathMatch[1]) : (hashMatch ? decodeURIComponent(hashMatch[1]) : '');
            if (!slug) return;
            try {
                const res = await fetch(`${API_BASE}/slug/${encodeURIComponent(slug)}`);
                const data = await res.json();
                if (data.success && data.offer?.id) window.showOfferDetail(data.offer.id);
            } catch (_) {}
        }

        await loadAllOffers();
        renderCarousels();
        await openOfferFromSlugParam();
    </script>
    <script type="module" src="https://strzelca.pl/bazar-commerce-ui.mjs?v=2026-04-12-2"></script>
    <script type="module" src="https://strzelca.pl/auth-widget.mjs?v=2026-04-12-4"></script>
    <script type="module" src="https://strzelca.pl/messages-widget.mjs?v=2026-03-23-1"></script>
    <script type="module" src="https://strzelca.pl/global-search-widget.mjs?v=2026-03-24-1"></script>
</body>
</html>
